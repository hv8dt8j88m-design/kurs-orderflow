<tr><td>dodatnia (atakowali kupujący)</td><td>wysoko</td><td>kupujący zaatakowali <b>i wygrali</b>: agresja skuteczna</td><td>siła kupujących, kontynuacja w górę. Long jest zgodny z ruchem</td></tr>
<tr><td>dodatnia (atakowali kupujący)</td><td><b>nisko</b></td><td>kupujący zaatakowali, <b>a cena skończyła na dole</b>: wysiłek bez rezultatu. Albo nad ceną stał pasywny sprzedający i zaabsorbował kupno, albo kupujących zabrakło pod koniec i cena spadła przez pustkę pod nią</td><td><b>sygnał słabości</b>: kupujący są uwięzieni w stracie i gdy będą zamykać pozycje, sprzedadzą. <b>Nie kupuj</b>; przy potwierdzeniu możliwy short</td></tr>
<tr><td>ujemna (atakowali sprzedający)</td><td><b>wysoko</b></td><td>sprzedający zaatakowali, <b>a cena skończyła na górze</b>: wysiłek bez rezultatu. Pod ceną stał pasywny kupujący, który przyjął całą sprzedaż (absorpcja), a potem kupujący przejęli ruch</td><td><b>sygnał siły</b>: sprzedający są uwięzieni w stracie i gdy będą zamykać pozycje, kupią. <b>Nie shortuj</b>; przy potwierdzeniu możliwy long</td></tr>
<tr><td>ujemna (atakowali sprzedający)</td><td>nisko</td><td>sprzedający zaatakowali <b>i wygrali</b>: agresja skuteczna</td><td>siła sprzedających, kontynuacja w dół. Short jest zgodny z ruchem</td></tr></table></div>

<p><b>Najczęstszy błąd przy wierszu 3:</b> „delta ujemna, czyli przewaga sprzedających, więc shortuję”. To pułapka. Delta pokazuje tylko <b>wysiłek</b>, a nie <b>wynik</b>. Jeśli sprzedający włożyli ogromny wysiłek, a cena i tak zamknęła się wysoko, to znaczy, że <b>przegrali</b>. Po drugiej stronie stał ktoś silniejszy. W starszej wersji tej tabeli było napisane „ostrzeżenie dla shortów”: chodziło właśnie o to, że ta świeca ostrzega przed sprzedawaniem, a nie zachęca do niego.</p>

<div class="case"><div class="lab">Przykład na liczbach · wiersz 3 (delta ujemna, zamknięcie wysoko)</div>
<p>Świeca: open 100, low 99, high 104, close 103,75. Zakres 5 punktów, więc górna 1/3 zaczyna się od ok. 102,33. Zamknięcie 103,75 jest w górnej 1/3, czyli „wysoko”.</p>
<p>Footprint: sprzedaż agresywna razem 500 kontraktów, kupno agresywne 200. Delta = 200 − 500 = <b>−300</b>. Większość sprzedaży (np. 380 z 500) uderzyła w poziomy 99–100, czyli w dole świecy.</p>
<p>Odczyt: sprzedający wysłali 500 kontraktów, a cena zeszła tylko o 1 punkt i wróciła na górę. Na 99–100 stał pasywny kupujący z limitami, który przyjął ich sprzedaż. Sprzedający, którzy sprzedali na 99–100, mają przy zamknięciu 103,75 stratę ok. 4 punktów i są uwięzieni. Świeca mówi „nie shortuj tutaj”.</p></div>
<div class="case"><div class="lab">Przykład na liczbach · wiersz 2 (delta dodatnia, zamknięcie nisko)</div>
<p>To dokładnie wariant z symulatora: Kup 25 → Kup 75 → Sprzedaj 25. Delta = +75, świeca 99–103, zamknięcie 99, czyli na samym dole zakresu. Kupujący zjedli trzy poziomy, a jedno małe zlecenie sprzedaży sprowadziło cenę na dół, bo pod ceną była pustka (punkt 2 wyżej). Sama delta mówi „kupujący”, a wynik mówi „cena skończyła na dole”.</p></div>

<div class="warnbox"><b>Jedna świeca to nie sygnał wejścia.</b> Wiersze 2 i 3 to <b>rozbieżności</b> między wysiłkiem a rezultatem i to one są najcenniejsze, ale działają tylko w dobrym miejscu (krawędź wartości, poziom z biasu dnia: lekcje 2–4) i z potwierdzeniem na kolejnej świecy (lekcje 5–6). W środku zakresu takie świece pojawiają się ciągle i nic nie znaczą. Szczegóły w lekcji 5.</div>

<div class="warnbox"><b>W jednym zdaniu:</b> świeca mówi, gdzie cena skończyła, footprint mówi, ile kosztowała walka, a dopiero razem, plus księga (czy była pustka), mówią, kto naprawdę ma przewagę.</div><details class="extra"><summary>Dla dociekliwych: co to znaczy dla strategii na samych świecach</summary><h4>5. Dla OBR i każdej strategii na samych świecach</h4>
<ul><li>OBR (Twój bot w MT5, czyli MetaTrader 5) widzi tylko otwarcie, maksimum, minimum i zamknięcie świecy. <b>Nie odróżni</b> „zielonej z wysiłkiem” od „zielonej z pustki” ani „czerwonej od siły sprzedających” od „czerwonej od jednego małego zlecenia”.</li>
<li>Formacje świecowe (pin bar, objęcie, czyli engulfing) mogą w obu wariantach pokazać odwrotny obraz przy identycznej walce.</li>
<li>Dlatego plan jest taki, żeby <b>najpierw nauczyć się ręcznie czytać wysiłek i rezultat</b>, a dopiero potem budować boty. Hipoteza do sprawdzenia w backteście na futures: czy wybicie OBR ze świecą „delta dodatnia, zamknięcie wysoko” wypada lepiej niż wybicie z „deltą dodatnią i zamknięciem nisko”.</li></ul>


</details>
<details class="extra"><summary>Dla dociekliwych: mapa: gdzie dalej w kursie wyjaśniamy wejście, stop i prowadzenie pozycji</summary><h3 class="sh">8. Co z tego wynika dla dalszych lekcji</h3>

<section class="s unit" data-unit="1"><div class="unit-nr">Jednostka 1 z 8</div><h2>Walka, a nie spisek. Rynek jako aukcja</h2>
<div class="unit-tools"></div>
<h3 class="sh">1. Punkt wyjścia: walka, a nie spisek</h3>
<p>Darius zaczyna od pytania: czy rynek jest manipulowany, a banki polują na stopy detalu? Jego odpowiedź: nie. Model „market makera” z ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona) to w praktyce przerobiony Wyckoff (Richard Wyckoff, analityk rynku z lat 1910–1930, autor metody faz akumulacji i dystrybucji): akumulacja → wybicie → dystrybucja, tylko z błędną logiką. Wyckoff rozumiał, że cena, która ma pójść w jednym kierunku, musi najpierw <b>spędzić czas na kupowaniu</b> (akumulacja). ICT tłumaczy ten sam obraz pułapkami na detal, a według Dariusa ruch ceny nie ma nic wspólnego ze stopami detalicznych traderów.</p>
<p>Jego obraz rynku to <b>walka bokserska</b>: byki kontra niedźwiedzie. Przed walką masz prawdopodobieństwa (który zawodnik lepiej przygotowany), ale w trakcie walki widać, kto zadaje ciosy, i prawdopodobieństwo się zmienia. Order flow pokazuje Ci te ciosy na bieżąco.</p>
<p>Ważna myśl z tej części: <b>rynek prawie nigdy nie stoi dokładnie na swojej prawdziwej wartości.</b> Wartość jest „gdzieś pomiędzy”. Gdy cena jest nad nią, ktoś to widzi i sprzedaje, gdy pod nią, ktoś kupuje. Właśnie z tego bierze się edge (przewaga statystyczna): z odchyleń ceny od wartości. Dlatego nawet na fundamentalnie spadkowym rynku zdarzają się dobre kupna i odwrotnie.</p>
<div class="watch">${yt('_AIOgBulQsg',0,'Darius · walka, a nie spisek; rynek nigdy nie jest w wartości',363)}</div><h3 class="sh">2. Aukcja: Mona Lisa i to samo na rynku</h3>
<h4>Licytacja obrazu</h4>
<p>Licytacja nie zaczyna się od 1 $, tylko od ceny, którą wszyscy uznają za rozsądną (np. 100 000 $). Aukcjoner pyta: kto da więcej? Ktoś krzyczy 200 000, ktoś 500 000, potem milion, dwa miliony. Cena rośnie tak długo, jak <b>jest ktoś gotów zapłacić więcej</b>. Gdy przy milionie nikt nie podbija, licytacja staje. Jeśli nagle ktoś da 3 miliony, cena znowu skacze.</p>
<p>Wniosek Dariusa: „kupuj tanio, sprzedawaj drogo” to za mało, bo cena może pójść dużo wyżej albo dużo niżej, niż się wydaje. Decyduje to, czy jest jeszcze ktoś chętny. Odwrotna strona: gdy <b>nikt nie chce kupić</b>, cena spada, aż znajdzie pierwszego chętnego. Tak kryptowaluty tracą 99,9%: nie ma płynności, więc cena „łączy się” z kolejnym kupującym coraz niżej.</p>
<h4>Przełożenie na rynek finansowy</h4>
<div class="scroll"><table class="t"><tr><th>Licytacja</th><th>Rynek futures</th></tr>
<tr><td>przedmiot</td><td>kontrakty czekające w księdze (limity: 2, 4, 3, 5… kontrakty na kolejnych poziomach)</td></tr>

<p>Darius pokazuje to na księdze złota (GC, kontrakt futures na złoto z giełdy COMEX, należącej do grupy CME), w programie Bookmap (platforma z heatmapą księgi zleceń): kupno 10 kontraktów zjada 2, potem 4, potem 3 i część z 5. Kupujący dostaje średnią ze wszystkich poziomów i sam przesuwa cenę w górę. To ten sam mechanizm, co krok 3 w lekcji 1.</p>
<p>Z tego wynika jego argument przeciw „manipulacji”: <b>kto kupuje dużo naraz, ten sam podbija sobie cenę</b> i dostaje złą średnią. Nie da się kupić 100 czy 1 000 kontraktów bez ruszenia ceny. Dlatego duzi uderzają agresywnie tylko w wybranych, przemyślanych momentach: wtedy, gdy liczą, że po ich ruchu inni zrobią to samo i „licytacja” pójdzie dalej. Przykład z ropą: gdy dostępność spadła z powodu konfliktu, firmy zależne od ropy kupowały, żeby się zabezpieczyć, i cena skoczyła z dnia na dzień.</p>

<details class="extra"><summary>Dla dociekliwych: czy to nie przeczy zasadzie „rynek dyskontuje wszystko”</summary><h4>Czy to nie przeczy zasadzie „rynek dyskontuje wszystko”?</h4>
<p><b>„Rynek dyskontuje wszystko”</b> to pierwsza zasada teorii Dowa (Charles Dow, twórca indeksu Dow Jones, przełom XIX i XX w.) i podstawa analizy technicznej. W wersji akademickiej to hipoteza rynku efektywnego. Mówi, że cena szybko uwzględnia wszystkie <b>znane informacje</b>: newsy, dane, oczekiwania. Teza Dariusa brzmi podobnie sprzecznie, ale dotyczy czegoś innego:</p>
<div class="scroll"><table class="t"><tr><th></th><th>„Rynek dyskontuje wszystko”</th><th>Darius: „rynek nigdy nie jest w wartości”</th></tr>
<tr><td>O czym mówi</td><td>o <b>informacji</b>: nie zarobisz na tym, co wszyscy już wiedzą</td><td>o <b>cenie w danej chwili</b>: ostatnia transakcja rzadko trafia idealnie w wartość</td></tr>
<tr><td>Skala czasu</td><td>dni, tygodnie: cena dochodzi do nowej wartości po nowej informacji</td><td>minuty, godziny: cena oscyluje wokół wartości</td></tr>
<tr><td>Mechanizm</td><td>nowa informacja → szybka zmiana wyceny</td><td>nierównowaga zleceń: jedni muszą kupić teraz, inni mają inny horyzont, w księdze jest pustka albo ściana (lekcja 1)</td></tr></table></div>
<p>Obie tezy mogą być prawdziwe naraz. <b>Rynek szybko ustala, gdzie mniej więcej jest wartość</b> (dyskontuje informację), <b>ale cena nie stoi w miejscu, tylko wahadłowo przechodzi przez tę wartość.</b> To jest balans z sekcji 3, a value area z lekcji 3 to właśnie ten przedział: wartość to obszar, a nie jedna cena. Żeby w ogóle doszło do transakcji, ktoś musi uznać cenę za za wysoką, a ktoś inny za za niską. Gdyby cena zawsze była dokładnie równa wartości, nikt nie miałby powodu handlować.</p>
<div class="warnbox"><b>Uwaga na skrót myślowy:</b> „nigdy nie jest w wartości” to uproszczenie, a nie twierdzenie, które da się zmierzyć. Nikt nie zna „prawdziwej wartości” co do ticka. Profil wolumenu pokazuje tylko, gdzie rynek <b>akceptował</b> ceny. Uczciwsze sformułowanie: cena ciągle odchyla się od obszaru akceptowanej wartości, a przewaga bierze się z handlu tymi odchyleniami wtedy, gdy order flow pokazuje, że wracają.</div>
</details>
<details class="extra"><summary>Dla dociekliwych: jak sprawdzić, czy jest drogo, czy tanio</summary><h4>Jak sprawdzić, czy jest drogo, czy tanio?</h4>
<p>Ani Faber, ani Darius nie liczą „prawdziwej wartości” fundamentalnie, z wycen czy bilansów. Obaj mierzą ją <b>wolumenem</b>: wartość to obszar, w którym rynek najwięcej handlował, czyli zaakceptował ceny. Wszystko nad tym obszarem jest „drogie” (premium), wszystko pod nim „tanie” (discount). Narzędzia, którymi to mierzysz, poznasz w lekcjach 3 i 4:</p>
<div class="scroll"><table class="t"><tr><th>Narzędzie</th><th>Co mierzy</th><th>Drogo (premium)</th><th>Tanio (discount)</th><th>Gdzie w kursie</th></tr>
<tr><td><b>Value area wczorajszej sesji</b>: VAH (value area high, górna krawędź obszaru wartości), VAL (value area low, dolna krawędź obszaru wartości), POC (point of control, poziom z największym wolumenem)</td><td>gdzie wczoraj przeszło ok. 70% wolumenu</td><td>cena nad VAH</td><td>cena pod VAL</td><td>lekcje 3 i 4</td></tr>
<tr><td><b>VWAP</b> (volume weighted average price, średnia cena dnia ważona wolumenem)</td><td>wartość dzisiejszego dnia, liczona na żywo</td><td>cena nad VWAP</td><td>cena pod VWAP (Darius: „dobra cena do kupna”)</td><td>lekcja 3, sekcja 8</td></tr>
<tr><td><b>Pasma odchyleń od VWAP</b></td><td>jak daleko cena odjechała od średniej dnia</td><td>2. i 3. odchylenie w górę</td><td>2. i 3. odchylenie w dół</td><td>lekcje 3 i 25</td></tr>
<tr><td><b>Profil wielodniowy</b> (scalone profile, profil złożony z 3 miesięcy)</td><td>wartość w dłuższym terminie</td><td>nad VAH tego profilu</td><td>pod VAL tego profilu</td><td>lekcja 4</td></tr>
<tr><td><b>Przesuwanie się VA (value area, obszar wartości z ok. 70% wolumenu) dzień po dniu</b></td><td>czy wartość rośnie, czy spada</td><td colspan="2">wartość rośnie: kupujesz tanio, czyli przy VAL i POC; wartość spada: sprzedajesz drogo, czyli przy VAH</td><td>lekcja 4 (bias dnia)</td></tr></table></div>
<p>Faber mówi to wprost: to jest „prawdziwe pojęcie premium i discount”. Gdy wartość przesuwa się w dół, szukasz wejścia w kierunku trendu z miejsca, które w rozkładzie wolumenu jest drogie, czyli przy VAH.</p>
<div class="warnbox"><b>Pułapka: „tanio” nie znaczy „kupuj”.</b> Wartość się przesuwa. Jeśli cena wyjdzie pod VAL i zostanie tam zaakceptowana (wolumen buduje się niżej), to nie jest okazja, tylko price discovery: stara wartość przestaje obowiązywać, a nowa tworzy się niżej (sekcje 4 i 5 tej lekcji). Dlatego ocena „drogo/tanio” to dopiero pierwszy z trzech kroków:
<ol><li><b>Gdzie jest wartość?</b> Profil wolumenu, VWAP.</li>
<li><b>W którą stronę się przesuwa?</b> Bias z lekcji 4.</li>
<li><b>Czy cena przy krawędzi wartości jest odrzucana, czy akceptowana?</b> Order flow: absorpcja kontra agresja z rezultatem (lekcje 5 i 6).</li></ol>
Okazja jest wtedy, gdy wszystkie trzy się zgadzają, np. bias long, cena pod VAL i absorpcja sprzedających. Sama „taniość” to za mało.</div>

<section class="s unit" data-unit="2"><div class="unit-nr">Jednostka 2 z 8</div><h2>Balans: uczciwa cena i budowa pozycji</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 1 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Jak Darius tłumaczy ruch ceny, zamiast „polowania na stopy”?</p><details><summary>Pokaż odpowiedź</summary><p>Cenę pcha <b>agresor</b>. Ruch się kończy, gdy po drugiej stronie ktoś tę agresję zaabsorbuje. Stopy mogą przyspieszyć ruch, ale nie są jego celem.</p></details></div><div class="rq"><p class="q">Kto w licytacji rynkowej jest aukcjonerem, kto licytującym i co jest przedmiotem?</p><details><summary>Pokaż odpowiedź</summary><p>Aukcjoner: giełda CME (Chicago Mercantile Exchange). Licytujący: agresywni (market takerzy). Przedmiot: kontrakty czekające w księdze jako limity.</p></details></div></div>
<h3 class="sh">3. Balans: uczciwa cena i budowa pozycji</h3>
<p>Darius tłumaczy balans na jabłkach w supermarkecie. Sprzedawca ma 50 jabłek.</p>
<ul><li><b>10 $ za sztukę:</b> kupi tylko ktoś bardzo bogaty albo bardzo zdeterminowany. Sprzedane 3 z 50. To nie jest uczciwa cena.</li>
<li><b>1 $ za sztukę:</b> ludzie biorą po dwa, bo tanio. Wszystko wyprzedane przed końcem dnia. To też nie jest uczciwa cena: sprzedawca stracił, bo zabrakło mu towaru.</li>
<li><b>Ok. 1,50 $:</b> sprzedawca sprzedaje cały towar i dostaje za niego lepszą cenę. <b>Obie strony uznają cenę za dobrą.</b> To jest rynek w balansie.</li></ul>
<p>Na wykresie balans to cena chodząca w górę i w dół w zakresie. Kupujący kupują dół, sprzedający sprzedają górę, i obie strony uważają, że robią dobry interes. W profilu wolumenu widać to jako value area (obszar wartości): granice VAH (value area high, górna krawędź obszaru wartości) i VAL (value area low, dolna krawędź obszaru wartości) działają jak naturalne wsparcie i opór (więcej w lekcji 3).</p>
<p><b>Dlaczego to w balansie buduje się pozycje (akumulacja):</b> duży inwestor, który wierzy w długoterminowy wzrost złota, wykorzystuje każdą akumulację, żeby kupić jak najwięcej kontraktów bez podbijania ceny. Krótkoterminowy spadek mu nie przeszkadza. W tym samym czasie spekulant (day trader, który zamyka pozycje w ciągu dnia, albo hedge fund, czyli spekulacyjny fundusz inwestycyjny) sprzedaje, bo widzi niżej więcej płynności, i cena chwilowo spada. Każdy ma inny horyzont: sekundy, dzień, tygodnie, miesiące. Nie ma tu „przygotowywania płynności, żeby Cię wyrzucić”. Są dwie strony, które obie uważają cenę za korzystną.</p>
<p>Faber opisuje to samo językiem wolumenu: w value area jest <b>najwięcej wykonanych transakcji</b>, czyli najsilniejsza akceptacja ceny. Instytucje chętnie tu handlują, bo znajdują kontrahenta. Taki rynek nazywa się range (zakres), kompresja albo konsolidacja i gra się go od krawędzi do środka, czyli do POC (point of control, poziom z największym wolumenem). To w nim rodzi się kolejny trend.</p>
<div class="warnbox"><b>Dwie liczby, których nie wolno mylić.</b> Darius: rynek spędza w balansie ok. <b>70% czasu</b>. Faber: w value area przechodzi ok. <b>68% wolumenu</b> profilu (jedno odchylenie standardowe rozkładu normalnego; wiele platform ustawia 70%). Pierwsza liczba dotyczy czasu, druga wolumenu. Żadna z nich nie jest zmierzoną statystyką skuteczności zagrania.</div>
<div class="case"><div class="lab">Pytanie, które musi paść · czy to nie przeczy temu, że w trendzie wolumen rośnie?</div>
<p>Wiele koncepcji (m.in. aukcja inicjująca u samego Fabera, lekcja 5) mówi: ruch w trendzie ma <b>duży wolumen</b>, a słupki rosną, gdy cena mocno spada albo rośnie. A tu czytasz, że najwięcej wolumenu jest w <b>balansie</b>. Obie rzeczy są prawdziwe naraz, bo to <b>dwa różne sposoby liczenia wolumenu</b>.</p>
<div class="scroll"><table class="t"><tr><th></th><th>Wolumen w czasie (pionowy)</th><th>Wolumen na cenie (poziomy, profil)</th></tr>
<tr><td>Gdzie go widać</td><td>słupki pod świecami</td><td>profil z boku wykresu</td></tr>
<tr><td>Pytanie</td><td>ile kontraktów przeszło <b>w tej minucie</b>?</td><td>ile kontraktów przeszło <b>na tej cenie</b> przez cały dzień?</td></tr>
<tr><td>W trendzie</td><td><b>dużo</b>: słupki rosną</td><td><b>mało na każdej cenie</b>: powstaje LVN (low volume node, węzeł niskiego wolumenu)</td></tr>
<tr><td>W balansie</td><td>często mniej na minutę</td><td><b>bardzo dużo na każdej cenie</b>, bo cena wraca na nie godzinami</td></tr></table></div>
<p><b>Przykład na liczbach</b> (NQ, czyli kontrakt futures E-mini Nasdaq-100; liczby ilustracyjne):</p>
<ul><li><b>Trend:</b> w 1 godzinę przechodzi 30 000 kontraktów, ale cena przejeżdża przez 100 poziomów. Na minutę to dużo (wysokie słupki), a na każdej cenie 30 000 / 100 = <b>300 kontraktów</b>, czyli cienko.</li>
<li><b>Balans:</b> przez 5 godzin przechodzi 60 000 kontraktów, ale cena chodzi tylko po 20 poziomach. Na minutę to mniej niż w trendzie, a na każdej cenie 60 000 / 20 = <b>3 000 kontraktów</b>, czyli gruba bryła: value area.</li></ul>
<p>Faber używa obu sposobów w tym samym filmie: przy aukcji inicjującej mówi, że ruch potwierdza <b>wolumen pionowy powyżej średniej</b>, a przy profilu, że w value area przechodzi <b>68% wolumenu</b>.</p>
<p><b>Skąd te 68% i 70%:</b></p>
<ul><li><b>68% wolumenu (Faber)</b> to <b>definicja</b>, a nie odkrycie: value area to z założenia przedział, w którym przeszło ok. 68–70% wolumenu dnia. Platforma tylko liczy, gdzie te 70% wypadło. Nic to nie mówi o tym, czy trend miał mało wolumenu.</li>
<li><b>70% czasu (Darius)</b> to obserwacja: rynek częściej stoi w zakresie, niż jedzie w trendzie. Pasuje do przykładu: trend trwał 1 godzinę, balans 5 godzin.</li></ul>
<p><b>W jednym zdaniu:</b> trend to szybko i dużo na minutę, ale cienko na cenie, a balans to wolno, ale grubo na cenie.</p>

<h3 class="sh">6. Jak to wygląda na wykresie i dlaczego BOS przegrywa w balansie</h3>
<p>Darius zaczyna każdą analizę od wyższego interwału (np. H1, czyli świec godzinowych) i schodzi niżej (M15, M5, M1: świece 15-, 5- i 1-minutowe). Na każdym widzi <b>tę samą historię</b>: balans, price discovery, nieudana aukcja, powrót, nowy balans. To fraktal.</p>
<p>Dlaczego traderzy ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona) i SMC tracą w akumulacji: w balansie cena co chwilę łamie mały szczyt albo dołek. Każde złamanie wygląda jak BOS (break of structure, złamanie struktury), FVG (fair value gap, luka między knotami trzech kolejnych świec) albo „liquidity grab” (zebranie płynności), czyli według strategii jak poprawny sygnał. W balansie te sygnały pojawiają się non stop, ale nic z nich nie wynika, i trader dostaje serię stopów. Złamanie struktury zdarza się zarówno wtedy, gdy rynek naprawdę wybija, jak i wtedy, gdy tylko chodzi w zakresie. Dlatego potrzebujesz reguły, kiedy w ogóle wolno grać wybicie. Darius bierze ją z profilu: czy cena jest w balansie, czy z niego wyszła z akceptacją.</p>

<section class="s unit" data-unit="3"><div class="unit-nr">Jednostka 3 z 8</div><h2>Price discovery: wyjście z balansu</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 2 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Czym jest balans?</p><details><summary>Pokaż odpowiedź</summary><p>Cena chodzi w zakresie, a obie strony uważają ją za uczciwą. W profilu wolumenu to VA (value area, obszar wartości z ok. 70% wolumenu).</p></details></div><div class="rq"><p class="q">Dlaczego to w balansie buduje się duże pozycje?</p><details><summary>Pokaż odpowiedź</summary><p>Bo tam zawsze jest <b>kontrahent</b>. Można kupić dużo bez przesuwania ceny.</p></details></div></div>
<h3 class="sh">4. Price discovery: wyjście z balansu</h3>
<p>Balans kończy się wtedy, gdy zmienia się to, co ludzie uważają za uczciwą cenę. U Dariusa to znowu jabłka: rolnik dostarcza dziś 10 jabłek zamiast 50, bo lato było słabe. Przy 1,50 $ wszystko zniknęłoby w godzinę, więc sprzedawca musi podnieść cenę do 5 $, żeby dalej sprzedawać „uczciwie”. Uczciwa cena zależy od dostępności towaru. Na rynku tę rolę grają <b>fundamenty</b> i nowe informacje.</p>
<p>W fazie price discovery <b>jedna strona jest agresywna i dostaje nagrodę</b>: kupuje coraz wyżej, a sprzedających nie ma. To jest licytacja Mony Lisy w ruchu. Cena szuka nowej wartości i w końcu ją znajduje: tworzy nowy balans wyżej albo niżej.</p>
<p>Faber dodaje dwie rzeczy:</p>
<ul><li><b>Sygnał wyjścia z balansu:</b> cena <i>i wolumen</i> akceptują poziomy poniżej VAL (value area low, dolna krawędź obszaru wartości) albo powyżej VAH (value area high, górna krawędź obszaru wartości). To znaczy, że akumulacja albo dystrybucja się skończyła i zaczyna się „prawdziwy ruch”. Chcesz wejść w trend wcześnie? Patrz na akceptację poza value area, a nie na samo dotknięcie.</li>
<li><b>LVN (węzeł niskiego wolumenu):</b> szybki ruch zostawia w profilu poziomy, na których prawie nie było transakcji. To miejsca nieefektywnej „dostawy” ceny, bez akceptacji, gdzie duzi nie znaleźli kontrahenta. Rynek zwykle wraca tam, żeby je „przebalansować”, zanim pojedzie dalej. Na takim powrocie Faber szuka wejścia w kierunku trendu. „Zwykle” nie mówi kiedy: powrót może przyjść już po Twoim SL (stop loss; zastrzeżenie w sekcji 5a).</li></ul>

<details class="extra"><summary>Dla dociekliwych: czy polujemy na poziomy z dużą liczbą limitów, i jak wyznaczyć cel</summary><div class="warnbox"><b>Uwaga: czy polujemy na poziomy z dużą liczbą limitów?</b>
<p>Częsta myśl: „widzę dużo limitów, dołożę swój i pojadę z nimi”. Najpierw trzeba rozdzielić dwa różne „duże poziomy”:</p>
<div class="scroll"><table class="t"><tr><th></th><th>Ściana limitów w księdze (DOM, czyli Depth of Market, księga zleceń na żywo; heatmapa)</th><th>HVN w profilu (high volume node, poziom wysokiego wolumenu)</th></tr>
<tr><td>Co to jest</td><td>zlecenia, które <b>czekają</b></td><td>transakcje, które <b>już przeszły</b></td></tr>
<tr><td>Pewność</td><td>może zniknąć (spoof, fałszywe zlecenie) albo być większa, niż widać (iceberg; lekcja 1, sekcja 9)</td><td>to historia, nie zniknie</td></tr></table></div>
<p><b>Dlaczego nie dokładamy swojego limitu do dużej ściany.</b> Nie chodzi o średnią cenę: uśrednianie dotyczy zlecenia <b>rynkowego</b>, które zjada kilka poziomów naraz, a limit wykonuje się zawsze <b>po Twojej cenie albo lepszej</b> (limit kupna na 103, gdy sprzedający stoją na 101, wykona się po 101; lekcja 1, sekcja 3). Prawdziwy problem to <b>kolejka</b> (FIFO, ang. first in, first out, „pierwszy przyszedł, pierwszy obsłużony”). Stajesz <b>za</b> wszystkimi, którzy już tam czekają, więc Twój limit wykona się dopiero wtedy, gdy agresja zje całą ścianę przed Tobą. Najczęściej to moment, w którym ściana <b>pęka i cena jedzie dalej przeciw Tobie</b> (pułapka kolejki, lekcja 1, sekcja 9.8).</p>
<p><b>Jak używamy ściany.</b> Ściana to <b>miejsce, gdzie patrzysz</b>, a nie zlecenie, do którego się dopisujesz.</p>
<ul><li><b>Ściana limitów kupna pod ceną</b>, w którą uderzają agresywni sprzedający, a cena stoi (absorpcja): ktoś duży broni poziomu. <b>Wejście long tuż nad nią, stop tuż pod nią</b>. Jeśli duży przegra, Ty też nie powinieneś już być w pozycji.</li>
<li><b>Ściana limitów sprzedaży nad ceną</b> to dla ruchu w górę <b>przeszkoda</b>, bo kupujący muszą ją zjeść. Zwykle jest to miejsce na <b>cel</b> (TP, take profit), a nie na wejście.</li>
<li><b>Cel</b> wyznaczasz w <b>pustkę</b> (LVN, low volume node, węzeł niskiego wolumenu), aż do następnej ściany albo HVN (high volume node, węzeł dużego wolumenu), bo przez pustkę cena przechodzi łatwo. Żeby to nie wyglądało na sprzeczność z sekcją 5a („LVN działa jak sufit albo podłoga”): <b>przez środek LVN cena przechodzi szybko, a reaguje na jego krawędzi</b>, czyli na granicy z HVN. Cel stawiasz za pustką, wejścia szukasz na jej krawędzi.</li></ul>
<p><b>Na co więc czekamy?</b> Powrót do LVN to tylko jeden z dwóch scenariuszy. Który wybierasz, zależy od fazy rynku:</p>
<div class="scroll"><table class="t"><tr><th>Faza rynku</th><th>Na co czekasz</th><th>Wejście</th><th>Cel</th></tr>
<tr><td><b>Price discovery</b> (trend, wartość się przesuwa; ta sekcja)</td><td><b>powrotu do LVN</b> albo do wczorajszej krawędzi VA (value area, obszaru wartości)</td><td>w kierunku trendu, gdy przeciwna agresja zostaje zaabsorbowana</td><td>kontynuacja, nowa wartość</td></tr>
<tr><td><b>Balans</b> (cena w zakresie; sekcje 3 i 5)</td><td>dojścia do <b>krawędzi VA</b> (VAH albo VAL, czyli value area high / low: górna albo dolna krawędź)</td><td>przeciw ruchowi, gdy wybicie jest odrzucane (hook)</td><td>POC (point of control, cena z największym wolumenem) albo druga krawędź VA</td></tr></table></div>
<p>W obu przypadkach kolejność jest ta sama co u Fabera: (1) <b>profil</b> mówi, <b>gdzie</b> i w którą stronę szukać wejścia; (2) <b>order flow</b> mówi, <b>czy</b> wejść, czyli czy ktoś duży broni ceny na tym poziomie; (3) <b>cena</b> mówi, jak prowadzić pozycję: break-even (stop na cenę wejścia) po potwierdzeniu, potem trailing (przesuwanie stopu za ruchem). <b>Samo dotknięcie LVN albo ściany to jeszcze nie sygnał.</b> Sygnałem jest reakcja na tym poziomie.</p>
<p><b>Jak wyznaczyć kolejny poziom, czyli cel?</b> Nie wiesz, gdzie powstanie nowy balans, i nikt tego nie wie. Dlatego cel wyznaczasz na dwa sposoby:</p>
<ul><li><b>Przed ceną są stare poziomy.</b> Rynek „pamięta”, gdzie handlował. Celem jest <b>najbliższe znane miejsce, w którym rynek już kiedyś handlował</b>: POC (point of control), VAH albo VAL (górna albo dolna krawędź value area) z poprzednich dni, HVN (high volume node, poziom wysokiego wolumenu) z profilu wielodniowego, high albo low poprzedniego dnia lub tygodnia, okrągła liczba (np. 25 500 na NQ, czyli kontrakcie futures E-mini Nasdaq-100, u Fabera), ściana limitów w księdze. Grasz od LVN (low volume node, węzła niskiego wolumenu) do znanej, starej wartości, a nie do przyszłej.</li>
<li><b>Przed ceną nie ma nic</b> (nowe szczyty albo dołki, czyste price discovery). Celu nie zgadujesz, tylko prowadzisz pozycję: stały stosunek zysku do ryzyka (np. RR 1:2, czyli risk/reward: zysk 2 razy większy od ryzyka), trailing za agresją albo ocena średniego zasięgu dnia (ADR, average daily range).</li></ul>
<p>W praktyce łączysz oba sposoby: <b>część pozycji</b> zamykasz na pierwszym znanym poziomie, <b>stop przesuwasz na break-even</b>, a <b>resztę prowadzisz trailingiem</b>. Przejdź rysunek krok po kroku. To materiał trochę na wyrost (zarządzanie pozycją szerzej omawiają lekcje 8–10 i 27), ale dzięki niemu od początku widzisz, po co zaznaczasz stare poziomy.</p>

<section class="s unit" data-unit="4"><div class="unit-nr">Jednostka 4 z 8</div><h2>Nieudana aukcja (hook) krok po kroku</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 3 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Co uruchamia price discovery (szukanie nowej ceny)?</p><details><summary>Pokaż odpowiedź</summary><p>Zmiana tego, co uczestnicy uznają za uczciwą cenę (nowa informacja, fundamenty). Jedna strona jest agresywna i <b>dostaje nagrodę</b>: cena idzie dalej.</p></details></div><div class="rq"><p class="q">Jaki jest według Fabera sygnał wyjścia z balansu?</p><details><summary>Pokaż odpowiedź</summary><p>Cena <b>i wolumen</b> akceptują poziomy poza VAL albo VAH (dolną albo górną krawędzią obszaru wartości). Samo dotknięcie nie wystarcza.</p></details></div></div>
<h3 class="sh">5. Nieudana aukcja (failed auction, „hook”)</h3>
<p>To trzeci scenariusz i najważniejszy dla ludzi z ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona). Cena wychodzi poza zakres, wygląda jak początek price discovery, ale <b>nie znajduje chętnych</b> do handlu po nowych cenach. Agresja zostaje zaabsorbowana i cena wraca do wartości.</p>
<p>Darius pokazuje to na dwóch przykładach:</p>
<ul><li><b>Wypowiedź polityka:</b> rynek jest w balansie, nagle pada zdanie „zaczynamy wojnę”. Spekulanci sprzedają, cena wypada z zakresu. Za chwilę „jednak nie, skończyliśmy” i rynek wraca. Sprzedający próbowali, wyglądali na zwycięzców (wybicie, kontrola, nikt nie kupuje), ale drugi bokser wyprowadził cios i walka się odwróciła.</li>
<li><b>Bez newsa:</b> sprzedający mają kontrolę, kupujący nie ruszają ceny, aż do poziomu <b>pełnego płynności i kupujących</b>, np. tam, gdzie wcześniej weszli agresywni kupujący, którzy wywindowali cenę w górę. Ktoś, kto kupił tam 100 kontraktów, widzi powrót do swojej ceny: „to wciąż dobra cena, dokładam”. Dołączają kolejni, a sprzedający realizują zyski. Cena idzie w górę.</li></ul>
<p>Dlaczego to <b>nie jest „polowanie na stopy”</b>: cena nie poszła tam po płynność detalu. Poszła, bo sprzedający byli agresywni, a wróciła, bo po drugiej stronie ktoś ich zaabsorbował. Darius zwraca też uwagę, że instytucje czasem po prostu <b>tracą</b> i przyjmują stratę. To ich zamykanie pozycji porusza rynkiem. Jedno jest pewne: poza zakresem był <b>niski wolumen</b>, a rynek nie lubi zostawać w niskim wolumenie.</p>
<h4>Hook Fabera</h4>
<p>Faber nazywa ten wzorzec <b>hook</b> (hak): cena próbuje wybić VAL albo VAH (value area low / high, dolna albo górna krawędź obszaru wartości), zostaje odrzucona i wraca do środka. Wszystko poza krawędzią staje się strefą odrzucenia. Po powrocie do value area masz zagranie kontynuacji: cena zwykle <b>przechodzi przez całą value area na drugą krawędź</b>. Przy hooku VAH od dołu: fake-out (fałszywe wybicie), failed auction, „trapped traders” (uwięzieni traderzy, którzy weszli w wybicie i mają stratę), a potem przejście ceny przez VAH w kierunku VAL. Faber nazywa to jednym z najbardziej dochodowych setupów z wysokim WR (win rate, odsetek wygranych transakcji). To jego deklaracja, a nie zmierzona statystyka.</p>
<div class="scroll"><table class="t"><tr><th></th><th>Price discovery</th><th>Nieudana aukcja</th></tr>
<tr><td>Wybicie z zakresu</td><td>tak</td><td>tak</td></tr>
<tr><td>Akceptacja poza VA (cena i wolumen zostają)</td><td>tak</td><td>nie, szybki powrót</td></tr>
<tr><td>Order flow za wybiciem</td><td>agresja nagrodzona</td><td>agresja zaabsorbowana</td></tr>
<tr><td>Cel</td><td>nowa wartość, kontynuacja</td><td>POC (point of control, poziom z największym wolumenem) albo przeciwna krawędź VA</td></tr>
<tr><td>Nazwa w ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona)</td><td>„displacement” (gwałtowne przemieszczenie ceny), BOS (break of structure, złamanie struktury)</td><td>„liquidity sweep” (zebranie płynności, czyli stopów za szczytem lub dołkiem), manipulacja</td></tr></table></div>

<div class="watch">${yt('_AIOgBulQsg',1399,'Darius · failed auction: polityk, boks, poziom wcześniejszych kupujących',1641)}${yt('APQLCEHwq38',422,'Darius · wybicie: price discovery czy failed auction? kto bardziej agresywny',544)}${yt('Pz8f0wWW12M',1589,'Faber · hook przy VAL i VAH, przejście przez value area',1713)}</div>
<h4>Mechanizm krok po kroku: co się dzieje w księdze przy nieudanej aukcji</h4>
<p>Autorzy opisują nieudaną aukcję słowami: „agresja zaabsorbowana”, „nikt nie handluje po nowych cenach”. Poniżej to samo na liczbach, w języku lekcji 1. To ilustracja mechanizmu na NQ (kontrakt futures E-mini Nasdaq-100 z giełdy CME; 1 tick = 0,25 pkt = 5 $), a nie zapis konkretnego dnia.</p>
<ol>
<li><b>Balans.</b> Od kilku godzin cena chodzi między VAL (value area low, dolna krawędź obszaru wartości) 21 000 a VAH (value area high, górna krawędź obszaru wartości) 21 040. POC (point of control, poziom z największym wolumenem) jest na 21 020. Obie strony handlują, delta (różnica między kupnem a sprzedażą agresywną) jest bliska zera.</li>
<li><b>Atak sprzedających.</b> Pada zła informacja albo duży sprzedający zaczyna działać. Sprzedaż rynkowa zjada limity kupna pod ceną: 21 000, 20 999,75, 20 999,50… Cena wychodzi pod VAL. Na wykresie wygląda to jak początek price discovery w dół.</li>
<li><b>Pytanie aukcji: „czy ktoś kupi taniej?”.</b> Tu rozstrzyga się wszystko. Pod VAL czeka ktoś pasywny i duży, np. fundusz, który chciał kupić w balansie, a teraz dostaje jeszcze lepszą cenę. Jego limity kupna są zjadane, ale on je <b>odnawia</b> (iceberg z lekcji 1, sekcja 9.7). W footprincie widać dużą liczbę w kolumnie bid (sprzedaż agresywna), a cena nie spada dalej. To <b>wysiłek bez rezultatu</b>.</li>
<li><b>Sprzedający zostają uwięzieni.</b> Ci, którzy sprzedali pod VAL, mają teraz pozycję short, a cena nie chce iść niżej. Ich stopy stoją nad wybiciem, czyli w VA (value area, obszar wartości z ok. 70% wolumenu). Zlecenie stop dla shorta to kupno (lekcja 1, sekcja 9.3).</li>
<li><b>Powrót.</b> Kupujący z dołu dokładają, agresywni kupujący wracają, a uwięzieni sprzedający zamykają pozycje <b>kupując</b>. Ich stopy odpalają się jako kupno rynkowe. Trzy źródła kupna naraz: cena wraca nad VAL.</li>
<li><b>Przejście przez VA.</b> Wewnątrz VA cena była już akceptowana i nie ma tam ściany, która by ją zatrzymała. Faber mówi, że cena „przecina value area, żeby szukać zleceń na drugiej krawędzi”. Stąd cel hooka: POC, a często przeciwna krawędź (VAH 21 040).</li>
</ol>
<p><b>To jest dokładnie to, co ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona) nazywa „liquidity sweep”.</b> Różnica w wyjaśnieniu: cena nie zeszła pod VAL „po stopy detalu”. Zeszła, bo sprzedający byli agresywni, a wróciła, bo po drugiej stronie stał większy pasywny kupujący. Stopy uwięzionych są <b>paliwem powrotu</b>, a nie celem wybicia.</p>

<details class="extra"><summary>Dla dociekliwych: pomysł na test hooka na bocie pomiarowym</summary><div class="case"><div class="lab">Twoja teza · hook, ICT i przewaga order flow</div>
<p><b>Teza (Darek, 14.11.2026):</b> hook przypomina ICT (Inner Circle Trader). Jeśli ma wysoki win rate (odsetek wygranych transakcji), to po prostu działa, a wyjaśnienie jest sprawą drugorzędną. Takich setupów jest dużo: kanał zostaje wybity, a my szukamy wejścia w stronę przeciwnej krawędzi. Setup może zdarzać się rzadko, ale gdy warunki są spełnione, bywa świetnym zagraniem. Szkoły się tu nie wykluczają, tylko mają inne, mniej albo bardziej świadome warunki wejścia. <b>Naszą przewagą</b> jest to, że heatmapa (mapa ciepła księgi zleceń) i order flow pozwalają sprawdzić na żywo, czy setup jest prawidłowy. To game changer (coś, co zmienia zasady gry).</p>
<p><b>Ten sam obraz pod różnymi nazwami:</b></p>
<div class="scroll"><table class="t"><tr><th>Szkoła</th><th>Nazwa</th><th>Jak sprawdza, czy wejść</th></tr>
<tr><td>ICT (Inner Circle Trader)</td><td>liquidity sweep (zebranie płynności), „manipulacja”</td><td>struktura świec: wybicie szczytu albo dołka i powrót</td></tr>
<tr><td>Wyckoff</td><td>spring (fałszywe przebicie dołu), upthrust (fałszywe przebicie góry)</td><td>cena i wolumen w fazach akumulacji i dystrybucji</td></tr>
<tr><td>AMT (Auction Market Theory, teoria aukcji), Faber</td><td>failed auction (nieudana aukcja), hook</td><td><b>na żywo w order flow</b>: czy agresja za krawędzią została zaabsorbowana; w heatmapie: czy ktoś duży broni poziomu</td></tr></table></div>
<p><b>Zgoda co do przewagi.</b> Trader ICT widzi tylko, że cena wyszła za dołek i wróciła, i dopiero po fakcie wie, czy to był sweep, czy początek trendu. Ty możesz zobaczyć <b>w trakcie</b>, czy po drugiej stronie stoi ktoś duży. Na przykładzie hooka pod VAL (value area low, dolną krawędzią obszaru wartości):</p>
<ul><li>Cena schodzi pod VAL, bo <b>sprzedający</b> atakują zleceniami rynkowymi.</li>
<li>Hook powstaje tylko wtedy, gdy <b>ktoś duży kupuje</b> po drugiej stronie i zjada całą tę sprzedaż. Bez niego cena jedzie dalej w dół i jest trend (price discovery), a nie hook.</li>
<li>Pytanie brzmi więc: <b>czy pod VAL naprawdę stoi duży kupujący?</b> Odpowiedź dają heatmapa (mapa ciepła księgi zleceń) i footprint (zapis wykonanych transakcji na każdej cenie):</li></ul>
<div class="scroll"><table class="t"><tr><th>Co widzisz</th><th>Co to znaczy</th><th>Co robi cena</th><th>Hook?</th></tr>
<tr><td><b>Iceberg</b> (ukryte duże zlecenie): w księdze widać tylko np. 10 kontraktów kupna. Sprzedający je zjadają, a za chwilę znowu stoi 10, i znowu… W footprincie na tym poziomie przeszło już 300 kontraktów sprzedaży.</td><td>ktoś duży <b>naprawdę kupuje</b>, tylko chowa wielkość</td><td>stoi, sprzedaż nic nie daje</td><td><b>tak</b>: to jest „ktoś duży po drugiej stronie”</td></tr>
<tr><td><b>Zwykła duża ściana</b>: np. 300 kontraktów kupna widocznych w księdze, które się wykonują i nie znikają</td><td>ktoś duży kupuje jawnie</td><td>stoi</td><td><b>tak</b></td></tr>
<tr><td><b>Spoof</b> (fałszywe zlecenie): widać 300 kontraktów kupna, ale gdy cena podchodzi, <b>znikają</b>, a w footprincie nic na tym poziomie nie przeszło</td><td>nikt nie kupuje, to tylko straszak</td><td><b>przelatuje</b> w dół</td><td><b>nie</b>: to wybicie i początek trendu</td></tr></table></div>
<p><b>Iceberg i spoof to przeciwieństwa:</b> iceberg <b>pokazuje mniej, niż ma</b> (widać 10, kupuje 300), a spoof <b>pokazuje więcej, niż ma</b> (widać 300, nie kupuje nic). Mechanizm obu jest opisany w lekcji 1, sekcja 9.</p>
<p><b>Dlatego patrzysz na wykonanie, a nie na samo zlecenie.</b> Ściana w heatmapie to tylko <b>obietnica</b>. O tym, czy to prawdziwa obrona, decyduje <b>footprint</b>:</p>
<ul><li>na tym poziomie <b>przeszły transakcje i cena się zatrzymała</b>: prawdziwy kupujący (zwykła ściana albo iceberg), czyli możliwy <b>hook</b>, i szukasz longa;</li>
<li>limit <b>zniknął i nic nie przeszło</b>: spoof, cena przeleci, <b>nie wchodzisz</b>.</li></ul>
<p>Dla tradera ICT oba przypadki wyglądają tak samo: „cena wyszła pod dołek”. Ty widzisz różnicę, zanim cena ją pokaże.</p>
<p><b>A co, gdy to spoof? Czy można wejść w drugą stronę?</b> Tak. Zamiast hooka masz wtedy <b>price discovery w dół</b> (sekcja 4). Wejście w chwili, gdy spoof znika, jest jednak bardzo trudne i nie trzeba tak robić.</p>
<p><b>Dlaczego nie wchodzić od razu:</b></p>
<ul><li>spoof znika w milisekundach, a cena przelatuje kilka poziomów naraz, więc zlecenie rynkowe dostanie duży poślizg;</li>
<li>zniknięcie limitu to jeszcze nie dowód: market makerzy (dostawcy płynności) zdejmują limity też przed newsami, a spoofer może znowu postawić ścianę niżej;</li>
<li>nie wiesz jeszcze, czy niżej nie czeka iceberg.</li></ul>
<p><b>Jak wchodzi się w praktyce:</b> nie gonisz pierwszego ruchu, tylko czekasz na potwierdzenie i <b>retest</b> (ponowny test poziomu od drugiej strony).</p>
<ol><li><b>Brak obrony:</b> limit zniknął, a w footprincie pod VAL nikt nie kupił.</li>
<li><b>Agresja sprzedających dostaje rezultat:</b> cena schodzi i nie wraca.</li>
<li><b>Akceptacja pod VAL:</b> cena i wolumen zostają pod krawędzią.</li>
<li><b>Retest VAL od dołu.</b> Cena wraca do VAL, który teraz działa jak opór. Short bierzesz, gdy kupujący są tam absorbowani, czyli kupują bez rezultatu.</li>
<li><b>Stop</b> dajesz nad VAL, a <b>cel</b> na najbliższym znanym poziomie poniżej: LVN (low volume node, węzeł niskiego wolumenu), stary POC (point of control, cena z największym wolumenem) albo wczorajszy low.</li></ol>
<p>Tak wyglądał drugi test VAL w przypadku Dariusa ze złota (sekcja 7). Za pierwszym razem byli kupujący i był hook (long). Za drugim razem nikt nie bronił, sprzedający „wcisnęli gaz” i Darius przeszedł na shorty.</p>
<p><b>W skrócie:</b> brak obrony to dopiero sygnał, żeby patrzeć w drugą stronę, a wejście bierzesz na reteście.</p>
<p><b>Dwa doprecyzowania, bo dotyczą pieniędzy:</b></p>
<ol><li><b>Wyjaśnienie ma znaczenie, ale praktyczne, a nie filozoficzne.</b> Ten sam początek, czyli wybicie za krawędź, kończy się albo hookiem, albo trendem (price discovery, sekcja 4). Kto wie, <b>dlaczego</b> hook działa (agresja zaabsorbowana, uwięzieni traderzy muszą zamknąć pozycje), ten wie też:
<ul><li><b>kiedy nie wchodzić</b>: cena i wolumen zostają za krawędzią, czyli jest akceptacja, a nie odrzucenie;</li>
<li><b>gdzie postawić stop</b>: za poziomem absorpcji, bo jeśli tam pęknie, powód wejścia zniknął;</li>
<li><b>jaki jest cel</b>: POC (point of control, cena z największym wolumenem) albo druga krawędź VA (value area, obszaru wartości), bo tam rynek znowu handluje.</li></ul>
Kto zna tylko obraz („wybili dołek, kupuję”), wchodzi też w wybicia, które okazały się początkiem trendu. Na tym traderzy ICT tracą najwięcej.</li>
<li><b>„Wysoki win rate” to na razie słowa Fabera, a nie liczba.</b> Nawet prawdziwy win rate nie mówi, czy setup zarabia. Liczą się też: <b>stosunek zysku do ryzyka</b> (80% wygranych po +1 przy stratach po −5 to strata), <b>częstotliwość</b> (setup bywa rzadki) i <b>koszty</b> (spread i prowizje, lekcja 1).</li></ol>

<p>Nie musisz wierzyć Faberowi na słowo, że hook ma „wysoki win rate”. To <b>hipoteza do testu dla OBR</b> (Twojego bota w MT5, czyli MetaTrader 5, grającego wybicie zakresu otwarcia sesji).</p>
<p><b>Pytanie:</b> czy po <b>nieudanym</b> wybiciu zakresu opłaca się zagranie w drugą stronę, do przeciwnej krawędzi zakresu?</p>
<p><b>Skąd dane:</b> bot pomiarowy <b>OBR v12_1M</b> już zbiera dane o tym, jak często po wybiciu cena wraca do zakresu.</p>

<details class="extra"><summary>Dla dociekliwych: ICT i Darius: sprzeczne czy uzupełniające się</summary><h4>ICT i Darius: sprzeczne czy uzupełniające się?</h4>
<p>Na pierwszy rzut oka Darius odrzuca ICT („to nie polowanie na stopy”). Ale w 26:21–28:21 sam mówi coś więcej: przy nieudanej aukcji cena wraca na poziom pełen kupujących, a tam spotyka się <b>kilka grup naraz</b>. Zobacz, kto w tym momencie kupuje:</p>
<div class="scroll"><table class="t"><tr><th>Kto kupuje przy powrocie na poziom</th><th>Dlaczego</th><th>Jak to nazywa ICT</th></tr>
<tr><td>dawni agresywni kupujący, którzy weszli na tym poziomie wcześniej</td><td>„to moja cena wejścia, wciąż mi się podoba, dokładam”</td><td>order block (poziom, z którego wyszedł ruch)</td></tr>
<tr><td>nowi kupujący</td><td>cena jest dla nich atrakcyjna, dołączają do trendu</td><td>wejście w „discount”</td></tr>
<tr><td>sprzedający realizujący zysk</td><td>zamknięcie shorta to kupno</td><td>(nie nazywa)</td></tr>
<tr><td>sprzedający, którzy <b>przyjmują stratę</b></td><td>zamknięcie shorta to kupno; Darius: „właśnie przez przyjmowanie strat rynek idzie w tę stronę”</td><td><b>płynność, stopy, „liquidity sweep”</b></td></tr>
<tr><td>długoterminowi kupujący z akumulacji</td><td>dokładają, bo krótkoterminowy spadek im nie przeszkadza (21:19–23:19)</td><td>„smart money”</td></tr></table></div>
<p>Wniosek: <b>teorie się nie wykluczają, tylko uzupełniają.</b> ICT dobrze nazywa jedno ze źródeł paliwa: stopy sprzedających rzeczywiście wchodzą w ten ruch jako kupno rynkowe (lekcja 1, sekcja 9.3). Darius pokazuje cały obraz: tych samych kupujących jest kilka grup i każda ma swój powód. Błąd ICT, według Dariusa, nie polega na tym, że stopów tam nie ma, tylko na wyjaśnieniu <b>przyczyny</b>: cena nie idzie pod dołek „po to, żeby zebrać stopy”, tylko dlatego, że sprzedający byli agresywni. Wraca, bo po drugiej stronie stał ktoś większy, a stopy uwięzionych tylko przyspieszają powrót. Darius: „to w gruncie rzeczy to samo co ICT, tylko z błędną logiką”, a o samej tezie: „prawda do pewnego stopnia”.</p>
</details>
<details class="extra"><summary>Dla dociekliwych: dwa znaczenia słowa „płynność”</summary><h4>Sedno różnicy: dwa znaczenia słowa „płynność”</h4>
<p>Obie szkoły używają słowa „płynność”, ale rozumieją je inaczej. Stąd bierze się większość nieporozumień między nimi.</p>
<div class="scroll"><table class="t"><tr><th></th><th>ICT</th><th>Order flow i AMT (Faber, Darius)</th></tr>
<tr><td><b>Czym jest płynność</b></td><td>głównie <b>stopy</b> zgromadzone nad szczytami (buy-side liquidity, płynność po stronie kupna) i pod dołkami (sell-side liquidity, płynność po stronie sprzedaży), także przy „równych szczytach”</td><td><b>zlecenia limit</b> czekające w księdze, czyli strona pasywna, którą agresorzy mogą zjeść</td></tr>
<tr><td><b>Skąd wiadomo, gdzie jest</b></td><td>wnioskowana z wykresu: szczyty, dołki, równe poziomy</td><td>widać ją w DOM (Depth of Market, księdze zleceń) i na heatmapie; stopów nie widać nigdzie (lekcja 1, sekcja 9.5)</td></tr>
<tr><td><b>Rola w ruchu ceny</b></td><td><b>magnes</b>: cena „idzie po płynność” (stopy)</td><td><b>cel i ściana naraz</b>: przez pustkę (LVN, low volume node, węzeł małego wolumenu) cena przechodzi szybko, a zatrzymuje się przy dużych skupiskach limitów. Tam walka: odbicie, jeśli agresja zostanie zaabsorbowana, albo przyspieszenie, jeśli ściana zostanie zjedzona. Darius: „rynek zawsze idzie do płynności” (moduł A2, lekcja D1)</td></tr>
<tr><td><b>Co napędza ruch</b></td><td>„smart money” celowo zbiera stopy</td><td>agresorzy: zlecenia rynkowe, w tym odpalone stopy, zjadają płynność pasywną</td></tr>
<tr><td><b>Cel transakcji</b></td><td>następna pula płynności (stary szczyt albo dołek)</td><td>następna ściana albo strefa akceptacji: HVN (high volume node, węzeł dużego wolumenu), POC (point of control, poziom z największym wolumenem), przeciwna krawędź VA (value area, obszar wartości z ok. 70% wolumenu)</td></tr>
<tr><td><b>Wejście</b></td><td>po „sweepie”</td><td>po potwierdzeniu absorpcji albo akceptacji</td></tr></table></div>
<p><b>Gdzie się spotykają.</b> Obie wersje są prawdziwe, tylko z innej perspektywy:</p>
<ul><li><b>Dla dużego kupującego</b> odpalone sell stopy pod dołkiem <b>są</b> płynnością: to sprzedający, od których może kupić bez podbijania ceny. Tu ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona) ma rację.</li>
<li><b>W księdze</b> te same stopy po odpaleniu stają się <b>agresją</b>, czyli zleceniami rynkowymi, które zjadają płynność pasywną. Tu ma rację order flow.</li></ul>
<p>AMT (Auction Market Theory, teoria aukcji rynkowej) łączy jedno z drugim: aukcja szuka kontrahentów. Cena przelatuje przez miejsca, gdzie ich nie ma (pustka), i zatrzymuje się tam, gdzie ich znajduje (limity, stopy, nowi uczestnicy).</p>
<p><b>Praktyczne różnice, które z tego wynikają:</b></p>
<ol><li><b>ICT zgaduje płynność z rysunku, order flow ją widzi.</b> Faber (lekcja 1, sekcja 6): zakładanie, że płynność leży nad szczytem, trafia w ok. 60–70%, bo to zgadywanie. Heatmapa pokazuje, gdzie limity stoją naprawdę, choć stopów nie pokaże.</li>
<li><b>„Magnes” w obu szkołach, ale inny.</b> ICT oczekuje, że cena dojdzie do puli <b>stopów</b>, które zgaduje z wykresu. Order flow też widzi płynność jako cel, ale to <b>prawdziwe limity</b> z heatmapy: cena przeleci przez pustkę i zatrzyma się przy dużej płynności. Przy tym samym poziomie mogą więc dać <b>różne cele</b>: ICT stary szczyt, order flow najbliższą ścianę albo HVN przed nim.</li>
<li><b>Wynik „sweepu”.</b> W ICT samo zebranie płynności jest sygnałem. W order flow decyduje to, czy po drugiej stronie stała duża płynność pasywna (absorpcja, powrót), czy nie (akceptacja, ruch dalej).</li></ol>
</details>
<details class="extra"><summary>Dla dociekliwych: LVN a FVG z ICT</summary><h4>LVN a FVG z ICT: to samo zjawisko widziane z dwóch stron</h4>
<p>LVN (low volume node, poziom z małym wolumenem) jest bardzo podobny do FVG (fair value gap, luka „niesprawiedliwej” wyceny) z ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona). Oba opisują miejsce, przez które cena przeszła <b>szybko i jednostronnie</b>, a druga strona prawie nie handlowała. Zostaje „dziura”, czyli strefa, w której nie zbudowano wartości.</p>
<div class="scroll"><table class="t"><tr><th></th><th>FVG (ICT)</th><th>LVN (order flow i AMT)</th></tr>
<tr><td><b>Skąd się bierze</b></td><td>z samych świec: układ trzech świec, w którym high świecy 1 nie styka się z low świecy 3 (wersja wzrostowa; spadkowa odwrotnie); wolumen niepotrzebny</td><td>z profilu wolumenu: na tych cenach zawarto mało kontraktów; potrzebne dane o wolumenie na każdej cenie</td></tr>
<tr><td><b>Zależy od</b></td><td>interwału wykresu (luka na M5, czyli wykresie 5-minutowym, może nie istnieć na H1, czyli godzinowym)</td><td>okresu profilu (sesja, kilka dni, profil złożony)</td></tr>
<tr><td><b>Czego się spodziewamy</b></td><td><b>magnes</b>: cena wróci i „zapełni” lukę, potem pójdzie dalej w kierunku impulsu; FVG = miejsce wejścia</td><td>cena <b>nie lubi się tu zatrzymywać</b>: albo zostanie odrzucona na krawędzi LVN (wsparcie lub opór), albo szybko przeleci do następnego HVN (high volume node, poziom z dużym wolumenem)</td></tr>
<tr><td><b>Teoria</b></td><td>„smart money” zostawiło nieefektywność, którą rynek wyrównuje</td><td>AMT (Auction Market Theory, teoria aukcji rynkowej): mało wolumenu = mało akceptacji; aukcja nie znalazła tam kontrahentów</td></tr></table></div>
<p><b>Kiedy to się rozjeżdża:</b></p>
<ul><li><b>FVG bez LVN.</b> Luka na M5 może w profilu całej sesji wcale nie być „chuda”, bo cena wracała tam później i dobudowała wolumen. Wtedy to już nie jest pustka.</li>
<li><b>LVN bez FVG.</b> Szybki ruch kilkoma nakładającymi się świecami nie tworzy luki na świecach, a w profilu i tak zostawia mało wolumenu.</li></ul>
<div class="case"><div class="lab">Wniosek</div><p>LVN to w praktyce <b>sprawdzalna wersja FVG</b>. Na futures (kontraktach terminowych z giełdy) możesz w footprincie (wykresie wolumenu na każdej cenie wewnątrz świecy) i w profilu sprawdzić, czy luka z ICT naprawdę jest pusta. Jeśli jest, reakcja na jej krawędzi ma solidniejsze uzasadnienie. To ten sam wzór co ze sweepem (wybiciem po stopy): ICT nazywa zjawisko po swojemu, a order flow pozwala je zmierzyć. Na CFD (kontraktach na różnicę cen) w MT5 (MetaTrader 5) masz tylko wolumen tickowy (liczbę zmian ceny, nie liczbę kontraktów), więc to przybliżenie.</p></div>
<div class="case"><div class="lab">Twoja teoria w tym świetle</div>
<p>Duzi gracze nie kupują naraz, tylko wiele razy na poziomie, który im odpowiada, bo ich pozycja jest długoterminowa. W akumulacji kupują i sprzedają obie strony rynku. Potem przychodzi „manipulacja”, czyli wyraźny ruch w jedną stronę, a po nim ruch kierunkowy. Dla instytucji długoterminowej ten krótkoterminowy ruch to drobiazg, dla scalpera to okazja. To się zgadza z tym, co mówi Darius (21:19–23:19 i 26:21–28:21) i z modelem AMD w ICT (akumulacja, manipulacja, dystrybucja). Dwa doprecyzowania:</p>
<ul><li>„Manipulacja” w tym ujęciu to po prostu <b>nieudana aukcja</b> z sekcji 5: wyjście za krawędź, absorpcja, powrót. Stopy uwięzionych są jej paliwem, a nie celem.</li>
<li>To, że taki schemat powtarza się w skali dnia, to na razie hipoteza. Nikt z autorów nie pokazał statystyki, jak często dzień przebiega według AMD. Da się to zmierzyć na danych (bot pomiarowy OBR v12_1M mierzy już, jak często po wybiciu cena wraca do zakresu).</li></ul>
<p>Szczegółowe porównanie z Wyckoffem i ICT, z oryginalnych źródeł, jest w osobnym kursie „Wyckoff i ICT” (lekcje 2, 6 i 8).</p></div>
<div class="watch">${yt('_AIOgBulQsg',1279,'Darius · w akumulacji kupuje inwestor, sprzedaje spekulant',1399)}${yt('_AIOgBulQsg',1520,'Darius · kto kupuje przy powrocie, przyjmowanie strat, „prawda do pewnego stopnia”',1701)}</div>

</details>

</section>
<section class="s unit" data-unit="5"><div class="unit-nr">Jednostka 5 z 8</div><h2>Akceptacja czy odrzucenie: jak to rozpoznać</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 4 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Czym nieudana aukcja różni się od price discovery?</p><details><summary>Pokaż odpowiedź</summary><p>Wybicie jest to samo, ale <b>brak akceptacji</b>: agresja zostaje zaabsorbowana, cena szybko wraca do VA (obszaru wartości).</p></details></div><div class="rq"><p class="q">Przy hooku pod VAL: gdzie stoją stopy uwięzionych sprzedających i co robią?</p><details><summary>Pokaż odpowiedź</summary><p>Nad wybiciem, czyli w VA. Po odpaleniu stają się <b>kupnem rynkowym</b>, więc są paliwem powrotu, a nie celem wybicia.</p></details></div></div>
<h4>jak odróżnić akceptację od odrzucenia?</h4>
<ul>
<li><b>Faber:</b> akceptacja to sytuacja, gdy „cena <i>i wolumen</i> akceptują” poziomy poza VAL (value area low, dolna krawędź obszaru wartości) albo VAH (value area high, górna krawędź obszaru wartości). Nie wystarczy dotknięcie ani przebicie knotem. Cena musi tam <b>zostać</b> i musi tam przejść wolumen. Konkretnego progu w minutach czy kontraktach nie podaje.</li>
<li><b>Darius:</b> o wyniku decyduje to, <b>kto jest bardziej agresywny</b> po wybiciu. Jeśli agresja w kierunku wybicia jest nagradzana (cena idzie dalej), to price discovery. Jeśli jest absorbowana (duże liczby w footprincie, a cena stoi), to nieudana aukcja.</li>
<li><b>Ogólna praktyka Market Profile</b> (nie słowa autorów; tradycja szkoły Steidlmayera, opisana m.in. przez J. Daltona): akceptacja to co najmniej dwa okresy 30-minutowe poza krawędzią. Pojedynczy okres poza krawędzią i powrót oznacza odrzucenie. Traktuj to jako punkt wyjścia do własnych obserwacji, a nie jako sprawdzoną regułę.</li>
<li><b>Najszybszy praktyczny sygnał</b> łączy obie rzeczy: zamknięcie świecy (np. M5, czyli 5-minutowej) z powrotem w VA (value area, obszar wartości z ok. 70% wolumenu) <b>plus</b> absorpcja w footprincie przy wybiciu. Dokładne odczytywanie absorpcji to lekcje 5 i 6.</li>
</ul>
<h4>Narzędzia: jak odróżnić akceptację od odrzucenia w praktyce</h4>
<p>Zasada: <b>żadne pojedyncze narzędzie tego nie rozstrzyga.</b> Potrzebne są co najmniej dwa niezależne znaki: czas i wolumen za poziomem oraz zachowanie order flow przy samym poziomie.</p>
<p><b>Na futures</b> (np. NQ, kontrakt futures E-mini Nasdaq-100, w Deep Charts albo innej platformie order flow):</p>
<div class="scroll"><table class="t"><tr><th>Narzędzie</th><th>Akceptacja (wybicie prawdziwe)</th><th>Odrzucenie (nieudana aukcja)</th></tr>
<tr><td><b>Footprint i delta świecy wybicia</b></td><td>agresja w kierunku wybicia <b>dostaje rezultat</b>: zamknięcie za poziomem, kilka nierównowag (stacked imbalances) z rzędu</td><td>duża delta <b>bez rezultatu</b>: zamknięcie z powrotem za poziomem, czyli absorpcja (tabela czterech kombinacji z lekcji 1, sekcja 10)</td></tr>
<tr><td><b>Bąble big trades</b> (duże pojedyncze transakcje)</td><td>po bąblach cena idzie dalej, po drugiej stronie brak dużych printów</td><td>bąble za poziomem, a cena wraca: ich autorzy są uwięzieni; po drugiej stronie pojawiają się duże printy</td></tr>
<tr><td><b>Heatmapa i DOM</b> (Depth of Market, księga zleceń)</td><td>limity za poziomem są zjadane albo cofane, za ceną buduje się nowa płynność</td><td>na poziomie stoi ściana albo iceberg (ukryte zlecenie), który się odnawia mimo transakcji</td></tr>
<tr><td><b>CVD</b> (cumulative volume delta, skumulowana delta)</td><td>potwierdza nowy szczyt albo dołek</td><td>rozbieżność: cena robi nowy dołek, a CVD wyższy dołek</td></tr>
<tr><td><b>Profil wolumenu na żywo</b></td><td>za krawędzią buduje się wolumen (nowy HVN, czyli high volume node, węzeł dużego wolumenu), POC (point of control, poziom z największym wolumenem) dnia przesuwa się w stronę wybicia</td><td>za krawędzią cienko (LVN, czyli low volume node, węzeł małego wolumenu), POC zostaje w środku</td></tr>
<tr><td><b>Czas</b></td><td>cena zostaje za krawędzią; ogólna praktyka Market Profile: co najmniej 2 okresy po 30 minut</td><td>jeden okres i powrót</td></tr>
<tr><td><b>VWAP</b> (średnia cena dnia ważona wolumenem)</td><td>cena trzyma się po stronie wybicia</td><td>cena wraca przez VWAP</td></tr></table></div>
<p><b>Na CFD w MT5</b> (MetaTrader 5, bez danych order flow):</p>
<ul><li><b>Zamknięcie świecy</b> M5 albo M15 (5- albo 15-minutowej) za poziomem i <b>retest od drugiej strony, który trzyma</b>. W języku Wyckoffa to BU (back-up) albo LPS (last point of support).</li>
<li><b>Czas i liczba ticków za poziomem w pierwszych minutach po wybiciu.</b> Dokładnie to mierzy bot pomiarowy OBR v12_1M (kolumny <span class="mono">acc_share_beyond</span> i <span class="mono">first_return_sec</span>).</li>
<li><b>Spread przy wybiciu:</b> szeroki spread oznacza wycofanie market makerów i pustą księgę, czyli pustkę, a nie siłę (lekcja 1).</li></ul>
<div class="warnbox"><b>Uczciwie:</b> żaden z autorów nie podaje progów liczbowych, np. ile minut za poziomem albo jaka delta oznacza akceptację. Te progi trzeba zmierzyć na własnych danych; dla OBR robi to wersja pomiarowa v12_1M.</div>
<h3 class="sh">8. Czego szukać w każdej fazie</h3>
<div class="scroll"><table class="t"><tr><th>Faza</th><th>Co robi rynek</th><th>Jak grać</th><th>Pułapka</th></tr>
<tr><td>Balans</td><td>odbija się między krawędziami wartości; obie strony uważają cenę za uczciwą</td><td>mean reversion (powrót do średniej): od krawędzi do środka (POC (point of control, poziom z największym wolumenem)); Darius radzi początkującym unikać tej fazy</td><td>granie każdego BOS (break of structure, złamanie struktury) w środku zakresu</td></tr>
<tr><td>Price discovery</td><td>akceptuje nowe ceny (cena i wolumen poza VA (value area, obszar wartości z ok. 70% wolumenu)), mało przeciwnej agresji</td><td>trend: wejścia na cofnięciach, np. na rebalansie LVN (low volume node, węzeł małego wolumenu), w kierunku agresji</td><td>wejście „bo dotknęło VAH (value area high, górna krawędź obszaru wartości)” bez akceptacji</td></tr>
<tr><td>Nieudana aukcja</td><td>wychodzi poza zakres i wraca; agresja zaabsorbowana</td><td>gra powrotu: cel POC lub przeciwna krawędź (hook)</td><td>zakładanie z góry, co będzie po niej (błąd Dariusa)</td></tr></table></div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Kiedy według Fabera jest akceptacja poza krawędzią?</p><details><summary>Pokaż odpowiedź</summary><p>Gdy cena tam <b>zostaje</b> i przechodzi tam <b>wolumen</b>. Dotknięcie albo przebicie knotem to za mało.</p></details></div><div class="rq"><p class="q">Jakie dwa niezależne znaki trzeba zebrać, zanim uznasz wybicie za prawdziwe?</p><details><summary>Pokaż odpowiedź</summary><p>(1) Czas i wolumen za poziomem; (2) zachowanie order flow przy samym poziomie (agresja z rezultatem albo absorpcja).</p></details></div><div class="rq"><p class="q">Cena robi nowy dołek, a CVD (skumulowana delta) wyższy dołek. Co to sugeruje?</p><details><summary>Pokaż odpowiedź</summary><p><b>Rozbieżność</b>: sprzedaż słabnie, więc raczej odrzucenie, a nie prawdziwe wybicie w dół.</p></details></div></div>
</section>
<section class="s unit" data-unit="6" id="L2-5a"><div class="unit-nr">Jednostka 6 z 8</div><h2>Film Fabera 19:22–28:33 krok po kroku</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 5 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Kiedy według Fabera jest akceptacja poza krawędzią?</p><details><summary>Pokaż odpowiedź</summary><p>Gdy cena tam <b>zostaje</b> i przechodzi tam <b>wolumen</b>. Dotknięcie albo przebicie knotem to za mało.</p></details></div><div class="rq"><p class="q">Jakie dwa niezależne znaki trzeba zebrać, zanim uznasz wybicie za prawdziwe?</p><details><summary>Pokaż odpowiedź</summary><p>(1) Czas i wolumen za poziomem; (2) zachowanie order flow przy samym poziomie (agresja z rezultatem albo absorpcja).</p></details></div></div>
<h3 class="sh">5a. Film Fabera 19:22–28:33 krok po kroku: balans, wyjście z wartości, hook</h3>
<p>Sekcje 3, 4 i 5 biorą z tego fragmentu najważniejsze wnioski. Tutaj masz cały fragment po kolei, tak jak Faber go tłumaczy, łącznie z przykładami z wykresu dzień po dniu (24:27–28:33), które wcześniej były opisane tylko skrótem. Czytaj jeden punkt i od razu oglądaj wskazany kawałek filmu.</p>
<div class="watch">${yt('Pz8f0wWW12M',1162,'Faber · cały fragment',1713)}</div>

<h4>19:22–20:24 · Co to jest profil wolumenu</h4>
<p><b>Każda transakcja to spotkanie dwóch zleceń</b>: limitu (pasywnego, czekającego w księdze) i zlecenia rynkowego (agresywnego). Profil wolumenu zlicza, <b>ile transakcji przeszło na każdej cenie</b>, i rysuje to poziomo z boku wykresu.</p>
<p>Faber podkreśla: profil <b>nie pokazuje, kto był agresywny</b> (to widać w footprincie, lekcja 1), tylko <b>gdzie ludzie handlowali</b>. Profil to mapa, a footprint pokazuje, co się dzieje na tej mapie w danej chwili.</p>
<p><b>Kształt profilu to dzwon</b> (rozkład Gaussa, czyli rozkład normalny):</p>
<ul><li>w środku jest najwięcej wolumenu, <b>ok. 68%</b> transakcji (jedno odchylenie standardowe; wiele platform ustawia 70%);</li>
<li>im dalej od środka, tym mniej transakcji: Faber nazywa to <b>imbalance</b> (nierównowagą);</li>
<li><b>wyjście poza ten środek to zwykle miejsce, gdzie zaczyna się trend.</b></li></ul>
<div class="watch">${yt('Pz8f0wWW12M',1162,'Faber · profil wolumenu, rozkład Gaussa, 68%',1224)}</div>

<h4>20:24–21:25 · VA, VAH, VAL, POC</h4>
<div class="scroll"><table class="t"><tr><th>Skrót</th><th>Pełna nazwa</th><th>Co to jest</th></tr>
<tr><td><b>VA (value area, obszar wartości z ok. 70% wolumenu)</b></td><td>value area (obszar wartości)</td><td>przedział cen, w którym przeszło 68–70% wolumenu</td></tr>
<tr><td><b>VAH (value area high, górna krawędź obszaru wartości)</b></td><td>value area high</td><td>górna krawędź VA</td></tr>
<tr><td><b>VAL (value area low, dolna krawędź obszaru wartości)</b></td><td>value area low</td><td>dolna krawędź VA</td></tr>
<tr><td><b>POC (point of control, poziom z największym wolumenem)</b></td><td>point of control (punkt kontroli)</td><td><b>jedna cena</b> z największą liczbą transakcji (u Fabera 90 transakcji na jednym poziomie), czyli najbardziej „uczciwa” cena dnia</td></tr></table></div>
<div class="watch">${yt('Pz8f0wWW12M',1224,'Faber · VA, VAH, VAL, POC',1285)}</div>

<h4>21:25–22:25 · Balans i wyjście z wartości</h4>
<p><b>Dużo transakcji = silna akceptacja ceny.</b> Instytucje chętnie tu handlują, bo <b>znajdują kontrahenta</b>: kto chce kupić 500 kontraktów, potrzebuje kogoś, kto je sprzeda, a w VA (value area, obszar wartości z ok. 70% wolumenu) taki ktoś zawsze jest.</p>
<p>To jest <b>balans</b> (inaczej: range, czyli zakres, kompresja, konsolidacja).</p>
<ul><li><b>Jak się go gra:</b> „fade” (gra przeciw ruchowi) góry i dołu: sprzedaż przy VAH (value area high, górna krawędź obszaru wartości), kupno przy VAL (value area low, dolna krawędź obszaru wartości), z potwierdzeniem w order flow.</li>
<li><b>Dlaczego jest ważny:</b> to w balansie <b>rodzi się następny trend</b>.</li></ul>
<div class="tip"><b>Kluczowe zdanie tego fragmentu (wyjście z wartości).</b> Gdy <b>cena i wolumen akceptują</b> poziomy pod VAL albo nad VAH, rynek mówi: „jesteśmy w nierównowadze”. Akumulacja albo dystrybucja się skończyła i zaczyna się prawdziwy ruch.</div>
<p><b>Akceptacja ≠ dotknięcie ani przebicie knotem.</b> Cena musi <b>zostać</b> poza krawędzią i <b>musi tam przejść wolumen</b>. Jeśli chcesz wejść w trend wcześnie, czekasz właśnie na to (jak odróżnić akceptację od odrzucenia: koniec sekcji 5).</p>
<div class="watch">${yt('Pz8f0wWW12M',1285,'Faber · balans, akceptacja poza VA = prawdziwy ruch',1345)}</div>

<h4>22:25–24:27 · LVN, czyli dziura w profilu</h4>
<p><b>LVN</b> (low volume node, węzeł niskiego wolumenu) to cena, na której było <b>bardzo mało transakcji</b>.</p>
<p><b>Dlaczego tak się dzieje:</b> cena przeskoczyła ten poziom bardzo szybko. Faber mówi o „nieefektywnej dostawie”: słabe wypełnienia, niezadowoleni uczestnicy, <b>brak akceptacji</b>, bo duzi nie znaleźli tam kontrahenta.</p>
<p><b>Co z tego wynika:</b> rynek <b>lubi wracać do LVN</b>, żeby go „przebalansować”, i dopiero potem jedzie dalej w kierunku trendu. LVN działa wtedy jak <b>sufit albo podłoga</b> przed powrotem do kierunku aukcji. Dokładniej: reaguje <b>krawędź</b> LVN, a przez jego środek cena przechodzi szybko (sekcja 4).</p>
<p><b>Zastrzeżenie:</b> „lubi wracać” nie mówi, <b>kiedy</b>. Cena może najpierw pójść dalej, zebrać Twój SL (stop loss) i dopiero potem wrócić do LVN. Liczy się więc nie to, czy cena wróci, tylko czy po dotknięciu LVN dojdzie do TP (take profit), zanim trafi SL. Bez potwierdzenia w order flow to teza niezmierzona (patrz uwaga pod przykładem).</p>
<div class="case"><div class="lab">Przykład z filmu · bycze price discovery</div>
<ol><li>Kupujący pchają cenę w górę.</li>
<li>Zostawiają LVN. Mechanizm jest jak <b>wchodzenie po drabinie</b>:
<ul><li>na kolejnych poziomach czekają <b>limity sprzedaży</b>, każdy poziom ma własną kolejkę FIFO (first in, first out: kto pierwszy, ten pierwszy obsłużony);</li>
<li>wchodzi <b>duże kupno rynkowe</b> i zjada wszystkie limity sprzedaży na pierwszym poziomie. Kolejka FIFO decyduje tylko o tym, <b>którzy sprzedający</b> są obsługiwani pierwsi;</li>
<li><b>zlecenie rynkowe nigdy nie staje w kolejce</b>: jeśli zostało mu coś do kupienia, w tej samej chwili idzie poziom wyżej i bierze limity sprzedaży, które już tam stały, od pierwszego w kolejce. Cena idzie szczebel po szczeblu tam, gdzie są sprzedający. (W kolejce staje tylko <b>limit</b>: np. limit kupna 2 000 po 101 zjada to, co jest na 101, a reszta zostaje na 101 jako nowy best bid, czyli najwyższy limit kupna, i jest pierwsza w kolejce, bo wcześniej na tej cenie stali tylko sprzedający);</li>
<li><b>„niewypełnieni kupujący”</b> to <b>nie</b> limity kupna na tym samym poziomie co sprzedający. Na jednej cenie nie mogą naraz czekać limity kupna i sprzedaży, bo od razu by się wykonały (lekcja 1, sekcje 3 i 9.2). To trzy grupy: (1) ci, których limity kupna stały <b>niżej</b>, pod ceną, i cena odjechała w górę bez nich; (2) duży gracz, który kupił część i przestał gonić cenę, albo reszta jego zlecenia nie weszła; (3) spóźnieni, którzy stawiają limity kupna niżej i czekają na powrót. Gdy cena wraca, te limity kupna nadal czekają: dlatego krawędź LVN może zadziałać jak wsparcie;</li>
<li>jeśli wyżej sprzedających jest mało (rzadkie szczeble), jedno duże zlecenie przechodzi kilka poziomów naraz. Na tych cenach prawie nie było transakcji, więc powstaje LVN.</li></ul>
<b>Duży strzał poza VA</b> (value area, obszar wartości z ok. 70% wolumenu) <b>może dać ogromny skok.</b> W VA jest dużo transakcji, bo cena wraca tam godzinami i <b>obie strony chętnie handlują</b>: agresja szybko trafia na kontrahenta, który ją przyjmie. To nie znaczy, że w księdze stoją tam grube ściany (profil pokazuje transakcje, które już przeszły, a nie limity, które czekają; sekcja 4). Poza VA mniej uczestników akceptuje cenę, więc chętnych kontrahentów jest mniej. Ta sama agresja przesuwa tam cenę dalej i zostawia większe LVN.</li>
<li>Cena wraca do LVN, oni kupują i cena rusza dalej w górę.</li>
<li><b>Tu Faber szuka wejścia w kierunku trendu</b>, z potwierdzeniem w order flow (absorpcja, agresja: lekcje 5 i 6).</li></ol><p><b>Uwaga: powrót do LVN to test, a nie pewne „wypełnienie luki”</b> (to język ICT, Inner Circle Trader, szkoła tradingu Michaela Huddlestona). Możliwe są dwa wyniki:</p>
<ul><li><b>kupujący bronią LVN</b>: widać absorpcję sprzedaży albo agresję kupna, i dopiero wtedy jest wejście;</li>
<li><b>cena przelatuje przez LVN</b> do następnego HVN (high volume node, poziom z dużym wolumenem): setup jest nieważny.</li></ul>
<p>Samo dotknięcie LVN bez potwierdzenia w order flow nie jest sygnałem. Faber gra ten setup <b>w kierunku trendu dnia</b>.</p>
</div>

<h4>26:29–27:31 · HOOK (hak) i P-shape</h4>
<p>Po kolejnym wzroście cena buduje wartość wyżej, a potem schodzi do VAL (value area low, dolna krawędź obszaru wartości) i niżej. Wtedy robi <b>hook</b>:</p>
<ol><li>Cena próbuje wybić <b>pod VAL</b>.</li>
<li><b>Nie udaje się (failed auction, nieudana aukcja)</b>: nikt nie chce handlować niżej, sprzedaż zostaje zaabsorbowana.</li>
<li><b>Wszystko pod VAL staje się strefą odrzucenia.</b></li>
<li>Cena <b>wraca do VA (value area, obszar wartości z ok. 70% wolumenu)</b> i to jest Twoje <b>zagranie kontynuacji</b>: w górę, przez VA.</li></ol>
<p>Kształt na wykresie przypomina hak: w dół za krawędź, zawrót, z powrotem do środka. Co dokładnie dzieje się wtedy w księdze, masz w sekcji 5 („Mechanizm krok po kroku”).</p>
<div class="case"><div class="lab">P-shape · profil w kształcie litery P</div>
<ul><li><b>Wygląd:</b> większość wolumenu <b>na górze</b> profilu, na dole cienki „ogonek”.</li>
<li><b>Co znaczy:</b> kupujący byli bardzo agresywni, a <b>sesja cash</b> (główna sesja w Nowym Jorku, 9:30–16:00 czasu nowojorskiego, czyli 15:30–22:00 w Polsce) zamknęła się wysoko.</li>
<li><b>Wniosek Fabera:</b> spodziewasz się <b>ruchu kierunkowego także następnego dnia</b>.</li>
<li><b>Co robić następnego dnia</b> (obie opcje w górę): <b>fade VAL</b>, czyli kupno przy dolnej krawędzi wczorajszej VA, albo <b>kontynuacja</b>, czyli kupno po wybiciu <b>VAH (value area high, górna krawędź obszaru wartości) poprzedniego dnia</b>.</li></ul></div>
<div class="tip"><b>Zasada Fabera:</b> dopóki rynek dzień po dniu akceptuje wartość wyżej, <b>rozważasz tylko longi</b>. Gdy dzień po dniu akceptuje niżej, tylko shorty.</div>

<h4>27:31–28:33 · Hook od drugiej strony, premium i discount</h4>
<p><b>Hook przy VAH (value area high, górna krawędź obszaru wartości) od dołu:</b></p>
<ol><li>Cena nie potrafi zejść pod poprzednią VAL (kupujący bronią).</li>

<li>Cena <b>przecina VA (value area, obszar wartości z ok. 70% wolumenu) od VAH w dół</b>, żeby szukać zleceń przy VAL.</li></ol>
<p>Faber nazywa to „jednym z naprawdę dochodowych setupów z wysokim win rate” (odsetkiem wygranych transakcji). <b>To jego deklaracja, a nie zmierzona statystyka.</b></p>

<li><b>Sygnał ostrzegawczy.</b> Przez 2 dni rynek <b>odrzuca górę</b>, a POC (point of control, poziom z największym wolumenem) i VA (value area, obszar wartości z ok. 70% wolumenu) schodzą niżej. VAH (value area high, górna krawędź obszaru wartości) nie dorównuje poprzedniemu. Faber: „zaczynają dystrybuować”. Zaznaczasz to na <b>pomarańczowo</b> („może to być zmiana rynku, monitoruj”).</li>
<li>Rynek próbuje wrócić w górę i <b>nie daje rady</b>, zostaje w tym samym obszarze. Scalasz te profile.</li>

<h4>34:36–36:36 · Faza 3: P-shape, kolejne zmiany aukcji, pierwszy stop</h4>
<ol><li><b>Mocny P-shape</b>: niski wolumen na dole został zaabsorbowany. Faber spodziewa się kilku dni trendu w górę i są cztery takie dni. VAL (value area low, dolna krawędź obszaru wartości) sesji cash był bardzo precyzyjny jako miejsce odrzucenia.</li>
<li><b>Wyraźna zmiana w dół.</b> Szukasz odrzuceń i <b>shortów w kierunku aukcji</b>. Próby wybicia dwóch VAL w górę okazały się fake-outem: zostały odrzucone i rynek poszedł w dół. Faber sam się poprawia, że to nie był dzień niezdecydowania, tylko <b>zmiana aukcji</b>.</li>
<li>Ruch w dół trwał 3 dni. Potem rynek próbował zmienić kierunek w dół i się nie udało. <b>Short w tym miejscu byłby pierwszym stopem po wielu dniach</b>, a aukcja poszła w górę.</li>
<li>Znowu zmiana i odrzucenia na górze, a potem rynek się załamuje. Faber bierze shorta. <b>Short z VA (value area, obszar wartości z ok. 70% wolumenu) w kolejnym miejscu znowu daje stop</b>, a po następnej zmianie dwa zagrania płacą.</li>
<li><b>Dlaczego na „wrażliwym” poziomie odrzucenie było silniejsze?</b> Bo cena była w <b>górnej części rozkładu</b> (premium z sekcji 5a). Long z okolic <b>25 180–25 200</b> Faber zapowiedział uczniom wcześniej i zadziałał. Teraz cena wraca do uczciwej wartości.</li></ol>
<div class="warnbox"><b>Ważne przy oglądaniu:</b> Faber pokazuje ten przegląd z wiedzą, jak się skończył. W kilku miejscach sam przyznaje, że byłby stop. To ilustracja metody, a nie dowód skuteczności. Prawdziwy test to zrobienie tego samego na dniach, których wyniku jeszcze nie znasz (replay).</div>
<div class="watch">${yt('Pz8f0wWW12M',2076,'Faber · P-shape i 4 dni trendu, zmiana aukcji',2136)}${yt('Pz8f0wWW12M',2136,'Faber · pierwszy stop, kolejne zmiany, premium, long z 25 200',2196)}</div>

<h4>36:36–37:37 · Przejście do wejścia: widok Deep Trades</h4>
<ul><li>Faber przypomina trzy wzorce order flow: <b>absorpcję</b> (duży wysiłek bez rezultatu), <b>exhaustion</b> (wyczerpanie: ruch trwa, a wolumen słabnie) i <b>initiative auction</b> (aukcję inicjującą: agresja z rezultatem, lekcja 5).</li>
<li>Przez pierwszy rok używał <b>pełnego footprintu</b> (wszystkie liczby na każdym poziomie). Jako scalper potrzebował szybszego widoku i stworzył szablon <b>Deep Trades view</b>.</li>
<li><b>Deep Trades</b> to filtr wykonanych zleceń według wielkości. Pokazuje <b>tylko dużych uczestników</b>, czyli bąble z lekcji 6, i ukrywa drobny handel.</li></ul>
<div class="watch">${yt('Pz8f0wWW12M',2196,'Faber · wzorce, pełny footprint a widok Deep Trades',2257)}</div>

<h4>37:37–38:38 · Wejście short: 72, 61, 60, 62</h4>
<ol><li><b>Lokalizacja</b>: strefa zakwalifikowana do shorta z profilu (albo z innej metody: Faber mówi „czegokolwiek używasz”).</li>
<li><b>Co obserwuje</b>: tylko reakcję dużych na tym poziomie.</li>
<li><b>Co widzi</b>: duże kupna 72, 61, 60 i 62 kontrakty, razem <b>ok. 300 kontraktów na jednym poziomie</b>, i <b>brak rezultatu</b>, bo cena nie idzie wyżej. To „perfekcyjna absorpcja”.</li>
<li><b>Decyzja</b>: zaczyna <b>budować pozycję short</b>, czyli wchodzi częściami, nie całością naraz.</li>
<li><b>Risk-free</b> (przesunięcie stopu na break-even, czyli na cenę wejścia): <b>3 minuty później</b>. Duzi sprzedający dokładają shorty i świeca zamyka się mocno w dół. To potwierdzenie, że miał rację.</li></ol>
<div class="watch">${yt('Pz8f0wWW12M',2257,'Faber · 72, 61, 60, 62: absorpcja i short, break-even po 3 minutach',2318)}</div>

<h4>38:38–40:40 · Wejście long: 105 i 101, potem trailing</h4>
<ol><li>Najpierw przykład <b>absorpcji w środku świecy</b>: kupujący wchodzą agresywnie, zostają zaabsorbowani, świeca zamyka się spadkowo. To ten sam obraz, co na początku filmu (lekcja 5).</li>
<li><b>Long z jego konta</b>: strefa zakwalifikowana do longów, cena wraca do niej <b>pierwszy raz</b>.</li>
<li><b>105 kontraktów</b> agresywnej sprzedaży na jednym poziomie i <b>brak rezultatu</b>, sprzedaż zaabsorbowana. Druga próba też nieudana. Ostatnia próba to <b>101 kontraktów na tym samym poziomie</b>, znowu bez przebicia.</li>
<li><b>Kupujący też mają kłopot</b>: ich wejścia na razie nie dają rezultatu. Cena utknęła i robi <b>„ping pong”</b> w małym zakresie.</li>
<li><b>Po wybiciu z tego zakresu</b> możesz przesunąć stop na <b>break-even</b>. Przykładowy cel to RR 1:2 do 1:5 (zysk 2 do 5 razy większy od ryzyka).</li>
<li>Dzień później była kolejna próba, przełamanie absorpcji sprzedających i <b>eksplozja w górę</b>. Tu wchodzi jego <b>model momentum</b>: <b>trailing</b> (przesuwanie stopu) za agresją. Każdy nowy duży print kupna w kierunku ruchu oznacza, że przesuwasz stop pod niego i jedziesz dalej.</li></ol>

<h4>Podsumowanie Fabera: trzy warstwy w jednej decyzji</h4>
<div class="scroll"><table class="t"><tr><th>Warstwa</th><th>Pytanie</th><th>Narzędzie</th><th>Gdzie w kursie</th></tr>
<tr><td><b>1. Wolumen</b></td><td>gdzie i w którą stronę szukać wejścia?</td><td>profile sesji cash, scalanie, kolor biasu, strefy odrzucenia, LVN (low volume node, węzeł niskiego wolumenu)</td><td>lekcje 2 (5a, 5b), 3 i 4</td></tr>
<tr><td><b>2. Order flow</b></td><td>czy na tym poziomie duzi bronią ceny?</td><td>absorpcja dużych zleceń (Deep Trades, bąble), agresja z rezultatem</td><td>lekcje 5 i 6</td></tr>
<tr><td><b>3. Cena (rezultat)</b></td><td>czy rynek potwierdził?</td><td>mocna świeca w kierunku pozycji → break-even; eksplozja → trailing</td><td>lekcje 8–10 i 27</td></tr></table></div>
<p>Kolejność jest stała: <b>najpierw kierunek i miejsce z profilu, potem potwierdzenie w order flow, na końcu zarządzanie według ceny</b>. Gdy order flow nie potwierdza w zakwalifikowanym miejscu, nie wchodzisz.</p>
<div class="warnbox"><b>Czego Faber tu nie podaje:</b> od ilu kontraktów zlecenie jest „duże” w widoku Deep Trades (próg filtra), ile dokładnie ryzykuje w tych wejściach ani gdzie stał stop. Liczby 72/61/60/62 i 105/101 dotyczą NQ. Na MNQ (Micro E-mini Nasdaq-100) i na innych rynkach progi będą inne. Na CFD (contract for difference, kontrakt na różnicę u brokera; np. US100, czyli CFD na indeks Nasdaq-100, w MT5, czyli MetaTrader 5) tych danych w ogóle nie ma: trzeba je czytać z futures (lekcja 1).</div>
