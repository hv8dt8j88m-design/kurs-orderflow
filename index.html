<h3 class="sh">7. Przypadek Dariusa ze złota, krok po kroku</h3>
<div class="case"><div class="lab">Przypadek z filmu · Darius, GC, sesja na żywo</div>
<ol><li><b>Kontekst:</b> złoto w balansie (akumulacja). Volume profile pokazuje VAH (value area high, górna krawędź obszaru wartości) i VAL (value area low, dolna krawędź obszaru wartości).</li>
<li><b>Cena przebija VAL w dół.</b> Wygląda na początek price discovery.</li>
<li><b>Ale na lewym profilu (delta profile, czyli profil delty: przewaga agresywnych kupujących albo sprzedających na każdym poziomie ceny) pod VAL stoi duży słupek delty kupujących.</b> To miejsce, gdzie agresywni kupujący już raz weszli. Cena reaguje na ten poziom i wraca.</li>
<li><b>Wejście long od VAL do VAH.</b> Cena przeszła przez value area na drugą krawędź (hook w praktyce).</li>
<li><b>Absorpcja:</b> w strefie wybicia agresywni sprzedający weszli, ale nie dostali nagrody. Kupujący „za kurtyną” wszystko zjedli. Darius: ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona) nazwałoby to manipulacją, a to po prostu failed auction.</li>
<li><b>Błąd.</b> Zamknął zysk i wszedł drugi raz w long „bo po failed auction w balansie zwykle jest ekspansja w górę”, <b>bez czekania na potwierdzenie</b>. Kontekst się już zmienił, a powinien raczej sprzedawać. Dostał stop. Jego komentarz: złamał własne zasady, więc „to nie ma sensu”.</li>
<li><b>Szybkie przyjęcie straty i odwrócenie:</b> przeszedł na shorty, bo cała aukcja była spadkowa.</li>
<li><b>Drugie przebicie VAL, tym razem pełne:</b> żadni kupujący nie weszli, sprzedający „wcisnęli gaz”. Price discovery w dół.</li></ol>
<p>Sens przypadku: <b>ten sam poziom</b> (VAL) dał najpierw nieudaną aukcję (long), a potem prawdziwe wybicie (short). Różnicę widać tylko w order flow: za pierwszym razem byli kupujący i absorpcja, za drugim nikt nie bronił.</p></div>
<p>W tym samym filmie Darius pokazuje odwrotną stronę: duży <b>pik delty sprzedających nad VAH</b> to miejsce, gdzie agresywni sprzedający już bronili ceny. Gdy cena tam wraca, to dobra lokalizacja (POI, point of interest, czyli miejsce, w którym szukasz wejścia) na short.</p>
<div class="watch">${yt('APQLCEHwq38',1150,'Darius · delta nad VAH jako POI',1270)}${yt('APQLCEHwq38',1270,'Darius · przypadek ze złota: long VAL→VAH, błąd, shorty, pełne wybicie',1453)}</div>
<h3 class="sh">10. Podsumowanie lekcji: co z tego wynika</h3>
<p>Lekcja 1 pokazała jedną transakcję i jedną świecę. Lekcja 2 pokazuje to samo w skali godzin i dni. Każda z trzech faz aukcji to znane już z lekcji 1 zestawienie <b>wysiłku</b> (agresji) i <b>rezultatu</b> (ruchu ceny):</p>
<div class="scroll"><table class="t"><tr><th>Faza aukcji</th><th>Wysiłek kontra rezultat</th><th>Odpowiednik z lekcji 1</th><th>Co robisz</th></tr>
<tr><td><b>Balans</b></td><td>agresja po obu stronach, cena stoi w zakresie</td><td>walka w tle, bid–ask bounce (odbijanie ceny między bidem a askiem), delta blisko zera</td><td>handlujesz od krawędzi do środka albo czekasz</td></tr>
<tr><td><b>Price discovery</b></td><td>agresja jednej strony <b>dostaje rezultat</b>, cena akceptuje nowe poziomy</td><td>krok 3 Fabera: zlecenie zjada kolejne poziomy księgi</td><td>grasz z kierunkiem, wchodzisz na cofnięciach (LVN (low volume node, węzeł małego wolumenu))</td></tr>
<tr><td><b>Nieudana aukcja</b></td><td>agresja <b>bez rezultatu</b>, zaabsorbowana, cena wraca</td><td>ten sam footprint, inna świeca; absorpcja; uwięzieni agresorzy</td><td>grasz powrót do POC (point of control, poziom z największym wolumenem) albo na drugą krawędź (hook)</td></tr>
<tr><td><b>LVN po szybkim ruchu</b></td><td>duży ruch przy małym wolumenie</td><td>pustka w księdze, a nie siła (sekcja 9.6 i podsumowanie lekcji 1)</td><td>spodziewasz się powrotu „na przebalansowanie”, ale nie wiesz kiedy: wejście dopiero na reakcji przy krawędzi LVN, potwierdzonej w order flow</td></tr></table></div>

<h4>1. Wybicie samo w sobie nic nie znaczy</h4>
<p>Ten sam obraz, czyli wyjście za krawędź zakresu, kończy się albo trendem, albo powrotem. Różnicy nie widać w chwili wybicia, tylko <b>po nim</b>: czy cena i wolumen zostają po nowej stronie i czy agresja jest nagradzana. To ta sama zasada co przy bąblach (lekcja 6): najpierw wysiłek, potem decyzja na podstawie rezultatu.</p>

<h4>2. Ten sam poziom może dać dwa przeciwne wyniki</h4>
<p>Przypadek Dariusa ze złota: VAL (value area low, dolna krawędź obszaru wartości) dał najpierw nieudaną aukcję (long), a godzinę później prawdziwe wybicie (short). Poziom to tylko <b>miejsce, gdzie patrzysz</b>. Decyzję daje to, co się tam dzieje (lekcja 1, sekcja 9.8: „DOM (Depth of Market, księga zleceń) mówi, gdzie patrzeć, footprint mówi, czy wejść”).</p>

<h4>3. „Manipulacja” to nieudana aukcja opisana innymi słowami</h4>
<p>Obraz z ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona) jest prawdziwy, wyjaśnienie nie. Jeśli myślisz „polują na moje stopy”, szukasz winnego. Jeśli myślisz „agresja nie znalazła chętnych i została zaabsorbowana”, szukasz <b>sygnału w danych</b>, który da się zobaczyć i przetestować.</p>

<h4>4. Faza rynku decyduje, która strategia w ogóle ma sens</h4>
<ul><li>W balansie wybicia przegrywają (seria stopów traderów BOS, czyli break of structure, złamania struktury), a granie od krawędzi wygrywa.</li>
<li>W price discovery jest odwrotnie: granie od krawędzi to stawanie przed pociągiem.</li>
<li>Dodatnia gamma sprzyja balansowi, ujemna ekspansji. To filtr dnia, a nie sygnał wejścia.</li></ul>

<div class="warnbox"><b>W jednym zdaniu:</b> rynek na zmianę szuka uczciwej ceny (balans) i nowej ceny (price discovery), a każde wybicie jest tylko pytaniem „czy ktoś będzie handlował tutaj?”. Odpowiedź dają wolumen i order flow po wybiciu, a nie samo wybicie.</div><details class="extra"><summary>Dla dociekliwych: co to znaczy dla strategii wybicia zakresu</summary><h4>5. Co to znaczy dla OBR</h4>
<ul><li><b>OBR</b> (Twój bot w MT5, czyli MetaTrader 5, grający wybicie zakresu otwarcia) z definicji stawia na <b>price discovery</b>: zlecenie buy stop albo sell stop wchodzi w chwili wybicia, zanim wiadomo, czy będzie akceptacja.</li>
<li>Jego stratne transakcje to w dużej części <b>nieudane aukcje</b>: wybicie, absorpcja, powrót do zakresu i stop po drugiej stronie.</li>
<li><b>Hipotezy do testu</b> (lekcje 13 i 29, dopiero po kursie, bez założeń z góry):
<ul><li>czy wybicia w dni „balansowe” (otwarcie w środku wczorajszej VA (value area, obszar wartości z ok. 70% wolumenu), dodatnia gamma) wypadają gorzej niż w dni otwarte poza VA;</li>
<li>czy wejście dopiero po potwierdzeniu akceptacji (zamknięcie świecy poza zakresem) poprawia wynik, mimo gorszej ceny wejścia;</li>
<li>czy po nieudanym wybiciu opłaca się zagranie odwrotne, czyli hook do przeciwnej krawędzi zakresu.</li></ul></li>
<li>Najpierw pomiar bez filtrów, potem decyzja (zasada bota pomiarowego).</li></ul>


</details>
<details class="extra"><summary>Dla dociekliwych: gamma dealerów opcji (warstwa opcjonalna)</summary><h3 class="sh">9. Opcjonalnie: gamma dealerów opcji</h3>
<p>To dodatkowa warstwa kontekstu, ważniejsza na NQ (kontrakt futures E-mini Nasdaq-100) niż na złocie, bo na indeksach USA rynek opcji jest ogromny.</p>
<p><b>Najpierw podstawy, bo bez nich „gamma” nic nie mówi.</b></p>
<ul>
<li><b>Opcja</b> to derywat (instrument pochodny): <b>prawo</b>, a nie obowiązek, kupna (opcja call) albo sprzedaży (opcja put) instrumentu po ustalonej cenie. Za to prawo płaci się premię.</li>
<li><b>Dealer opcji</b> to market maker na rynku opcji: wystawia opcje klientom, a sam nie chce zakładać się o kierunek. Zabezpiecza się więc kupnem albo sprzedażą <b>futures</b> (np. NQ, kontrakt futures E-mini Nasdaq-100, albo ES, E-mini S&amp;P 500). To zabezpieczanie nazywa się <b>hedgingiem delta</b>.</li>
<li><b>Delta opcji</b> mówi, o ile zmienia się jej wartość przy ruchu ceny o 1 punkt, czyli ile futures dealer musi trzymać, żeby być neutralny. Nie myl jej z deltą w footprincie, to zupełnie inne pojęcie z tą samą nazwą. <b>Gamma</b> mówi, jak szybko ta delta się zmienia, gdy cena się rusza, czyli jak często i w którą stronę dealer musi poprawiać zabezpieczenie.</li>
</ul>
<p>Z tego wynikają dwa reżimy:</p>
<ul><li><b>Dodatnia gamma (dealerzy „long gamma”):</b> zabezpieczając się, kupują spadki i sprzedają wzrosty, więc <b>tłumią ruchy</b>. Dzień ma tendencję do kompresji, balansu.</li>
<li><b>Ujemna gamma:</b> zabezpieczając się, gonią ruch, więc go <b>wzmacniają</b>. Dzień ma tendencję do ekspansji.</li></ul>
<p>Faber pokazuje to na swojej najgorszej sesji miesiąca: dwie godziny kompresji, każdy ruch zaabsorbowany, seria stopów z modelu trend following, −9 000 $. Mówi wprost: market makerzy są long gamma, więc będą kompresować zmienność. Jeden short (18 kontraktów, RR 1:20, czyli zysk 20 razy większy od ryzyka) odwrócił dzień do +2 330 $. Mimo że order flow potwierdzał dalszy spadek, zamknął pozycję w zysku, bo „przy dodatniej gammie kompresują każdy ruch” i wieczorem spada koncentracja. Wniosek: <b>to nie jest dzień na trend following, bierz, co rynek daje</b>.</p>
<p>Darius używa gammy na złocie tylko jako informacji, czy rynek da dziś ekspansję. Mówi wprost, że nie jest potrzebna.</p>
<p><b>Skąd wziąć dane o gammie:</b> nie z wykresu. Liczą ją płatne serwisy z danych o pozycjach w opcjach (Faber korzysta z pakietu Pro w Deep Charts). Wynik jest szacunkiem, bo nikt nie zna dokładnych pozycji dealerów. Dlatego to filtr kontekstu, a nie sygnał.</p>

<p><b>Skróty w tej lekcji</b> (rozwinięte też w tekście przy pierwszym użyciu):</p>
<ul>
<li><b>VP</b> (volume profile, profil wolumenu): wykres wolumenu na każdym poziomie ceny, położony na boku wykresu.</li>
<li><b>POC</b> (point of control): poziom z największym wolumenem.</li>
<li><b>VA</b> (value area, obszar wartości): przedział wokół POC z ok. 70% wolumenu.</li>
<li><b>VAH / VAL</b> (value area high / low): górna i dolna krawędź VA.</li>
<li><b>HVN</b> (high volume node): węzeł dużego wolumenu.</li>
<li><b>LVN</b> (low volume node): węzeł małego wolumenu.</li>
<li><b>VWAP</b> (volume weighted average price): średnia cena dnia ważona wolumenem.</li>
<li><b>FVG</b> (fair value gap): luka ze świec w metodzie ICT (Inner Circle Trader, szkoła tradingu z YouTube).</li>
<li><b>NQ</b> (kontrakt futures E-mini Nasdaq-100 z giełdy CME, czyli Chicago Mercantile Exchange).</li>
<li><b>GC</b> (kontrakt futures na złoto z giełdy COMEX, części grupy CME).</li>
<li><b>RTH / ETH</b> (regular / extended trading hours): sesja kasowa (na NQ 9:30–16:00 czasu Nowego Jorku, 15:30–22:00 w Polsce) i handel całodobowy.</li>
</ul>

<section class="s"><h2>1. Skąd bierze się profil wolumenu</h2>
<p>Faber zaczyna od tego samego mechanizmu co w lekcji 1: <b>każde spotkanie zlecenia limit ze zleceniem rynkowym to transakcja</b>. Każda transakcja zostaje zapisana na swoim poziomie ceny (na swoim ticku). Gdy zsumujesz wszystkie transakcje z danego okresu poziom po poziomie, dostajesz rozkład. Ten rozkład to <b>volume profile</b>.</p>
<p>Połącz to z lekcją 1: footprint pokazuje, ile wykonało się na każdym poziomie <b>jednej świecy</b>. Profil to <b>suma footprintów wszystkich świec</b> z wybranego okresu, położona na boku wykresu. Bez podziału na bid i ask, tylko łączny wolumen na poziomie.</p>
<p>Darius nazywa profil „money indicator”: pokazuje, <b>gdzie włożono pieniądze</b>, czyli gdzie kupujący i sprzedający zrobili najwięcej biznesu. Duży węzeł oznacza, że tu obie strony chętnie handlowały. Mały oznacza, że tu nikt nie chciał handlować i cena szybko przeszła dalej.</p>
<p>Faber dodaje ważne rozróżnienie: profil <b>nie mówi, kto był agresywny</b>. Do tego służą footprint i delta. Profil pokazuje, <b>jak uczestnicy rozłożyli się w poziomie</b>, czyli gdzie cena była akceptowana, a gdzie nie.</p>
<div class="watch">${yt('dGeGeYvY7a8',0,'Darius · czym jest volume profile: gdzie zrobiono biznes',123)}${yt('Pz8f0wWW12M',1162,'Faber · każda transakcja na swoim ticku, z tego rozkład',1224)}</div>

<p>Trzy świece z footprintem (jak w lekcji 1: lewa liczba to kolumna bid, czyli sprzedaż agresywna, prawa to kolumna ask, czyli kupno agresywne). Sumujesz je poziom po poziomie:</p>

<ul><li><b>Profil wolumenu</b> to kolumna „wolumen”: bid + ask na każdym poziomie. Na 104 przeszło najwięcej (66), więc to POC.</li>
<li><b>Profil delty</b> (sekcja 7) to kolumna „delta”: ask − bid. Na 104 przeważali kupujący (+8), na 103 sprzedający (−6). To są „piki delty”, których Darius używa jako poziomów obrony.</li>
<li>Profil <b>gubi kolejność</b>: nie wiesz już, w której świecy co się stało. To ta sama strata informacji co w podsumowaniu lekcji 1 (ten sam footprint, inna świeca), tylko w większej skali.</li></ul>
</section>

<section class="s"><h2>2. Krzywa dzwonowa i skąd 70%</h2>
<p>Darius tłumaczy to na przykładach spoza rynku. Wyniki testów IQ (ilorazu inteligencji): większość ludzi ma 85–120, a im dalej od środka, tym mniej osób. Wzrost: większość w przedziale średnim, nieliczni bardzo niscy albo bardzo wysocy. To <b>rozkład normalny</b> (krzywa dzwonowa): najwięcej w środku, coraz mniej po bokach.</p>
<p>W rozkładzie normalnym w odległości jednego odchylenia od środka mieści się ok. <b>68%</b> wyników (Faber mówi o 68%, Darius podaje 68,27%). W tradingu przyjęło się zaokrąglenie do <b>70%</b> i tak ustawia się większość platform.</p>
<p>Wniosek, który powtarza Darius: gdy cena wychodzi poza obszar 70%, częściej wraca do środka, niż wybija. Podaje to jako proporcję: ok. 70% szans na powrót, 30% na wybicie, a przy wybiciu 50/50 w którą stronę. <b>To jego heurystyka z rozkładu, a nie zmierzona statystyka zagrania.</b> Własną liczbę dla swojego instrumentu musisz policzyć sam (lekcja 13).</p>
<div class="watch">${yt('dGeGeYvY7a8',123,'Darius · krzywa dzwonowa: IQ, wzrost, 70%',368)}${yt('dGeGeYvY7a8',368,'Darius · value area, powrót do środka, 70/30',549)}</div>
</section>

<section class="s"><h2>3. POC, value area, VAH, VAL</h2>
<ul><li><b>POC</b> (point of control): poziom, na którym wykonało się najwięcej. Faber: to poziom z największą liczbą transakcji w danym rozkładzie, najbardziej „uczciwa” cena dnia.</li>
<li><b>Value area</b>: obszar wokół POC, w którym przeszło ok. 70% wolumenu. Liczy się ją od POC na zewnątrz, dokładając za każdym razem większy z dwóch sąsiednich poziomów, aż suma dojdzie do 70%.</li>
<li><b>VAH</b> i <b>VAL</b>: górna i dolna granica value area.</li></ul>
<p>Co z tego wynika według Fabera: w value area jest <b>najwięcej wykonań</b>, czyli najsilniejsza akceptacja ceny. Tu instytucje znajdują kontrahenta (lekcja 1: duży gracz potrzebuje drugiej strony). Dlatego krawędzie VA działają jak naturalne wsparcie i opór, a wyjście poza nie z akceptacją oznacza nierównowagę (lekcja 2).</p>
<p>Darius pokazuje to na żywo na złocie: cena wraca do POC sesji i reaguje na nim, raz co do ticka, raz trochę obok. POC to miejsce, gdzie obie strony najchętniej handlowały, więc cena do niego wraca jak magnes.</p>
<div class="w" data-w="profilelab"></div>

<h3>Krok po kroku na liczbach: jak liczy się value area</h3>
<p>Profil z dziewięciu poziomów (wolumen w kontraktach). Razem 240 kontraktów, więc 70% to 168.</p>
<div class="scroll"><table class="t"><tr><th>Poziom</th><th class="num">100</th><th class="num">101</th><th class="num">102</th><th class="num">103</th><th class="num">104</th><th class="num">105</th><th class="num">106</th><th class="num">107</th><th class="num">108</th></tr>
<tr><td>Wolumen</td><td class="num">5</td><td class="num">12</td><td class="num">25</td><td class="num">40</td><td class="num"><b>60</b></td><td class="num">45</td><td class="num">30</td><td class="num">15</td><td class="num">8</td></tr></table></div>
<ol><li>Start od POC: <b>104</b> = 60.</li>
<li>Sąsiedzi: 103 (40) i 105 (45). Większy jest 105, więc dokładasz go: 60 + 45 = <b>105</b>.</li>
<li>Sąsiedzi: 103 (40) i 106 (30). Dokładasz 103: 105 + 40 = <b>145</b>.</li>
<li>Sąsiedzi: 102 (25) i 106 (30). Dokładasz 106: 145 + 30 = <b>175</b>. To już ponad 168, koniec.</li></ol>
<p>Wynik: <b>VA = 103–106</b>, czyli <b>VAL = 103</b>, <b>VAH = 106</b>, a w środku 175 z 240 kontraktów (73%).</p>
<p><b>Dlaczego różne platformy dają trochę inne VAH i VAL?</b> Bo stosują różne warianty tej procedury: jedne dokładają po jednym poziomie, inne po dwa naraz (tradycja Market Profile), różnie grupują ticki w wiersze i różnie zaokrąglają. Stąd różnice o 1–2 ticki, które Darius pokazuje między TradingView a Deep Charts (sekcja 9). Nie szukaj w nich znaczenia.</p>
</section>

<section class="s"><h2>4. HVN i LVN: gdzie cena chce być, a gdzie nie</h2>
<p><b>HVN</b> (high volume node) to węzeł dużego wolumenu, czyli akceptacja: tu cena „mieszka”. <b>LVN</b> (low volume node) to węzeł małego wolumenu: cena przez niego przeleciała, bo nikt nie chciał tam handlować.</p>
<p>Faber opisuje LVN słowami, które warto zapamiętać: transakcja była tam nieefektywna, „dostawa” ceny słaba, wypełnienia kiepskie, uczestnicy niezadowoleni, <b>brak akceptacji ceny</b>. Duzi nie znaleźli tam kontrahenta. Dlatego rynek zwykle wraca, żeby LVN „przebalansować”, zanim pojedzie dalej (lekcja 2).</p>
<p>Darius dokłada najważniejszą rzecz: <b>LVN ma dwie twarze</b>.</p>
<ul><li><b>Przelot:</b> nikt nie chce tam handlować, więc cena może się przez LVN szybko przepchnąć i pójść do następnego HVN, gdzie obie strony znowu się zgadzają. HVN jest wtedy celem.</li>
<li><b>Odrzucenie:</b> ten sam brak chęci do handlu sprawia, że cena dotyka LVN i wraca do strefy, gdzie toczy się biznes.</li></ul>
<p>Która twarz się pokaże, nie wynika z samego profilu. Decyduje kontekst (balans czy nierównowaga, lekcja 2) i order flow na miejscu (lekcje 5–7).</p>
<div class="watch">${yt('dGeGeYvY7a8',911,'Darius · HVN i LVN: przelot albo odrzucenie',1097)}${yt('Pz8f0wWW12M',1345,'Faber · LVN: nieefektywna dostawa, rebalans',1467)}</div>
</section>

<section class="s"><h2>5. „Prawdziwy fair value gap”</h2>
<p>Faber: FVG rysowany ze świec (luka między knotem pierwszej i trzeciej świecy) to zwykle błąd, bo żeby znaleźć prawdziwą lukę, trzeba zajrzeć do środka świec i zobaczyć, <b>jak przeszedł wolumen</b>. Jego metoda:</p>
<ol><li>Narysuj <b>fixed range profile</b> (profil o stałym zakresie, rysowany ręcznie na wybranym odcinku) na ruchu, od punktu A do punktu B.</li>
<li><b>Ukryj świece</b>, żeby nie sugerować się ich kształtem.</li>
<li>Wewnątrz value area tego ruchu znajdź <b>najcieńszy poziom</b>. To jest prawdziwa luka: miejsce, gdzie wolumen nie przeszedł w sposób zrównoważony.</li></ol>
<p>W jego przykładzie na NQ był to <b>pojedynczy poziom 24 318–24 317</b>, a nie cała strefa. „Zobaczysz tysiące razy, że dokładnie tu cena odrzuca.”</p>
<p>Darius, który kilka lat handlował ICT, rozkłada FVG na części:</p>
<ul><li><b>Jest ich za dużo.</b> Na jednym ruchu zaznacza kilkanaście byczych i niedźwiedzich luk. Część działa, część nie, a decyzja, którą wziąć, jest subiektywna.</li>
<li><b>Zależą od interwału.</b> Na M5 (świecach 5-minutowych) luka jest, na M1 (1-minutowych) jej nie ma. A interwały to wymysł człowieka: są też 2, 7, 45 minut, 2 godziny 45 minut. Czas nie rejestruje handlu, rejestruje go wolumen.</li>
<li><b>FVG jest skutkiem, a nie przyczyną.</b> Pojawia się czasem przy prawdziwej nierównowadze, ale częściej bez niej.</li></ul>
<p>Jego zamiennik, czyli <b>prawdziwa nierównowaga</b>: cena przy VAL (albo VAH) zakresu sesji, w tym miejscu precyzyjny <b>LVN</b>, a na nim <b>big trades</b>, czyli duzi gracze kupujący agresywnie. Tak powstaje ruch, który ICT potem nazwie FVG.</p>
<div class="case"><div class="lab">Przypadek z filmu · Darius, złoto, sesja Londyn</div><p>Profil sesji pre-Frankfurt i Frankfurt (handel przed i po otwarciu giełdy we Frankfurcie, ok. 8:00 czasu polskiego, godzinę przed Londynem). Cena schodzi pod <b>VAL</b>: kupujący muszą się tu pojawić, a jeśli się nie pojawią, setup nie działa. W tym miejscu jest bardzo precyzyjny <b>LVN</b>. Pojawiają się <b>big trades kupna</b>, czyli instytucje, bo detalista nie wejdzie taką liczbą kontraktów. Cena rusza w górę. Wszystkie niedźwiedzie FVG po drodze zostają przejechane, „jakby nikogo nie obchodziły”. Cena wraca do strefy, gdzie stała wcześniej, próbuje wyżej, nie znajduje akceptacji i wraca: failed auction. Druga część filmu pokazuje to samo w dół: LVN od góry, obszar obrony, kontynuacja.</p></div>
<div class="watch">${yt('o-w5Gxss6T0',183,'Faber · prawdziwy FVG: fixed profile, ukryte świece, najcieńszy poziom',310)}${yt('KwJUYRRbQlE',122,'Darius · problemy z FVG: za dużo, subiektywne, interwał',668)}${yt('KwJUYRRbQlE',668,'Darius · prawdziwa nierównowaga: VAL + LVN + big trades',913)}${yt('KwJUYRRbQlE',913,'Darius · przykład spadkowy',1094)}</div>
</section>

<section class="s"><h2>6. Delta print i volume ledge (Faber)</h2>
<p>Faber pokazuje dwa wejścia z jednego dnia. Ważne, żeby zobaczyć kolejność jego myślenia:</p>
<ol><li><b>Kontekst:</b> sesja londyńska otwiera się wybiciem poprzedniego poziomu, dużo agresji i <b>akceptacja pod VAL</b>. To warunek trendu: rynek szuka nowej wartości, więc oczekuje kierunku (lekcja 2).</li>
<li><b>Obszar (delta print):</b> fixed profile poprzedniego swingu. Delta profile pokazuje poziom dużego nacisku sprzedających, a big trades potwierdzają, że ten nacisk zrobili duzi. W tym samym miejscu leży VAH. Trzy rzeczy w jednym miejscu: <b>VAH + big trades + poziom delty</b>. Faber: bardzo mocny obszar, ustawiasz alert.</li>
<li><b>Reakcja:</b> cena podchodzi i od razu pojawiają się agresywni sprzedający. Wejście short (sprzedaż) ze stopem nad obszarem. Cena próbuje jeszcze raz przebić, zawraca i daje drugie wejście, czyli re-entry.</li>
<li><b>Volume ledge</b> (półka wolumenu): na kolejnym ruchu fixed profile pokazuje miejsce, gdzie profil gwałtownie przechodzi z HVN w LVN. To precyzyjna strefa reakcji, ale <b>„nie możesz wejść tylko na tej podstawie”</b>. Faber schodzi do szczegółów: w tej strefie sprzedający wygrali walkę, a kupujący, którzy próbowali przejąć kontrolę, zostali zaabsorbowani. Dopiero to robi z obszaru miejsce wejścia.</li></ol>
<p>Jego zdanie na koniec: <b>„jedyne, co porusza ceną, to wolumen”</b>. Żeby cena poszła w górę albo w dół, musi dojść do wykonania.</p>
<div class="watch">${yt('06R-ebyOhDI',0,'Faber · delta print: obszar z prawdziwych wykonań',63)}${yt('06R-ebyOhDI',63,'Faber · akceptacja pod VAL, VAH + big trades + delta, re-entry',245)}${yt('06R-ebyOhDI',245,'Faber · volume ledge i sprawdzenie order flow',427)}</div>
</section>

<section class="s"><h2>7. Delta profile</h2>
<p><b>Delta profile</b> to ten sam profil, ale zamiast sumy pokazuje na każdym poziomie <b>różnicę</b>: agresywni kupujący minus agresywni sprzedający (delta z lekcji 1, zsumowana z wielu świec). Darius: widzisz, czy dany poziom był zdominowany przez kupujących, czy przez sprzedających.</p>
<p>Jak go używa: liczą się <b>wyraźne piki</b>, a nie każdy słupek. Duży pik delty kupujących oznacza, że tu agresywni kupujący bronili ceny. Gdy cena wraca do takiego poziomu, często reaguje, bo ci sami gracze mogą wejść znowu. Działa to też lustrzanie dla sprzedających. Zastrzeżenie Dariusa: sam pik nie działa za każdym razem, potrzebna jest dobra lokalizacja (np. VAH/VAL) i potwierdzenie.</p>
<div class="case"><div class="lab">Przypadek z filmu · Darius, sesja na żywo, GC M5</div><p>Darius włącza delta profile i zaznacza poziom, gdzie siedzieli sprzedający. Świece M5 <b>ani razu nie zamykają się nad nim</b>. „To nie jest linia, którą narysowałem, bo był tam szczyt. To mam z danych.” Potem footprint: świeca zamyka się <b>pod</b> dużym wolumenem kupujących, czyli kupujący są „pod wodą”, słabość nad poziomem. To jego potwierdzenie na short. Cel: 1:2–1:3 albo najbliższy LVN w profilu sesji („podążaj za pieniędzmi”).</p></div>
<div class="watch">${yt('dGeGeYvY7a8',1097,'Darius · delta profile: piki jako poziomy obrony',1344)}${yt('n3UKOSmiXPM',911,'Darius · delta profile na żywo, M5 nie zamyka się nad poziomem',972)}${yt('n3UKOSmiXPM',1216,'Darius · świeca pod byczym wolumenem = short, cel LVN',1277)}</div>
</section>

<section class="s"><h2>8. VWAP</h2>
<p><b>VWAP</b> (volume weighted average price) to średnia cena ważona wolumenem od początku sesji: łączna wartość transakcji podzielona przez łączny wolumen. Darius: to punkt odniesienia „uczciwej ceny” dla instytucji i traderów intraday (zamykających pozycje w ciągu dnia).</p>
<p>Jak go czyta Darius:</p>
<ul><li><b>Cena pod VWAP</b> = poniżej wartości dnia, czyli <b>dobra cena do kupna</b> (discount, czyli dyskonto).</li>
<li><b>Cena nad VWAP</b> = powyżej wartości dnia, czyli <b>dobra cena do sprzedaży</b> (premium, czyli premia).</li>
<li><b>Spadający VWAP</b> = uczciwa cena dnia spada, czyli wartość przesuwa się w dół.</li>
<li><b>VWAP jako cel pośredni:</b> cena pod VWAP często do niego wraca, więc w longu z dołu VWAP to pierwszy cel przed VAH.</li></ul>
<div class="warnbox"><b>Poprawka względem poprzedniej wersji kursu.</b> Wcześniej było tu napisane, że „nad VWAP kontrolę mają kupujący, pod nim sprzedający”. Darius w filmie tak nie mówi. Mówi, że pod VWAP rynek jest niedowartościowany i to dobra cena do kupna. Obie interpretacje funkcjonują w tradingu: trend (nad VWAP = siła kupujących) i powrót do średniej (pod VWAP = tanio). W tej lekcji trzymamy się tego, co mówi autor, i zawsze z kontekstem.</div>
<div class="watch">${yt('dGeGeYvY7a8',1344,'Darius · VWAP: pod = tanio, nad = drogo, VWAP jako cel',1587)}</div>
</section>

<section class="s"><h2>9. Typy profilu i ustawienia</h2>
<div class="scroll"><table class="t"><tr><th>Typ</th><th>Co pokazuje</th><th>Do czego</th></tr>
<tr><td>Session</td><td>każdy dzień osobno, buduje się na żywo</td><td>podstawowy; wartość dnia, POC, VAH/VAL</td></tr>
<tr><td>Delta profile</td><td>na każdym poziomie: agresywni kupujący minus sprzedający</td><td>poziomy obrony; tylko na platformach order flow</td></tr>
<tr><td>Composite (złożony)</td><td>wiele dni zsumowanych w jeden profil</td><td>szerszy obraz, wielodniowy balans</td></tr>
<tr><td>Fixed / custom range</td><td>dowolny odcinek, który sam zaznaczysz</td><td>swing od A do B, prawdziwy FVG, delta print, range otwarcia (lekcja 9)</td></tr></table></div>
<p><b>TradingView</b> (ustawienia Dariusa): wskaźnik Session Volume Profile, value area 70%, row size 80, czyli liczba wierszy profilu (albo 120 dla dokładniejszych węzłów; domyślne 24 daje za grube poziomy). Ograniczenia: TradingView liczy na tick volume (wolumen tickowy, czyli liczba zmian ceny), a nie na prawdziwym order flow, i nie pokazuje delty ani VWAP w profilu. Mimo to POC i VAH/VAL wychodzą bardzo podobnie jak w DeepCharts (Deep Charts, platforma order flow współtworzona przez Fabera; w jego porównaniu POC 4 591 = 4 591, VAH 4 639 vs 4 641), bo im dłużej cena stoi na poziomie, tym więcej tam ticków. Do profilu wystarczy, do delty nie.</p>
<div class="watch">${yt('dGeGeYvY7a8',549,'Darius · TradingView kontra DeepCharts, ustawienia',911)}${yt('dGeGeYvY7a8',1587,'Darius · typy profilu: session, delta, composite, custom',1889)}</div>
</section>

<section class="s"><h2>Pytania, które muszą paść</h2>
<h3>Czy profil zmienia się w trakcie dnia?</h3>
<p>Tak. Profil bieżącej sesji jest <b>rozwijający się</b> (ang. <i>developing</i>): z każdą transakcją rośnie słupek na jej poziomie, więc POC, VAH i VAL mogą się przesuwać. Wczorajszy profil jest <b>zamknięty</b>, a jego poziomy są stałe. Dlatego jako poziomy do handlu bierze się zwykle profile zamknięte (wczoraj, poprzedni swing), a bieżący służy do oceny, czy wartość dnia przesuwa się w górę, czy w dół (lekcja 4).</p>
<h3>Jaki okres obejmuje profil: sesja kasowa czy cała doba?</h3>
<p>NQ handluje prawie całą dobę, a ok. 6,5 godziny to sesja kasowa (RTH). Profil z całej doby (ETH) i profil z samej sesji kasowej dają <b>inne</b> POC i VA, bo nocny handel ma mniejszy wolumen i inne poziomy. Faber dla indeksów USA używa tylko sesji kasowej (lekcja 4). Darius na złocie rysuje profile osobno dla sesji (Azja, Frankfurt, Londyn, Nowy Jork). Zasada: <b>wybierz jedną definicję i trzymaj się jej</b>, inaczej porównujesz różne rzeczy.</p>
<h3>Wolumen czy czas: profil wolumenu a TPO</h3>
<p>Starszy kuzyn profilu wolumenu to <b>Market Profile</b> z <b>TPO</b> (time price opportunity), stworzony przez Petera Steidlmayera na giełdzie CBOT (Chicago Board of Trade) w latach 80. Zamiast wolumenu liczy <b>czas</b>: za każde 30 minut, w których cena dotknęła poziomu, stawia literę. Dlatego w lekcji 2 rozróżniamy 70% czasu i 68–70% wolumenu. Zwykle oba profile wskazują podobne obszary, ale nie zawsze: krótki moment z ogromnym wolumenem jest duży w profilu wolumenu, a mały w TPO. Autorzy kursu pracują na profilu wolumenu.</p>
<h3>Od czego zależy, czy zobaczę LVN: wysokość wiersza</h3>
<p>Platforma grupuje ticki w wiersze (w TradingView to ustawienie <b>row size</b>, czyli liczba wierszy profilu). Jeden wiersz to np. 1 tick albo 4 ticki naraz.</p>
<ul><li><b>Za grube wiersze</b> (np. domyślne 24 w TradingView): cienki LVN zlewa się z sąsiadami i znika.</li>
<li><b>Za cienkie wiersze</b>: profil robi się „poszarpany” i każdy poziom wygląda jak LVN.</li></ul>
<p>Dlatego Darius ustawia 80 albo 120 wierszy, a Faber przy „prawdziwym FVG” szuka pojedynczego poziomu (24 318–24 317). Ten sam ruch przy innych ustawieniach pokaże inne węzły.</p>
<h3>Jak liczy się VWAP: przykład</h3>
<p>Od początku sesji były trzy transakcje: 10 kontraktów po 100, 30 po 102 i 10 po 105. VWAP = (10 × 100 + 30 × 102 + 10 × 105) / (10 + 30 + 10) = 5 110 / 50 = <b>102,2</b>. Zwykła średnia trzech cen to 102,33. VWAP jest niżej, bo najwięcej kontraktów przeszło po 102. Platformy rysują też pasma odchyleń od VWAP (1., 2., 3.). Faber mówi, że 3. odchylenie osiąga mniej więcej jedna sesja na 10 (lekcja 25).</p>
<h3>Czy to działa na CFD w MT5?</h3>
<p>W MT5 (MetaTrader 5) nie ma prawdziwego wolumenu, tylko <b>wolumen tickowy</b> (liczbę zmian ceny). Profil z wolumenu tickowego pokazuje, gdzie cena <b>spędziła czas i była aktywna</b>, więc POC i VA wychodzą zbliżone do prawdziwych (porównanie Dariusa w sekcji 9). Delty i profilu delty w MT5 nie zbudujesz. Dla OBR oznacza to, że część „cenową” profilu (POC, VAH, VAL, LVN) da się policzyć i przetestować w MT5, a część „agresji” nie (lekcja 13).</p>
</section>

<section class="s"><h2>10. Profil to lokalizacja, a nie wejście</h2>
<p>Obaj autorzy kończą w tym samym miejscu. Darius: samego volume profile <b>nie używasz do wejścia</b>. Mówi Ci, gdzie jest wartość i gdzie są poziomy, a do wejścia potrzebujesz footprintu, big trades albo delty. Faber przy volume ledge: „nie możesz wejść tylko na tej podstawie”. To jest drugi krok modelu z lekcji 8: <b>kontekst → lokalizacja (profil) → potwierdzenie (order flow)</b>.</p>
<p>Najprostsze zagranie z profilu według Dariusa: cena wychodzi poza VAH albo VAL, nie znajduje akceptacji i wraca. Wtedy grasz od jednej krawędzi value area do drugiej. A jeśli wybicie jest czyste i cena zostaje poza value area, to jest price discovery i nie stoisz jej na drodze.</p>
<div class="watch">${yt('dGeGeYvY7a8',1889,'Darius · gra VAH → VAL po nieudanym wybiciu',2010)}${yt('dGeGeYvY7a8',2372,'Darius · sam profil to za mało: footprint, big trades, delta',2555)}</div>
</section>

<section class="s"><h2>11. Podsumowanie lekcji: co z tego wynika</h2>
<p>Profil wolumenu to <b>suma wysiłku z lekcji 1, rozłożona na poziomy cen</b>. Każde pojęcie z tej lekcji ma odpowiednik w mechanice księgi i w aukcji z lekcji 2:</p>
<div class="scroll"><table class="t"><tr><th>W profilu</th><th>Co to znaczy mechanicznie (lekcja 1)</th><th>Co to znaczy w aukcji (lekcja 2)</th></tr>
<tr><td><b>HVN, POC</b></td><td>dużo transakcji: obie strony chętnie handlowały, walka w tle, bid–ask bounce</td><td>akceptacja ceny, balans, „uczciwa cena”</td></tr>
<tr><td><b>VAH, VAL</b></td><td>krawędzie, poza którymi handel słabnie</td><td>granice balansu: tu rozstrzyga się price discovery albo nieudana aukcja</td></tr>
<tr><td><b>LVN</b></td><td>mało transakcji: zlecenie przeszło przez pustą księgę (book sweep, „pustka, a nie siła”)</td><td>brak akceptacji, ślad szybkiego ruchu; miejsce powrotu „na przebalansowanie”</td></tr>
<tr><td><b>Pik delty</b></td><td>jedna strona agresywnie dominowała na poziomie</td><td>miejsce, gdzie ktoś bronił ceny; może bronić znowu</td></tr>
<tr><td><b>VWAP</b></td><td>średnia cena wszystkich wykonań dnia</td><td>wartość dnia w ruchu: pod nią tanio, nad nią drogo (Darius)</td></tr></table></div>

<h3>1. Profil mówi „gdzie”, a nie „kiedy” i „czy”</h3>
<p>Profil gubi kolejność transakcji i nie pokazuje, kto był agresorem. Daje <b>mapę poziomów</b>. Czy na danym poziomie wejść, mówi dopiero order flow na miejscu (lekcje 5–7). To trzeci raz ta sama zasada: w lekcji 1 „DOM mówi, gdzie patrzeć, footprint mówi, czy wejść”, w lekcji 2 „poziom to tylko miejsce, gdzie patrzysz”.</p>

<h3>2. LVN ma dwie twarze z tego samego powodu</h3>
<p>Na LVN nikt nie chciał handlować. Dlatego cena może przez niego przelecieć (nikt nie stoi na drodze) albo się od niego odbić (nikt nie chce tam kupować ani sprzedawać, więc cena wraca tam, gdzie toczy się biznes). Którą twarz pokaże, rozstrzyga kontekst (balans czy price discovery) i order flow na miejscu.</p>

<h3>3. Liczby profilu zależą od ustawień</h3>
<p>Okres (sesja kasowa czy doba), wysokość wiersza i wariant liczenia VA zmieniają POC, VAH, VAL i widoczność LVN. Wybierz ustawienia raz i trzymaj się ich, także w backteście.</p>

<h3>4. Co to znaczy dla OBR</h3>
<ul><li>Zakres otwarcia OBR to w praktyce <b>mały profil</b>: jeśli w nim cena kręciła się w miejscu, jest tam HVN i akceptacja. Wybicie z takiego zakresu to pytanie z lekcji 2: akceptacja czy odrzucenie?</li>
<li><b>Hipotezy do testu</b> (lekcje 13 i 29, po kursie, bez założeń z góry):
<ul><li>czy wybicia OBR, które wychodzą w <b>LVN</b> poprzedniego dnia, idą dalej niż te, które wchodzą w <b>HVN</b>;</li>
<li>czy TP ustawiony przed najbliższym HVN albo POC poprzedniej sesji ma wyższą skuteczność niż stały TP;</li>
<li>czy położenie zakresu otwarcia względem wczorajszej VA (wewnątrz, nad, pod) zmienia wynik wybić.</li></ul></li>
<li>Wszystkie te poziomy da się policzyć w MT5 na wolumenie tickowym, więc te hipotezy są testowalne bez danych CME.</li></ul>

<div class="warnbox"><b>W jednym zdaniu:</b> profil wolumenu to mapa tego, gdzie rynek już handlował (HVN, akceptacja) i gdzie tylko przeleciał (LVN, pustka), a o tym, co cena zrobi na danym poziomie dziś, decyduje dopiero order flow w chwili, gdy tam dojdzie.</div>
</section>

<div class="task"><b>Zadanie (20 min):</b> (1) W laboratorium profilu zaznacz poziomy, które uważasz za LVN, i porównaj z odpowiedzią. (2) W TradingView na NQ1! (ciągły wykres kontraktu NQ, świece M5) ustaw Session Volume Profile według ustawień Dariusa i zapisz wczorajszy POC, VAH i VAL. (3) Na ostatnim wyraźnym ruchu narysuj fixed range profile od A do B, ukryj świece i znajdź najcieńszy poziom w value area. Sprawdź, czy cena na nim zareagowała. (4) Jednym zdaniem: dlaczego ten sam LVN raz przepuszcza cenę, a raz ją odbija? (5) Bez zaglądania policz value area dla profilu: 100 = 4, 101 = 10, 102 = 30, 103 = 50, 104 = 35, 105 = 20, 106 = 6. Odpowiedź: razem 155, 70% to 108,5; od POC 103 dokładasz 104 (85), 102 (115), więc VA = 102–104.</div>`};

<section class="s"><h2>Profile framing — rytuał przed sesją</h2>
<p>To punkt startu Fabera na każdy dzień. Na NQ używa tylko profilu <b>sesji cash NY</b> (według jego testów Londyn nie dodaje wartości dla indeksów US). Dla każdego dnia ocenia:</p>
<ol><li>kształt i położenie POC (POC wysoko = kupujący agresywni),</li><li>strefy odrzucenia poza VAL/VAH (obszar, gdzie cena nigdy nie była akceptowana),</li><li>czy profile nakładają się — jeśli tak, <b>scala</b> je w jeden wielodniowy balans z dokładniejszymi krawędziami,</li><li>kolor biasu: zielony long, pomarańczowy ostrzeżenie, niebieski niezdecydowanie.</li></ol>
<p>W biasie long nie bierze shortów, nawet jeśli sygnał wygląda dobrze.</p>
<div class="w" data-w="framing"></div>
<div class="case"><div class="lab">Przypadek z filmu · Faber, NQ, XI 2025 – I 2026</div><p>Faber przechodzi dwa miesiące NQ dzień po dniu właśnie w ten sposób: P-shape i zielony bias, test VAL i odrzucenie, scalenie profili, dwa dni odrzucenia góry z opadającym POC (pomarańczowy), wybicie VAL i seria shortów z testów VAH, potem zmiana aukcji. Symulator powyżej odtwarza tę sekwencję w uproszczeniu. Pełne omówienie dzień po dniu, z odnośnikiem do każdej minuty filmu, jest w lekcji 2, sekcja 5b.</p><div class="watch">${yt('Pz8f0wWW12M',1713,'Faber · profile framing, początek')}${yt('Pz8f0wWW12M',1996,'Faber · ostrzeżenie i zmiana aukcji')}</div></div>
</section>
<section class="s"><h2>Bias z bootcampu Fabera: wartość dzień po dniu</h2>
<p><b>Skąd to jest.</b> Ta i kolejne sekcje pochodzą z notatek ucznia, Pavlovicia, który kupił płatny bootcamp Fabera (Deep Charts, 2025) i streścił go w 8 krótkich filmach. To <b>interpretacja ucznia, a nie słowa Fabera</b>. Tam, gdzie notatki zgadzają się z filmami samego Fabera, piszę to wprost. Tam, gdzie się kłócą, też.</p>
<p>Skróty w tej lekcji:</p>
<ul>
<li><b>VA</b> (value area, obszar wartości): przedział cen, w którym przeszło ok. 70% wolumenu sesji;</li>
<li><b>VAH / VAL</b> (value area high / low): górna i dolna krawędź VA;</li>
<li><b>POC</b> (point of control): poziom z największym wolumenem;</li>
<li><b>sesja cash</b> (RTH, regular trading hours): 9:30–16:00 czasu Nowego Jorku, czyli 15:30–22:00 w Polsce.</li>
</ul>

<h3>Krok po kroku: jak czytać bias z dziennych VA</h3>
<ol>
<li>Rysujesz <b>dzienny profil tylko z sesji cash</b>, dla każdego dnia osobno.</li>
<li>Porównujesz VA dzisiaj z VA wczoraj:
<ul><li><b>VA wyżej</b> (cała albo prawie cała nad wczorajszą): wartość przesunęła się w górę, kupujący kontrolują aukcję, bias <b>long</b>;</li>
<li><b>VA niżej</b>: bias <b>short</b>;</li>
<li><b>VA się nakładają</b>: dzień neutralny. <b>Scalasz</b> oba profile w jeden (to samo, co „scalanie” w profile framingu wyżej).</li></ul></li>
<li><b>Jedno przesunięcie przeciw trendowi nie zmienia biasu.</b> Jeśli po serii dni w górę jeden dzień przesunie wartość w dół, czekasz jeszcze jeden dzień. Dopiero drugi dzień niżej potwierdza zmianę.</li>
<li>Gdy bias jest ustalony, zaznaczasz <b>wczorajsze VAH, POC i VAL</b>. To poziomy statyczne, nie zmienią się w trakcie dnia. W biasie long VAL i POC to miejsca, gdzie najczęściej pojawią się kupujący.</li>
</ol>

<h3>Dzień symetryczny i asymetryczny</h3>
<ul>
<li><b>Symetryczny</b>: długi termin (seria dni) i krótki termin (ostatni dzień) pokazują ten sam kierunek. Najprostsza sytuacja: grasz z biasem.</li>
<li><b>Asymetryczny</b>: długi termin jest long, a ostatni dzień przesunął wartość w dół (albo odwrotnie). Najczęstszy błąd to przeskoczyć od razu na short. W asymetrycznym dniu spadek jest najczęściej <b>korektą</b>, a przy wsparciu (wczorajszy POC, VAL, stacked profiles poniżej) można szukać longów.</li>
<li>Zasada z bootcampu: <b>patrz co najmniej na 5 ostatnich sesji</b>, a nie tylko na wczoraj. Kto patrzy na jeden dzień, gubi narrację i daje się złapać na korekcie.</li>
</ul>

<section class="s"><h2>Stacked profiles: punkt kontrolny aukcji</h2>
<p><b>Stacked profiles</b> („profile ułożone jeden na drugim”) to dwie lub więcej sesji, których VA leżą prawie na tych samych cenach. Rynek przez kilka sesji uznawał ten przedział za uczciwą cenę. Po obu stronach zebrało się dużo zleceń: kupujący bronią dołu, sprzedający góry.</p>
<h3>Co z tego wynika</h3>
<ol>
<li><b>Wybicie ze stacked profiles zwykle daje dzień trendowy.</b> Logika jest ta sama co przy ścieżce najmniejszego oporu z lekcji 1: gdy jedna strona przegra, ci, którzy bronili tej strefy, muszą zamknąć pozycje, a to dokłada paliwa ruchowi.</li>
<li><b>Im więcej sesji w stosie, tym większy wybuch po wybiciu</b>, bo w strefie siedzi więcej zleceń do zamknięcia. To reguła z bootcampu, bez podanych statystyk.</li>
<li><b>Podpowiedź z POC:</b> gdy VA są takie same, a POC kolejnych dni schodzi niżej, wolumen buduje się na dole. Sprzedający naciskają mocniej i wybicie dołem jest bardziej prawdopodobne. POC wędrujący w górę to sygnał odwrotny. To zgadza się z tym, co Faber pokazuje w swoim filmie o profile framingu: dwa dni odrzucenia góry z opadającym POC dostały u niego kolor pomarańczowy.</li>
<li><b>Otwarcie sesji cash już poza stosem</b> (np. pod nim): spodziewaj się dnia trendowego. Każda korekta to potencjalny <b>reload</b>, czyli miejsce, gdzie wygrana strona dokłada pozycje. Nie grasz wtedy powrotów do środka.</li>
<li><b>Często cena po wybiciu najpierw wraca do stosu</b> (do jego krawędzi), a dopiero potem idzie dalej. Bootcamp nazywa to <b>retreat zone</b>: strefą, gdzie wygrana strona ostatnio miała kontrolę.</li>
<li><b>Zaznacz punkt, z którego ruch się zaczął.</b> Dla wybicia w dół to VAH stosu. Powrót i akceptacja nad nim oznacza, że aukcja się odwróciła.</li>
</ol>

<section class="s"><h2>Composition profile: gdzie jesteś w aukcji długoterminowej</h2>
<p><b>Composition profile</b> (profil złożony) to jeden profil z dłuższego okresu, w bootcampie z ok. <b>3 miesięcy</b>. Pokazuje, gdzie rynek widzi uczciwą cenę w dłuższym terminie. Dzienne profile mówią, dokąd przesuwa się wartość. Profil złożony mówi, <b>czy to przesunięcie ma jeszcze miejsce</b>.</p>
<ul>
<li><b>Seria dni w górę dochodzi do VAH profilu złożonego:</b> tam kupowanie robi się drogie, więc spodziewaj się pierwszych sprzedających. W przykładzie z bootcampu właśnie tam wartość pierwszy raz przesunęła się niżej.</li>
<li><b>Cena wraca do środka VA profilu złożonego</b> (akceptacja z powrotem w wartości): celem staje się <b>POC profilu złożonego</b>. Według bootcampu POC to jedyny prawdziwy magnes na rynku. W przykładzie cena szła do niego cały tydzień.</li>
<li><b>Profit release przy POC:</b> gdy cena dojdzie do tego POC, duzi gracze realizują zyski. Spodziewaj się balansu albo odbicia, a nie dalszej jazdy. Według bootcampu realizacje zysków zdarzają się najczęściej w piątki. To teza bez statystyk, do sprawdzenia samemu.</li>
<li><b>Prawdziwa zmiana aukcji</b> to dwie rzeczy naraz: akceptacja poza stacked profiles <b>i</b> powrót do VA profilu złożonego (albo wyjście z niej).</li>
</ul>

</section>

<section class="s"><h2>Przed otwarciem: premarket, kształt i „last line of defense”</h2>
<ol>
<li><b>Porównaj z wczoraj.</b> Otwarcie powyżej wczorajszej wartości oznacza przesunięcie wartości, więc presja jest long. Poniżej: short.</li>
<li><b>Narysuj profil premarketu</b>, czyli Londynu i godzin przed otwarciem NY. Według bootcampu rysujesz go <b>według strefy konsolidacji, a nie według zegara</b>: jeśli konsolidacja zaczęła się przed otwarciem Londynu, bierzesz ją całą.</li>
<li><b>Kształt premarketu daje scenariusz otwarcia</b> (P, b, D z początku lekcji):
<ul><li><b>D</b> (balans): handluj zakresem, sprzedawaj przy VAH, kupuj przy VAL;</li>
<li><b>P</b>: presja w górę, na otwarciu przewiduj wybicie i kontynuację;</li>
<li><b>b</b>: to samo w dół.</li></ul></li>
<li><b>„Last line of defense”</b> (ostatnia linia obrony): w premarkecie Faber zaznacza najsilniejsze poziomy <b>delty</b> (przewagi agresywnych kupujących albo sprzedających na poziomie) przy krawędziach balansu. Dopóki cena ich nie przebije, grasz <b>modelem balansu</b>, czyli od krawędzi do POC. Gdy cena zostanie zaakceptowana za tą linią <b>i</b> widać agresję, przełączasz się na <b>model trendowy</b>. Przebite wsparcie staje się oporem.</li>
<li><b>Obserwuj Londyn.</b> Jeśli Londyn już dotknął Twojej strefy (np. wczorajszego VAL) i odbił, NY może od razu wystrzelić bez drugiego testu. Bądź gotów wejść od otwarcia.</li>
</ol>
<div class="warnbox"><b>Sprzeczność do wyjaśnienia:</b> w profile framingu (wyżej) Faber mówi, że dla indeksów USA używa tylko sesji cash NY, bo według jego testów Londyn nie dodaje wartości. W bootcampie, według notatek ucznia, używa profilu Londynu do scenariusza otwarcia. Najbardziej prawdopodobne pogodzenie: <b>bias</b> buduje z profili sesji cash, a Londyn służy mu tylko do <b>scenariusza na otwarcie</b> i do sprawdzenia, czy strefa została już przetestowana. Tego nie da się jednak potwierdzić bez dostępu do bootcampu.</div>

</section>

<section class="s"><h2>Silna i słaba reakcja na poziomie</h2>
<p>Masz poziom z biasu, np. wczorajsze VAH w biasie short. Liczy się to, <b>co się dzieje po dotknięciu</b>:</p>
<ul>
<li><b>Silna strefa:</b> szybkie, wyraźne odejście (przemieszczenie ceny) w Twoim kierunku. Strefa działa.</li>
<li><b>Słaba strefa:</b> cena odbija trochę, a potem znów buduje wartość w stronę poziomu, „przepychając się” coraz wyżej. Przeciwna strona akceptuje ceny. Jeśli masz pozycję, zamykaj ją szybko, bo zbliża się wybicie przez „dach”.</li>
<li><b>Jak cena doszła do poziomu</b> też ma znaczenie (dzień 2 bootcampu, przewidywanie kontra reagowanie). Jeśli kupujący dotarli do Twojego VAH z trudem, walcząc z każdym poziomem, sprzedający wciąż są aktywni i short ma większe szanse. Jeśli cena „wystrzeliła” do poziomu bez oporu, sprzedawców nad ceną było mało, a poziom może nie wytrzymać. To prawo wysiłku i rezultatu z podsumowania lekcji 1.</li>
</ul>
<div class="watch">${yt('DRIivo9cehc',215,'Pavlovic · dzień 7: silna kontra słaba strefa',265)}${yt('gz6jAD1nBKM',10,'Pavlovic · dzień 2: jak cena doszła do strefy',133)}</div>

<div class="extra"><div class="xlab">Materiał nadprogramowy · co jeszcze było w bootcampie i gdzie to trafi</div>
<p>Poniższe tematy z notatek dotyczą wejścia i order flow, a nie biasu. Opiszę je dokładnie w lekcjach, do których należą:</p>
<ul>
<li><b>Zawężanie strefy profilem delty</b> („poziom snajperski”), <b>battle of orders</b> („kto dostaje zapłatę”), trigger „jedna strona przegrywa, druga wygrywa w korpusie świecy”: L5 i L8;</li>
<li><b>Locked value model</b> (świece M5, czyli 5-minutowe, filtr big trades 60–75 kontraktów NQ, czyli kontraktu na Nasdaq 100, maks. 3 duże transakcje na świecę), <b>reload</b> i <b>momentum</b> (reguła: kupujący u góry, sprzedający w korpusie, wejście w korpus, 1:1, według Fabera WR, czyli odsetek wygranych, ok. 75%, niezweryfikowane): L6 i L24;</li>
<li><b>Retreat zone / pass-over zone</b>, uwięzieni uczestnicy, <b>stair model</b>, <b>gap model</b>: L14 i L24;</li>
<li><b>Deep Effort na wykresie range 40</b> (świece o stałym zakresie 40 ticków): L9 (uczeń przyznaje, że zgaduje, jak algorytm działa).</li>
</ul>
<p>Transkrypcje wszystkich 8 dni: <span class="mono">transkrypcje_pobrane / Pavlovic_bootcamp</span> w folderze kursu.</p>
</div>
</section>

LESSONS.L6={title:'Big trades i CVD: czytanie wysiłku',time:'30 min',goals:['ustawić filtr big trades pod instrument','zrozumieć, że bąbel to wykonane zlecenie, a kierunek wybiera się na reakcji ceny','odróżnić absorpcję od akceptacji na bąblach','nie wchodzić na pierwszym bąblu i w środku range’u','użyć CVD do wykrycia dystrybucji i absorpcji'],
html:`
<section class="s"><h2>Bąble = duzi agresorzy</h2>
<p>Big trades (w Deep Charts: Deep Trades) to filtr, który rysuje bąbel tylko wtedy, gdy agresywne zlecenie przekracza próg. Włączona opcja <b>aggregate</b> skleja małe zlecenia jednego gracza po ID, więc duży nie ukryje pozycji w kawałkach. Duży bąbel na NQ to często dziesiątki milionów dolarów ekspozycji — ktoś to robi z planem.</p>
<table class="t"><tr><th>Instrument</th><th>Filtr (Darius)</th></tr><tr><td>GC (złoto)</td><td class="num">30 (spokojny Londyn: 15; tylko grube ryby: 40–60)</td></tr><tr><td>NQ w sesji NY</td><td class="num">60–80</td></tr><tr><td>ES</td><td class="num">~100</td></tr></table>
<p>Filtr zmieniaj razem ze zmiennością. Faber na żywo podnosi go, gdy dzień ma duży wolumen.</p>
</section>
<section class="s"><h2>Bąbel to przeszłość: kierunek wybierasz na reakcji ceny</h2>
<p>To najważniejsza zasada czytania bąbli. Bąbel pokazuje zlecenie, które <b>już się wykonało</b>. W chwili, gdy go widzisz, duży agresor zjadł już limity z księgi, a cena przesunęła się o tyle, o ile przesunęła. Bąbel sam nie mówi „wchodź w górę” ani „wchodź w dół”. Mówi tylko trzy rzeczy:</p>
<ul><li><b>kto</b> użył siły: kupujący (bąbel kupna, zjadł stronę ask) albo sprzedający (bąbel sprzedaży, zjadł stronę bid);</li>
<li><b>ile</b>: liczba kontraktów, czyli wielkość wysiłku;</li>
<li><b>gdzie</b>: poziom, mniej więcej średnia cena dużego gracza.</li></ul>
<p>Kierunek wybierasz dopiero na tym, <b>co cena zrobi potem</b>. To prawo wysiłku i rezultatu z podsumowania lekcji 1: bąbel to wysiłek, reakcja ceny to rezultat.</p>

<h3>Krok po kroku: co się dzieje po bąblu</h3>
<ol><li><b>Bąbel się pojawia.</b> Duży agresor zjada limity i przesuwa cenę. To trwa milisekundy. Pierwsze ticki ruchu zabierają algorytmy, Ty tego nie złapiesz (lekcja 1, „kto gra kierunek na newsach”).</li>
<li><b>Rynek odpowiada.</b> Teraz decyduje się, czy pozostali uczestnicy przyjmą nową cenę. Możliwe są dwie reakcje:
<ul><li>inni agresorzy dołączają po tej samej stronie, a pasywni z drugiej strony cofają limity wyżej: <b>akceptacja</b>, cena idzie dalej;</li>
<li>po drugiej stronie stoi pasywny gracz, który odnawia limity (iceberg, ściana) i przyjmuje całą agresję: <b>absorpcja</b>, cena stoi albo wraca.</li></ul></li>
<li><b>Odczytujesz wynik</b> i dopiero wtedy decydujesz.</li></ol>

<h3>Trzy możliwe reakcje i decyzja</h3>
<p>Przykład dla bąbla <b>kupna</b>. Dla bąbla sprzedaży wszystko odwrotnie.</p>
<div class="scroll"><table class="t"><tr><th>Co zrobiła cena po bąblu</th><th>Odczyt</th><th>Decyzja</th></tr>
<tr><td>Poszła w górę, świeca zamknęła się wysoko, a cena <b>trzyma się nad poziomem bąbla</b>. Kolejne bąble też są po stronie kupna.</td><td><b>akceptacja</b>: wysiłek dał rezultat, kupujący kontrolują</td><td><b>long</b>, najlepiej na powrocie do poziomu bąbla (reload), stop tuż pod nim</td></tr>
<tr><td>Stoi w miejscu albo <b>wraca pod poziom bąbla</b>; świeca zamyka się nisko, pojawia się agresja sprzedających w korpusie świecy</td><td><b>absorpcja</b>: ktoś pasywny i większy przyjął całe kupno; kupujący z bąbla są teraz <b>uwięzieni</b> (mają stratę)</td><td><b>short</b> albo nic. Uwięzieni kupujący, zamykając pozycje, sprzedają i dokładają paliwa w dół</td></tr>
<tr><td>Kręci się wokół poziomu bąbla, bąble po obu stronach, nikt nie wygrywa</td><td>brak rozstrzygnięcia</td><td><b>nic</b>. Czekasz, aż jedna strona wyraźnie wygra (zasada z bootcampu: „nie handluj, gdy nie wiesz, kto kontroluje”)</td></tr></table></div>

<h3>Jak długo czekać na reakcję?</h3>
<p>Autorzy nie podają jednej sztywnej reguły w sekundach. Z ich filmów i z notatek z bootcampu wynikają trzy punkty kontrolne, od najszybszego do najpewniejszego:</p>
<ol><li><b>Zamknięcie świecy, w której pojawił się bąbel.</b> Zamknięcie daleko od bąbla w jego kierunku to pierwsza oznaka rezultatu. Zamknięcie z powrotem po drugiej stronie to pierwsza oznaka absorpcji. W modelu momentum z bootcampu świeca musi zamknąć się za agresją, inaczej „obie strony przegrały” i nie ma wejścia.</li>
<li><b>Następna świeca.</b> Trigger Fabera według bootcampu: jedna strona przegrywa, druga wygrywa, a zwycięska agresja jest <b>w korpusie świecy</b>, nie w knocie. Bez tego nie ma wejścia.</li>
<li><b>Test poziomu bąbla.</b> Cena wraca do poziomu i duży gracz go broni (nowe bąble po tej samej stronie, absorpcja kontrataku). To wejście reload: najlepsza cena i najkrótszy stop, ale czasem ruch ucieka bez testu.</li></ol>
<p>To samo mówi zasada „<b>nie na pierwszym bąblu</b>” niżej: pierwszy bąbel to pytanie, reakcja to odpowiedź.</p>

<h3>Co znaczy „rezultat”: zawsze względem wielkości bąbla</h3>
<ul><li>Bąbel 2 000 kontraktów, który przesunął cenę o 2 ticki i stanął, to <b>słaby</b> rezultat. Po drugiej stronie stał ktoś bardzo duży.</li>
<li>Bąbel 80 kontraktów, który przesunął cenę o 10 ticków, bo nad ceną było pusto, to <b>book sweep</b> (zjedzenie pustej księgi). Ruch duży, ale siła mała. To ta sama pułapka co „pustka, a nie siła” z lekcji 1.</li>
<li>Autorzy nie podają liczbowego progu „dobrego rezultatu”. Wyczucie, ile ticków powinien dać bąbel danej wielkości na danym instrumencie i o danej porze, budujesz w <b>replayu</b>. To jedna z rzeczy, których nie da się nauczyć z tekstu.</li></ul>

<h3>Poziom bąbla zostaje na wykresie</h3>
<ul><li>To mniej więcej <b>średnia cena dużego gracza</b>. Jeśli miał rację, będzie jej bronił albo dokupi przy powrocie, więc poziom działa jak wsparcie (przy bąblu kupna).</li>
<li>Jeśli cena <b>przejdzie przez poziom bąbla i zamknie się po drugiej stronie</b>, duży gracz ma stratę. Ten poziom staje się wtedy <b>strefą odrzucenia</b>: przy powrocie uwięzieni będą chcieli wyjść na zero i sprzedadzą. Bootcamp opisuje to jako „trapped participants = rejection zone”.</li>
<li>Stop stawiasz <b>za poziomem bąbla</b>, a nie za przypadkową świecą. Jeśli duży gracz przegra, Ty też nie powinieneś już być w pozycji.</li></ul>

<h3>Bez lokalizacji to nie działa</h3>
<p>Ten sam bąbel z tą samą reakcją znaczy różne rzeczy w różnych miejscach. Czytasz go tylko tam, gdzie miałeś już powód handlować: krawędź balansu (VAH, VAL), LVN, poziom z biasu dnia (lekcja 4), high lub low sesji. W środku zakresu bąble po obu stronach to zwykła walka w tle (lekcja 1) i nie są sygnałem.</p>

<div class="case"><div class="lab">Przykład z liczbami · NQ, liczby ilustracyjne</div>
<p>Bias long (lekcja 4), wczorajszy VAL to 21 000,00. Cena schodzi do VAL. Ten sam bąbel, dwa zakończenia:</p>
<div class="scroll"><table class="t"><tr><th>Moment</th><th>Wariant A: akceptacja</th><th>Wariant B: absorpcja</th></tr>
<tr><td>1. Przed bąblem</td><td colspan="2">sprzedaż agresywna ok. 300 kontraktów na 21 000,00, cena nie spada (absorpcja sprzedających)</td></tr>
<tr><td>2. Bąbel</td><td colspan="2">kupno ok. 400 kontraktów, zjada 21 000,25–21 001,00</td></tr>
<tr><td>3. Zamknięcie świecy</td><td>21 002,50, wysoko</td><td>21 000,25, z powrotem przy dole</td></tr>
<tr><td>4. Następna świeca</td><td>nowe bąble kupna, korpus zielony</td><td>sprzedający w korpusie, zamknięcie 20 999,50, pod poziomem bąbla</td></tr>
<tr><td>5. Decyzja</td><td><b>long</b> na reteście 21 000,50, stop 20 999,50 (4 ticki = 20 $ na kontrakt NQ), cel POC 21 010 (38 ticków = 190 $)</td><td><b>nie kupujesz.</b> VAL nie wytrzymał, a bias long jest pod znakiem zapytania. Short przeciw biasowi tylko według zasad lekcji 4: dopiero po akceptacji pod VAL</td></tr></table></div>
<p>Wariant B pokazuje, dlaczego bias i lokalizacja idą przed bąblem. Ten sam sygnał w drugą stronę bierzesz tylko wtedy, gdy kontekst też się zmienił.</p></div>

<section class="s"><h2>Absorpcja czy akceptacja — ćwiczenie</h2>
<p>Każda scena poniżej to odtworzenie sytuacji z filmów. Zdecyduj, co widzisz, zanim zobaczysz odpowiedź.</p>
<div class="w" data-w="bubbles"></div>
<div class="case"><div class="lab">Przypadek z filmu · Faber, NQ</div><p>Na jednym poziomie cztery duże zlecenia kupna: <span class="num">72, 61, 60, 62</span> — razem ok. 300 kontraktów, bez rezultatu. Faber zaczyna budować short. Trzy minuty później pojawiają się nowe duże sprzedaże z mocną świecą — stop na break-even. Po drugiej stronie: <span class="num">105</span> i <span class="num">101</span> kontraktów sprzedaży kilka razy na tym samym poziomie bez przebicia → long. Oba wejścia krok po kroku (break-even po 3 minutach, ping pong, trailing za agresją) są w lekcji 2, sekcja 5b.</p><div class="watch">${yt('Pz8f0wWW12M',2257,'Faber · 72, 61, 60, 62')}${yt('Pz8f0wWW12M',2318,'Faber · 105 i 101')}</div></div>
<div class="case"><div class="lab">Przypadek z filmu · Darius, NQ po otwarciu</div><p>Sprzedający atakują po otwarciu, ale zostają zaabsorbowani. Kupujący pchają w górę i… sami wpadają w pułapkę na szczycie. Darius pokazuje, jak jedna scena może najpierw wyglądać jak absorpcja, a okazać się udaną agresją — dlatego czeka na drugie potwierdzenie.</p><div class="watch">${yt('RXOZM6sQs3U',1028,'Darius · NQ, pułapki na bąblach')}${yt('_PbN1la9rdM',1037,'Darius · przykłady absorpcji i akceptacji')}</div></div>

<section class="s"><h2>Trzy zasady wejścia</h2>
<ol><li><b>Nie na pierwszym bąblu.</b> Czekaj na drugą absorpcję w tym samym miejscu albo na follow-through.</li>
<li><b>Nie w środku balansu.</b> Bąble działają na krawędziach: VAH/VAL, LVN, high/low sesji.</li>
<li><b>Najmocniejszy sygnał</b>: absorpcja jednej strony i agresja drugiej w tym samym miejscu.</li></ol>
</section>
<section class="s"><h2>CVD — skumulowana delta</h2>
<p>CVD to suma delty w czasie. Nie patrzysz na jej kierunek, tylko na <b>rozjazd z ceną</b>:</p>
<ul><li>Cena stoi w konsolidacji, CVD mocno spada → <b>dystrybucja</b>, wybicie w dół przed wybiciem. Tak Faber zarobił na swojej najlepszej sesji w World Cup.</li>
<li>CVD robi niższy dołek, cena nie → pasywni kupujący absorbują sprzedaż, failed auction w dół.</li></ul>
<div class="w" data-w="cvd"></div>
<div class="watch">${yt('0jM5Y31YJak',60,'Faber · CVD i dystrybucja w World Cup')}${yt('o-w5Gxss6T0',311,'Faber · CVD i absorpcja')}</div>
</section>

LESSONS.L9={title:'Model IVB i Deep Effort (Faber)',time:'30 min',goals:['zbudować IVB: range otwarcia, profil range’u, strefa reloadu, inwalidacja, cele','porównać wynik wejścia ORB na wybiciu z wejściem IVB na retest','zastosować filtr biasu z Deep Effort'],
html:`
<section class="s"><h2>IVB — opening range breakout z wolumenem</h2>
<p><b>To jest najbliższe Twojemu OBR.</b> Faber bierze klasyczny ORB Toby’ego Crabela i dodaje trzy rzeczy: lokalizację z profilu, potwierdzenie z order flow i statystyczny cel.</p>
<ol><li><b>Range</b>: pierwsze 15/30/60 minut sesji cash NY (Faber pokazuje 30). Czekasz, aż się zamknie.</li>
<li><b>Kierunek</b>: pierwsze wybicie mówi, kto wygrał najważniejszą bitwę dnia. Faber: sam ORB bez wolumenu daje na NQ przewagę ok. 13,5% przy RR 1:1.</li>
<li><b>Model 1</b>: fixed profile na range. Strefa między POC a krawędzią VA po stronie wybicia to „blok zleceń” — tam czekasz na retest.</li>
<li><b>Inwalidacja</b>: zamknięcie świecy po drugiej stronie VA (dla longa: pod VAL). Nie czekasz na dno range’u.</li>
<li><b>Model 2</b>: w strefie retestu czekasz na absorpcję lub momentum w order flow.</li>
<li><b>Cele</b>: „protection level” (wskaźnik Deep Charts, według nich 65–70% prawdopodobieństwa) i „extreme average” jako TP2. Rada: 1:2–1:3 konsekwentnie, runner do protection level.</li></ol>
<div class="w" data-w="ivb"></div>
<div class="warnbox">Protection level i jego 65–70% to zamknięty wskaźnik, niezweryfikowany. W symulatorze cel jest przybliżony jako 1,5× wysokości range’u — tylko do ilustracji. Część cenową da się przetestować w MT5 na Twoich danych (lekcja 13).</div>
<div class="watch">${yt('cUTsoU-15Tc',243,'Faber · model 1: profil range’u')}${yt('cUTsoU-15Tc',362,'Faber · inwalidacja')}${yt('cUTsoU-15Tc',424,'Faber · model 2: potwierdzenie')}${yt('cUTsoU-15Tc',607,'Faber · backtest w Deep Charts')}</div>
</section>
<section class="s"><h2>Deep Effort — filtr biasu</h2>
<p>Deep Effort (Nasdaq Effort) to skrypt Fabera, który zamienia prawo wysiłku i rezultatu w <b>boksy</b>: strefy, gdzie wolumen porusza cenę „bez wysiłku”. Zasady użycia:</p>
<ul><li>tylko boksy <b>zgodne z biasem</b> z profile framingu albo z IVB,</li><li>boks „momentum” (cena nigdy go nie testuje) — pomijasz,</li><li>retest „dziewiczego” boksu — wejście, stop za boksem,</li><li>przeciwny boks przy twojej pozycji = sygnał wyczerpania → realizuj.</li></ul>
<div class="case"><div class="lab">Przypadek z filmu · Faber</div><p>Jeden dzień z biasem long: dwa trafienia 1:3 (+6R), dwa stopy (−2R) = <b>+4R</b> z samych setupów zgodnych z biasem. Shortów nie brał, choć „dałyby 1:2,5”. Po wybiciu IVB w dół nie grał już kontr-trendu.</p><div class="watch">${yt('Khgj5q1-ln8',428,'Faber · rachunek +4R')}${yt('Khgj5q1-ln8',60,'Faber · jak powstał Deep Effort')}</div></div>
</section>
<div class="task"><b>Zadanie (10 min):</b> w symulatorze IVB porównaj trzy warianty wejścia na kilku dniach (przycisk „Nowy dzień”). Zapisz, w ilu dniach retest w ogóle nastąpił. To ważna cena lepszego RR: część ruchów ucieka bez ciebie.</div>`};

LESSONS.L10={title:'Prowadzenie pozycji: BE, skalowanie, trailing',time:'30 min',goals:['prowadzić stop za strefami agresji zamiast za świecami','skalować pozycję z zysku dnia','rozpoznać moment wyjścia z order flow'],
html:`
<section class="s"><h2>Case: 20R w jednej sesji NQ (Faber, grudzień 2025)</h2>
<p>Najlepszy materiał o prowadzeniu pozycji na obu kanałach. Faber ma już <span class="num">27 500 $</span> zysku na dniu i otwiera short, ryzykując tylko <span class="num">3 150 $</span> z tego zysku. Przejdź sesję krok po kroku i obserwuj, gdzie wędruje stop.</p>

<section class="s"><h2>Zasady z sesji na żywo</h2>
<ul>
<li><b>Ryzykuj zysk dnia.</b> Maksymalne obsunięcie dnia = break-even. Po pierwszym zysku kolejne wejścia finansuje tylko z niego.</li>
<li><b>BE, gdy rynek potwierdza</b> — nowe duże zlecenia w twoją stronę z mocną świecą.</li>
<li><b>Skalowanie</b>: dokładanie przy kolejnych potwierdzeniach; unikanie dokładania „nisko w krzywej” (daleko od wartości).</li>
<li><b>Trailing</b> za ostatnim punktem agresji strony przeciwnej albo za poziomem kontroli, nie za świecą.</li>
<li><b>Wyjście</b>, gdy agresywni po drugiej stronie przejmują kontrolę albo duże zlecenia przestają pchać.</li>
<li><b>Zły dzień</b>: w chopie przy dodatniej gammie zamknij w zysku, gdy tylko się da.</li></ul>
<div class="case"><div class="lab">Przypadek z filmu · Faber, najgorsza sesja miesiąca</div><p>Seria stopów w kompresji, <span class="num">−9 000 $</span> na dniu. Jeden short z 18 kontraktami i RR 1:20 odwraca dzień do <span class="num">+2 330 $</span>, wcześniej zablokował <span class="num">12 000 $</span> zysku na pozycji. Faber: „w złe dni tnę w zysku, bo wieczorem spada koncentracja”.</p><div class="watch">${yt('jasv3L-d8ZE',60,'Faber · dzień w obsunięciu')}${yt('jasv3L-d8ZE',571,'Faber · odrobienie i wyjście')}</div></div>
<div class="case"><div class="lab">Przypadek z filmu · Darius, skalowanie na złocie</div><p>Pierwszy kontrakt przy absorpcji, drugi na kolejnej absorpcji w retestcie; wspólny stop przeniesiony pod nową agresję. W innym dniu dołożył drugi kontrakt tak, że stop na obu = zero ryzyka netto (zysk 137 ticków na pierwszym pokrywał 138 ryzyka drugiego).</p><div class="watch">${yt('M8bhgzErRmY',790,'Darius · re-entry i stop pod agresją')}${yt('jb8pJ0xNcWo',60,'Darius · dokładanie za zysk')}</div></div>
</section>

<section class="s"><h2>Prop to symulacja: skąd pieniądze, co to znaczy dla Ciebie i jak zarabiają autorzy</h2>
<p>Pytanie, które musi paść: skoro autorzy mówią, że futures są lepsze od CFD, „bo są rozliczane na prawdziwym rynku”, a na propie (firmie finansującej traderów, np. FTMO na CFD albo Tradeify i Apex na futures) i tak nie handlujesz na prawdziwym rynku, to o co chodzi? I z czego żyją Darius i Faber?</p>

<h3>1. Konto prop to w większości symulacja: i wyzwanie, i konto finansowane</h3>
<ul><li>Darius mówi to wprost: konta prop „są wszystkie demo, to nie jest 300 tys. na żywym rynku”. Firmy „nie są tu, żeby nas wspierać, tylko robią biznes”.</li>
<li><b>Skąd biorą pieniądze na wypłaty:</b> według Dariusa głównie z <b>opłat za nieudane wyzwania</b>. Znają statystykę: do pierwszej wypłaty dochodzi niewielu. Opłaty wielu osób pokrywają wypłaty nielicznych.</li>
<li><b>A-book i B-book na propie.</b> Większość traderów jest w B-booku: firma nie wysyła ich zleceń na rynek, bo statystycznie i tak stracą. Zyskownego tradera firma <b>może</b> przenieść do A-booku, czyli kopiować jego transakcje na prawdziwy rynek, zwykle tylko część ryzyka i nie zawsze. Darius: sam podobno był przeniesiony do A-booku na jednym propie forex, „tak mi przynajmniej powiedzieli, nigdy nie wiedziałem, czy to prawda”.</li>
<li>W innym filmie Darius przypomina: większość detalu jest na demo, bo przy propie albo nieregulowanym brokerze „nawet nie jesteś sparowany z dostawcą płynności”. Nikt więc nie „poluje” na Twój stop, bo Twojego zlecenia nie ma na rynku.</li></ul>

<h3>2. To o co chodzi z „futures są lepsze”?</h3>
<p>Przewaga futures w filmach dotyczy <b>danych i ceny</b>, a nie tego, czy Twoje pieniądze trafiają na rynek:</p>
<div class="scroll"><table class="t"><tr><th></th><th>Prop na futures (np. NQ przez Tradovate lub Rithmic, czyli platformy i dostawców danych z CME)</th><th>Prop na CFD (np. FTMO w MT5, czyli MetaTrader 5)</th></tr>
<tr><td>Skąd cena</td><td><b>prawdziwa księga CME</b>, ta sama dla wszystkich uczestników</td><td>kwotowanie brokera albo dostawcy płynności firmy</td></tr>
<tr><td>Order flow (footprint, bąble, heatmapa)</td><td><b>jest</b>, bo dane pochodzą z giełdy</td><td>brak, tylko wolumen tickowy</td></tr>
<tr><td>Twoje zlecenie</td><td>symulowane, ale <b>wobec prawdziwej księgi</b></td><td>symulowane wobec ceny brokera</td></tr>
<tr><td>Spread na newsach</td><td>taki jak na rynku</td><td>ustala broker, często szerszy</td></tr></table></div>
<p>Na futures propie analizujesz i „wykonujesz” na prawdziwych danych rynkowych, choć samo wykonanie jest symulowane. Na CFD propie zarówno dane, jak i cena pochodzą od brokera.</p>

<h3>3. Pułapka symulatora, ważna dla scalpera</h3>
<ul><li><b>Zlecenia limit wypełniają się za łatwo.</b> Symulator zwykle nie zna Twojego miejsca w kolejce FIFO (first in, first out, „pierwszy przyszedł, pierwszy obsłużony”; lekcja 1, sekcja 9.4). Często uznaje limit za wykonany, gdy cena tylko go dotknie. Na prawdziwym rynku byłbyś na końcu kolejki i część takich zleceń by się nie wykonała.</li>
<li><b>Duże zlecenia rynkowe nie przesuwają ceny.</b> W symulacji Twoje 20 kontraktów nie zjada księgi (lekcja 1, sekcja 3), więc nie płacisz poślizgu, który zapłaciłbyś naprawdę.</li>
<li>Wniosek: wynik z propa przenoszony na <b>prawdziwe konto</b> będzie zwykle trochę gorszy, szczególnie przy strategiach z wieloma małymi celami. Faber mówi o tym przy zawodach: bez prawidłowego poślizgu zyskowna strategia może stać się stratna (lekcja 19).</li></ul>

<h3>4. Ryzyko nie znika, tylko przenosi się z rynku na firmę</h3>
<p>Wypłata z propa to <b>prawdziwe pieniądze</b>. Ale Darius wymienia ryzyka, których nie ma na własnym koncie: firma może Cię zbanować, odmówić wypłaty, zmienić platformę albo pogorszyć warunki, gdy jesteś „zbyt zyskowny” albo gdy ma za dużo zyskownych traderów. Firmy upadają i zmieniają regulaminy. Dlatego Darius rozkłada konta na wiele firm i platform naraz.</p>

<h3>5. Jak zarabiają autorzy</h3>
<div class="scroll"><table class="t"><tr><th></th><th>Darius</th><th>Faber</th></tr>
<tr><td>Główne źródło według ich słów</td><td><b>propy</b>: w 2024 r. mówił o 2,2 mln $ kapitału finansowanego i „sześciocyfrowych wypłatach miesięcznie”</td><td><b>własne konta</b>: podia w zawodach Robbins World Cup i CME Equity Cup, czyli na prawdziwych pieniądzach na rachunku futures; „handlowałem na żywo niezliczoną liczbę razy”</td></tr>
<tr><td>Jak tym zarządza</td><td>wiele firm i platform naraz (część kont w Deep Charts, część w MT5); cel: utrzymać konto jak najdłużej przy jak najmniejszym ryzyku</td><td>różny profil ryzyka dla propa, zawodów i konta prywatnego (tabela wyżej)</td></tr>
<tr><td>Biznes poza tradingiem</td><td>mentoring (płatna grupa), współpraca z firmami prop</td><td>współtwórca Deep Charts (platforma, wskaźniki), bootcampy, kursy, Chart Fanatics</td></tr>
<tr><td>Co da się sprawdzić</td><td>nic niezależnie: kwoty to deklaracje z filmów</td><td>rankingi zawodów są publiczne, ale pokazują procent zwrotu w kwartale, a nie całą historię konta</td></tr></table></div>
<p>Żaden z nich nie pokazuje publicznie pełnej historii rachunku. Ile z ich dochodu pochodzi z tradingu, a ile z edukacji i platform, nie wiadomo. To nie zarzut, tylko powód, żeby ich liczby traktować jako <b>hipotezy do sprawdzenia</b>, a nie jako wyniki.</p>
<div class="watch">${yt('zwgzhmEfJi4',0,'Darius · 2,2 mln $ finansowania, wypłaty z propów',122)}${yt('TnEy_tekJ_M',304,'Darius · konta rozłożone na wiele firm i platform',366)}${yt('StaphlRH8NQ',60,'Faber · Robbins Cup, CME Equity Cup, handel na żywo',120)}</div>

<h3>Co z tego wynika dla Ciebie</h3>
<ul><li><b>Order flow czytasz z futures</b> bez względu na to, gdzie wykonujesz transakcje. Dane z CME są prawdziwe także wtedy, gdy Twoje konto jest symulowane.</li>
<li><b>Prop to tani dostęp do dźwigni, a nie dowód umiejętności.</b> Ryzykujesz opłatę, a nie własny kapitał. Prawdziwy test egzekucji (kolejka, poślizg) przychodzi dopiero na własnym koncie albo przy A-booku.</li>
<li><b>Dla OBR na FTMO:</b> wynik z MT5 odzwierciedla cenę i spread FTMO, a nie rynek NQ. Backtest powinien zakładać spread i poślizg nie lepsze niż na koncie, na którym bot faktycznie działa.</li>
<li>Typowa droga, którą opisuje Darius: prop (ryzykujesz opłatę) → regularne wypłaty → ewentualnie własny kapitał. Faber to przykład drogi na własnym rachunku, wspieranej biznesem edukacyjnym.</li></ul>
</section>
<section class="s"><h2>Psychologia bez frazesów</h2>
<ul><li><b>Bezpiecznik</b> (Faber): np. −1% dziennie → koniec dnia, nawet jeśli pojawi się „najlepszy setup”.</li>
<li><b>Stałe ryzyko</b> na każdą transakcję; żadnego podwajania po stratach.</li>
<li><b>66 dni</b> dyscypliny, żeby zbudować nawyk (dziennik, plan sesji, wizualizacja).</li>
<li><b>Dziennik „dlaczego”</b> (Darius): po sesji zaznacz idealny trade i porównaj ze swoim.</li>
<li><b>„Fałszywa psychologia”</b> (Darius): często to problem strategii, która nie adaptuje stopu do zmienności, a nie emocji.</li></ul>
<div class="watch">${yt('0KyIEdvVKMQ',1037,'Faber · psychologiczny bezpiecznik')}${yt('UoFgw05bY9E',1209,'Darius · dziennik „dlaczego”')}</div>
</section>

<section class="s"><h2>Co działa gdzie</h2>

<tr><td>Zasady ryzyka (E, limity, stop dnia po celu)</td><td class="num" style="color:var(--buy)">tak</td><td>łatwe do wbudowania w EA</td></tr></table>
</section>
<section class="s"><h2>Plan pierwszego testu: IVB-lite na MT5</h2>
<ol><li>Instrument i sesja jak w OBR (US indeksy, NY cash).</li>
<li>Range 30 min od otwarcia cash; wariant 15 min dla porównania.</li>
<li>Profil range’u z tick volume: POC, VA 70%.</li>
<li>Trzy warianty wejścia do porównania: (a) pending STOP na wybiciu (obecny OBR), (b) limit na retest krawędzi VA po stronie wybicia, (c) limit na retest POC.</li>
<li>Inwalidacja: zamknięcie M1/M5 po drugiej stronie VA.</li>
<li>Cele: TP1 z Twojego rozkładu wybiegów (np. mediana), runner.</li>

</section>
<section class="s"><h2>Jak ćwiczyć czytanie order flow</h2>
<ul><li><b>Replay</b> w Deep Charts (wyłącz feed → odtwarzanie tick po ticku) albo Market Replay w NinjaTrader 8.</li>
<li>Jeden instrument (Darius: „one pair mastery”), jedno okno czasowe.</li>
<li>Codziennie: zaznacz VAH/VAL/POC przed sesją, zapisz scenariusze, w replayu oznacz każdą absorpcję i akceptację na krawędziach, zapisz, co było dalej.</li>
<li>Po 20 sesjach policz, jak często absorpcja na krawędzi dała ruch do POC. To Twoja własna statystyka zamiast „70/30”.</li></ul>
<div class="watch">${yt('ZyeM9xsXl_k',905,'Darius · jak uczył się w replayu')}${yt('V23EtzSdquc',1920,'Darius · ORB jako baza + order flow')}</div>
</section>
<div class="task"><b>Zadanie (15 min):</b> spisz specyfikację testu IVB-lite (punkty 1–7) dla swojego bota. To gotowy materiał do następnej wersji OBR.</div>`};

W.orderbook=function(el){
  el.innerHTML='<div class="wt">Symulator księgi zleceń</div><div class="ctrls"><button data-a="b25">Kup 25 rynkowo</button><button data-a="b75">Kup 75 rynkowo</button><button data-a="s60">Sprzedaj 60 rynkowo</button><button data-a="r">Reset</button></div><div class="ob"></div><div class="grid2" style="margin-top:10px"><div class="stat"><div class="k">Limity sprzedaży (5 poz. nad)</div><div class="v" data-s="up">0</div></div><div class="stat"><div class="k">Limity kupna (5 poz. pod)</div><div class="v" data-s="dn">0</div></div></div><div class="log">Kliknij zlecenie rynkowe. Czerwone = limity sprzedaży (ask), zielone = limity kupna (bid).</div>';
  let asks,bids,last;
  function reset(){asks={101:33,102:42,103:56,104:61,105:81};bids={99:41,98:30,97:22,96:18,95:11};last=100;draw();}
  function draw(){
    const ob=$('.ob',el);let h='<div class="h">cena</div><div class="h">bid (kupno)</div><div class="h">ask (sprzedaż)</div>';
    const mx=100;
    for(let p=105;p>=95;p--){
      const a=asks[p]||0,b=bids[p]||0;
      h+='<div class="p num'+(p===last?' now':'')+'">'+p+'</div>';
      h+='<div class="cell bid">'+(b?'<i style="width:'+Math.min(100,b/mx*100)+'%"></i><b>'+b+'</b>':'')+'</div>';
      h+='<div class="cell ask">'+(a?'<i style="width:'+Math.min(100,a/mx*100)+'%"></i><b>'+a+'</b>':'')+'</div>';
    }
    ob.innerHTML=h;
    let up=0,dn=0;Object.keys(asks).forEach(k=>up+=asks[k]);Object.keys(bids).forEach(k=>dn+=bids[k]);
    $('[data-s=up]',el).textContent=up;$('[data-s=dn]',el).textContent=dn;
  }
  function market(side,q){
    const book=side==='b'?asks:bids;const keys=Object.keys(book).map(Number).sort((x,y)=>side==='b'?x-y:y-x);
    let left=q,cost=0,lines=[];const best=keys.find(k=>book[k]>0);
    for(const k of keys){if(left<=0)break;const take=Math.min(book[k],left);if(take>0){book[k]-=take;left-=take;cost+=take*k;lines.push(take+' @ '+k);last=k;}if(book[k]===0)delete book[k];}
    const filled=q-left;const avg=filled?cost/filled:0;

};

/* ---- path + profile (AMT) ---- */
function genPath(kind,seed){
  const r=rng(seed),N=240,out=[];let x=100,v=0;
  for(let i=0;i<N;i++){
    let tgt=100,k=0.08,noise=0.55;
    if(kind==='breakout'){if(i>140&&i<190){tgt=100+ (i-140)*0.22;k=0.3;noise=0.35}else if(i>=190){tgt=111;k=0.08}}
    if(kind==='failed'){if(i>=150&&i<164){tgt=105.5;k=0.35;noise=0.3}else if(i>=164&&i<200){tgt=97.5;k=0.12}else if(i>=200){tgt=98.5}}
    if(kind==='pshape'){if(i<50){tgt=92+i*0.2;k=0.5;noise=0.3}else{tgt=102;k=0.1}}
    if(kind==='bshape'){if(i<50){tgt=108-i*0.2;k=0.5;noise=0.3}else{tgt=98;k=0.1}}
    x+=k*(tgt-x)+(r()-0.5)*2*noise;
    if(i===0&&kind==='pshape')x=92; if(i===0&&kind==='bshape')x=108;
    out.push(x);
  }
  return out;
}
W.pathprofile=function(el){
  const SC={balance:['Balans','Cena chodzi w zakresie. Profil ma jeden „brzuch” — kształt D. Graj od krawędzi do środka.'],breakout:['Price discovery','Balans, potem wyjście z akceptacją i nowy balans wyżej. Między nimi zostaje LVN — przyszłe miejsce reakcji.'],failed:['Nieudana aukcja','Wybicie nad VAH bez akceptacji: cena wraca do wartości i przechodzi na drugą stronę. To, co ICT nazwie „sweepem”.'],pshape:['Profil P','Szybki ruch w górę (mało wolumenu), potem balans wysoko. Wartość przesunęła się w górę.']};

  let kind='balance';const holder=$('.cv',el);const cv=canvasIn(holder);
  function draw(){
    const path=genPath(kind,kind.length*7+3);const t=+$('#pp_t',el).value;$('.v',el).textContent=t+'/240';
    const {c,w,h}=prep(cv,300);const lo=88,hi=114,step=0.5,nb=Math.round((hi-lo)/step)+1;const bins=new Array(nb).fill(0);
    for(let i=0;i<t;i++){const b=Math.round((path[i]-lo)/step);if(b>=0&&b<nb)bins[b]++;}
    const va=valueArea(bins);const Y=p=>h-18-(p-lo)/(hi-lo)*(h-30);const pw=w*0.68;
    c.clearRect(0,0,w,h);c.fillStyle=css('--va');c.globalAlpha=.55;c.fillRect(0,Y(lo+va.hi*step+step/2),w,Y(lo+va.lo*step-step/2)-Y(lo+va.hi*step+step/2));c.globalAlpha=1;
    c.strokeStyle=css('--line');c.lineWidth=1;for(let p=90;p<=112;p+=4){c.beginPath();c.moveTo(0,Y(p));c.lineTo(w,Y(p));c.stroke();}
    c.strokeStyle=css('--fg');c.lineWidth=1.6;c.beginPath();for(let i=0;i<t;i++){const X=i/239*(pw-10)+4;i?c.lineTo(X,Y(path[i])):c.moveTo(X,Y(path[i]));}c.stroke();
    const mx=Math.max(...bins);const bh=(h-30)/(nb)*0.9;
    for(let b=0;b<nb;b++){const len=bins[b]/mx*(w-pw-20);c.fillStyle=b===va.poc?css('--poc'):(b>=va.lo&&b<=va.hi?css('--accent'):css('--muted'));c.globalAlpha=b>=va.lo&&b<=va.hi?.85:.45;c.fillRect(pw+10,Y(lo+b*step)-bh/2,len,bh);}
    c.globalAlpha=1;
    const lines=[['VAH',lo+va.hi*step,css('--accent')],['POC',lo+va.poc*step,css('--poc')],['VAL',lo+va.lo*step,css('--accent')]];
    c.font='600 12px '+css('--mono');lines.forEach(([n,p,col])=>{c.strokeStyle=col;c.setLineDash([5,4]);c.beginPath();c.moveTo(0,Y(p));c.lineTo(w,Y(p));c.stroke();c.setLineDash([]);c.fillStyle=col;c.fillText(n+' '+p.toFixed(1),6,Y(p)-4);});
    const lp=path[t-1],vah=lo+va.hi*step,val=lo+va.lo*step;let where=lp>vah?'nad VAH — sprawdź, czy wybicie jest akceptowane':(lp<val?'pod VAL — sprawdź, czy wybicie jest akceptowane':'w value area');
    $('.cap',el).innerHTML='<b>'+SC[kind][0]+'.</b> '+SC[kind][1]+' <span class="mono">Ostatnia cena '+lp.toFixed(1)+': '+where+'.</span>';
  }
  $('[data-g=sc]',el).addEventListener('click',e=>{const k=e.target.dataset.k;if(!k)return;kind=k;$$('[data-g=sc] button',el).forEach(b=>b.classList.toggle('on',b.dataset.k===k));draw();});

W.heatmap=function(el){
  const PT={wall:['Ściana i absorpcja','Gruba ściana limitów sprzedaży. Kupujący atakują dwa razy (bąble), zostają zaabsorbowani, cena wraca. Stop dla shorta: nad ścianą. Cel: skupisko kupna niżej.'],

  grill:['Grill','Kilka poziomów limitów sprzedaży zjadanych jeden po drugim przez kupujących. Każdy zjedzony poziom = miejsce na częściową realizację; przy grubym skupisku ruch się wyczerpuje.'],
  spoof:['Spoofing','Pod ceną pojawia się ogromny limit kupna. Gdy cena się zbliża — znika i cena spada przez ten poziom. Dlatego Darius nazywa L2 „pokerem”.']};

  let k='wall';const holder=$('.cv',el);const cv=canvasIn(holder);
  function scene(){const T=120,P=60,r=rng(k.length*13);const L=[];for(let t=0;t<T;t++){L.push(new Array(P).fill(0).map(()=>r()*0.12));}const path=[],bub=[];let p=25;
    const add=(lv,t0,t1,val)=>{for(let t=t0;t<t1;t++)for(let d=-1;d<=1;d++)if(L[t][lv+d]!==undefined)L[t][lv+d]=Math.max(L[t][lv+d],val*(d?0.55:1));};
    if(k==='wall'){add(42,0,T,1);add(14,0,T,0.7);for(let t=0;t<T;t++){const tgt=t<40?38:(t<55?41:(t<70?36:(t<85?40.5:(t<120?20:20))));p+=0.18*(tgt-p)+(r()-0.5);path.push(p);}bub.push([52,41,'b'],[82,40.5,'b'],[88,37,'s']);}
    if(k==='reload'){add(30,0,48,1);add(29,52,T,0.85);add(48,0,T,0.9);for(let t=0;t<T;t++){const tgt=t<35?26:(t<50?33:(t<65?33.5:(t<78?30.5:46)));p+=0.2*(tgt-p)+(r()-0.5)*0.8;path.push(p);}bub.push([45,31,'b'],[76,30.5,'b'],[90,38,'b']);}
    if(k==='grill'){const lv=[32,36,40,44];const eat=[35,55,75,95];lv.forEach((l,i)=>add(l,0,eat[i],0.9));add(52,0,T,1);for(let t=0;t<T;t++){const step=eat.filter(e=>t>e).length;const tgt=28+step*4.2+(t>100?4:0);p+=0.15*(tgt-p)+(r()-0.5)*0.7;path.push(p);}eat.forEach((e,i)=>bub.push([e,lv[i],'b']));}
    if(k==='spoof'){add(15,20,70,1);add(40,0,T,0.6);for(let t=0;t<T;t++){const tgt=t<70?(26-t*0.12):(t<100?12:10);p+=0.2*(tgt-p)+(r()-0.5)*0.8;path.push(p);}bub.push([78,14,'s']);}
    return {T,P,L,path,bub};}
  function draw(){const {c,w,h}=prep(cv,280);const s=scene();const cwid=w/s.T,ch=h/s.P;const h0=css('--heat0'),h1=css('--heat1'),h2=css('--heat2');
    c.fillStyle=h0;c.fillRect(0,0,w,h);
    for(let t=0;t<s.T;t++)for(let q=0;q<s.P;q++){const v=s.L[t][q];if(v<0.15)continue;c.fillStyle=v>0.75?h2:h1;c.globalAlpha=Math.min(1,v);c.fillRect(t*cwid,h-(q+1)*ch,cwid+0.5,ch+0.5);}
    c.globalAlpha=1;c.strokeStyle='#ffffff';c.lineWidth=1.6;c.beginPath();s.path.forEach((p,t)=>{const X=t*cwid,Y=h-p*ch;t?c.lineTo(X,Y):c.moveTo(X,Y);});c.stroke();

    $('.cap',el).innerHTML='<b>'+PT[k][0]+'.</b> '+PT[k][1]+' <span class="mono">Biała linia = cena, pasy = limity, kółka = duże transakcje.</span>';}
  $('[data-g=h]',el).addEventListener('click',e=>{if(e.target.dataset.k){k=e.target.dataset.k;$$('[data-g=h] button',el).forEach(b=>b.classList.toggle('on',b===e.target));draw();}});
  draw();new ResizeObserver(()=>draw()).observe(holder);
};
