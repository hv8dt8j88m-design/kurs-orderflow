LESSONS.D3={title:'Darius 3: delta, profil delty i dywergencja CVD',time:'',goals:['wyjaśnić, czym jest delta i dwa sposoby jej czytania','wykorzystać profil delty do znalezienia poziomów, na które strona wraca','rozpoznać dywergencję CVD (skumulowanej delty) i wiedzieć, czemu to nie jest samodzielny sygnał'],
html:`
<div class="tip"><b>Darius, film 41:31–51:38: delta.</b> Krótka lekcja, rozwinięcie lekcji 6 (CVD).</div>
<div class="utoc" data-utoc="1"></div>
<section class="s unit" data-unit="1"><div class="unit-nr">Jednostka 1 z 2</div><h2>Profil delty: gdzie dana strona była najbardziej agresywna</h2>
<div class="unit-tools"></div>
<p><b>Delta</b> = agresywne kupno minus agresywna sprzedaż. Darius czyta ją na dwa sposoby: <b>na poziomie ceny</b> (footprint albo profil delty po lewej stronie profilu wolumenu) i <b>na świecy</b> (delta pionowa). Żeby nie przytłoczyć, bierze dwa najprostsze narzędzia.</p>
<p><b>Profil delty.</b> Po lewej stronie profilu wolumenu każdy poziom ma słupek delty: zielony w prawo (przewaga kupna agresywnego), czerwony (przewaga sprzedaży). Interesują go <b>duże</b> słupki. Mała delta może mieć znaczenie, ale tylko w kontekście małego wolumenu.</p>
<ul><li>Duża ujemna delta na poziomie = tam sprzedający byli mocno zainteresowani. Darius rysuje tam linię.</li><li>Gdy potem włącza bąble, pojawiają się <b>wokół tych poziomów</b>: sprzedający wracają przy „swojej” delcie, kupujący przy swojej.</li><li>Wniosek: profil delty pokazuje poziomy, na których dana strona może się <b>przeładować</b> (dołożyć).</li></ul>
<div class="watch">${yt('qEGrb1-GNxo',2491,'Darius · delta: na poziomie i na świecy',2612)}${yt('qEGrb1-GNxo',2612,'Darius · profil delty: poziomy przeładowania',2732)}</div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Co pokazuje duża ujemna delta na jednym poziomie profilu?</p><details><summary>Pokaż odpowiedź</summary><p>Że tam sprzedający byli najbardziej agresywni. To poziom, na którym mogą wrócić (przeładować się).</p></details></div><div class="rq"><p class="q">Czy mała delta jest bez znaczenia?</p><details><summary>Pokaż odpowiedź</summary><p>Nie zawsze. W kontekście małego wolumenu mała delta też może być istotna.</p></details></div><div class="rq"><p class="q">Jakie dwa sposoby czytania delty pokazuje Darius?</p><details><summary>Pokaż odpowiedź</summary><p>Na poziomie ceny (footprint, profil delty) i na świecy (delta pionowa, CVD).</p></details></div></div>
</section>
<section class="s unit" data-unit="2"><div class="unit-nr">Jednostka 2 z 2</div><h2>Dywergencja CVD</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 1 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Co pokazuje duża ujemna delta na jednym poziomie profilu?</p><details><summary>Pokaż odpowiedź</summary><p>Że tam sprzedający byli najbardziej agresywni. To poziom, na którym mogą wrócić (przeładować się).</p></details></div><div class="rq"><p class="q">Czy mała delta jest bez znaczenia?</p><details><summary>Pokaż odpowiedź</summary><p>Nie zawsze. W kontekście małego wolumenu mała delta też może być istotna.</p></details></div></div>
<p><b>CVD (cumulative volume delta)</b> to skumulowana delta, u Dariusa pokazana jako świece pod wykresem. Sprawdzasz, czy świece CVD <b>pasują</b> do świec ceny.</p>
<div class="scroll"><svg viewBox="0 0 660 310" role="img" aria-label="Dywergencja CVD: cena niższy dołek, CVD wyższy dołek" style="max-width:660px;width:100%"><g style="font:12px var(--body,sans-serif)"><text x="20" y="18" style="fill:var(--fg);font-weight:700">Cena</text><text x="20" y="168" style="fill:var(--fg);font-weight:700">CVD (skumulowana delta)</text><polyline points="40,60 110,110 170,80 260,135 330,95 420,150 470,120" style="fill:none;stroke:var(--fg);stroke-width:2"/><line x1="260" y1="135" x2="420" y2="150" style="stroke:var(--sell);stroke-dasharray:4 3"/><text x="430" y="160" style="fill:var(--sell)">niższy dołek</text><polyline points="40,200 110,250 170,225 260,270 330,235 420,255 470,225" style="fill:none;stroke:var(--accent);stroke-width:2"/><line x1="260" y1="270" x2="420" y2="255" style="stroke:var(--buy);stroke-dasharray:4 3"/><text x="430" y="275" style="fill:var(--buy)">wyższy dołek</text><text x="20" y="300" style="fill:var(--muted)">Cena robi niższy dołek, sprzedaż agresywna już nie: dywergencja = możliwe odwrócenie (absorpcja sprzedających).</text></g></svg></div>
<ul><li><b>Zgodność</b>: cena w dół i CVD w dół = agresja sprzedających zaakceptowana, kontynuacja.</li><li><b>Dywergencja</b>: np. CVD robi wyższe szczyty i dołki, a cena niższe. Wysiłek idzie w jedną stronę, rezultat w drugą. To <b>absorpcja</b> i potencjał odwrócenia.</li><li><b>Przy dużych odwróceniach</b> zwykle widać dywergencję. Ale Darius sam ostrzega: nie zawsze, bywa trudna do zauważenia i daje fałszywe sygnały. Potrzebne doświadczenie.</li><li><b>Jak tego używa:</b> nie wchodzi w chwili zauważenia dywergencji. Czeka, aż wszystko się zgodzi (lokalizacja, bąble, świeca), i wchodzi, gdy CVD i cena znowu idą razem w nowym kierunku.</li></ul>
<div class="watch">${yt('qEGrb1-GNxo',2732,'Darius · CVD jako świece, zgodność',2913)}${yt('qEGrb1-GNxo',2913,'Darius · dywergencje CVD na przykładach',3098)}</div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Cena niższy dołek, CVD wyższy dołek. Co to sugeruje?</p><details><summary>Pokaż odpowiedź</summary><p>Dywergencję: sprzedaż agresywna słabnie albo jest absorbowana. Możliwe odwrócenie w górę.</p></details></div><div class="rq"><p class="q">Wchodzisz od razu, gdy widzisz dywergencję?</p><details><summary>Pokaż odpowiedź</summary><p>Nie. Darius czeka na pozostałe potwierdzenia i na moment, gdy cena i CVD znowu idą razem w nowym kierunku.</p></details></div><div class="rq"><p class="q">Co znaczy zgodność ceny i CVD?</p><details><summary>Pokaż odpowiedź</summary><p>Że agresja jest akceptowana: wysiłek daje rezultat, raczej kontynuacja.</p></details></div></div>
</section>
`};
LESSONS.D4={title:'Darius 4: profil wolumenu w praktyce, kształty i LVN',time:'',goals:['rozpoznać kształty profilu P, b i D i wiedzieć, co mówią o dniu','wyjaśnić, dlaczego cena wraca do LVN (poziomu z małym wolumenem) i co robi po powrocie','użyć profilu od początku swingu i zbiegu LVN z VAL jako miejsca wejścia'],
html:`
<div class="tip"><b>Darius, film 51:38–1:05:50: profil wolumenu, oraz krótki film Fabera.</b> Rozwinięcie lekcji 3–4. Moduł 6 filmu (1:05:50–1:26:10, aukcja: Mona Lisa, jabłka, nieudana aukcja) to powtórka lekcji 2. Możesz go obejrzeć dla utrwalenia:<div class="watch">${yt('qEGrb1-GNxo',3950,'Darius · moduł 6: aukcja (powtórka L2)',5170)}</div>
</div>

<section class="s unit" data-unit="1"><div class="unit-nr">Jednostka 1 z 2</div><h2>Kształty profilu i powrót do LVN</h2>
<div class="unit-tools"></div>
<p>Profil wolumenu opiera się na <b>rozkładzie normalnym</b> (krzywej dzwonowej). Darius porównuje to do wyników testu IQ: najwięcej ludzi jest w środku, mało na krańcach. Na rynku środek to VA (value area, obszar wartości z ok. 70% wolumenu), czyli wartość uczciwa i akceptowana. Ważne poziomy to VAH, VAL i POC (point of control, poziom z największym wolumenem).</p>
<div class="scroll"><svg viewBox="0 0 660 225" role="img" aria-label="Kształty profilu wolumenu: P, b i D" style="max-width:660px;width:100%"><g style="font:12px var(--body,sans-serif)"><text x="20" y="18" style="fill:var(--fg);font-weight:700">Kształt P</text><text x="20" y="34" style="fill:var(--muted)">wartość wysoko</text><rect x="20" y="48" width="112" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="62" width="128" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="76" width="144" height="12" style="fill:var(--poc);opacity:.6"/><rect x="20" y="90" width="144" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="104" width="128" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="118" width="112" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="132" width="96" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="146" width="80" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="160" width="64" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="174" width="48" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="188" width="48" height="12" style="fill:var(--muted);opacity:.6"/><rect x="20" y="202" width="32" height="12" style="fill:var(--muted);opacity:.6"/><text x="235" y="18" style="fill:var(--fg);font-weight:700">Kształt b</text><text x="235" y="34" style="fill:var(--muted)">wartość nisko</text><rect x="235" y="48" width="32" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="62" width="48" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="76" width="48" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="90" width="64" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="104" width="80" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="118" width="96" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="132" width="112" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="146" width="128" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="160" width="144" height="12" style="fill:var(--poc);opacity:.6"/><rect x="235" y="174" width="144" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="188" width="128" height="12" style="fill:var(--muted);opacity:.6"/><rect x="235" y="202" width="112" height="12" style="fill:var(--muted);opacity:.6"/><text x="450" y="18" style="fill:var(--fg);font-weight:700">Kształt D</text><text x="450" y="34" style="fill:var(--muted)">balans</text><rect x="450" y="48" width="32" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="62" width="48" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="76" width="80" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="90" width="112" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="104" width="144" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="118" width="160" height="12" style="fill:var(--poc);opacity:.6"/><rect x="450" y="132" width="160" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="146" width="144" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="160" width="112" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="174" width="80" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="188" width="48" height="12" style="fill:var(--muted);opacity:.6"/><rect x="450" y="202" width="32" height="12" style="fill:var(--muted);opacity:.6"/></g></svg></div>
<ul><li><b>P</b>: cena mocno poszła w górę i tam zbudowała wartość. Pod spodem cienki „ogon”.</li><li><b>b</b>: odwrotnie, gwałtowny spadek i wartość na dole.</li><li><b>D</b>: cały dzień w balansie.</li></ul>
<p><b>LVN (low volume node, poziom z małym wolumenem)</b> to według Dariusa „prawdziwe FVG” (fair value gap, luka z ICT). Rynek lubi wracać do LVN, żeby je przebalansować. Zamiast rysować dziesięć luk, masz jeden czy dwa punkty z danych. Po dotknięciu LVN są dwie możliwości: powrót do wartości albo przebicie i dalsze szukanie ceny (price discovery). Rozstrzyga order flow.</p>
<p><b>Jak grać kształty:</b> balans (D) traktuj neutralnie, wybicie może pójść w obie strony. Po P albo b najczęściej jest <b>kontynuacja</b> w kierunku historii, ale możliwe jest też zaakceptowanie nowej wartości i powrót. W obszarze dużego wolumenu cena „utyka”, w obszarze małego przechodzi szybko, a <b>na najniższym LVN</b> może się zatrzymać, bo tam obie strony mogą się zaangażować.</p>
<div class="watch">${yt('qEGrb1-GNxo',3098,'Darius · krzywa dzwonowa, LVN = prawdziwe FVG',3342)}${yt('qEGrb1-GNxo',3464,'Darius · kształty P, b, D i jak je grać',3710)}${yt('qEGrb1-GNxo',3710,'Darius · przykłady na wykresie złota',3950)}</div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Co oznacza profil w kształcie b?</p><details><summary>Pokaż odpowiedź</summary><p>Gwałtowny spadek i zbudowanie wartości nisko. Najczęściej kontynuacja w dół, choć możliwy powrót.</p></details></div><div class="rq"><p class="q">Dlaczego Darius nazywa LVN „prawdziwym FVG”?</p><details><summary>Pokaż odpowiedź</summary><p>Bo to luka potwierdzona danymi (mało transakcji), a nie narysowana ze świec. Zwykle jest jeden czy dwa takie poziomy zamiast wielu luk.</p></details></div><div class="rq"><p class="q">Co może się stać po powrocie ceny do LVN?</p><details><summary>Pokaż odpowiedź</summary><p>Odbicie z powrotem do wartości albo przebicie i dalsze price discovery. Rozstrzyga order flow przy LVN.</p></details></div></div>
</section>
<section class="s unit" data-unit="2"><div class="unit-nr">Jednostka 2 z 2</div><h2>Profil od swingu i wejście na zbiegu LVN z VAL (Faber)</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 1 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Co oznacza profil w kształcie b?</p><details><summary>Pokaż odpowiedź</summary><p>Gwałtowny spadek i zbudowanie wartości nisko. Najczęściej kontynuacja w dół, choć możliwy powrót.</p></details></div><div class="rq"><p class="q">Dlaczego Darius nazywa LVN „prawdziwym FVG”?</p><details><summary>Pokaż odpowiedź</summary><p>Bo to luka potwierdzona danymi (mało transakcji), a nie narysowana ze świec. Zwykle jest jeden czy dwa takie poziomy zamiast wielu luk.</p></details></div></div>
<p>Krótki film Fabera (Chart Fanatics) dokłada jedną praktyczną rzecz: <b>profil rysowany od początku do końca swingu</b>, a nie od początku sesji.</p>

90,120 340,80 400,55" style="fill:none;stroke:var(--fg);stroke-width:2"/><circle cx="235" cy="160" r="9" style="fill:var(--buy);opacity:.6"/><circle cx="222" cy="158" r="7" style="fill:var(--buy);opacity:.6"/><line x1="200" y1="180" x2="280" y2="180" style="stroke:var(--sell);stroke-width:2"/><text x="285" y="184" style="fill:var(--sell)">stop pod świecą (ok. 160 $)</text><line x1="330" y1="52" x2="410" y2="52" style="stroke:var(--buy);stroke-width:2"/><text x="290" y="30" style="fill:var(--buy)">cel (ok. 500 $)</text><text x="40" y="215" style="fill:var(--muted)">Kupujący znów agresywni przy LVN = VAL, sprzedający absorbowani → wejście long.</text></g></svg></div>
<ol><li><b>Akumulacja:</b> z poziomu startowego kupujący raz za razem wchodzą agresywnie, a sprzedający, którzy próbują zepchnąć cenę, są „anihilowani”.</li><li><b>Profil od swingu</b>: wolumen jest rozłożony równo, a od pewnego miejsca robi się mały. Powstaje nowy zakres (dealing range).</li><li><b>Lokalizacja:</b> szukasz miejsca, gdzie <b>LVN pokrywa się z VAL</b>. Dwa niezależne powody, by cena tam zareagowała.</li><li><b>Wejście</b> po świecy potwierdzenia, stop pod nią. U Fabera ok. <b>160 $ ryzyka na kontrakt przy celu ok. 500 $</b>, czyli ok. 1:3.</li></ol>
<p>To deklaracja z krótkiego filmu promocyjnego, bez statystyki. Pokazuje jednak, jak łączyć dwie warstwy lokalizacji.</p>

LESSONS.D5={title:'Darius 5: model 3 kroków i ryzyko pod konto prop',time:'',goals:['przejść model kontekst → lokalizacja → potwierdzenie','rozpisać scenariusze dnia na VAH, VAL, POC i LVN','policzyć, jaki odsetek wygranych jest potrzebny przy RR 1:1,5 i 1:2'],
html:`
<div class="tip"><b>Darius, film 1:26:10–1:48:26: model 3 kroków i zarządzanie ryzykiem.</b> Rozwinięcie lekcji 8 (model 3 kroków).</div>
<div class="utoc" data-utoc="1"></div>
<section class="s unit" data-unit="1"><div class="unit-nr">Jednostka 1 z 2</div><h2>Kontekst, lokalizacja, potwierdzenie</h2>
<div class="unit-tools"></div>
<ol><li><b>Kontekst:</b> jedno pytanie, czy rynek jest w <b>balansie</b>, czy w <b>nierównowadze</b> (cena kierunkowa). Bywa też krótki balans wewnątrz nierównowagi. Narzędzia: TPO (time price opportunity, profil czasu) i profil wolumenu razem.</li><li><b>Lokalizacja:</b> VAH, VAL, nieudana aukcja, LVN i HVN (high volume node, poziom z dużym wolumenem). LVN to miejsca wejścia albo cele. HVN i POC traktuje jak cele, a HVN nazywa „zamiennikiem order blocka”. Typowe błędy: price action ma lokalizację bez kontekstu, a order flow często ma kontekst, ale nie czeka na lokalizację.</li><li><b>Potwierdzenie:</b> bąble, CVD, heatmapa, footprint, czyli absorpcja, agresja, wyczerpanie, ścieżka najmniejszego oporu.</li></ol>
<p><b>Heatmapa jako nawigator:</b> szukaj transakcji w kierunku, w którym stoi płynność. Jeśli szukasz longa, a całe skupisko limitów jest pod ceną, szansa na spadek jest duża. Cele stawiaj przy skupiskach.</p>
<div class="scroll"><svg viewBox="0 0 660 300" role="img" aria-label="Scenariusze dnia: VAH, VAL, POC i LVN" style="max-width:660px;width:100%"><g style="font:12px var(--body,sans-serif)"><rect x="60" y="90" width="420" height="120" style="fill:var(--va);opacity:.6"/><line x1="60" y1="150" x2="480" y2="150" style="stroke:var(--poc);stroke-width:1.5"/><text x="490" y="154" style="fill:var(--poc)">POC</text><text x="490" y="94" style="fill:var(--muted)">VAH</text><text x="490" y="214" style="fill:var(--muted)">VAL</text><rect x="60" y="30" width="420" height="18" style="fill:var(--sell);opacity:.18"/><text x="490" y="44" style="fill:var(--sell)">LVN</text><line x1="120" y1="205" x2="120" y2="98" style="stroke:var(--buy);stroke-width:2.5"/><circle cx="120" cy="98" r="4" style="fill:var(--buy)"/><text x="128" y="151" style="fill:var(--fg);font-weight:700">1</text><line x1="200" y1="95" x2="200" y2="205" style="stroke:var(--sell);stroke-width:2.5"/><circle cx="200" cy="205" r="4" style="fill:var(--sell)"/><text x="208" y="150" style="fill:var(--fg);font-weight:700">2</text><line x1="280" y1="95" x2="280" y2="50" style="stroke:var(--buy);stroke-width:2.5"/><circle cx="280" cy="50" r="4" style="fill:var(--buy)"/><text x="288" y="72" style="fill:var(--fg);font-weight:700">3</text><line x1="350" y1="45" x2="350" y2="148" style="stroke:var(--sell);stroke-width:2.5"/><circle cx="350" cy="148" r="4" style="fill:var(--sell)"/><text x="358" y="96" style="fill:var(--fg);font-weight:700">4</text><line x1="430" y1="205" x2="430" y2="265" style="stroke:var(--sell);stroke-width:2.5"/><circle cx="430" cy="265" r="4" style="fill:var(--sell)"/><text x="438" y="235" style="fill:var(--fg);font-weight:700">5</text><text x="20" y="290" style="fill:var(--muted)">1: od VAL do VAH · 2: od VAH do VAL · 3: wybicie VAH do LVN · 4: z LVN do POC · 5: wybicie VAL w dół</text></g></svg></div>
<p><b>Przykład z filmu (kontekst spadkowy, wartość schodzi dzień po dniu):</b> 1) od VAL do VAH, gdy dzień jest w balansie; 2) od VAH do VAL; 3) wybicie VAH z potwierdzeniem i cel w LVN nad wartością; 4) short z LVN do POC; 5) wybicie VAL. Przy wybiciu poziomy dużej delty kupna pod VAL muszą zostać <b>unieważnione</b> (sprzedający zamykają się pod nimi). Za najlepsze uważa transakcje zgodne z kontekstem: short z LVN na górze i wybicie VAL w dół. POC służy mu jako miejsce częściowej realizacji zysku, a nie wejścia.</p>
<div class="watch">${yt('qEGrb1-GNxo',5170,'Darius · krok 1 kontekst, krok 2 lokalizacja',5470)}${yt('qEGrb1-GNxo',5470,'Darius · potwierdzenie, heatmapa jako nawigator',5655)}${yt('qEGrb1-GNxo',5655,'Darius · scenariusze dnia na przykładzie',6142)}</div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Jakie jedno pytanie zadajesz w kroku „kontekst”?</p><details><summary>Pokaż odpowiedź</summary><p>Czy rynek jest w balansie, czy w nierównowadze (kierunkowy).</p></details></div><div class="rq"><p class="q">Do czego Darius używa HVN i POC?</p><details><summary>Pokaż odpowiedź</summary><p>Głównie jako celów (TP). Nie wchodzi z nich.</p></details></div><div class="rq"><p class="q">Szukasz longa, ale całe skupisko limitów na heatmapie jest pod ceną. Co mówi Darius?</p><details><summary>Pokaż odpowiedź</summary><p>Że to słaby pomysł: płynność stoi przeciw kierunkowi, więc szansa na spadek jest duża.</p></details></div></div>
</section>
<section class="s unit" data-unit="2"><div class="unit-nr">Jednostka 2 z 2</div><h2>Ryzyko pod konto prop i uczciwa matematyka</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 1 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Jakie jedno pytanie zadajesz w kroku „kontekst”?</p><details><summary>Pokaż odpowiedź</summary><p>Czy rynek jest w balansie, czy w nierównowadze (kierunkowy).</p></details></div><div class="rq"><p class="q">Do czego Darius używa HVN i POC?</p><details><summary>Pokaż odpowiedź</summary><p>Głównie jako celów (TP). Nie wchodzi z nich.</p></details></div></div>
<p>Darius dopasowuje stosunek zysku do ryzyka (RR) do zasad konta prop (firmy finansującej):</p>
<table class="t"><tr><th>Konto</th><th>Dopuszczalne obsunięcie</th><th>Cel</th><th>RR, który proponuje</th></tr><tr><td>50k</td><td>ok. 2 000 $</td><td>3 000 $</td><td>1:1,5</td></tr><tr><td>100k</td><td>ok. 3 000 $</td><td>6 000 $</td><td>1:2</td></tr></table>
<p>Stop dobierasz do sytuacji (200, 300, 400 ticków…), ważne, żeby utrzymać stosunek. Gdy strefa jest szeroka, możesz poczekać na potwierdzenie i dać mniejszy stop.</p>
<div class="warnbox"><b>Uwaga, tu Darius się myli.</b> Mówi, że przy RR 1:1,5 albo 1:2 „wygrasz z definicji”, bo zyski są większe od strat. To nieprawda. Przy RR 1:R próg opłacalności (bez kosztów) to <b>1 / (1 + R)</b>:<ul><li>1:1 → potrzebujesz ponad 50% wygranych,</li><li>1:1,5 → ponad 40%,</li><li>1:2 → ponad 33,3%.</li></ul>Do tego dochodzą koszty (prowizja, spread, poślizg), które podnoszą próg. Sam RR niczego nie gwarantuje. Zarabiasz tylko wtedy, gdy Twoja trafność jest wyraźnie powyżej progu.</div>
<p>Uwaga: w tym fragmencie jest też reklama firmy prop (IQ Capital), z którą Darius współpracuje.</p>
<div class="watch">${yt('qEGrb1-GNxo',6142,'Darius · ryzyko i RR pod konta prop',6506)}</div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Jaki minimalny odsetek wygranych potrzebujesz przy RR 1:2 (bez kosztów)?</p><details><summary>Pokaż odpowiedź</summary><p>Ponad 33,3%, bo 1 / (1 + 2) = 1/3.</p></details></div><div class="rq"><p class="q">Czy przy RR 1:1,5 „wygrywasz z definicji”?</p><details><summary>Pokaż odpowiedź</summary><p>Nie. Potrzebujesz ponad 40% wygranych, a z kosztami trochę więcej.</p></details></div><div class="rq"><p class="q">Jak Darius dobiera RR?</p><details><summary>Pokaż odpowiedź</summary><p>Do zasad konta prop: dla 50k ok. 1:1,5 (obsunięcie 2k, cel 3k), dla 100k ok. 1:2 (3k i 6k).</p></details></div></div>
</section>
`};
LESSONS.D6={title:'Darius 6: sesja na żywo, Azja, Frankfurt i Londyn',time:'',goals:['przejść z Dariusem przygotowanie dnia po sesji azjatyckiej','prześledzić trzy transakcje: long nad VAH, short po nieudanej aukcji, short na otwarciu Londynu','wiedzieć, dlaczego przesuwa stop na BE w jednej transakcji, a w innej nie'],
html:`
<div class="tip"><b>Darius, film 1:48:26–2:09:42: sesja na żywo na złocie (GC, kontrakt futures na złoto), część 1.</b> Uczciwy plus: pokazuje też transakcję zamkniętą na zero i niedobity TP. Godziny w filmie są w strefie czasowej Dariusa.</div>
<div class="utoc" data-utoc="1"></div>
<section class="s unit" data-unit="1"><div class="unit-nr">Jednostka 1 z 2</div><h2>Przygotowanie dnia i pierwsza transakcja (Frankfurt)</h2>
<div class="unit-tools"></div>
<div class="scroll"><svg viewBox="0 0 660 230" role="img" aria-label="Dzień Dariusa na złocie: Azja, Frankfurt, Londyn" style="max-width:660px;width:100%"><g style="font:12px var(--body,sans-serif)"><rect x="20" y="24" width="150" height="170" rx="4" style="fill:var(--soft)"/><text x="24" y="18" style="fill:var(--muted)">Azja</text><rect x="175" y="24" width="140" height="170" rx="4" style="fill:var(--soft)"/><text x="179" y="18" style="fill:var(--muted)">Frankfurt</text><rect x="320" y="24" width="140" height="170" rx="4" style="fill:var(--soft)"/><text x="324" y="18" style="fill:var(--muted)">Londyn</text><rect x="465" y="24" width="180" height="170" rx="4" style="fill:var(--soft)"/><text x="469" y="18" style="fill:var(--muted)">Nowy Jork</text><circle cx="60" cy="150" r="6" style="fill:var(--muted)"/><text x="70" y="154" style="fill:var(--fg)">balans po Azji</text><circle cx="200" cy="90" r="6" style="fill:var(--warn)"/><text x="210" y="94" style="fill:var(--fg)">1. long nad VAH → BE</text><circle cx="250" cy="150" r="6" style="fill:var(--buy)"/><text x="260" y="154" style="fill:var(--fg)">2. short do VAL</text><circle cx="350" cy="175" r="6" style="fill:var(--buy)"/><text x="360" y="179" style="fill:var(--fg)">3. short, TP w min.</text></g></svg></div>
<p><b>Przygotowanie (koniec Azji, ok. 6:00):</b> dwa wykresy. Po lewej TPO i profil wolumenu, po prawej M1 (wykres 1-minutowy) z order flow. Poprzedni dzień był mocno nierównowagowy (gwałtowny spadek, duży LVN nad ceną). Dziś Azja stoi w balansie. Kontekst ogólny: lekko spadkowy, ale „nie żeni się z analizą”. Scenariusze: powrót do LVN i reakcja w dół albo przebicie w górę; z drugiej strony wybicie VAL poprzedniego dnia i spadek.</p>
<p><b>Transakcja 1, long nad VAH (Frankfurt):</b> wolumen kupna, CVD zgodne, zamknięcie nad VAH, dużo dodatniej delty. Wchodzi 1 kontraktem złota, stop pod sytuacją, cel ok. 1:1,5 albo początek LVN (28,6). Ostrzeżenie: <b>szczyt Azji</b>. Według niego wybicie ponad szczyt Azji w balansie często kończy się nieudaną aukcją. To jego obserwacja, bez liczb. Gdy CVD słabnie, a cena jest nad szczytem Azji, przesuwa stop na <b>BE</b> (break even, cenę wejścia). Wybija go na zero.</p>
<div class="watch">${yt('qEGrb1-GNxo',6506,'Darius · przygotowanie po Azji: TPO, profil, scenariusze',6866)}${yt('qEGrb1-GNxo',6866,'Darius · long nad VAH, szczyt Azji, BE',7116)}</div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Dlaczego Darius przesunął stop na BE w pierwszej transakcji?</p><details><summary>Pokaż odpowiedź</summary><p>Bo CVD zaczęło słabnąć, a cena była nad szczytem Azji, gdzie według niego często kończy się nieudaną aukcją.</p></details></div><div class="rq"><p class="q">Jakie dwa wykresy ma otwarte?</p><details><summary>Pokaż odpowiedź</summary><p>TPO i profil wolumenu (kontekst, lokalizacja) oraz M1 z order flow (potwierdzenie).</p></details></div><div class="rq"><p class="q">Jaki był kontekst dnia?</p><details><summary>Pokaż odpowiedź</summary><p>Poprzedni dzień mocno nierównowagowy w dół, dziś balans w Azji. Lekko spadkowy, ale bez przywiązania do jednego scenariusza.</p></details></div></div>
</section>
<section class="s unit" data-unit="2"><div class="unit-nr">Jednostka 2 z 2</div><h2>Nieudana aukcja nad szczytem Azji i short na otwarciu Londynu</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 1 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Dlaczego Darius przesunął stop na BE w pierwszej transakcji?</p><details><summary>Pokaż odpowiedź</summary><p>Bo CVD zaczęło słabnąć, a cena była nad szczytem Azji, gdzie według niego często kończy się nieudaną aukcją.</p></details></div><div class="rq"><p class="q">Jakie dwa wykresy ma otwarte?</p><details><summary>Pokaż odpowiedź</summary><p>TPO i profil wolumenu (kontekst, lokalizacja) oraz M1 z order flow (potwierdzenie).</p></details></div></div>
<p><b>Transakcja 2, short po nieudanej aukcji:</b> cena dotknęła LVN nad wartością i wróciła pod szczyt Azji. Darius czeka na <b>zamknięcie świecy spadkowej</b> poniżej poziomu agresji kupujących i na zgodność CVD. Mówi wprost: „to klasyczny liquidity sweep, ale nie gram go dlatego, że zebrano szczyt Azji, tylko dlatego, że widzę absorpcję kupujących w tym kontekście”. Wchodzi, stop nie nad szczytem, tylko bliżej, cel VAL, RR ok. 1:2. To strategia powrotu do średniej (mean reversion), nie jego ulubiona.</p>
<p><b>Prowadzenie:</b> filtr bąbli zmniejsza do 20 kontraktów (spokojna sesja). Nie przesuwa na BE za wcześnie, bo cena wróciła do wartości, gdzie „znowu robi się biznes”, i może jeszcze podejść. Cofnięcie zatrzymuje się przy VWAP (średniej cenie dnia ważonej wolumenem). Stop przesuwa dopiero nad poziom, na którym kupujący zostali zaabsorbowani. Cena prawie dochodzi do TP, ale nie trafia. Darius przyznaje: z heatmapą ustawiłby TP przed ścianą płynności.</p>
<p><b>Transakcja 3, short na otwarciu Londynu:</b> kupujący zaabsorbowani, sprzedający agresywni. Cel: dołek Frankfurtu, RR 1:2. <b>TP trafiony w kilka minut.</b> Uwaga: VAL nie jest kreską, tylko strefą, a poziomy dużej delty kupna pokazują, gdzie kupujący mogą wrócić.</p>
<div class="watch">${yt('qEGrb1-GNxo',7116,'Darius · short po nieudanej aukcji, prowadzenie, VWAP',7476)}${yt('qEGrb1-GNxo',7476,'Darius · TP niedobity, otwarcie Londynu, short do dołka Frankfurtu',7780)}</div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Czy Darius shortuje dlatego, że cena „zebrała” szczyt Azji?</p><details><summary>Pokaż odpowiedź</summary><p>Nie. Gra absorpcję kupujących, którą widzi w danych, w kontekście, w którym szczyt Azji ma znaczenie.</p></details></div><div class="rq"><p class="q">Dlaczego w transakcji 2 nie przesuwa od razu stopu na BE?</p><details><summary>Pokaż odpowiedź</summary><p>Bo cena wróciła do wartości, gdzie może jeszcze podejść. Zbyt ciasny stop wyrzuciłby go z dobrej pozycji.</p></details></div><div class="rq"><p class="q">Co było sygnałem shortu na otwarciu Londynu?</p><details><summary>Pokaż odpowiedź</summary><p>Absorpcja kupujących i agresja sprzedających. Cel: dołek Frankfurtu, RR 1:2.</p></details></div></div>
</section>
`};
LESSONS.D7={title:'Darius 7: sesja na żywo, Nowy Jork i kontynuacja',time:'',goals:['wyznaczyć cel z heatmapy i sprawdzić go z TPO i profilem','wiedzieć, dlaczego nie kupować przy VAH tam, gdzie kupujący byli absorbowani','zagrać kontynuację w fazie nierównowagi z nowym profilem ruchu'],

<div class="tip"><b>Darius, film 2:09:42–2:34:05: sesja na żywo, część 2.</b> Ostatnia lekcja modułu A2.</div>
<div class="utoc" data-utoc="1"></div>
<section class="s unit" data-unit="1"><div class="unit-nr">Jednostka 1 z 2</div><h2>Nowy Jork: cel z heatmapy i long z wybicia VAH</h2>
<div class="unit-tools"></div>
<div class="scroll"><svg viewBox="0 0 660 230" role="img" aria-label="Dzień Dariusa na złocie: Nowy Jork" style="max-width:660px;width:100%"><g style="font:12px var(--body,sans-serif)"><rect x="20" y="24" width="150" height="170" rx="4" style="fill:var(--soft)"/><text x="24" y="18" style="fill:var(--muted)">Azja</text><rect x="175" y="24" width="140" height="170" rx="4" style="fill:var(--soft)"/><text x="179" y="18" style="fill:var(--muted)">Frankfurt</text><rect x="320" y="24" width="140" height="170" rx="4" style="fill:var(--soft)"/><text x="324" y="18" style="fill:var(--muted)">Londyn</text><rect x="465" y="24" width="180" height="170" rx="4" style="fill:var(--soft)"/><text x="469" y="18" style="fill:var(--muted)">Nowy Jork</text><circle cx="520" cy="150" r="6" style="fill:var(--buy)"/><text x="530" y="154" style="fill:var(--fg)">4. long z VAH → 3933</text><circle cx="560" cy="90" r="6" style="fill:var(--buy)"/><text x="570" y="94" style="fill:var(--fg)">5. kontynuacja → 3973</text></g></svg></div>
<p><b>Trik z heatmapą:</b> w balansie przed Nowym Jorkiem Darius patrzy, gdzie stoi płynność. Nad ceną, na <b>3933–3936</b>, stoi ok. <b>101 kontraktów</b> limitów sprzedaży, ok. 200 ticków od ceny. Pod ceną nic bliskiego (3850, ponad 600 ticków). Wniosek: przy wybiciu w górę jest realny cel, w dół nie.</p>
<ul><li>W Londynie płynność pod ceną <b>zniknęła</b>. Dlatego mówi, że trzeba było wtedy zamykać: celu już nie było.</li><li>3933 leży w <b>LVN poprzedniego dnia</b> i na pojedynczym wydruku TPO, więc dwa źródła wskazują to samo miejsce.</li><li>Szczytu Azji „już nie ma” (został pokonany), więc przeszkoda z porannej transakcji zniknęła.</li></ul>
<p><b>Czego NIE robić:</b> nie kupować przy VAH w miejscu, gdzie przed chwilą <b>kupujący byli absorbowani</b>. To najgorsza możliwa lokalizacja. Kupno przy VAL było w porządku (dobra lokalizacja), ale bez wyraźnego potwierdzenia.</p>

<div class="tip"><b>Skąd ta lekcja.</b> To dodatek do kursu, napisany na Twoje pytanie o derywaty. Autorzy kursu (Faber i Darius) nie mają osobnych filmów o instrumentach pochodnych, więc ta lekcja opiera się na ogólnej wiedzy o rynku i na dokumentacji giełd i regulatorów (źródła na końcu). Tam, gdzie temat łączy się z ich filmami (gamma dealerów, zabezpieczanie się instytucji), są linki z zakresem od–do. Liczby w przykładach są ilustracyjne, chyba że podano źródło.</div>

<section class="s"><h2>1. Czym jest derywat</h2>
<p><b>Derywat</b> (instrument pochodny, ang. <i>derivative</i>) to <b>umowa</b> między dwiema stronami, której wartość wynika z ceny czegoś innego. To „coś” nazywa się <b>instrumentem bazowym</b> (ang. <i>underlying</i>): indeks (np. Nasdaq-100), akcja, złoto, ropa, waluta, stopa procentowa, a nawet inny derywat. Kto ma derywat, nie ma samej rzeczy, tylko umowę, która zyskuje albo traci razem z jej ceną.</p>
<h3>Po co istnieją: trzy powody</h3>
<ul><li><b>Zabezpieczenie (hedging).</b> Ktoś ma ryzyko, którego nie chce, i przenosi je na kogoś innego. Linia lotnicza boi się drożejącego paliwa, więc ustala cenę z góry. Fundusz ma akcje i boi się spadku, więc kupuje „ubezpieczenie”. To pierwotny cel derywatów.</li>
<li><b>Spekulacja.</b> Ktoś <b>chce</b> tego ryzyka, bo liczy na zysk. Spekulant jest drugą stroną dla zabezpieczającego się. Bez spekulantów zabezpieczający nie mieliby z kim handlować.</li>
<li><b>Arbitraż.</b> Ktoś pilnuje, żeby derywat i baza nie rozjechały się za bardzo, i zarabia na drobnych różnicach. To utrzymuje ceny w ryzach (lekcja 1: arbitraż NQ kontra ES, futures kontra ETF-y).</li></ul>
<h3>Dwie cechy, które mają prawie wszystkie derywaty</h3>
<ul><li><b>Dźwignia.</b> Małą kwotą (depozytem albo premią) kontrolujesz dużą wartość bazy. Jeden kontrakt NQ przy indeksie 21 000 to 20 $ × 21 000 = <b>420 000 $</b> ekspozycji. Ruch indeksu o 1% to 4 200 $ zysku albo straty na jednym kontrakcie.</li>
<li><b>Gra o sumie zerowej (przed kosztami).</b> Każdy kontrakt ma stronę kupującą i sprzedającą. Ile zarobi jedna, tyle straci druga. Po kosztach (prowizje, spread) suma jest ujemna.</li></ul>
<h3>Giełda czy poza giełdą: najważniejszy podział</h3>
<div class="scroll"><table class="t"><tr><th></th><th>Giełdowe (np. futures i opcje na CME)</th><th>Poza giełdą, OTC (over the counter: CFD, forwardy, swapy)</th></tr>
<tr><td>Kto jest Twoim kontrahentem</td><td><b>izba rozliczeniowa</b> giełdy (np. CME Clearing): staje między kupującym a sprzedającym i gwarantuje rozliczenie</td><td>konkretna firma: broker, bank</td></tr>
<tr><td>Warunki umowy</td><td>standardowe, takie same dla wszystkich</td><td>ustalane przez strony albo przez brokera</td></tr>
<tr><td>Ryzyko kontrahenta</td><td>bardzo małe</td><td>realne: jeśli broker zbankrutuje, masz problem</td></tr>
<tr><td>Przejrzystość</td><td>jedna księga, każda transakcja publiczna, stąd order flow</td><td>brak wspólnej księgi; widzisz tylko ceny swojego brokera</td></tr></table></div>
<p>Ten podział tłumaczy cały kurs: <b>order flow istnieje tylko tam, gdzie jest jedna centralna księga</b>, czyli na derywatach giełdowych (lekcja 1, sekcja 7).</p>
</section>

<section class="s"><h2>2. Forward: najprostszy derywat</h2>
<p>Zacznij od forwardu, bo z niego wyrosły futures. <b>Forward</b> (kontrakt terminowy pozagiełdowy) to umowa: „za 3 miesiące kupię od Ciebie X po cenie, którą ustalamy dziś”.</p>
<div class="case"><div class="lab">Przykład · rolnik i młyn</div>
<p>Rolnik w marcu boi się, że w sierpniu pszenica stanieje. Młyn boi się, że zdrożeje. Podpisują forward: w sierpniu rolnik sprzeda młynowi 100 ton po 1 000 zł za tonę.</p>
<ul><li>W sierpniu rynek płaci 800 zł: rolnik zyskał na umowie 200 zł na tonie (sprzedaje drożej niż rynek), młyn stracił tyle samo.</li>
<li>W sierpniu rynek płaci 1 200 zł: odwrotnie, młyn zyskał 200 zł na tonie, rolnik stracił.</li></ul>
<p>Obaj osiągnęli cel: <b>znali cenę z góry</b>. Ten, kto „stracił” na umowie, i tak dostał cenę, na którą się umówił.</p></div>
<p><b>Wady forwardu</b>, które rozwiązały futures:</p>
<ul><li><b>Ryzyko kontrahenta:</b> jeśli młyn zbankrutuje do sierpnia, umowa nic nie jest warta.</li>
<li><b>Brak standaryzacji:</b> każda umowa jest inna (ilość, jakość, termin), więc trudno ją komuś odsprzedać.</li>
<li><b>Rozliczenie dopiero na końcu:</b> przez 5 miesięcy strata rośnie po cichu.</li></ul>
<p>Forwardy żyją dalej głównie w bankach i firmach, np. jako <b>forward walutowy</b>: eksporter ustala z bankiem kurs, po którym za 3 miesiące wymieni euro na złote.</p>
</section>

<section class="s"><h2>3. Futures: kontrakt terminowy na giełdzie</h2>
<p><b>Futures</b> to forward, który przeniesiono na giełdę i ustandaryzowano. Kupujący (long) zobowiązuje się kupić bazę w ustalonym terminie po cenie z kontraktu, a sprzedający (short) sprzedać. W praktyce prawie nikt nie czeka do terminu: pozycję zamyka się transakcją odwrotną.</p>
<h3>Standaryzacja: wszystko jest z góry ustalone</h3>
<div class="scroll"><table class="t"><tr><th>Kontrakt</th><th>Baza</th><th>Wartość</th><th>Tick (najmniejszy ruch)</th><th>Rozliczenie</th></tr>
<tr><td><b>NQ</b> (E-mini Nasdaq-100, CME)</td><td>indeks Nasdaq-100</td><td class="num">20 $ × indeks</td><td class="num">0,25 pkt = 5 $</td><td>gotówkowe</td></tr>
<tr><td><b>MNQ</b> (Micro E-mini Nasdaq-100)</td><td>to samo, 10 razy mniejszy</td><td class="num">2 $ × indeks</td><td class="num">0,25 pkt = 0,50 $</td><td>gotówkowe</td></tr>
<tr><td><b>ES</b> (E-mini S&amp;P 500)</td><td>indeks S&amp;P 500</td><td class="num">50 $ × indeks</td><td class="num">0,25 pkt = 12,50 $</td><td>gotówkowe</td></tr>
<tr><td><b>GC</b> (złoto, COMEX, część grupy CME)</td><td>100 uncji trojańskich złota</td><td class="num">100 × cena uncji</td><td class="num">0,10 $ = 10 $</td><td>fizyczna dostawa</td></tr></table></div>
<p><b>Terminy.</b> NQ i ES mają kontrakty kwartalne: marzec (kod H), czerwiec (M), wrzesień (U), grudzień (Z). Np. „NQZ6” to NQ grudzień 2026. Wygasają w trzeci piątek miesiąca kontraktu. Złoto ma inny kalendarz i fizyczną dostawę, więc spekulanci zamykają pozycje przed okresem dostawy.</p>

<h3>Depozyt i codzienne rozliczenie: serce futures</h3>
<p>Kupując futures, nie płacisz 420 000 $. Wpłacasz <b>depozyt zabezpieczający</b> (ang. <i>margin</i>). To kaucja, a nie cena. Wysokość depozytu ustala giełda (i broker może zażądać więcej). Zmienia się wraz ze zmiennością rynku, więc zawsze sprawdzaj aktualne wartości u brokera albo na stronie CME.</p>
<ul><li><b>Depozyt początkowy</b> (initial margin): tyle musisz mieć, żeby otworzyć pozycję.</li>
<li><b>Depozyt podtrzymujący</b> (maintenance margin): niższy próg. Jeśli przez straty spadniesz poniżej niego, dostajesz <b>wezwanie do uzupełnienia depozytu</b> (margin call) albo broker zamyka pozycję.</li>
<li><b>Codzienne rozliczenie</b> (mark-to-market): każdego dnia giełda przelicza pozycję po cenie zamknięcia i <b>przelewa gotówkę</b> między stronami. Zysk dostajesz na konto od razu, stratę płacisz od razu. Dzięki temu strata nie rośnie po cichu jak w forwardzie, a izba rozliczeniowa nie ryzykuje.</li></ul>

<h3>Dlaczego cena NQ nie jest równa indeksowi i co to jest rolowanie</h3>
<ul><li><b>Baza</b> (ang. <i>basis</i>): różnica między ceną futures a ceną instrumentu bazowego. Na indeksach futures są zwykle <b>drożej</b> niż indeks, bo kupując futures zamiast akcji, nie wydajesz pieniędzy dziś (możesz je trzymać na odsetkach), ale też nie dostajesz dywidend. Przy stopach ok. 4% i dywidendach ok. 1% rocznie kontrakt na 3 miesiące jest ok. 0,75% drożej od indeksu. Ta różnica maleje do zera w dniu wygaśnięcia.</li>
<li><b>Rolowanie</b> (ang. <i>roll</i>): ok. tydzień przed wygaśnięciem wolumen przechodzi na następny kontrakt kwartalny. Trader zamyka grudniowy i otwiera marcowy. Na wykresach „ciągłych” (np. NQ1! w TradingView) w dniu rolowania widać skok ceny, który jest skutkiem zmiany kontraktu, a nie ruchem rynku. Przy backteście trzeba o tym pamiętać.</li></ul>

<h3>Futures a order flow</h3>
<p>Wszystkie transakcje na NQ przechodzą przez jedną księgę CME. Dlatego istnieją footprint, bąble, heatmapa i delta. To z futures autorzy czytają rynek, nawet jeśli wykonują transakcje gdzie indziej.</p>

<section class="s"><h2>4. Opcje: prawo, a nie obowiązek</h2>
<p>Opcje są najtrudniejsze, ale też najciekawsze, bo ich zabezpieczanie przez dealerów porusza rynkiem futures (lekcja 2, sekcja 9). Przejdziemy je od zera.</p>

<h3>4.1 Dwa typy i dwie strony</h3>
<ul><li><b>Opcja call</b> (kupna): <b>prawo</b> do kupienia instrumentu bazowego po ustalonej cenie do (albo w) ustalonym dniu.</li>
<li><b>Opcja put</b> (sprzedaży): <b>prawo</b> do sprzedania instrumentu bazowego po ustalonej cenie.</li></ul>
<p>Każda opcja ma dwie strony:</p>
<ul><li><b>Kupujący</b> (long, nabywca): płaci <b>premię</b> i dostaje prawo. Może z niego skorzystać albo nie. Więcej niż premię stracić nie może.</li>
<li><b>Wystawca</b> (short, sprzedający opcję): dostaje premię i bierze na siebie <b>obowiązek</b>. Jeśli kupujący skorzysta z prawa, wystawca musi sprzedać (przy call) albo kupić (przy put) po ustalonej cenie, nawet jeśli to dla niego bardzo niekorzystne.</li></ul>
<p>Najprostsza analogia: <b>kupujący put to ubezpieczony, a wystawca put to ubezpieczyciel</b>. Ubezpieczony płaci składkę (premię) i jest chroniony przed spadkiem. Ubezpieczyciel zbiera składki i płaci, gdy zdarzy się „wypadek”.</p>

<h3>4.2 Słownik opcji</h3>
<div class="scroll"><table class="t"><tr><th>Pojęcie</th><th>Znaczenie</th></tr>
<tr><td><b>Cena wykonania</b> (strike)</td><td>cena, po której można kupić (call) albo sprzedać (put) bazę</td></tr>
<tr><td><b>Termin wygaśnięcia</b> (expiry, expiration)</td><td>dzień, po którym prawo przestaje istnieć</td></tr>
<tr><td><b>Premia</b></td><td>cena opcji, którą kupujący płaci wystawcy</td></tr>
<tr><td><b>Opcja amerykańska / europejska</b></td><td>amerykańską można wykonać w dowolnym dniu do wygaśnięcia, europejską tylko w dniu wygaśnięcia. Nazwy nie mają związku z kontynentem: opcje na indeks SPX (S&amp;P 500) są europejskie, a opcje na pojedyncze akcje w USA amerykańskie</td></tr>
<tr><td><b>ITM / ATM / OTM</b> (in / at / out of the money)</td><td>„w pieniądzu”: wykonanie dziś dałoby zysk (call: cena bazy wyżej niż strike); „przy pieniądzu”: strike ok. obecnej ceny; „poza pieniądzem”: wykonanie dziś nic by nie dało</td></tr>
<tr><td><b>Wartość wewnętrzna</b></td><td>ile opcja byłaby warta, gdyby wygasła teraz: dla call max(cena bazy − strike, 0), dla put max(strike − cena bazy, 0)</td></tr>
<tr><td><b>Wartość czasowa</b></td><td>premia minus wartość wewnętrzna: dopłata za to, że do wygaśnięcia cena jeszcze może się zmienić. Spada do zera w dniu wygaśnięcia</td></tr>
<tr><td><b>Mnożnik</b></td><td>ile jednostek bazy obejmuje kontrakt: opcja na akcje w USA to 100 akcji; opcja na SPX to 100 $ × indeks; opcja na NQ obejmuje 1 kontrakt NQ (20 $ za punkt)</td></tr>
<tr><td><b>Rozliczenie</b></td><td>gotówkowe (dostajesz różnicę, np. SPX) albo fizyczne (dostajesz akcje lub kontrakt futures)</td></tr>
<tr><td><b>Open interest</b> (liczba otwartych pozycji)</td><td>ile kontraktów danej opcji jest otwartych; z tego szacuje się pozycje dealerów i poziomy gammy</td></tr></table></div>

<p class="cap">Oś pozioma: cena bazy przy wygaśnięciu (od 80 do 120), oś pionowa: zysk lub strata. Kupujący ma ograniczoną stratę (premia), wystawca ograniczony zysk (premia).</p>
<p><b>Najważniejsze wnioski z tabeli:</b></p>
<ul><li><b>Próg rentowności</b> (break-even) kupującego call to strike + premia = 105. Nie wystarczy, że cena wzrośnie: musi wzrosnąć o więcej niż zapłacona premia.</li>
<li><b>Wystawienie call bez zabezpieczenia</b> („nagiego”, ang. <i>naked</i>) ma <b>nieograniczone ryzyko</b>: cena może rosnąć bez końca. To najniebezpieczniejsza pozycja w całej tabeli.</li>
<li>Wystawca wygrywa <b>częściej</b> (gdy cena stoi albo idzie lekko w jego stronę), ale <b>mało</b>. Kupujący wygrywa <b>rzadziej</b>, ale czasem dużo. To ta sama zależność między odsetkiem wygranych a stosunkiem zysku do ryzyka co w lekcji 25 („nie możesz mieć 1:20 przy 75% WR”).</li>
<li>Z mnożnikiem: opcja na NQ obejmuje 1 kontrakt NQ, więc premia 100 pkt to 100 × 20 $ = 2 000 $.</li></ul>

<h3>4.4 Od czego zależy cena opcji: greki</h3>
<p>Przed wygaśnięciem opcja jest warta więcej niż jej wartość wewnętrzna, bo cena jeszcze może się zmienić. Ile więcej, liczą modele (najbardziej znany to model Blacka–Scholesa z 1973 r.). Nie musisz liczyć sam. Musisz rozumieć, <b>co porusza ceną opcji</b>. Opisują to tzw. greki (od greckich liter):</p>
<div class="scroll"><table class="t"><tr><th>Grek</th><th>Co mierzy</th><th>Przykład (call ATM, baza 100)</th></tr>
<tr><td><b>Delta</b></td><td>o ile zmienia się cena opcji, gdy baza zmieni się o 1. Też: przybliżona szansa, że opcja wygaśnie w pieniądzu, i ile bazy „odpowiada” opcji</td><td>delta 0,50: baza +2 → opcja ok. +1. Call głęboko ITM ma deltę bliską 1, daleko OTM bliską 0. Put ma deltę ujemną</td></tr>
<tr><td><b>Gamma</b></td><td>o ile zmienia się <b>delta</b>, gdy baza zmieni się o 1, czyli przyspieszenie</td><td>gamma 0,02: po wzroście bazy o 10 delta rośnie z 0,50 do ok. 0,70. Gamma jest największa dla opcji ATM tuż przed wygaśnięciem</td></tr>
<tr><td><b>Theta</b></td><td>ile opcja traci każdego dnia przez upływ czasu (rozpad wartości czasowej)</td><td>theta −0,05: po dniu bez ruchu opcja tańsza o 0,05. Rozpad przyspiesza w ostatnich tygodniach. Kupujący płaci thetę, wystawca na niej zarabia</td></tr>
<tr><td><b>Vega</b></td><td>o ile zmienia się cena opcji, gdy <b>zmienność implikowana</b> wzrośnie o 1 punkt procentowy</td><td>vega 0,20: zmienność implikowana z 20% na 25% → opcja ok. +1</td></tr>
<tr><td><b>Rho</b></td><td>wrażliwość na stopy procentowe</td><td>przy krótkich opcjach zwykle najmniej ważna</td></tr></table></div>
<p><b>Zmienność implikowana</b> (ang. <i>implied volatility</i>, IV) to zmienność, jakiej rynek <b>oczekuje</b>, odczytana z cen opcji. Najbardziej znana miara to <b>VIX</b>: oczekiwana zmienność indeksu S&amp;P 500 na 30 dni, liczona z cen opcji na SPX. Przed ważnym wydarzeniem (decyzja Fed, czyli Rezerwy Federalnej, banku centralnego USA; wyniki spółki) IV rośnie, bo wszyscy chcą się zabezpieczyć. Po wydarzeniu gwałtownie spada (ang. <i>IV crush</i>, zgniecenie zmienności). Dlatego można dobrze trafić kierunek, a i tak stracić na kupionej opcji: spadek IV zjadł zysk z ruchu.</p>

<h3>4.5 Popularne strategie opcyjne</h3>
<div class="scroll"><table class="t"><tr><th>Strategia</th><th>Jak zbudowana</th><th>Po co</th><th>Ryzyko</th></tr>
<tr><td><b>Protective put</b> (put ochronny)</td><td>masz bazę + kupujesz put</td><td>ubezpieczenie przed spadkiem; tak zabezpieczają się fundusze</td><td>ograniczone do premii i odległości do strike</td></tr>
<tr><td><b>Covered call</b> (call pokryty)</td><td>masz bazę + wystawiasz call</td><td>dodatkowy dochód z premii, gdy rynek stoi</td><td>oddajesz zysk powyżej strike; spadek bazy nadal boli</td></tr>
<tr><td><b>Spread pionowy</b> (np. bull call spread)</td><td>kupujesz call 100, wystawiasz call 110</td><td>tańszy zakład na wzrost</td><td>ograniczone z obu stron</td></tr>
<tr><td><b>Straddle / strangle</b></td><td>kupujesz call i put (ten sam strike albo różne)</td><td>zakład na <b>duży ruch</b> w dowolną stronę</td><td>tracisz, gdy rynek stoi (theta) albo IV spada</td></tr>
<tr><td><b>Iron condor</b></td><td>wystawiasz spread call nad ceną i spread put pod ceną</td><td>zakład, że rynek <b>zostanie w zakresie</b> (balans z lekcji 2)</td><td>ograniczone, ale duży ruch zabiera kilka miesięcy premii</td></tr></table></div>
<p><b>0DTE</b> (zero days to expiration, opcje wygasające tego samego dnia): opcje na SPX wygasają dziś w każdy dzień roboczy, a ich wolumen stanowi dziś dużą część całego obrotu opcjami na ten indeks. Mają ogromną gammę i błyskawiczną thetę. Dlatego przepływy dealerów zabezpieczających 0DTE mogą wpływać na ruchy w trakcie dnia na ES i NQ.</p>

<h3>4.6 Dealer opcji i gamma: dlaczego opcje poruszają futures</h3>
<p>To połączenie z lekcją 2 (sekcja 9) i z filmami autorów. <b>Dealer</b> (market maker na rynku opcji) wystawia i kupuje opcje od klientów, ale nie chce zakładać się o kierunek. Każdą pozycję zabezpiecza więc futures albo akcjami tak, żeby łączna delta była bliska zera. To się nazywa <b>hedging delta</b> (zabezpieczanie delty). Problem w tym, że delta opcji ciągle się zmienia (to jest gamma), więc dealer musi <b>ciągle dokupować albo sprzedawać</b> futures.</p>
<div class="scroll"><table class="t"><tr><th>Krok</th><th>Dealer krótki gamma (klienci kupili od niego 100 call)</th><th>Dealer długi gamma (klienci sprzedali mu 100 call)</th></tr>
<tr><td>Start: delta call 0,50</td><td>dealer ma −50 delty, więc <b>kupuje</b> 50 jednostek bazy</td><td>dealer ma +50 delty, więc <b>sprzedaje</b> 50 jednostek bazy</td></tr>
<tr><td>Baza rośnie, delta call rośnie do 0,70</td><td>ma −70 delty, więc musi <b>dokupić 20</b>: kupuje <b>na wzroście</b></td><td>ma +70 delty, więc musi <b>sprzedać 20</b>: sprzedaje <b>na wzroście</b></td></tr>
<tr><td>Baza spada, delta call spada do 0,30</td><td>musi <b>sprzedać</b>: sprzedaje <b>na spadku</b></td><td>musi <b>kupić</b>: kupuje <b>na spadku</b></td></tr>
<tr><td>Skutek dla rynku</td><td><b>wzmacnia ruchy</b>, ekspansja, trend</td><td><b>tłumi ruchy</b>, kompresja, balans</td></tr></table></div>
<p>Stąd pojęcia z kursu:</p>
<ul><li><b>Dodatnia gamma</b> (dealerzy długi gamma): dzień ma tendencję do balansu. To sesja Fabera z lekcji 2: dwie godziny kompresji i seria stopów na modelu trendowym.</li>
<li><b>Ujemna gamma</b>: dzień ma tendencję do ekspansji i gwałtownych ruchów.</li>
<li><b>Zero gamma</b> (gamma flip): poziom ceny, na którym łączna gamma dealerów zmienia znak. Nad nim zwykle spokojniej, pod nim nerwowo (lekcja 24).</li>
<li><b>Ściany gammy</b>: strike z ogromnym open interest. Cena bywa do nich przyciągana i „przyklejana”, szczególnie w dniu wygaśnięcia (ang. <i>pinning</i>).</li></ul>
<div class="warnbox"><b>Ważne zastrzeżenie:</b> nikt nie zna dokładnych pozycji dealerów. Serwisy (np. pakiet Pro w Deep Charts, z którego korzysta Faber) <b>szacują</b> gammę z open interest i założeń o tym, kto kupił, a kto sprzedał. To filtr kontekstu dnia, a nie sygnał wejścia. Darius mówi wprost, że na złocie gamma nie jest potrzebna.</div>
<div class="watch">${yt('jasv3L-d8ZE',511,'Faber · long gamma kompresuje ruchy, wyjście w zysku',697)}${yt('n3UKOSmiXPM',116,'Darius · gamma: dzień ekspansji czy nie',180)}${yt('px-f_qteOB0',1217,'Darius · instytucje zabezpieczają się opcjami i futures',1340)}</div>

<h3>4.7 Ryzyka opcji, o których trzeba wiedzieć</h3>
<ul><li><b>Wystawianie bez zabezpieczenia</b>: strata może wielokrotnie przekroczyć zebrane premie. Wiele kont wyzerowało się na jednym dniu gwałtownego ruchu.</li>
<li><b>Przypisanie</b> (ang. <i>assignment</i>): przy opcjach amerykańskich wystawca może zostać „wywołany” do realizacji obowiązku wcześniej, np. przed dywidendą.</li>
<li><b>Spread i płynność</b>: opcje daleko od ceny albo z odległym terminem mają szerokie spready. Ten sam koszt agresora co w lekcji 1, tylko większy.</li>
<li><b>Upływ czasu</b>: kupujący opcję musi mieć rację co do kierunku, <b>wielkości</b> ruchu i <b>czasu</b>. Trzy warunki naraz.</li>
<li><b>IV crush</b>: patrz 4.4.</li></ul>
<p><b>Dostęp:</b> opcje na indeksy i akcje USA oraz opcje na futures CME są dostępne u brokerów z dostępem do giełd USA. W Polsce na GPW (Giełdzie Papierów Wartościowych w Warszawie) notowane są opcje na indeks WIG20. Firmy finansujące traderów działające na CFD (jak FTMO) opcji nie oferują.</p>
</section>

<section class="s"><h2>5. CFD: kontrakt na różnicę u brokera</h2>
<p><b>CFD</b> (contract for difference, kontrakt na różnicę) to umowa z brokerem: rozliczacie się z różnicy ceny między otwarciem a zamknięciem pozycji. Nie ma giełdy, nie ma terminu wygaśnięcia, nie ma innych uczestników w tej samej księdze. Twoim kontrahentem jest broker.</p>
<ul><li><b>Cena</b>: broker pokazuje cenę opartą na rynku bazowym (np. US100 na indeksie Nasdaq-100 albo na futures NQ), ale to <b>jego</b> kwotowanie.</li>
<li><b>Koszty</b>: spread brokera (często poszerzany na newsach i w nocy), prowizja, a za trzymanie pozycji przez noc <b>swap</b> (punkty swapowe, opłata albo dopłata za finansowanie). To inne znaczenie słowa „swap” niż w sekcji 6.</li>
<li><b>Dźwignia dla klientów detalicznych w UE</b> jest ograniczona (decyzja ESMA, Europejskiego Urzędu Nadzoru Giełd i Papierów Wartościowych, z 2018 r., potem przepisy krajowe, w Polsce KNF, czyli Komisji Nadzoru Finansowego): 1:30 dla głównych par walutowych, 1:20 dla głównych indeksów, złota i pozostałych walut, 1:10 dla innych surowców i indeksów, 1:5 dla akcji, 1:2 dla kryptowalut. Klient detaliczny ma też <b>ochronę przed ujemnym saldem</b>: nie straci więcej, niż ma na koncie.</li>
<li><b>Model brokera</b>: A-book (broker przekazuje Twoje zlecenie dalej na rynek) albo B-book (broker sam jest Twoją drugą stroną i zarabia, gdy tracisz; lekcja 1, sekcja 7). Brokerzy w UE muszą publikować, jaki odsetek ich klientów detalicznych traci pieniądze; zwykle to większość rachunków.</li>
<li><b>Dane</b>: brak wspólnej księgi, więc brak prawdziwego wolumenu, footprintu i delty. MT5 (MetaTrader 5) pokazuje tylko wolumen tickowy, czyli liczbę zmian ceny (lekcja 23).</li>
<li><b>Konta prop</b> (np. FTMO): handel odbywa się na rachunkach demonstracyjnych z ceną brokera; firma wypłaca udział w zysku według własnych zasad.</li></ul>
<p><b>Twój OBR handluje właśnie na CFD.</b> Dlatego autorzy czytają order flow na futures, a wykonują na CFD. Ceny obu rynków są bardzo zbliżone, ale nie identyczne: inna baza, inny spread, inny poślizg.</p>
</section>

<section class="s"><h2>6. Swap: wymiana przepływów</h2>
<p><b>Swap</b> to umowa o wymianie strumieni płatności przez określony czas. To głównie świat banków i dużych firm, ale wartość nominalna wszystkich derywatów pozagiełdowych na świecie liczona jest w setkach bilionów dolarów (dane BIS, Banku Rozrachunków Międzynarodowych), a największą część stanowią właśnie swapy stóp procentowych.</p>
<div class="scroll"><table class="t"><tr><th>Rodzaj</th><th>Co się wymienia</th><th>Przykład</th></tr>
<tr><td><b>IRS</b> (interest rate swap, swap stopy procentowej)</td><td>stałe oprocentowanie na zmienne</td><td>firma z kredytem na zmiennej stopie płaci bankowi stałe 5%, a dostaje zmienną stopę rynkową. Efekt: jej kredyt staje się kredytem o stałej racie</td></tr>
<tr><td><b>Swap walutowy</b></td><td>płatności w dwóch walutach</td><td>firma pożycza w euro, a chce płacić w złotych</td></tr>
<tr><td><b>CDS</b> (credit default swap, swap kredytowy)</td><td>regularna opłata za ochronę przed niewypłacalnością dłużnika</td><td>„ubezpieczenie” obligacji. CDS-y odegrały dużą rolę w kryzysie 2008 r., gdy ubezpieczyciel AIG nie był w stanie wypłacić ochrony, którą sprzedał</td></tr></table></div>
<p>Dla tradera indeksów swapy są tłem: wpływają na stopy procentowe i koszt finansowania, a przez to na bazę futures i swapy overnight na CFD.</p>
</section>

<section class="s"><h2>7. Inne produkty z dźwignią, które możesz spotkać</h2>
<ul><li><b>Warranty i certyfikaty turbo</b>: papiery emitowane przez banki, notowane na giełdzie (także na GPW), z wbudowaną dźwignią i często z poziomem „knock-out”, po którego przekroczeniu wygasają. Twoim kontrahentem jest emitent.</li>
<li><b>ETF-y lewarowane</b> (np. 3 razy Nasdaq-100): fundusze, które dziennie odwzorowują wielokrotność ruchu indeksu, używając w środku derywatów. Przez codzienne odnawianie dźwigni w długim okresie mogą tracić nawet wtedy, gdy indeks stoi w miejscu.</li></ul>
</section>

<section class="s"><h2>9. Podsumowanie: co z tego wynika</h2>
<h3>1. Ten sam indeks, trzy różne umowy</h3>
<p>NQ (futures), opcje na NQ i US100 (CFD) zależą od tego samego Nasdaq-100. Różnią się tym, <b>z kim</b> zawierasz umowę, <b>ile</b> możesz stracić i <b>co widzisz</b>. Tylko futures dają order flow, bo tylko tam wszyscy handlują w jednej księdze.</p>
<h3>2. Opcje wpływają na rynek, nawet jeśli nimi nie handlujesz</h3>
<p>Zabezpieczanie dealerów to realny przepływ zleceń na futures. Dodatnia gamma tłumi ruchy, ujemna je wzmacnia. To wyjaśnia, dlaczego niektóre dni są „klejące” (balans), a inne „lecą” (price discovery). Dla OBR, który gra wybicia, to potencjalny filtr dnia. Najpierw pomiar bez filtra, potem decyzja (lekcja 13 i 29).</p>
<h3>3. Asymetria ryzyka decyduje o przetrwaniu</h3>
<p>Kupujący opcję ma znaną maksymalną stratę. Wystawca bez zabezpieczenia ma nieznaną. Futures i CFD z dźwignią mają stratę ograniczoną tylko Twoim stopem i saldem. Przed każdą pozycją odpowiedz sobie: <b>ile maksymalnie mogę stracić i czy to wiem z góry?</b></p>
<h3>4. Koszt agresora jest wszędzie</h3>
<p>Spread, poślizg i prowizja z lekcji 1 dotyczą każdego derywatu. Na opcjach spready bywają szerokie, na CFD spread ustala broker, a na futures płacisz giełdzie i brokerowi. Strategia, która nie pokrywa kosztów agresora, nie działa na żadnym instrumencie.</p>
<div class="warnbox"><b>W jednym zdaniu:</b> derywat to umowa o cenę czegoś innego, a jej budowa (giełda czy broker, prawo czy obowiązek, depozyt czy premia) decyduje o tym, ile możesz stracić, co widzisz w danych i czy ktoś inny musi przez nią kupować albo sprzedawać na rynku.</div>

  function reset(){asks={101:33,102:42,103:56,104:61,105:81};bids={99:41,98:30,97:22,96:18,95:11};fpB={};fpA={};last=100;o=h=l=c=null;step=0;hist=[];$('.log',el).textContent='';draw();}

/* mapa skrót → definicja do podpowiedzi */
const GL_AUTO={};GLOSS.forEach(([c,items])=>items.forEach(g=>{if(g.a)GL_AUTO[g.t]=g;}));
function glAnchor(t){return 'g-'+t.replace(/[^A-Za-z0-9]+/g,'_');}

/* podpowiedzi w lekcjach: pierwsze wystąpienie każdego skrótu w lekcji dostaje kropkowane podkreślenie */
function glossify(root){
  const keys=Object.keys(GL_AUTO).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&'));
  const re=new RegExp('(^|[^A-Za-zÀ-žĄĆĘŁŃÓŚŹŻąćęłńóśźż0-9])('+keys.join('|')+')(?![A-Za-zÀ-žĄĆĘŁŃÓŚŹŻąćęłńóśźż0-9])');
  const seen=new Set();
  const skip=n=>n.closest('a,button,h1,h2,h3,script,style,.w,.gl,.yt,.eyebrow,.meta,label,select');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.trim()&&!skip(n.parentElement)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    let text=node.nodeValue,frag=null,last=0,m,rest=text,off=0;
    while((m=re.exec(rest))){
      const term=m[2],start=off+m.index+m[1].length;
      if(!seen.has(term)){seen.add(term);frag=frag||document.createDocumentFragment();
        frag.appendChild(document.createTextNode(text.slice(last,start)));
        const s=document.createElement('span');s.className='gl';s.tabIndex=0;s.dataset.t=term;s.textContent=term;frag.appendChild(s);last=start+term.length;}
      off=off+m.index+m[0].length;rest=text.slice(off);
    }
    if(frag){frag.appendChild(document.createTextNode(text.slice(last)));node.parentNode.replaceChild(frag,node);}
  });
}
const glPop=document.createElement('div');glPop.id='glpop';glPop.hidden=true;glPop.setAttribute('role','tooltip');document.body.appendChild(glPop);
let glGoto=null;
function glShow(el){const g=GL_AUTO[el.dataset.t];if(!g)return;
  glPop.innerHTML='<b>'+g.t+'</b>'+(g.f?' · <i>'+g.f+'</i>':'')+'<p>'+g.d+'</p><a href="#SL" data-g="'+g.t+'">Więcej w słowniczku →</a>';
  glPop.hidden=false;const r=el.getBoundingClientRect(),pw=Math.min(340,window.innerWidth-24);glPop.style.width=pw+'px';
  let x=r.left+window.scrollX;x=Math.max(12+window.scrollX,Math.min(x,window.scrollX+window.innerWidth-pw-12));
  glPop.style.left=x+'px';glPop.style.top=(r.bottom+window.scrollY+6)+'px';}
function glHide(){glPop.hidden=true;}
document.addEventListener('mouseover',e=>{const s=e.target.closest&&e.target.closest('.gl');if(s)glShow(s);});
document.addEventListener('mouseout',e=>{const s=e.target.closest&&e.target.closest('.gl');if(s&&!glPop.contains(e.relatedTarget))setTimeout(()=>{if(!glPop.matches(':hover'))glHide();},120);});
glPop.addEventListener('mouseleave',glHide);
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('gl'))glShow(e.target);});
document.addEventListener('click',e=>{const s=e.target.closest('.gl');if(s){glShow(s);return;}const a=e.target.closest('#glpop a');if(a){glGoto=a.dataset.g;glHide();return;}if(!glPop.contains(e.target))glHide();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')glHide();});

  const n=GLOSS.reduce((s,[c,i])=>s+i.length,0);

  h+='<div class="glsearch"><input type="search" id="glq" placeholder="Szukaj: np. DOM, delta, BE…" aria-label="Szukaj w słowniczku"><span class="mono" id="glc"></span></div>';
  h+='<div class="glcats">'+GLOSS.map(([c],i)=>'<a href="#SL" data-c="'+i+'">'+c+'</a>').join('')+'</div>';
  GLOSS.forEach(([c,items],i)=>{h+='<section class="s glsec" data-c="'+i+'"><h2 id="glc'+i+'">'+c+'</h2><dl class="gll">'+items.map(g=>'<div class="gli" id="'+glAnchor(g.t)+'" data-s="'+(g.t+' '+g.f+' '+g.d).toLowerCase().replace(/"/g,'')+'"><dt>'+g.t+(g.f?' <span>'+g.f+'</span>':'')+'</dt><dd>'+g.d+'<div class="gllink">Lekcje: '+g.l.split(/,\s*/).map(x=>/^L\d+$/.test(x)?'<a href="#'+x+'">'+x+'</a>':x).join(', ')+'</div></dd></div>').join('')+'</dl></section>';});
  h+='<div class="pager"><a href="#start">← Mapa kursu</a><a href="#L1">L1 →</a></div>';
  const v=$('#view');v.innerHTML=h;
  const q=$('#glq',v),cnt=$('#glc',v);
  const filt=()=>{const s=q.value.trim().toLowerCase();let k=0;$$('.gli',v).forEach(e=>{const on=!s||e.dataset.s.includes(s);e.hidden=!on;if(on)k++;});$$('.glsec',v).forEach(sec=>sec.hidden=!$$('.gli',sec).some(e=>!e.hidden));cnt.textContent=s?k+' wyników':'';};
  q.addEventListener('input',filt);
  v.onclick=e=>{const c=e.target.closest('.glcats a');if(c){e.preventDefault();const t=$('#glc'+c.dataset.c,v);if(t)t.scrollIntoView({behavior:'smooth'});}};
  if(glGoto){const t=document.getElementById(glAnchor(glGoto));glGoto=null;if(t){setTimeout(()=>{t.scrollIntoView({block:'center'});t.classList.add('hl');},30);}}
}

  const L=LESSONS[id];const s=store.get();const done=(s.done||{})[id];const mod=MODS.find(m=>m.items.includes(id));

/* ======================= v63: audio (Web Speech) + tryb wieczorny + jednostki ======================= */
const TTS={items:[],i:0,unit:null,on:false,paused:false,pref:(()=>{try{return JSON.parse(localStorage.getItem('ofkurs_tts')||'{}')}catch(e){return {}}})()};
function ttsSave(){try{localStorage.setItem('ofkurs_tts',JSON.stringify(TTS.pref))}catch(e){}}
function plVoices(){if(!window.speechSynthesis)return [];return speechSynthesis.getVoices().filter(v=>/^pl/i.test(v.lang));}
function pickVoice(){const vs=plVoices();if(TTS.pref.voice){const f=vs.find(v=>v.name===TTS.pref.voice);if(f)return f;}return vs.find(v=>/natural|online/i.test(v.name))||vs[0]||null;}
const SKIP='svg,canvas,script,style,.watch,.unit-tools,.unit-nr,.utoc,[data-w],.rq details,.yt,button,select';
function gather(node,out){
  for(const el of node.children){
    if(el.matches(SKIP))continue;
    if(el.tagName==='DETAILS'&&!el.open){const sm=el.querySelector(':scope>summary');continue;}
    if(el.tagName==='SUMMARY')continue;
    if(el.tagName==='TABLE'){out.push({el,txt:'Tabela. Obejrzyj ją na ekranie.'});continue;}
    if(/^(H2|H3|H4|P|LI|BLOCKQUOTE|PRE)$/.test(el.tagName)){const t=el.innerText.trim();if(t)out.push({el,txt:t});continue;}
    const direct=Array.from(el.childNodes).some(n=>n.nodeType===3&&n.textContent.trim());
    if(direct){const t=el.innerText.trim();if(t)out.push({el,txt:t});continue;}
    gather(el,out);
  }
}
function clean(t){return t.replace(/→/g,', potem ').replace(/×/g,' razy ').replace(/≈/g,' około ').replace(/≠/g,' to nie to samo co ').replace(/(\d)–(\d)/g,'$1 do $2').replace(/·/g,', ').replace(/\s+/g,' ');}
function chunks(t){const parts=t.match(/[^.!?;:]+[.!?;:]*\s*/g)||[t];const out=[];let cur='';parts.forEach(p=>{if((cur+p).length>220&&cur){out.push(cur);cur=p;}else cur+=p;});if(cur.trim())out.push(cur);return out;}
function ttsMark(){$$('.reading').forEach(e=>e.classList.remove('reading'));const it=TTS.items[TTS.i];if(it){it.el.classList.add('reading');it.el.scrollIntoView({block:'center',behavior:'smooth'});}}
function ttsStatus(msg){if(TTS.unit){const st=TTS.unit.querySelector('.tts-st');if(st)st.textContent=msg;}}
function ttsSpeakItem(){
  if(!TTS.on)return;
  if(TTS.i>=TTS.items.length){ttsStop();ttsStatus('Koniec jednostki. Teraz odpowiedz na pytania.');return;}
  ttsMark();ttsStatus('Czytam '+(TTS.i+1)+' z '+TTS.items.length);
  const parts=chunks(clean(TTS.items[TTS.i].txt));let k=0;const v=pickVoice();
  const next=()=>{if(!TTS.on)return;if(k>=parts.length){TTS.i++;ttsSpeakItem();return;}
    const u=new SpeechSynthesisUtterance(parts[k++]);u.lang='pl-PL';if(v)u.voice=v;u.rate=TTS.pref.rate||1;u.onend=next;u.onerror=next;speechSynthesis.speak(u);};
  next();
}
function ttsStart(unit,fromEl){
  if(!window.speechSynthesis){alert('Ta przeglądarka nie obsługuje czytania.');return;}
  speechSynthesis.cancel();TTS.unit=unit;TTS.items=[];gather(unit,TTS.items);TTS.i=0;
  if(fromEl){const j=TTS.items.findIndex(it=>it.el===fromEl||it.el.contains(fromEl));if(j>=0)TTS.i=j;}
  TTS.on=true;TTS.paused=false;ttsButtons();ttsSpeakItem();
}
function ttsPause(){if(!TTS.on)return;if(TTS.paused){speechSynthesis.resume();TTS.paused=false;}else{speechSynthesis.pause();TTS.paused=true;}ttsButtons();}
function ttsStop(){TTS.on=false;TTS.paused=false;if(window.speechSynthesis)speechSynthesis.cancel();$$('.reading').forEach(e=>e.classList.remove('reading'));ttsButtons();}
function ttsButtons(){$$('.unit-tools').forEach(t=>{const mine=TTS.on&&t.closest('.unit')===TTS.unit;const p=t.querySelector('[data-t="pause"]');if(p){p.textContent=mine&&TTS.paused?'Wznów':'Pauza';p.disabled=!mine;}const s=t.querySelector('[data-t="stop"]');if(s)s.disabled=!mine;if(!mine){const st=t.querySelector('.tts-st');if(st&&!/Koniec/.test(st.textContent))st.textContent='';}});}
function voiceOptions(){const vs=plVoices();const cur=(pickVoice()||{}).name;if(!vs.length)return '<option>domyślny głos</option>';return vs.map(v=>'<option'+(v.name===cur?' selected':'')+'>'+v.name+'</option>').join('');}
function enhance(v){
  const units=$$('.unit',v);if(!units.length)return;
  const toc=$('[data-utoc]',v);
  if(toc)toc.innerHTML='<b style="font-family:var(--display);font-size:14px;align-self:center">Jednostki:</b>'+units.map((u,k)=>'<button data-go="'+k+'">'+(k+1)+'. '+u.querySelector('h2').textContent+'</button>').join('');
  if(toc)toc.onclick=e=>{const b=e.target.closest('[data-go]');if(b)units[+b.dataset.go].scrollIntoView({behavior:'smooth'});};
  const rates=[0.8,0.9,1,1.1,1.2,1.35];
  units.forEach(u=>{const t=u.querySelector('.unit-tools');if(!t)return;
    t.innerHTML='<button class="pri" data-t="play">▶ Słuchaj</button><button data-t="pause" disabled>Pauza</button><button data-t="stop" disabled>Stop</button>'+
      '<select data-t="rate" title="Tempo">'+rates.map(r=>'<option value="'+r+'"'+(((TTS.pref.rate||1)==r)?' selected':'')+'>'+String(r).replace('.',',')+'×</option>').join('')+'</select>'+
      '<select data-t="voice" title="Głos">'+voiceOptions()+'</select><span class="tts-st"></span>';
    t.onclick=e=>{const a=e.target.dataset.t;if(a==='play')ttsStart(u);else if(a==='pause')ttsPause();else if(a==='stop')ttsStop();};
    t.onchange=e=>{const a=e.target.dataset.t;if(a==='rate'){TTS.pref.rate=+e.target.value;ttsSave();$$('[data-t="rate"]').forEach(s=>s.value=e.target.value);}if(a==='voice'){TTS.pref.voice=e.target.value;ttsSave();$$('[data-t="voice"]').forEach(s=>s.value=e.target.value);}};
    u.addEventListener('dblclick',e=>{if(e.target.closest('.unit-tools,.rq summary,button,a'))return;ttsStart(u,e.target);});
  });
  $$('details.extra',v).forEach(d=>d.addEventListener('toggle',()=>{if(d.open)$$('[data-w]',d).forEach(el=>{try{el.innerHTML='';W[el.dataset.w](el)}catch(err){}});}));
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{$$('[data-t="voice"]').forEach(s=>s.innerHTML=voiceOptions());};
function eveApply(){let on=false;try{on=localStorage.getItem('ofkurs_eve')==='1'}catch(e){}document.documentElement.classList.toggle('evening',on);if(on)document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');const b=$('#evebtn');if(b){b.textContent=on?'☀ Tryb dzienny':'☾ Tryb wieczorny';}}
(function(){const a=$('aside');if(!a)return;const b=document.createElement('button');b.id='evebtn';b.className='evebtn';a.insertBefore(b,$('#nav'));b.onclick=()=>{let on=false;try{on=localStorage.getItem('ofkurs_eve')==='1';localStorage.setItem('ofkurs_eve',on?'0':'1')}catch(e){}eveApply();};eveApply();})();

function route(){if(window.speechSynthesis&&typeof ttsStop==='function')ttsStop();const id=location.hash.slice(1);glHide();if(id==='SL')renderGloss();else if(LESSONS[id])renderLesson(id);else if(QUIZ[id])renderQuiz(id);else renderStart();buildNav();window.scrollTo(0,0);}
/* move var() out of SVG presentation attributes into style, so theme tokens apply everywhere */
function fixSvg(root){$$('svg [fill*="var("],svg [stroke*="var("],svg [font-family*="var("]',root).forEach(n=>{['fill','stroke','font-family'].forEach(a=>{const v=n.getAttribute(a);if(v&&v.includes('var(')){n.style.setProperty(a,v);n.removeAttribute(a);}});});}
new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)fixSvg(n.parentNode||n);}));}).observe(document.body,{childList:true,subtree:true});
window.addEventListener('hashchange',route);
$('#msel').addEventListener('change',e=>{location.hash=e.target.value;});
route();
</script>
