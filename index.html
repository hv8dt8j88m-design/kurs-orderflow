<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Flow — Faber i Darius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: course app — sidebar with modules/lessons/quizzes, one lesson at a time in the main column. Buy = teal, sell = red, heat = infrared ramp. */
:root{
  --bg:#f4f6f5; --paper:#ffffff; --fg:#1b1f1e; --muted:#5b6561; --line:#dbe1de; --soft:#eaf0ed;
  --accent:#0f7c6c; --buy:#0f8a74; --sell:#c2412d; --warn:#a86b00; --poc:#7a3fb0; --va:#e9dcc6;
  --heat1:#f2b233; --heat2:#d9402b; --heat0:#20303a;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --paper:#191e1d; --fg:#e3e9e6; --muted:#98a39f; --line:#2b3331; --soft:#1f2826;
  --accent:#4cc3ad; --buy:#46c7ab; --sell:#f07c64; --warn:#e0a941; --poc:#c29af0; --va:#3a3325;
  --heat1:#f2b233; --heat2:#ff5a3c; --heat0:#0b1116; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --paper:#191e1d; --fg:#e3e9e6; --muted:#98a39f; --line:#2b3331; --soft:#1f2826;
  --accent:#4cc3ad; --buy:#46c7ab; --sell:#f07c64; --warn:#e0a941; --poc:#c29af0; --va:#3a3325;
  --heat1:#f2b233; --heat2:#ff5a3c; --heat0:#0b1116; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6;margin:0}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
a{color:var(--accent)}
button{font-family:var(--display);font-size:14px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--fg);padding:8px 12px;border-radius:7px}
button:hover{border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg)}
aside .brand{font-family:var(--display);font-weight:800;font-size:19px;display:block;text-decoration:none;color:var(--fg)}
aside .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:4px 0 16px}
.mod{margin-top:14px}
.mod .mt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.nav a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--fg);font-family:var(--display);font-size:13.5px;padding:5px 8px;border-radius:6px}
.nav a:hover{background:var(--soft)}
.nav a.cur{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.nav a .id{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:26px}
.nav a .ck{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--buy)}
.nav a.quiz{color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
main{padding-inline:clamp(16px,4vw,48px);padding-block:32px 90px;min-width:0}
.wrap{max-width:860px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;margin-top:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:10px}
.goals{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:18px}
.goals b{font-family:var(--display);font-size:14px}
.goals ul{margin:6px 0 0;padding-left:20px}
section.s{margin-top:34px}
section.s h2{font-size:23px;margin-bottom:10px}
section.s h3{font-size:17px;margin:18px 0 6px}
p,li{max-width:70ch}
.case{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--paper);border-radius:8px;padding:14px 18px;margin-top:18px}
.case .lab{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--warn);font-weight:600}
.tip{border-left:3px solid var(--accent);padding:4px 14px;margin-top:14px;color:var(--fg)}
.warnbox{border-left:3px solid var(--sell);padding:4px 14px;margin-top:14px}
.task{background:var(--soft);border-radius:10px;padding:14px 18px;margin-top:22px}
.task b{font-family:var(--display)}
.yt{display:inline-flex;gap:8px;align-items:center;text-decoration:none;font-family:var(--display);font-size:13.5px;font-weight:700;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;margin:4px 6px 4px 0;color:var(--fg)}
.yt:hover{border-color:var(--sell)}
.yt::before{content:"";width:0;height:0;border-left:8px solid var(--sell);border-top:5px solid transparent;border-bottom:5px solid transparent}
.yt span{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:12px}
.watch{margin-top:12px}
.w{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:18px}
.w .wt{font-family:var(--display);font-weight:700;font-size:14.5px;margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.w .wt::before{content:"◆";color:var(--accent);font-size:12px}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cap{font-size:15px;color:var(--fg);margin-top:8px;min-height:1.4em}
.cap b{font-family:var(--display)}
.mono{font-family:var(--mono);font-size:13px}
canvas{display:block;max-width:100%}
svg{display:block;max-width:100%;height:auto}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-family:var(--display);font-size:12.5px;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
label.rl{font-family:var(--display);font-size:13px;display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin:4px 0}
label.rl span.v{font-family:var(--mono);text-align:right}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:var(--soft);border-radius:8px;padding:10px 12px}
.stat .k{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
/* order book */
.ob{display:grid;grid-template-columns:70px 1fr 1fr;font-family:var(--mono);font-size:13px;gap:2px 8px;align-items:center}
.ob .h{color:var(--muted);font-size:11px;text-transform:uppercase}
.ob .p{text-align:right}
.ob .cell{height:22px;position:relative;border-radius:3px;background:var(--soft)}
.ob .cell i{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.85}
.ob .cell.ask i{left:0;background:var(--sell)}
.ob .cell.bid i{right:0;background:var(--buy)}
.ob .cell b{position:relative;z-index:1;padding:0 6px;line-height:22px;color:var(--fg);font-weight:600}
.ob .cell.bid b{float:right}
.ob .now{outline:2px solid var(--fg)}
.log{font-family:var(--mono);font-size:12.5px;background:var(--soft);border-radius:6px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;max-height:170px;overflow:auto}
/* footprint */
.fp{display:grid;grid-template-columns:auto auto;gap:14px;align-items:start}
.fpt{border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
.fpt td{padding:2px 8px;text-align:right;border:1px solid var(--line);min-width:52px}
.fpt td.px{color:var(--muted);border:0}
.fpt tr.poc td.bd,.fpt tr.poc td.ak{outline:2px solid var(--poc);outline-offset:-2px}
/* quiz */
.q{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:14px}
.q .qn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.q .qq{font-weight:600;margin:4px 0 8px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.q label:hover{background:var(--soft)}
.q label.ok{background:color-mix(in srgb,var(--buy) 16%,transparent)}
.q label.bad{background:color-mix(in srgb,var(--sell) 16%,transparent)}
.q input{margin-top:6px;accent-color:var(--accent)}
.q .fb{margin-top:8px;font-size:15px;border-left:3px solid var(--line);padding-left:12px}
.q .fb.ok{border-color:var(--buy)}
.q .fb.bad{border-color:var(--sell)}
.result{background:var(--paper);border:2px solid var(--fg);border-radius:12px;padding:18px;margin-top:22px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:40px;flex-wrap:wrap}
.pager a{font-family:var(--display);font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--paper);padding:10px 14px;border-radius:8px;color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:16px;margin-bottom:6px}
.card ol{margin:0;padding-left:20px;font-size:15px}
.chk label{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.chk input{margin-top:6px;accent-color:var(--accent)}
.mnav{display:none}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{display:none}.mnav{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}.mnav select{width:100%;font-family:var(--display);font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--fg)}label.rl{grid-template-columns:1fr 60px}label.rl>span:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gl{border-bottom:1.5px dotted var(--accent);cursor:help}
.gl:hover{background:var(--soft)}
#glpop{position:absolute;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 10px 28px rgb(0 0 0 / .18);font-size:15px;line-height:1.5}
#glpop b{font-family:var(--display)}
#glpop i{color:var(--muted)}
#glpop p{margin:6px 0 8px}
#glpop a{font-family:var(--display);font-size:13px;font-weight:700}
.glsearch{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.glsearch input{font-family:var(--display);font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--fg);width:min(420px,100%)}
.glcats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.glcats a{font-family:var(--display);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--fg);background:var(--paper)}
.glcats a:hover{border-color:var(--accent)}
.gll{margin:0}
.gli{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:4px 18px;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:6px}
.gli dt{font-family:var(--display);font-weight:700}
.gli dt span{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted);font-style:italic}
.gli dd{margin:0;max-width:62ch}
.gllink{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:4px}
.gli.hl{background:var(--soft)}
table.dom{max-width:360px;margin-top:10px}
table.dom td,table.dom th{text-align:center}
table.dom td.b{color:var(--buy);font-weight:600}
table.dom td.k{color:var(--sell);font-weight:600}
@media (max-width:600px){.gli{grid-template-columns:1fr}}
.ofb{display:grid;grid-template-columns:100px 64px 100px 190px 64px;min-width:540px;font-family:var(--mono);font-size:13px;gap:2px 0}
.ofh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:4px 6px;line-height:1.3;align-self:end}
.ofc{height:26px;position:relative;display:flex;align-items:center;padding:0 6px}
.ofc.bid{justify-content:flex-end;background:var(--soft)}
.ofc.ask{background:var(--soft)}
.ofc.bid i,.ofc.ask i{position:absolute;top:3px;bottom:3px;opacity:.28;border-radius:3px}
.ofc.bid i{right:0;background:var(--buy)}
.ofc.ask i{left:0;background:var(--sell)}
.ofc b{position:relative;font-weight:600}
.ofc em{position:absolute;font-style:normal;font-size:9.5px;color:var(--muted);bottom:-1px;left:6px}
.ofc.ask em{left:auto;right:6px}
.ofc.px{justify-content:center;font-weight:600}
.ofc.px.now{background:var(--fg);color:var(--bg);border-radius:4px}
.ofc.sep,.ofh.sep{border-left:2px solid var(--line);margin-left:10px;padding-left:12px}
.ofc.fp{justify-content:center;gap:6px}
.ofc .fb{color:var(--sell);font-weight:600}
.ofc .fa{color:var(--buy);font-weight:600}
.ofc .mut{color:var(--line)}
.ofc.cn{justify-content:center}
.ofc.cn i{display:block}
.ofc.cn i.bd{width:22px;height:100%}
.ofc.cn i.wk{width:3px;height:100%}
.ofc.cn i.up{background:var(--buy)}
.ofc.cn i.dn{background:var(--sell)}
.ofc.foot{height:auto;padding:6px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.extra{margin-top:22px;border:2px dashed var(--accent);border-radius:12px;padding:16px 20px;background:var(--soft)}
.extra .xlab{font-family:var(--mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.extra h3{margin-top:4px}

/* v63: jednostki, audio, tryb wieczorny */
.unit-nr{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.unit h3.sh{font-size:1.2em;margin:1.6em 0 .6em}
.unit h4{font-size:1.04em;margin:1.4em 0 .5em}
.unit-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 16px}
.unit-tools select{font-family:var(--display);font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--fg)}
.unit-tools .tts-st{font-family:var(--mono);font-size:12px;color:var(--muted)}
.reading{background:color-mix(in srgb,var(--warn) 20%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 20%,transparent);border-radius:4px}
details.extra{border:1px dashed var(--line);border-radius:8px;padding:8px 14px;margin:20px 0;background:var(--soft)}
details.extra>summary{cursor:pointer;font-family:var(--display);font-weight:700;color:var(--muted);font-size:15px}
details.extra[open]>summary{margin-bottom:10px}
.rcheck{border-left:4px solid var(--accent);background:var(--soft);padding:12px 16px;margin:24px 0}
.rcheck .rlab{font-family:var(--display);font-weight:800;margin-bottom:6px}
.rcheck .rlab span{font-weight:400;color:var(--muted);font-size:13px}
.rq{margin:12px 0}.rq .q{margin:0 0 4px;font-weight:600}
.rq details>summary{cursor:pointer;color:var(--accent);font-family:var(--display);font-size:14px}
.rq details>p{margin:6px 0 0}
.utoc{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 22px}
.utoc button{font-size:13px;padding:6px 10px}
.evebtn{width:100%;margin:10px 0 4px}
html.evening body{font-size:19.5px;line-height:1.8}
html.evening .rq .q{font-weight:700}
</style>

<div class="mnav"><select id="msel" aria-label="Wybierz lekcję"></select></div>
<div class="app">
  <aside><a class="brand" href="#start">Order Flow</a><div class="sub">Faber Vaale · Darius FX · kurs</div>
    <div class="bar" aria-label="Postęp kursu"><i id="pbar" style="width:0"></i></div>
    <div class="sub" id="ptxt" style="margin-top:6px"></div>
    <nav class="nav" id="nav"></nav></aside>
  <main><div class="wrap" id="view"></div></main>
</div>

<script>
/* ======================= utilities ======================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mmss(t){const m=Math.floor(t/60),s=t%60;return m+':'+String(s).padStart(2,'0');}
function yt(id,t,label,e){return '<a class="yt" href="https://www.youtube.com/watch?v='+id+'&t='+t+'s" target="_blank" rel="noopener">'+label+' <span>'+mmss(t)+(e?'–'+mmss(e):'')+'</span></a>';}
function canvasIn(el,h){const cv=document.createElement('canvas');el.appendChild(cv);return cv;}
function prep(cv,h){const w=Math.max(280,cv.parentElement.clientWidth);const d=window.devicePixelRatio||1;cv.width=w*d;cv.height=h*d;cv.style.width=w+'px';cv.style.height=h+'px';const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return {c,w,h};}
const store={get(){try{return JSON.parse(localStorage.getItem('ofkurs')||'{}')}catch(e){return {}}},set(o){try{localStorage.setItem('ofkurs',JSON.stringify(o))}catch(e){}}};
function valueArea(bins){let tot=0,poc=0;bins.forEach((v,i)=>{tot+=v;if(v>bins[poc])poc=i});let lo=poc,hi=poc,acc=bins[poc];while(acc<tot*0.7&&(lo>0||hi<bins.length-1)){const up=hi<bins.length-1?bins[hi+1]:-1,dn=lo>0?bins[lo-1]:-1;if(up>=dn){hi++;acc+=up}else{lo--;acc+=dn}}return {poc,lo,hi};}

/* ======================= course data ======================= */
const MODS=[
 {id:'A',name:'Moduł A · Fundamenty',items:['L1','L2','QA']},
 {id:'A2',name:'Moduł A2 · Darius: darmowy kurs 2 h (7 krótkich lekcji z testami)',items:['D1','TD1','D2','TD2','D3','TD3','D4','TD4','D5','TD5','D6','TD6','D7','TD7']},
 {id:'B',name:'Moduł B · Volume profile',items:['L3','L4','QB']},
 {id:'C',name:'Moduł C · Potwierdzenie',items:['L5','L6','L7','QC']},
 {id:'D',name:'Moduł D · Modele i prowadzenie',items:['L8','L9','L10','QD']},
 {id:'E',name:'Moduł E · Praktyka',items:['L11','L12','L13','QE']},
 {id:'F',name:'Moduł F · Faber: struktura i sesje',items:['L14','L15','L16','QF']},
 {id:'G',name:'Moduł G · Faber: bias, newsy, makro',items:['L17','L18','QG']},
 {id:'H',name:'Moduł H · Faber: edge, ryzyko, psychika',items:['L19','L20','QH']},
 {id:'I',name:'Moduł I · Faber: strategia H4, zarządzanie, Wyckoff',items:['L21','L22','L23','QI']},
 {id:'J',name:'Moduł J · Faber na żywo: modele NQ i dzień scalpera',items:['L24','L25','QJ']},
 {id:'K',name:'Moduł K · Ściągi: czas, prowadzenie pozycji, ryzyko, modele',items:['L26','L27','L28','L29','QK']},
 {id:'L',name:'Moduł L · Dodatki: instrumenty pochodne',items:['L30']}
];
const F='fabervaale', D='darius';
const LESSONS={};

<section class="s unit" data-unit="1"><div class="unit-nr">Jednostka 1 z 6</div><h2>Agresywni i pasywni: kto rusza cenę</h2>
<div class="unit-tools"></div>
<h3 class="sh">1. Jak Faber definiuje rynek</h3>
<p>Faber zaczyna od jednego zdania i warto je zapamiętać dosłownie: rynek to <b>spotkanie dwóch zamiarów, zamiaru kupna i zamiaru sprzedaży</b>, kierowanych przez <b>centralną giełdę</b> i zapisywanych jako <b>wolumen</b>.</p>
<p>W tym zdaniu są trzy rzeczy, na których stoi cały kurs:</p>
<ul><li><b>Każda transakcja ma dwie strony.</b> Nie da się „kupić”, jeśli ktoś w tym samym momencie nie sprzeda. Kupujący i sprzedający są zawsze w równej liczbie kontraktów. Różni ich tylko to, <b>kto był aktywny, a kto czekał</b>.</li>
<li><b>Giełda to jedno miejsce, przez które przechodzi wszystko.</b> Dlatego każdą transakcję da się zapisać i policzyć.</li>
<li><b>Wolumen to ten zapis.</b> Order flow (ang. przepływ zleceń) to czytanie tego zapisu: nie samej ceny, tylko tego, kto i z jaką siłą ją przesunął.</li></ul>
<p>Na wykresie świecowym widzisz tylko wynik: cena poszła z A do B. Order flow pokazuje, jaki wysiłek do tego doprowadził i kto go wykonał. Cały kurs to porównywanie tych dwóch rzeczy: <b>wysiłku</b> (ile kontraktów, czyja agresja) i <b>rezultatu</b> (co zrobiła cena).</p>
<div class="watch">${yt('Pz8f0wWW12M',0,'Faber · czym jest order flow (wstęp)',60)}</div>
<h3 class="sh">2. Dwie siły: agresywni i pasywni</h3>
<p>Każde zlecenie na rynku jest jednym z dwóch typów. Faber nazywa je siłami. <b>Zlecenie limit</b> ma podaną cenę i czeka w księdze, aż ktoś je przyjmie. <b>Zlecenie rynkowe</b> (market) wykonuje się natychmiast po najlepszej dostępnej cenie. <b>Market maker</b> (dostawca płynności) to ten, kto wystawia limity, <b>market taker</b> (biorca płynności) to ten, kto je zjada zleceniem rynkowym.</p>
<div class="scroll"><table class="t"><tr><th></th><th>Pasywni (limit, market maker)</th><th>Agresywni (rynkowe, market taker)</th></tr>
<tr><td>Co robią</td><td>wystawiają zlecenie z ceną i czekają w księdze zleceń</td><td>klikają „kup” albo „sprzedaj” teraz, po tym, co jest w księdze</td></tr>
<tr><td>Czego są pewni</td><td><b>ceny</b>: sami wybrali poziom (Faber: „pricing authority”, czyli władza nad ceną)</td><td><b>wykonania</b>: zostaną wypełnieni na pewno („execution authority”, czyli władza nad wykonaniem)</td></tr>
<tr><td>Czego nie są pewni</td><td>wykonania i czasu: ktoś musi przyjść i zaakceptować ich cenę</td><td>ceny: mogą kliknąć przy 101, a dostać 102</td></tr>
<tr><td>Co płacą</td><td>ryzyko, że cena ucieknie bez nich</td><td>spread i poślizg (gorszą cenę za pośpiech)</td></tr>
<tr><td>Rola w ruchu ceny</td><td><b>opór</b></td><td><b>presja</b>: to oni ruszają cenę</td></tr></table></div>
<p><b>Spread</b> to odstęp między najlepszą ceną kupna (<b>best bid</b>, najwyższy czekający limit kupna) a najlepszą ceną sprzedaży (<b>best ask</b>, najniższy czekający limit sprzedaży). Agresywny kupujący zawsze płaci best ask (a gdy jego zlecenie jest większe niż to, co tam czeka, także kolejne, droższe poziomy strony ask). Agresywny sprzedający zawsze dostaje best bid (a przy dużym zleceniu także niższe poziomy strony bid).</p>
<p><b>Gdzie leżą limity:</b> limit kupna zawsze <b>pod</b> aktualną ceną, limit sprzedaży zawsze <b>nad</b> nią. Najwyższy z limitów kupna to best bid, najniższy z limitów sprzedaży to best ask, a między nimi jest spread.</p>
<div class="warnbox"><b>Słowniczek, którego trzymamy się w całym kursie.</b> <b>Strona bid</b> (bid) = wszystkie limity kupna w księdze, pod ceną. <b>Best bid</b> = najwyższy z nich, jeden poziom. <b>Strona ask</b> (ask) = wszystkie limity sprzedaży, nad ceną. <b>Best ask</b> = najniższy z nich. W footprincie: <b>kolumna bid</b> = transakcje wykonane na stronie bid, czyli sprzedaż agresywna; <b>kolumna ask</b> = transakcje wykonane na stronie ask, czyli kupno agresywne. Te pojęcia nie są zamienne.</div>
<div class="w" data-w="spread"></div>
<p><b>Spread nie jest stały.</b> Zwęża się, gdy płynności jest dużo, a poszerza, gdy jej brakuje: chwilę po dużym zleceniu rynkowym (zanim market makerzy zapełnią dziurę), przed newsami i w ich trakcie, na otwarciu sesji, w nocy, w święta i przy rolowaniu kontraktów. Na NQ (kontrakt futures E-mini Nasdaq-100 z giełdy CME, czyli Chicago Mercantile Exchange) 1 tick (najmniejszy możliwy ruch ceny) = 0,25 pkt = 5 $ na kontrakt; na MNQ (Micro E-mini Nasdaq-100, wersja 10 razy mniejsza) 0,50 $; na ES (kontrakt futures E-mini S&amp;P 500) 12,50 $. Na CFD (kontraktach u brokera, np. FTMO w platformie MT5, czyli MetaTrader 5) spread ustala broker: w spokojnym rynku jest stały, ale mocno rośnie na newsach i ok. 21–23 czasu polskiego (lekcja 22). Dla OBR (Twojego bota w MT5, który gra wybicie zakresu otwarcia sesji): wejście buy stopem (zleceniem kupna, które uruchamia się po dotknięciu poziomu) to zlecenie rynkowe, więc płaci best ask (albo gorzej, gdy zjada kolejne poziomy); wybicie w chwili szerokiego spreadu daje gorsze wejście niż poziom w kodzie, a backtest ze stałym, małym spreadem jest zbyt optymistyczny.</p>
<div class="w" data-w="spreadmoves"></div>

<details class="extra"><summary>Dla dociekliwych: opłaty za transakcję</summary><h4>Opłaty: stały koszt za transakcję, nie za tick</h4>
<p>Prowizję brokera i opłaty giełdowe płacisz <b>raz za pełną transakcję</b> (wejście + wyjście), bez względu na to, ile ticków zarobisz. Dlatego im mniejszy ruch łapiesz, tym większą część zysku zjadają opłaty. Na micro przy ruchu 1–2 ticki tracisz nawet wtedy, gdy trafiłeś kierunek.</p>
<p><b>NQ</b> (kontrakt futures E-mini Nasdaq-100): 1 tick = 5 $, koszt pełnej transakcji ok. 4,50 $ (koszt przyjęty w audycie modelu IVB, czyli Initial Volume Breakout, strategii wybicia zakresu otwarcia Fabera z lekcji 9; u Twojego brokera może być inny).</p>

<li><b>Stratne transakcje też płacą opłaty:</b> strata 10 ticków na NQ to −50 $ − 4,50 $ = −54,50 $.</li>
<li><b>Dlatego łapanie 1–2 ticków (jak market maker) nie działa dla tradera prywatnego</b>, a Faber i Darius celują w ruchy kilkunasto- i kilkudziesięciotickowe przy RR (stosunku ryzyka do zysku) 1:2–1:3. Wtedy opłaty to kilka procent zysku.</li>
<li><b>Zasada praktyczna:</b> zanim wejdziesz, sprawdź, czy cel jest wielokrotnie większy od opłaty.</li></ul>

<details class="extra"><summary>Dla dociekliwych: kto zarabia na spreadzie, market makerzy i algorytmy</summary><h4>Kto zarabia na spreadzie?</h4>
<p>Przede wszystkim ci, którzy go tworzą, czyli <b>market makerzy</b> (dostawcy płynności, dziś zwykle firmy algorytmiczne, np. Citadel Securities, Jump Trading, Virtu). Wystawiają jednocześnie limit kupna na best bid i limit sprzedaży na best ask. Gdy agresywny sprzedający uderzy w ich bid, a chwilę później agresywny kupujący weźmie ich ask, zarabiają różnicę: 1 tick, na NQ 5 $ na kontrakt. To grosze na pojedynczej transakcji, ale powtarzane tysiące razy dziennie w ułamkach sekund. Giełda CME ma też programy dla market makerów z obniżonymi opłatami za stałe utrzymywanie płynności.</p>
<div class="w" data-w="mmday"></div>
<p><b>Dlaczego to nie jest darmowy pieniądz.</b> Market maker zarabia na walce w tle, gdy cena odbija bid–ask–bid. Gdy przychodzi duże, jednostronne zlecenie (jak w kroku 3 w sekcji 3), jego limity zostają zjedzone i nagle ma pozycję przeciw ruchowi. Fachowo to <b>adverse selection</b> (niekorzystny wybór): wykonujesz się właśnie wtedy, gdy rynek idzie przeciw Tobie. Jeden taki przejazd potrafi zabrać zysk z wielu cykli. Dlatego market makerzy zdejmują limity przed newsami i poszerzają spread przy niepewności. To biznes dla firm z najszybszą technologią i serwerami tuż obok serwerów giełdy.</p>
<ul><li><b>Broker CFD</b> (np. przy handlu na FTMO) ustala spread sam i dolicza do niego marżę. Według Dariusa w modelu B-book (broker nie wysyła Twojego zlecenia na rynek, tylko sam jest Twoim kontrahentem; sekcja 7) zarabia też na stratach klientów.</li>
<li><b>Giełda</b> nie zarabia na spreadzie, tylko na opłatach od każdej transakcji.</li>
<li><b>Spread płaci każdy agresor</b>: każde zlecenie rynkowe i każdy odpalony stop. Także Twój OBR, gdy wchodzi buy stopem.</li>
<li><b>Czy Ty możesz na nim zarabiać?</b> W teorii tak: wchodzisz limitem i stoisz po stronie pasywnej. W praktyce masz pułapkę kolejki (sekcja 9.8): Twój limit wykona się najczęściej wtedy, gdy rynek przejdzie przez Twój poziom, czyli ta sama adverse selection w małej skali.</li></ul>
<p><b>Czy te algorytmy przestają działać na newsach, na otwarciu i przy dużym spreadzie?</b> Nie wyłączają się, tylko zmieniają zachowanie. Przyczyna i skutek są tu odwrotnie, niż się wydaje: to nie duży spread wyłącza market makerów, tylko ich wycofanie <b>powoduje</b> duży spread.</p>
<div class="scroll"><table class="t"><tr><th>Sytuacja</th><th>Co robią market makerzy</th><th>Skutek dla Ciebie</th></tr>
<tr><td><b>Sekundy przed ważnym newsem</b> (np. CPI, czyli inflacja konsumencka w USA)</td><td>zdejmują większość limitów albo zostawiają je daleko od ceny</td><td>spread nagle szeroki, księga pusta, ogromny poślizg</td></tr>
<tr><td><b>Chwilę po newsie</b></td><td>wracają, zwykle w ciągu sekund: najpierw z szerokim spreadem, potem coraz węższym</td><td>pierwsze sekundy to najgorsze ceny, potem rynek się uspokaja</td></tr>
<tr><td><b>Otwarcie sesji</b></td><td>działają, ale ostrożniej: szerszy spread, mniejsze ilości</td><td>większe ruchy i poślizg w pierwszych minutach</td></tr>
<tr><td><b>Spokojny rynek</b></td><td>stoją ciasno (1 tick) i zarabiają na walce w tle</td><td>spread minimalny</td></tr></table></div>
<ul><li><b>Nie wszystkie algorytmy się wycofują.</b> Market makerzy chronią się przed ryzykiem, ale inne algorytmy, które <b>grają kierunek</b> i reagują na news w mikrosekundach, są wtedy najbardziej aktywne. To one zjadają pustą księgę i robią gwałtowną świecę newsa. Dlatego Faber nie gra samej świecy newsa (lekcja 18).</li>
<li>Market makerzy w programach giełdy mają często obowiązek wystawiania limitów przez określony czas, ale w skrajnych momentach mogą to robić z szerokim spreadem. Formalnie są na rynku, a w praktyce płynności brakuje.</li></ul>
<div class="extra"><div class="xlab">Materiał nadprogramowy · dla lepszego zrozumienia rynku</div>
<h4>Jak market maker zarabia i co robi, gdy rynek go „przejedzie”</h4>
<p><b>1. „Kupił po 99, sprzedał po 101”: to dwie transakcje, a zysk z całego cyklu.</b> Dla giełdy to dwie osobne transakcje: najpierw kupno po 99 od agresywnego sprzedającego, potem sprzedaż po 101 agresywnemu kupującemu. Zysk market maker liczy dla całego cyklu (pozycja otwarta, potem zamknięta): 101 − 99 = 2 punkty. Jeśli <b>obie strony się wypełnią</b>, zarabia tak czy siak. Problem w tym, że <b>nie ma gwarancji, że druga strona się wypełni</b>. O tym decyduje rynek, a nie market maker.</p>
<p><b>2. Co się dzieje, gdy ktoś mocno kupuje.</b> Zdejmowanie limitu i stawianie nowego wyżej dotyczy tylko <b>limitów, które jeszcze się nie wykonały</b>. Limit, który się wykonał, przestał być limitem i stał się <b>pozycją</b>. Kolejność:</p>
<ol><li>Duży kupujący zjada limit sprzedaży market makera na 101. Market maker ma teraz <b>short</b> (pozycję sprzedaży) po 101.</li>
<li>Cena idzie na 103. Short jest na minusie.</li>
<li>Pozostałe, niewykonane limity market maker zdejmuje i stawia wyżej. To jednak nie usuwa shorta: <b>musi go kiedyś odkupić</b>, a odkupi drożej, niż sprzedał.</li></ol>
<p>Jak się przed tym broni? Zwykle <b>nie klasycznym stop lossem</b>, tylko trzema narzędziami:</p>
<ul><li><b>Przesuwanie limitów na swoją korzyść</b> (inventory skew, czyli przechylanie kwotowań). Mając shorta, podnosi swój limit kupna bliżej ceny, żeby szybciej odkupić, a limit sprzedaży odsuwa dalej, żeby nie dokładać shortów.</li>
<li><b>Zabezpieczenie na innym rynku</b> (hedging). Np. short na NQ (kontrakt futures E-mini Nasdaq-100) równoważy kupnem ES (kontrakt futures E-mini S&amp;P 500), bo oba indeksy chodzą prawie razem.</li>
<li><b>Twarde limity pozycji i „wyłącznik”</b> (kill switch). Po przekroczeniu określonej straty albo wielkości pozycji algorytm zamyka wszystko rynkowo i przestaje kwotować.</li></ul>
<p><b>3. Czy to realne i do zarządzania?</b> <b>Dla nich tak.</b> Działa to dlatego, że:</p>
<ul><li>robią <b>ogromną liczbę cykli</b>: zyski z setek tysięcy małych cykli pokrywają rzadkie, większe straty;</li>
<li>są <b>szybsi od agresorów</b>: zdejmują limity, zanim duże zlecenie dotrze do kolejnych poziomów, więc tracą rzadziej i mniej;</li>
<li>mają <b>niskie koszty</b> i zwroty opłat od giełdy (programy dla market makerów).</li></ul>
<p>Logika „mały zysk często, kontrolowana strata rzadko” działa tylko wtedy, gdy przewaga na cykl jest większa od średniej straty na przejazdach. U nich tak jest dzięki szybkości i skali.</p>
<p><b>Dla tradera prywatnego nie.</b> Twój limit stoi na końcu kolejki (FIFO, ang. first in, first out, czyli „pierwszy przyszedł, pierwszy obsłużony”: kto pierwszy wystawił limit, ten pierwszy się wykona), a przestawiasz go o rząd wielkości wolniej. Do tego płacisz opłaty, które przy 1–2 tickach zjadają cały zysk (tabele w podrozdziale „Opłaty: stały koszt za transakcję”). Wychodzi więc odwrotnie: Twoje limity wykonywałyby się głównie przy przejazdach, a zysk z cykli zjadałyby opłaty.</p>
<p><b>Co z tego przenosisz do swojego tradingu:</b> zasady, nie technologię. Dostarczaj płynność tam, gdzie inni się spieszą i zostają zaabsorbowani (krawędzie wartości w balansie, lekcja 2), nie stój na drodze dużego jednostronnego ruchu, wycofaj się przed newsami (lekcja 18), trzymaj stałe ryzyko i twarde limity dzienne (lekcje 12 i 20). Zamiast łapać 1 tick tysiące razy, łapiesz kilkanaście albo kilkadziesiąt ticków kilka razy w tygodniu tam, gdzie order flow daje Ci przewagę.</p>
<h4>Jak korzystamy z mechanizmu algorytmów, nie będąc ich właścicielami</h4>
<p>Nie budujemy własnego algorytmu. <b>Czytamy ślady, które algorytmy zostawiają w księdze zleceń i w footprincie</b>, i ustawiamy się po stronie, która ma przewagę. Konkretnie w czterech sytuacjach:</p>
<ol><li><b>Ich wycofanie to dla nas ostrzeżenie.</b> Gdy market makerzy zdejmują limity (szeroki spread, cienka księga przed newsem), to znak, że ryzyko przejazdu jest duże. My wtedy też nie wchodzimy: ta sama decyzja co ich, tylko bez ich infrastruktury.<br><b>Skąd to wiemy?</b> Na futures (np. NQ, kontrakt futures E-mini Nasdaq-100 z giełdy CME) zlecenia limit <b>widać</b>: DOM (Depth of Market, księga zleceń na żywo) pokazuje liczbę kontraktów na każdej cenie, a heatmapa (mapa ciepła) zapisuje ją w czasie. Niewidoczne są tylko zlecenia stop (sekcja 9.5). Wycofanie market makerów widać więc w trzech miejscach naraz: liczby w DOM-ie maleją (zamiast 15–30 kontraktów na poziomie zostają pojedyncze albo puste poziomy), heatmapa blednie wokół ceny, a na końcu poszerza się spread (z 1 ticka do kilku). Spread to objaw najpóźniejszy. Na CFD (np. US100 na FTMO w MT5, czyli MetaTrader 5) księgi nie ma, więc zostaje tylko spread brokera: pośredni, spóźniony ślad tego samego. Dlatego Darius analizuje na futures, a wykonuje na CFD. Najprostszy sygnał nie wymaga żadnych danych: <b>kalendarz makro</b>. Mówi z góry, kiedy market makerzy się wycofają (np. 14:30 polskiego czasu w dni NFP, czyli raportu o zatrudnieniu w USA, i CPI, czyli inflacji konsumenckiej). DOM i spread tylko to potwierdzają na żywo.</li>
<li><b>Ich obrona poziomu to nasza lokalizacja wejścia.</b> Duża ściana limitów, która w footprincie naprawdę zjada agresję (absorpcja, iceberg odnawiający się na jednym poziomie, „ściana ochronna” Fabera), pokazuje, że ktoś duży broni ceny. Wchodzimy obok niego, ze stopem tuż za nim (sekcja 9.8).</li>
<li><b>Ich płynność to nasz tani wjazd i wyjazd.</b> W spokojnym rynku spread ma 1 tick i wchodzimy albo wychodzimy bez dużego poślizgu. Dlatego nie robimy transakcji w momentach, gdy ich nie ma (otwarcie sesji, newsy).</li>
<li><b>Ich przejazd to czasem nasze paliwo.</b> Gdy duże zlecenie przejedzie market makerów, zostają z pozycją przeciw ruchowi i muszą ją zamknąć, czyli kupić albo sprzedać w tym samym kierunku. To dokłada nacisku jak odpalone stopy z sekcji 9.3. Jeśli jesteśmy po stronie agresji, ich zamykanie pozycji nam pomaga.</li></ol>
<p><b>Dwa zastrzeżenia, żeby nie przecenić tej przewagi:</b></p>
<ul><li><b>Nie wiemy, kto stoi za zleceniem.</b> W DOM-ie (Depth of Market, księga zleceń na żywo) i w footprincie widzimy limity i transakcje, a nie nazwę firmy. Czytamy skutki, a nie intencje, dlatego potwierdzenie zawsze daje wykonanie, a nie samo zlecenie.</li>
<li><b>To działa też w drugą stronę.</b> Algorytmy czytają rynek szybciej od nas i wykorzystują przewidywalne zachowania detalu: wyprzedzają duże limity kupna, grają na skupiskach stopów pod oczywistymi dołkami i zdejmują limity, zanim do nich dojdziemy (spoof, czyli fałszywe zlecenie). Nasza przewaga nie bierze się z szybkości, tylko z <b>cierpliwości i wyboru miejsca</b>: czekamy na sytuację, w której wynik walki jest już widoczny.</li></ul>
<h4>Kto gra kierunek na newsach: algorytmy, firmy, dane i wyniki</h4>
<p>Rozwinięcie zdania z tabeli powyżej, że nie wszystkie algorytmy się wycofują. Większość tych firm to spółki prywatne, więc ich wyniki znamy z przecieków do prasy. Pełne, audytowane sprawozdanie publikuje tylko Virtu, bo jest notowana na giełdzie.</p>
<p><b>1. Jakie to algorytmy</b></p>
<div class="scroll"><table class="t"><tr><th>Rodzaj</th><th>Co robi</th><th>Kiedy jest najaktywniejszy</th></tr>
<tr><td><b>Algorytmy newsowe</b> (event-driven, czyli reagujące na zdarzenie)</td><td>odbierają dane makro w formacie dla maszyn w chwili publikacji, porównują z prognozą (konsensusem) i wysyłają zlecenia w mikro- i milisekundach</td><td>publikacje o 8:30 czasu nowojorskiego (14:30 w Polsce): NFP (Non-Farm Payrolls, zatrudnienie poza rolnictwem w USA), CPI (Consumer Price Index, inflacja konsumencka), decyzje Fed (Federal Reserve, banku centralnego USA)</td></tr>
<tr><td><b>Arbitraż opóźnień</b> (latency arbitrage)</td><td>ta sama informacja dociera w różne miejsca w różnym czasie; kto pierwszy, ten handluje po starej cenie na wolniejszym rynku</td><td>zawsze, najbardziej przy gwałtownych ruchach</td></tr>
<tr><td><b>Momentum krótkoterminowe</b></td><td>dołącza do pierwszego impulsu i zjada kolejne poziomy księgi</td><td>pierwsze sekundy po newsie i po otwarciu sesji</td></tr>
<tr><td><b>Arbitraż między instrumentami</b></td><td>pilnuje, żeby powiązane rynki chodziły razem: NQ (kontrakt futures E-mini Nasdaq-100) z ES (E-mini S&amp;P 500), futures z akcjami i z ETF-ami (funduszami notowanymi na giełdzie)</td><td>ciągle; przy newsie przenosi ruch z jednego rynku na resztę</td></tr></table></div>
<p><b>Ważne:</b> to często <b>te same firmy</b>, które robią market making. W jednej firmie jedna strategia wycofuje limity przed newsem, a inna w tej samej sekundzie agresywnie zjada pustą księgę. Z zewnątrz widzisz tylko skutek: pustą księgę i gwałtowną świecę.</p>
<p><b>2. Kto to robi.</b> Największe firmy tradingu ilościowego (handlu opartego na algorytmach) i market makingu: Jane Street, Hudson River Trading (HRT), Citadel Securities, Jump Trading, Virtu Financial, Optiver, XTX Markets, Tower Research, DRW, IMC. Wszystkie łączą market making z własnymi strategiami kierunkowymi. Ile która zarabia na samych newsach, nikt nie publikuje.</p>
<p><b>3. Dane: jak szybki jest ten wyścig</b></p>
<ul><li><b>Chicago–Nowy Jork:</b> w latach 2010–2012 czas przesyłu informacji między giełdą CME (Chicago Mercantile Exchange) a giełdami akcji w New Jersey skrócił się o ok. <b>3 milisekundy</b>, najpierw dzięki nowemu łączu światłowodowemu, potem sieciom mikrofalowym. Koszt infrastruktury i 5 lat utrzymania badacze szacują na <b>ponad 500 mln $</b>.</li>
<li><b>Ile warta jest milisekunda:</b> firma Tradeworx podawała w 2012 roku, że jej przewaga ok. 2,3 ms była warta ok. <b>1 350 $ dziennie</b> na jednej strategii arbitrażu między futures na S&amp;P 500 w Chicago a odpowiednikiem w Nowym Jorku.</li>
<li><b>Futures prowadzą rynek:</b> badanie potwierdza, że ceny futures z Chicago wyprzedzają ceny akcji, dlatego wszyscy ścigają się o dane z CME.</li>
<li><b>Decyzja Fed 18 września 2013:</b> informacja leci z Waszyngtonu do Chicago ok. 7 ms. Firma Nanex wykazała zakupy E-mini w Chicago ok. 3 ms po godzinie 14:00 czasu nowojorskiego i zasugerowała przeciek. Virtu odpowiedziała, że analiza ma błędne znaczniki czasu, a niezależna analiza Quincy Data uznała dane za zgodne z równoczesną publikacją. Spór dotyczył <b>kilku milisekund</b>.</li>
<li><b>Ile kontraktów wchodzi w pierwszej minucie</b> (badanie CME, lata 2021–2025): niespodzianka w NFP o jedno odchylenie standardowe dawała ok. <b>174 tys. kontraktów</b> ponad średnią między 8:30:00 a 8:30:59 czasu nowojorskiego. Niespodzianki w CPI dokładały mniej: ok. <b>20–30 tys. kontraktów</b> w pierwszej minucie.</li></ul>

<section class="s unit" data-unit="2"><div class="unit-nr">Jednostka 2 z 6</div><h2>Od księgi zleceń do świecy: przykład Fabera krok po kroku</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 1 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Czego jest pewny pasywny uczestnik (zlecenie limit), a czego agresywny (zlecenie rynkowe)?</p><details><summary>Pokaż odpowiedź</summary><p>Pasywny ma pewność <b>ceny</b>, ale nie wykonania. Agresywny ma pewność <b>wykonania</b>, ale nie ceny: przy dużym zleceniu zje kilka poziomów i zapłaci średnio drożej.</p></details></div><div class="rq"><p class="q">Gdzie zawsze leżą limity kupna, a gdzie limity sprzedaży?</p><details><summary>Pokaż odpowiedź</summary><p>Limity kupna (strona bid) zawsze <b>pod</b> ceną, limity sprzedaży (strona ask) zawsze <b>nad</b> ceną. Między najlepszym bidem a najlepszym askiem jest spread. Na jednej cenie nie mogą czekać obie strony naraz, bo od razu doszłoby do transakcji.</p></details></div></div>
<h3 class="sh">3. Od księgi zleceń do świecy: przykład Fabera krok po kroku</h3>
<p>To jest najważniejsza część lekcji. Faber pokazuje na jednym przykładzie, jak zlecenia zmieniają cenę i jak każda transakcja zostaje zapisana w świecy. Zanim zaczniesz, trzy definicje, bez których przykład nie ma sensu:</p>
<ul><li><b>Cena na wykresie to cena ostatniej transakcji.</b> Nie „cena rynku” w ogóle, tylko poziom, na którym ostatnio ktoś z kimś się wymienił.</li>
<li><b>Świeca to zapis transakcji z danego okresu</b> (np. 5 minut): <b>open</b> = pierwsza transakcja, <b>high</b> i <b>low</b> = najwyższa i najniższa transakcja, <b>close</b> = ostatnia transakcja. Jeśli nie było transakcji, nie ma świecy.</li>
<li><b>Footprint to ta sama świeca rozłożona na poziomy ceny.</b> Na każdym poziomie są dwie liczby: ile kontraktów <b>sprzedali agresywnie</b> (uderzyli w limity kupna, czyli w stronę bid księgi; to jest <b>kolumna bid</b>, lewa) i ile <b>kupili agresywnie</b> (zjedli limity sprzedaży, czyli stronę ask księgi; to jest <b>kolumna ask</b>, prawa). To nie jest osobny wskaźnik, tylko dokładny zapis tych samych transakcji, z których zbudowana jest świeca.</li></ul>
<div class="w" data-w="bidaskfp"></div>
<p><b>A co, gdy zlecenie jest większe niż to, co czeka na najlepszym poziomie?</b> Wtedy zjada best bid (albo best ask) w całości i przechodzi na kolejny poziom tej samej strony księgi: sprzedaż w dół, kupno w górę. Footprint zapisuje wykonania na każdym zjedzonym poziomie.</p>
<div class="w" data-w="bidask2"></div>
<p><b>A co, gdy kupno i sprzedaż przychodzą w tej samej chwili?</b> Przejdź rysunek krok po kroku, a potem przeczytaj wyjaśnienie pod nim. Przykład na NQ (kontrakt futures E-mini Nasdaq-100), gdzie 1 tick = 0,25 pkt.</p>
<div class="w" data-w="twomarket"></div>
<p><b>Najważniejsze z rysunku:</b></p>
<ol><li><b>„Cena 100” to tylko ostatnia transakcja.</b> Zleceniem rynkowym nie kupisz po 100, jeśli nikt nie sprzedaje po 100. Kupno rynkowe zawsze wykonuje się na best ask, a sprzedaż rynkowa na best bid.</li>
<li><b>Silnik giełdy obsługuje zlecenia po jednym</b>, w kolejności przyjścia. „Ta sama milisekunda” dla giełdy to dwa osobne zdarzenia w kolejce, różniące się mikro- albo nanosekundami.</li>
<li><b>Dwa zlecenia rynkowe nigdy nie rozliczają się ze sobą.</b> Każda transakcja to zlecenie <b>przychodzące</b> (agresor) plus zlecenie <b>czekające</b> w księdze (pasywne).</li>
<li><b>Dwa limity na tej samej cenie:</b> pierwszy czeka w księdze, a drugi, jeśli trafia w ten czekający, wykonuje się od razu i to on jest agresorem.</li></ol>
<p><b>„Walka w tle” istnieje naprawdę i wygląda dokładnie tak.</b> Przez cały czas spływają drobne zlecenia rynkowe w obie strony: kupujący trafiają w best ask, sprzedający w best bid, a ostatnia transakcja skacze bid–ask–bid. Fachowo nazywa się to <b>bid–ask bounce</b> (odbijanie ceny między bidem a askiem). Na footprincie widać to jako wolumen w <b>obu kolumnach</b> na tych samych poziomach, z deltą bliską zera. To jest balans z lekcji 2: obie strony handlują, nikt nie wygrywa, cena stoi. Ruch zaczyna się dopiero wtedy, gdy jedna strona przeważy i zacznie zjadać kolejne poziomy (krok 3 w symulatorze poniżej).</p>

<p>Przejdź symulator krokami 1, 2, 3. Po każdym kroku porównaj trzy kolumny: księgę (co zostało), footprint (co się wykonało) i świecę (co widać na wykresie).</p>
<div class="w" data-w="ofbuild"></div>
<h4>Krok 1: 25 kontraktów kupna rynkowego</h4>
<p>Cena stoi na 100. Best ask (najniższy limit sprzedaży) to 101 z 33 kontraktami, best bid (najwyższy limit kupna) to 99 z 41 kontraktami. Pomiędzy jest pusty poziom 100, czyli spread. Przychodzi 25 kontraktów kupna rynkowego. Na 101 czeka 33, więc <b>wystarcza</b>: całe 25 wypełnia się na 101, w księdze zostaje 8. Ostatnia transakcja odbyła się na 101, więc <b>cena przesuwa się na 101</b>. W footprincie pojawia się nowa świeca z zapisem: 101, w kolumnie ask (kupno agresywne), 25 kontraktów.</p>
<h4>Krok 2: 25 kontraktów sprzedaży rynkowej</h4>
<p>Teraz agresywni sprzedający: 25 kontraktów trafia w best bid, czyli 99, gdzie czeka 41. Znowu wystarcza: wypełnienie na 99, zostaje 16, <b>cena idzie na 99</b>. Footprint dopisuje 25 w kolumnie bid (sprzedaż agresywna) na poziomie 99. Świeca ma teraz zakres 99–101: otwarła się na 101, zeszła na 99 i tam stoi.</p>
<h4>Krok 3: 75 kontraktów kupna rynkowego</h4>
<p>Tu Faber pokazuje, co się dzieje, gdy najlepsza cena <b>nie wystarcza</b>. 75 kontraktów kupna trafia na 101, gdzie zostało tylko 8. Po wypełnieniu brakuje 67. Silnik giełdy przechodzi na następny poziom: na 102 jest 42, więc brakuje jeszcze 25. Kolejny poziom, 103: jest 56, więc ostatnie 25 wypełnia się tutaj, a w księdze zostaje 31. <b>Cena kończy na 103.</b></p>
<p>Co z tego wynika:</p>
<ul><li><b>Kupujący nie dostał ceny 101.</b> Średnio zapłacił (8×101 + 42×102 + 25×103) / 75 = <span class="num">102,23</span>. To jest poślizg: Faber mówi „trzy ticki”, licząc od 100, gdzie stała cena, do 103, gdzie skończyło się wypełnienie.</li>
<li><b>Jedno duże zlecenie przesunęło cenę o trzy poziomy</b>, bo zjadło całą płynność na 101 i 102. Tak wygląda ruch ceny „od środka”: cena nie idzie w górę dlatego, że ktoś tak zdecydował, tylko dlatego, że agresja była większa niż płynność na kolejnych poziomach.</li>
<li><b>Footprint pokazuje to dokładnie:</b> w kolumnie ask: 101 → 33 (25 z kroku 1 + 8 teraz), 102 → 42, 103 → 25; w kolumnie bid: 99 → 25. W filmie Faber mówi „32” na 101. To przejęzyczenie: 25 + 8 = 33.</li>
<li><b>Świeca:</b> open 101, low 99, high 103, close 103. Zielona świeca z knotem w dół do 99. <b>Knot</b> to ślad transakcji, które się odbyły (25 sprzedaży na 99), ale cena się tam nie utrzymała. Na samym wykresie świecowym tego nie zobaczysz. Na footprincie widzisz, kto tam był i ile.</li>
<li><b>Delta świecy</b> = kupno agresywne − sprzedaż agresywna = 100 − 25 = <b>+75</b>. Wysiłek kupujących był wyraźnie większy i dał rezultat: cena wyżej. To pierwsza lekcja porównywania wysiłku z rezultatem (rozwinięta w lekcji 5).</li></ul>
<div class="case"><div class="lab">Wniosek Fabera z tablicy (5:08–6:08)</div><p>Pasywni mają pewność ceny, ale nie wykonania: ktoś musi zaakceptować ich poziom. Agresywni mają pewność wykonania, ale nie ceny: możesz kliknąć kupno przy 101 i dostać 102, bo Twoje zlecenie zjadło poziom. Z tej różnicy wynika cały ruch ceny.</p></div>
<div class="watch">${yt('Pz8f0wWW12M',122,'Faber · kroki 1–3 na tablicy z footprintem',368)}${yt('FawPrRUGNpk',245,'Faber · ten sam przykład w drugim filmie (powtórka)',366)}</div>
<details class="extra"><summary>Dla dociekliwych: „ochrona ceny” zleceń na CME (Chicago Mercantile Exchange)</summary><div class="warnbox"><p><b>Ważne: zlecenie rynkowe i stop na CME mają „ochronę ceny” (market with protection, stop with protection)</b></p>
<p>Na giełdzie CME (Chicago Mercantile Exchange) zlecenie rynkowe na futures nie może zjeść księgi bez końca. Ta zasada chroni przed ogromnymi stratami przy pustej księdze. Jednocześnie zmienia to, co się dzieje z Twoim zleceniem, i musisz o tym wiedzieć, zanim użyjesz stop lossa albo wejścia stopem.</p>
<p><b>Jak to działa, krok po kroku:</b></p>
<ol><li>Giełda liczy <b>cenę ochronną</b>. Przy kupnie: best ask + tzw. punkty ochrony (ang. protection points). Przy sprzedaży: best bid − punkty ochrony. Punkty ochrony ustala giełda osobno dla każdego kontraktu. Według dokumentacji CME to zwykle połowa „zakresu niepodważalnego” (ang. non-reviewable range, czyli przedziału, w którym giełda nie anuluje transakcji jako błędnych).</li>
<li>Zlecenie zjada księgę po kolei, jak w kroku 3, ale <b>tylko do ceny ochronnej</b>.</li>
<li><b>Jeśli nie wypełni się w całości, reszta nie znika.</b> Zostaje w księdze jako <b>zlecenie limit na cenie ochronnej</b> i czeka jak każdy pasywny uczestnik.</li></ol>
<p><b>Przykład 1: kupno rynkowe 200 kontraktów</b> na księdze z lekcji: 101 → 33, 102 → 42, 103 → 56, wyżej pusto. Przyjmijmy punkty ochrony = 2 poziomy, więc cena ochronna = 101 + 2 = 103.</p>
<ul><li>Wypełnia się 33 na 101, 42 na 102 i 56 na 103, razem 131.</li>
<li>Brakuje 69. Zamiast lecieć w pustkę na 110 czy 130, te 69 kontraktów staje w księdze jako <b>limit kupna na 103</b> i staje się nowym best bidem.</li>
<li>Bez ochrony to samo zlecenie przeleciałoby przez pustą księgę i wypełniło się po absurdalnych cenach, daleko od 101.</li></ul>
<p><b>Przykład 2: stop loss, sell stop 100 kontraktów na 99</b> (zamyka Twój long). Ochrona = 2 poziomy, więc limit na 97. Księga: 99 → 41, 98 → 30, 97 → 22.</p>
<ul><li>Wypełnia się 41 + 30 + 22 = 93.</li>
<li><b>7 kontraktów zostaje jako sell limit na 97. Nadal masz 7 kontraktów longa.</b> Jeśli cena spadnie do 90, tracisz na nich dalej, choć „stop zadziałał”.</li></ul>
<p><b>Dlaczego to chroni obie strony:</b></p>
<ul><li><b>Agresora przed ogromną stratą:</b> jego średnia cena nie może odjechać dalej niż o punkty ochrony.</li>
<li><b>Rynek przed przypadkowymi, niespodziewanie dobrymi wypełnieniami:</b> bez ochrony ktoś, kto zostawił limit daleko od ceny, dostałby nagle wypełnienie po absurdalnej cenie, a rynek po chwili by wrócił. Takie wypełnienia giełda musiałaby potem rozstrzygać jako błędne transakcje.</li></ul>
<p><b>Co z tego wynika w praktyce:</b></p>
<ul><li><b>Po każdym gwałtownym ruchu sprawdź pozycję</b>, a nie tylko to, czy stop się uruchomił. Częściowe wypełnienie to realna sytuacja.</li>
<li><b>Bot na futures musi obsługiwać częściowe wypełnienia</b>, czyli porównywać wielkość pozycji z tym, co zamierzał.</li>
<li><b>Na CFD</b> (np. US100 na FTMO w MT5, czyli MetaTrader 5) tej giełdowej ochrony nie ma, bo nie ma giełdy. Broker wykonuje zlecenie według własnych zasad. Poślizg na stopie OBR podczas newsa może być więc większy, a ewentualny limit poślizgu zależy od brokera i typu wykonania.</li>
<li>Punkty ochrony dla konkretnego kontraktu (NQ, ES, GC) sprawdzisz w specyfikacji CME albo u brokera futures. Są różne dla każdego produktu.</li></ul>
<p>Źródła: <a href="https://cmegroupclientsite.atlassian.net/wiki/spaces/EPICSANDBOX/pages/457087412/Order+Types+for+Futures+and+Options" target="_blank" rel="noopener">CME Globex: Order Types for Futures and Options</a> ·

<section class="s unit" data-unit="3"><div class="unit-nr">Jednostka 3 z 6</div><h2>To samo na żywym rynku: presja, opór i ścieżka najmniejszego oporu</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 2 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Kupno rynkowe 75 kontraktów. Na 101 zostało 8, na 102 stoi 42, na 103 stoi 56. Gdzie kończy cena i jaka jest średnia cena kupującego?</p><details><summary>Pokaż odpowiedź</summary><p>Cena kończy na <b>103</b> (8 na 101, 42 na 102, reszta 25 na 103). Średnia: (8×101 + 42×102 + 25×103) / 75 ≈ <b>102,23</b>.</p></details></div><div class="rq"><p class="q">Czym jest „cena” na wykresie?</p><details><summary>Pokaż odpowiedź</summary><p>Ceną <b>ostatniej transakcji</b>. Nie da się po niej kupić, jeśli nikt na tym poziomie nie sprzedaje.</p></details></div></div>
<h3 class="sh">4. To samo na żywym rynku (Deep Charts)</h3>
<p>Zaraz po tablicy Faber przełącza się na prawdziwy rynek w platformie Deep Charts (program do analizy order flow, którego Faber jest współtwórcą; sesja londyńska, kontrakt w okolicy 6 841) i pokazuje, że działa to dokładnie tak samo. Na ekranie są obok siebie: DOM (księga zleceń na żywo), footprint i świece. Co się dzieje po kolei:</p>
<ol><li><b>13 sprzedaży rynkowych na 6 841 i cena odbija w dół.</b> Agresywni sprzedający trafiają na limity kupna i „spychają” płynność w dół: zjadają kolejne poziomy księgi pod ceną. Dlatego cena spada.</li>
<li><b>Świeca footprintu zamyka się pod kontrolą sprzedających.</b> Na footprincie widać, na którym poziomie skupiła się agresja: żółty box z 53 agresywnymi sprzedażami.</li>
<li><b>Dlaczego w dół, a nie w górę?</b> W księdze nad ceną stało więcej (28, 33), pod ceną mniej (10). Sprzedającym było łatwiej, więc przemietli trzy poziomy w dół.</li>
<li><b>Potem aukcja się odwraca.</b> Na 6 840 jest maksimum agresji sprzedających, ale tam kontrolę przejmują kupujący i zaczynają pchać płynność w górę.</li>
<li><b>Sprzedający bronią 6 841,5.</b> Za każdym razem, gdy cena tam dochodzi, wracają agresywni sprzedający i spychają ją w dół. Na 6 840,5 Faber zapowiada, że teraz kupujący obronią poziom, a sprzedający zostaną zaabsorbowani.</li>
<li><b>Ścieżka najmniejszego oporu na żywo:</b> po jednej stronie ceny jest tylko 5 i 16 kontraktów, po drugiej 23, 25, 18, 14. Cena idzie w stronę cieńszej księgi, dochodzi do poziomu, odbija i wraca do „fair value” (uczciwej wartości) tego zakresu.</li></ol>
<p>Wniosek Fabera z tej sceny: widzisz <b>poziom kontroli sprzedających</b> (6 841,5) i <b>poziom kontroli kupujących</b> (6 840). Między nimi siły się ścierają i to tam zmienia się przewaga. To jest ten sam mechanizm co na tablicy, tylko w czasie rzeczywistym i z prawdziwymi liczbami.</p>
<div class="watch">${yt('Pz8f0wWW12M',368,'Faber · ten sam mechanizm na żywym DOM i footprincie',553)}</div>
<h3 class="sh">5. Presja i opór, ścieżka najmniejszego oporu</h3>
<p>Faber zbiera wszystko w jedno zdanie: <b>agresywni tworzą presję</b> (ruszają rynek), <b>pasywni tworzą opór</b>. Opór widać w księdze, więc można zadać pytanie: którą stronę łatwiej przebić?</p>
<p>Jego przykład: 5 poziomów nad ceną to łącznie <span class="num">273</span> kontrakty limitów sprzedaży, 5 poziomów pod ceną to <span class="num">122</span> kontrakty limitów kupna. W drugim filmie dodaje ważny warunek: <b>ustal wysiłek</b>, np. 50 kontraktów agresji, wszystko jedno z której strony. Przy tym samym wysiłku łatwiej przebić 122 niż 273, więc ścieżka najmniejszego oporu prowadzi <b>w dół</b>.</p>
<p>Dwa zastrzeżenia, które Faber sam podkreśla:</p>
<ul><li>To <b>prawdopodobieństwo, nie pewność</b>. „To, co łatwiejsze, nie zawsze się dzieje, ale to informacja, której możesz użyć.”</li>
<li>Ma znaczenie <b>dla decyzji krótkoterminowych</b> (scalping, moment wejścia). Księga zmienia się co ułamek sekundy, limity są dokładane i zdejmowane, więc ta informacja żyje bardzo krótko. Kontekst z wyższego obrazu (lekcje 2–4) jest ważniejszy.</li></ul>
<div class="watch">${yt('Pz8f0wWW12M',553,'Faber · presja i opór, 122 kontra 273',675)}${yt('FawPrRUGNpk',366,'Faber · ścieżka najmniejszego oporu przy stałym wysiłku 50',427)}</div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Nad ceną 273 kontrakty limitów, pod ceną 122. Gdzie jest ścieżka najmniejszego oporu i czy to pewny sygnał?</p><details><summary>Pokaż odpowiedź</summary><p>W <b>dół</b>, bo przy tym samym wysiłku łatwiej przebić 122 niż 273. To tylko <b>prawdopodobieństwo</b>, a nie pewność.</p></details></div><div class="rq"><p class="q">Kto według Fabera tworzy presję, a kto opór?</p><details><summary>Pokaż odpowiedź</summary><p>Agresywni tworzą presję (ruszają rynek), pasywni tworzą opór.</p></details></div><div class="rq"><p class="q">Dlaczego informacja z księgi zleceń „żyje” bardzo krótko?</p><details><summary>Pokaż odpowiedź</summary><p>Bo limity są dokładane i zdejmowane co ułamek sekundy. Kontekst z profilu wolumenu (lekcje 2–4) jest ważniejszy.</p></details></div></div>
</section>
<section class="s unit" data-unit="4"><div class="unit-nr">Jednostka 4 z 6</div><h2>Gdzie naprawdę jest płynność. Futures a CFD</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 3 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Nad ceną 273 kontrakty limitów, pod ceną 122. Gdzie jest ścieżka najmniejszego oporu i czy to pewny sygnał?</p><details><summary>Pokaż odpowiedź</summary><p>W <b>dół</b>, bo przy tym samym wysiłku łatwiej przebić 122 niż 273. To tylko <b>prawdopodobieństwo</b>, a nie pewność.</p></details></div><div class="rq"><p class="q">Kto według Fabera tworzy presję, a kto opór?</p><details><summary>Pokaż odpowiedź</summary><p>Agresywni tworzą presję (ruszają rynek), pasywni tworzą opór.</p></details></div></div>
<h3 class="sh">6. Gdzie naprawdę jest płynność (i dlaczego nikt nie poluje na Twój stop)</h3>
<p>Darius przechodzi z tego mechanizmu do pytania, które zmienia sposób patrzenia na wykres: <b>gdzie rynek jest najbardziej płynny?</b> Większość traderów odpowiada źle.</p>
<ul><li><b>Szybki, gwałtowny ruch to nie jest płynny rynek. To rynek bez płynności.</b> Cena leci, bo jest jednostronnie: agresywni kupujący kupują, a po drugiej stronie prawie nikogo nie ma. Z przykładu Fabera: im mniej limitów na kolejnych poziomach, tym dalej zajdzie to samo zlecenie.</li>
<li><b>Najwięcej płynności jest tam, gdzie cena chodzi w górę i w dół w zakresie.</b> Tam obie strony robią interesy: kupujący i sprzedający uznają cenę za uczciwą. Darius nazywa to strefą biznesu, czyli fair value. Rynek spędza w niej ok. 70% czasu (to jego heurystyka, rozwinięta w lekcji 2).</li>
<li><b>Przy samych szczytach i dołkach płynności jest zwykle mało.</b> To strefa, w której nikt nie chce robić interesów, więc cena wraca do strefy biznesu. Zaznaczanie „tu zebrano płynność” na szczycie jest według Dariusa nieporozumieniem. Rynek nie idzie do tego poziomu dlatego, że tam leży płynność. Idzie, bo jakiś taker agresywnie pcha cenę. Jeśli po drugiej stronie pojawi się ktoś, kto tę agresję zaabsorbuje, ruch się cofa (faded auction, czyli „wyblakła” aukcja: nie było dość kupujących gotowych zaakceptować wyższej ceny).</li></ul>
<p><b>Dlaczego duży gracz nie poluje na stopy?</b> Darius liczy to na przykładzie z kroku 3: gracz, który musi kupić 2 000 kontraktów NQ, jednym kliknięciem zjadłby księgę na wielu poziomach i sam wywindowałby sobie średnią cenę. Dla instytucji każdy dolar, a czasem każdy cent średniej ceny decyduje o wyniku. Dlatego potrzebuje <b>kontrahenta</b>, a kontrahent jest tam, gdzie jest dużo limitów: w strefie wartości, nie nad szczytem. W praktyce zlecenia w księdze odnawiają się w milisekundach, więc duży gracz dzieli pozycję na kawałki.</p>
<p>Darius dodaje, że <b>interesy dużych graczy są różne</b>. Fundusz emerytalny buduje pozycję tygodniami i walczy o cenę. Hedge fund (fundusz hedgingowy, który inwestuje agresywnie i zabezpiecza pozycje), który zabezpiecza pozycję na innym aktywie, czasem <b>musi wejść teraz</b>, z 2 000 kontraktów, i średnia cena jest dla niego drugorzędna. Dlatego rynku nie da się sprowadzić do prostej reguły „sweep, więc wzrośnie”.</p>
<div class="warnbox"><b>Doprecyzowanie (lekcja 2, sekcja 5 i „Sedno różnicy”):</b> to nie jest całkowite odrzucenie ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona). Darius sam mówi, że teza o stopach to „prawda do pewnego stopnia”. Dla dużego kupującego odpalone sell stopy pod dołkiem <b>są</b> płynnością, bo to sprzedający, od których może kupić. Spór dotyczy przyczyny ruchu i dwóch znaczeń słowa „płynność”: w ICT to stopy (magnes), w order flow to limity w księdze (opór).</div>
<div class="watch">${yt('px-f_qteOB0',608,'Darius · gdzie naprawdę jest płynność, strefa biznesu, różne interesy',913)}${yt('px-f_qteOB0',1035,'Darius · 2 000 kontraktów zjada księgę, hot spoty, faded auction',1400)}</div>
<h3 class="sh">7. Skąd te dane i co to znaczy przy CFD</h3>
<p>Wszystko powyżej zakłada, że istnieje <b>jedna giełda</b>, na której spotykają się wszystkie zlecenia. Darius tłumaczy w filmie „The basics of order flow”, dlaczego to dotyczy tylko <b>futures</b>:</p>
<ul><li><b>Futures:</b> Twoje zlecenie idzie przez brokera i feed danych (dostawcę danych giełdowych, np. Rithmic albo dxFeed) na giełdę (CME, Chicago Mercantile Exchange), która paruje je z kontrahentem. Każda transakcja jest zapisana i widoczna. Stąd footprint, delta (różnica kupna i sprzedaży agresywnej), big trades (duże agresywne zlecenia pokazywane jako bąble) i DOM (Depth of Market, księga zleceń na żywo).</li>
<li><b>CFD</b> (FTMO, czyli firma prop dająca kapitał po zdaniu wyzwania; MT5, czyli MetaTrader 5; XAUUSD, czyli złoto w dolarach; US100, czyli Nasdaq-100 jako CFD): nie ma centralnej giełdy. Broker jest Twoim kontrahentem albo przekazuje zlecenie dalej według własnych zasad. Danych o tym, kto był agresywny, po prostu nie ma. Dlatego order flow na CFD „technicznie nie istnieje”. Według Dariusa większość klientów CFD jest w tzw. B-booku, czyli broker zarabia na ich stratach. To jego opinia o branży, nie zmierzony fakt.</li>
<li><b>Jak Darius to łączy:</b> analizuje złoto na futures (GC, kontrakt futures na złoto z giełdy COMEX), bo tam są dane, a wykonuje transakcję także na CFD (XAUUSD) na propie. Świece i ruchy są te same, różni się tylko cena. Na CFD daje stopowi trochę więcej miejsca, bo nie odwzorujesz go co do ticka. Dla Ciebie odpowiednik: analiza na NQ (futures), wykonanie na US100 na FTMO.</li>
<li><b>Po co w ogóle są futures:</b> do zabezpieczania (hedgingu). Linie lotnicze kupują kontrakty na paliwo, żeby zablokować cenę, firma meblarska kontrakty na drewno. Nikt z nich nie kupi „jednego lota ropy” u brokera CFD. Dlatego rynek futures musi być przejrzysty.</li>
<li><b>Specyfikacja (przykład ES):</b> tick 0,25 pkt = 12,50 $, punkt = 50 $ na kontrakt, stop 10 pkt = 500 $. Micro = 1/10 kontraktu mini. Na futures pozycje się sumują: dwa kupna to jedna pozycja +2 po średniej cenie, bez osobnych stopów i bez hedgowania. Long (pozycję kupna) zamykasz sprzedażą: TP (take profit, zamknięcie z zyskiem) to <b>sell limit</b>, SL (stop loss, zamknięcie ze stratą) to <b>sell stop</b>, zawsze z liczbą kontraktów.</li></ul>

<section class="s unit" data-unit="5"><div class="unit-nr">Jednostka 5 z 6</div><h2>Zlecenia stop, kolejka, iceberg i spoof</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 4 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Szybki, gwałtowny ruch ceny: rynek jest wtedy płynny czy niepłynny?</p><details><summary>Pokaż odpowiedź</summary><p><b>Niepłynny.</b> Po drugiej stronie stoi mało limitów, więc to samo zlecenie przesuwa cenę dalej.</p></details></div><div class="rq"><p class="q">Dlaczego duży gracz nie kupi 2 000 kontraktów jednym kliknięciem?</p><details><summary>Pokaż odpowiedź</summary><p>Zjadłby wiele poziomów i sam podbiłby sobie średnią cenę. Szuka kontrahenta tam, gdzie jest dużo limitów (strefa wartości), i dzieli zlecenie na kawałki.</p></details></div></div>
<h3 class="sh">9. Zlecenia stop, kolejka, iceberg i spoof</h3>
<p>Ta sekcja powstała z Twoich pytań. Mechanizm zleceń stop to ogólna wiedza o działaniu giełdy. Typy zleceń pokazuje Darius w filmie „basics” (27:19–32:22). Bid reload, iceberg, spoof i „ścianę ochronną” omawia Faber w filmie o płynności. Linki są na końcu sekcji.</p>

<h4>9.1 Zlecenie stop to nie to samo co stop loss</h4>
<p><b>Zlecenie stop</b> to typ zlecenia: „gdy cena dotknie poziomu X, kup albo sprzedaj rynkowo”. Ma dwa zastosowania:</p>
<ul><li><b>Stop loss:</b> zamknięcie przegranej pozycji. Long zamykasz sell stopem pod ceną, short zamykasz buy stopem nad ceną.</li>
<li><b>Wejście na wybiciu:</b> tak działa Twój OBR. Buy stop nad zakresem oznacza „wchodzę w long dopiero wtedy, gdy rynek pokaże siłę w górę”, a sell stop pod zakresem to samo dla shorta. To świadoma decyzja, gra na kontynuację.</li></ul>
<p>Na rynku oba wyglądają identycznie: po dotknięciu stają się zleceniem rynkowym.</p>

<h4>9.2 Mapa: co leży nad ceną, a co pod nią</h4>
<div class="w" data-w="stopmap"></div>
<div class="scroll"><table class="t"><tr><th></th><th>Nad ceną</th><th>Pod ceną</th></tr>
<tr><td><b>Limit</b> (widoczny w DOM, czeka, stawia opór)</td><td>sell limit</td><td>buy limit</td></tr>
<tr><td><b>Stop</b> (niewidoczny, budzi się, dokłada paliwa)</td><td>buy stop</td><td>sell stop</td></tr></table></div>
<p>Buy limit zawsze leży <b>pod</b> ceną: „kupię, ale dopiero na 99”. Gdybyś postawił go nad ceną, wykonałby się od razu, bo ktoś już sprzedaje taniej. Odpalony stop zawsze trafia w <b>limity po tej samej stronie ceny</b>: sell stop zjada limity kupna pod ceną, buy stop zjada limity sprzedaży nad ceną.</p>

<h4>9.3 Co się dzieje, gdy cena dotknie stopu</h4>
<p>Stop nie stoi w księdze. Nikt go nie kupuje i nikt go „nie zbiera”. Gdy cena dotknie jego poziomu, zamienia się w zlecenie rynkowe i od tej chwili jest zwykłym <b>agresywnym</b> uczestnikiem z kroku 3. Musi zostać wykonany, ale <b>nie wiadomo, po jakiej cenie</b>: zjada limity tak daleko, jak trzeba. Stąd gwałtowny ruch ceny i poślizg na stop lossach.</p>
<div class="w" data-w="stopcascade"></div>

<h4>9.4 Kolejka: najpierw cena, potem czas</h4>
<p>Nowy limit wchodzi do księgi (i do DOM-u) natychmiast. Giełda (NQ, ES, GC) wykonuje zlecenia według zasady: <b>najpierw lepsza cena, potem kto pierwszy przyszedł</b> (FIFO, ang. first in, first out, czyli „pierwszy przyszedł, pierwszy obsłużony”: kto pierwszy wystawił limit, ten pierwszy się wykona). Nowy limit kupna na 100 staje się nowym najlepszym bidem, bo jest wyżej niż 99. Limit dołożony na 99, gdzie już ktoś stoi, ustawia się na końcu kolejki. Z tego wynika ważna rzecz: <b>limity przed poziomem stopów chronią go</b>. Sprzedający muszą najpierw zjeść wszystko wyżej, żeby cena w ogóle dotknęła stopów. Przełącz 20 i 50 kontraktów i porównaj wynik.</p>
<div class="w" data-w="stopqueue"></div>

<h4>9.5 Stopów nie widać w żadnych danych</h4>
<p>Giełda publikuje tylko <b>limity w księdze</b> i <b>wykonane transakcje</b>. Stopów nie widzi nikt: ani DOM, ani heatmapa, ani najdokładniejsze dane MBO (market by order, czyli dane o każdym pojedynczym zleceniu). Odpalone stopy widać dopiero po fakcie, jako nagły wybuch agresji w footprincie i na big trades. Po footprincie nie odróżnisz stopu od ręcznego kliknięcia, bo dla giełdy to ta sama agresywna sprzedaż. Faber: zakładanie „tu leży płynność, bo tu jest szczyt” trafia w ok. 60–70%, bo zgadujesz. Heatmapa pokazuje prawdziwe limity, a nie domysły.</p>

<h4>9.6 To samo paliwo, inny wynik. I świeca, która wprowadza w błąd</h4>
<p>Nawet gdybyśmy widzieli stopy, wiedzielibyśmy, ile jest paliwa, ale nie, jak silnie cena zareaguje. O tym decyduje to, co stoi po drugiej stronie. Poniżej dwa warianty z <b>identycznymi zleceniami</b>: sprzedaż 5, odpalenie 60 stopów, kupno 25. Różni je tylko liczba limitów kupna na 99: 20 albo 500.</p>
<div class="w" data-w="stopab"></div>
<p><b>Wniosek z kroku 4.</b> W obu wariantach wykonało się tyle samo kontraktów (90), a świece zamknęły się na tym samym poziomie (101). Mimo to:</p>
<ul><li><b>A</b> ma <b>długi knot</b> do 97. Klasyczne price action (analiza samych świec) przeczyta to jako silne odrzucenie przez kupujących. W rzeczywistości kupujący byli słabi: cena spadła, bo pod nią było pusto, a wróciła, bo nad nią też było pusto.</li>
<li><b>B</b> ma <b>krótki knot</b> do 99. Wygląda słabiej, a kupujący byli silni: zjedli całą sprzedaż na jednym poziomie i zostało im jeszcze 435 kontraktów.</li></ul>
<p><b>Długość knota nie mierzy siły, tylko to, jak daleko cena mogła przejść, a to zależy od pustki w księdze.</b> Sama świeca pokazała siłę odwrotnie, niż było. Różnicę widać tylko w footprincie: w A sprzedaż rozlana po trzech poziomach, w B skupiona na jednym (absorpcja). Faber: cena to skutek, order flow to przyczyna. To też wyjaśnia Twoją obserwację z OBR, że szerokie knoty niszczą wybicia: bot widzi świecę, ale nie wie, czy knot to siła, czy pustka.</p>

<h4>9.7 Iceberg i spoof</h4>
<p><b>Iceberg</b> to prawdziwe, duże zlecenie limit, które pokazuje w księdze tylko małą część. Faber: „widzisz 8 kontraktów, a może ich być 400 albo 500”. Za każdym razem, gdy sprzedający zjedzą widoczne 8, poziom odnawia się z ukrytej reszty. Faber nazywa to niewidzialną płynnością i używa do tego specjalnego wskaźnika. Bez niego rozpoznasz iceberg, zestawiając DOM z footprintem: w DOM-ie ciągle mało, a w footprincie na tym poziomie wykonało się dużo i cena stoi.</p>
<p><b>Spoof</b> to odwrotność icebergu: duże, dobrze widoczne zlecenie, którego <b>nikt nie zamierza wykonać</b>. Ktoś stawia 400 kontraktów kupna pod ceną, inni myślą „ktoś broni, kupuję”, cena rośnie, a spoofer sprzedaje im drożej. Gdy cena zbliża się do jego zlecenia, ono znika. Faber: spoofing jest nielegalny, ale wciąż widać go na rynku codziennie. Dlatego każdy nagły „bid reload” (pojawienie się dużego limitu kupna tuż pod ceną) może być prawdziwy albo fałszywy.</p>
<div class="scroll"><table class="t"><tr><th></th><th>Co widać w DOM-ie</th><th>Co dzieje się naprawdę</th><th>Jak sprawdzić</th></tr>
<tr><td><b>Iceberg</b></td><td>mało</td><td>dużo, prawdziwe kupno lub sprzedaż</td><td>footprint: duże wykonania na tym poziomie, cena stoi</td></tr>
<tr><td><b>Spoof</b></td><td>dużo</td><td>nic, zlecenie znika</td><td>footprint: zero wykonań, zlecenie zniknęło przed ceną</td></tr></table></div>

<h4>9.8 Zasada: DOM mówi, gdzie patrzeć. Footprint mówi, czy wejść</h4>
<p>Limit w DOM-ie to <b>deklaracja</b>. Transakcja w footprincie to <b>fakt</b>. Nie wchodzisz dlatego, że ściana stoi, tylko dlatego, że ściana zadziałała. Cztery sytuacje przy poziomie 99:</p>
<div class="scroll"><table class="t"><tr><th>DOM</th><th>Footprint</th><th>Co to jest</th><th>Co robisz</th></tr>
<tr><td>duża ściana kupna</td><td>dużo sprzedaży wykonane na 99, cena stoi</td><td>prawdziwa obrona, absorpcja</td><td><b>long</b>, stop pod 99</td></tr>
<tr><td>duża ściana, znika, gdy cena się zbliża</td><td>zero wykonań na 99</td><td>spoof</td><td>nie wchodzisz; pod nim jest pustka</td></tr>
<tr><td>mała ilość, ciągle się odnawia</td><td>dużo sprzedaży wykonane na 99, cena stoi</td><td>iceberg</td><td><b>long</b>, mimo że ściany nie widać</td></tr>
<tr><td>duża ściana kupna</td><td>sprzedaż ją zjada, cena przebija 99</td><td>prawdziwa, ale przegrała</td><td>nie long; raczej short na kontynuację</td></tr></table></div>
<p>Wiersze 1 i 3 dają ten sam sygnał w footprincie, a spoof go nie daje. Patrząc na wykonania, odsiewasz oba problemy naraz.</p>
<p><b>Gdzie wejście, stop i cel</b> (model 3 kroków z lekcji 8, szczegóły w lekcjach 6–7):</p>
<ul><li><b>Wejście</b> przy poziomie, gdzie dużo płynności broni ceny i w footprincie widać absorpcję.</li>
<li><b>Stop</b> tuż za tym poziomem. Jeśli ściana zostanie zjedzona albo zniknie, teza upada i tracisz kilka ticków.</li>
<li><b>Cel</b> przez strefę bez płynności, do następnej dużej ściany. Przez pustkę cena przechodzi szybko, a zatrzymuje się na kolejnym skupisku limitów.</li>
<li><b>Sprzedający</b> nie sprzedaje w ścianę 435 kupujących. Czeka, aż zostanie zjedzona (drugi test VAL, czyli dolnej granicy value area, obszaru 70% wolumenu; Darius, lekcja 2).</li></ul>
<p>Faber pokazuje dokładnie to w filmie o płynności: „ściana ochronna” kupujących, cena uderza w nią i zostaje zaabsorbowana raz, drugi i trzeci, a dopiero wtedy jest gra w kierunku głównego trendu. Scalperzy dodatkowo czekają na big trades, czyli agresję w swoją stronę.</p>
<div class="warnbox"><b>Pułapka kolejki.</b> Jeśli wystawisz własny buy limit na 99, staniesz na końcu kolejki, za tymi 435 kontraktami. Wykonasz się dopiero wtedy, gdy ktoś sprzeda ponad 435, a wtedy ściana jest już zjedzona i Twoja teza nie działa. Dlatego scalperzy (traderzy grający bardzo krótkie ruchy) wchodzą tick wyżej albo czekają na reakcję przy 99 i wchodzą rynkowo, akceptując mały poślizg.</div>

<section class="s unit" data-unit="6"><div class="unit-nr">Jednostka 6 z 6</div><h2>Ten sam footprint, inna świeca: jak czytać każdą świecę</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 5 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Co się dzieje ze zleceniem stop, gdy cena dotknie jego poziomu?</p><details><summary>Pokaż odpowiedź</summary><p>Zamienia się w <b>zlecenie rynkowe</b>, czyli staje się agresorem i zjada limity po drugiej stronie.</p></details></div><div class="rq"><p class="q">Iceberg (ukryte duże zlecenie) a spoof (fałszywe zlecenie): jak je odróżnić w danych?</p><details><summary>Pokaż odpowiedź</summary><p>Iceberg: w DOM (księdze zleceń) widać mało, a w footprincie dużo wykonań i cena stoi. Spoof: w DOM widać dużo, wykonań brak, a zlecenie znika, gdy cena się zbliża.</p></details></div></div>
<h3 class="sh">10. Podsumowanie lekcji: ten sam footprint, inna świeca. Co z tego wynika</h3>
<p>To najważniejsze spostrzeżenie tej lekcji i jedno z najważniejszych w całym order flow. Sprawdź je sam w symulatorze z sekcji 3: kliknij <b>Reset</b>, potem <b>Kup 25 → Sprzedaj 25 → Kup 75</b>. Zapisz wynik. Znowu <b>Reset</b>, potem <b>Kup 25 → Kup 75 → Sprzedaj 25</b>.</p>
<div class="scroll"><table class="t"><tr><th></th><th>Kup 25 → Sprzedaj 25 → Kup 75 (Faber)</th><th>Kup 25 → Kup 75 → Sprzedaj 25</th></tr>
<tr><td>Footprint, kolumna ask (kupno agresywne)</td><td>101 → 33, 102 → 42, 103 → 25</td><td>101 → 33, 102 → 42, 103 → 25</td></tr>
<tr><td>Footprint, kolumna bid (sprzedaż agresywna)</td><td>99 → 25</td><td>99 → 25</td></tr>
<tr><td>Delta świecy</td><td>+75</td><td>+75</td></tr>
<tr><td>Świeca (open / high / low / close)</td><td>101 / 103 / 99 / <b>103</b>, zielona, knot w dół</td><td>101 / 103 / 99 / <b>99</b>, czerwona, knot w górę</td></tr></table></div>
<p><b>Footprint jest taki sam, a świeca jest inna.</b> Przy tej samej księdze kupujący w obu wariantach zjedli te same limity sprzedaży, tylko w innej kolejności. Inna jest droga ceny, a więc zamknięcie i kolor świecy. (Na prawdziwym rynku księga zmienia się między zleceniami, więc tam kolejność zmienia zwykle także footprint.) Wynika z tego pięć rzeczy.</p>

<h4>1. Świeca pokazuje rezultat, footprint pokazuje wysiłek</h4>
<p>W obu wariantach wysiłek jest taki sam: kupujący 100, sprzedający 25, delta +75. Rezultat jest odwrotny:</p>
<ul><li><b>Kup → Sprzedaj → Kup:</b> zamknięcie 103, świeca zielona. Wysiłek kupujących dał rezultat.</li>
<li><b>Kup → Kup → Sprzedaj:</b> zamknięcie 99, świeca czerwona. Ten sam wysiłek kupujących, a na koniec cena na dole.</li></ul>
<p>Sama świeca każe Ci w drugim wariancie myśleć, że wygrali sprzedający. Sam footprint każe myśleć, że kupujący. Prawdę daje dopiero <b>porównanie jednego z drugim</b>, i na tym stoi lekcja 5 (absorpcja, agresja).</p>

<h4>2. Zamknięcie mogło ustawić małe zlecenie w pustej księdze</h4>
<p>W wariancie kup → kup → sprzedaj cenę z 103 na 99 sprowadziło <b>tylko 25 kontraktów sprzedaży</b>. Spadek o 4 poziomy nie wziął się z siły sprzedających. Między 102 a 100 po stronie kupna <b>nie było żadnych limitów</b>, więc pierwsza transakcja sprzedaży wypadła dopiero na 99.</p>
<p>To ta sama zasada co z knotami w sekcji 9.6: <b>duży ruch przy małym wolumenie oznacza pustkę, a nie siłę</b>. Czerwona świeca nie znaczy, że przyszli silni sprzedający. Mogła ją zrobić garstka zleceń, bo pod ceną było pusto.</p>

<h4>3. Kolejność w footprincie da się odczytać: delta minimalna i maksymalna</h4>
<p>Footprint sumuje wszystko na poziomach, ale platformy order flow pokazują pod świecą zwykle także <b>deltę minimalną i maksymalną w trakcie świecy</b>. Faber pokazuje ten typ danych w Deep Charts. W naszym przykładzie delta zmieniała się tak:</p>
<div class="scroll"><table class="t"><tr><th>Kolejność</th><th>Delta po każdym zleceniu</th><th>Min / max</th><th>Zamknięcie delty</th></tr>
<tr><td>Kup → Sprzedaj → Kup</td><td>+25 → 0 → <b>+75</b></td><td>0 / +75</td><td>+75, czyli na maksimum</td></tr>
<tr><td>Kup → Kup → Sprzedaj</td><td>+25 → <b>+100</b> → +75</td><td>+25 / +100</td><td>+75, czyli <b>25 poniżej maksimum</b></td></tr></table></div>
<p>W drugim wierszu delta doszła do +100, a potem się cofnęła. To ślad, że <b>na końcu świecy przewagę mieli sprzedający</b>, choć sumarycznie wygrali kupujący. To samo widać:</p>
<ul><li>na <b>taśmie transakcji</b> (time &amp; sales, czyli liście transakcji po kolei);</li>
<li>na <b>mniejszym interwale</b> albo na <b>wykresie tickowym</b> (patrz materiał „Rodzaje wykresów”).</li></ul>

<h4>4. Cztery kombinacje do czytania każdej świecy</h4>
<p>Najpierw dwa pojęcia, których nie wolno mieszać, bo opisują <b>dwie różne rzeczy</b>:</p>
<ul><li><b>Delta</b> = agresywne kupno minus agresywna sprzedaż w tej świecy (z footprintu: kolumna ask minus kolumna bid). Mówi, <b>kto atakował</b>, czyli kto włożył wysiłek. W tej tabeli liczy się jej <b>znak</b>: dodatnia albo ujemna.</li>
<li><b>Zamknięcie „wysoko” albo „nisko”</b> = <b>gdzie świeca skończyła w swoim zakresie</b>, od low do high. Podziel świecę od knota do knota na trzy części: zamknięcie w górnej 1/3 to „wysoko”, w dolnej 1/3 to „nisko”. To <b>nie dotyczy</b> wielkości delty ani koloru świecy. Mówi, <b>kto ostatecznie wygrał</b>, czyli jaki był rezultat.</li></ul>
