/* ---- IVB interactive ---- */
W.ivb=function(el){
  el.innerHTML='<div class="wt">Symulator IVB: ORB kontra retest strefy</div><div class="ctrls" data-g="r"><button data-r="15">Range 15 min</button><button data-r="30" class="on">Range 30 min</button></div><div class="ctrls" data-g="m"><button data-m="orb" class="on">ORB: wejście na wybiciu</button><button data-m="va">IVB: retest VA-krawędzi</button><button data-m="poc">IVB: retest POC</button><button data-a="day">Nowy dzień</button></div><div class="cv"></div><div class="grid2"><div class="stat"><div class="k">Wejście</div><div class="v" data-s="e"></div></div><div class="stat"><div class="k">Stop</div><div class="v" data-s="s"></div></div><div class="stat"><div class="k">Wynik</div><div class="v" data-s="r"></div></div></div><div class="cap"></div>';
  let R=30,M='orb',seed=5;const holder=$('.cv',el);const cv=canvasIn(holder);
  function gen(){const r=rng(seed);const N=150,p=[];let x=100;const up=r()>0.35;const retest=r()>0.3;const fail=r()>0.8;
    for(let i=0;i<N;i++){let tgt=100,k=0.1,n=0.9;
      if(i>=R&&i<R+12){tgt=up?106:94;k=0.25;n=0.6}
      else if(i>=R+12&&i<R+30){tgt=retest?(up?99.9:100.1):(up?108:92);k=0.2;n=0.5}
      else if(i>=R+30){tgt=fail?(up?96:104):(up?113:87);k=0.06;n=0.7}
      x+=k*(tgt-x)+(r()-0.5)*2*n;p.push(x);}return p;}
  function draw(){
    const p=gen();const rng_=p.slice(0,R);const hi=Math.max(...rng_),lo=Math.min(...rng_);
    const step=0.25,nb=Math.round((hi-lo)/step)+1,bins=new Array(nb).fill(0);rng_.forEach(v=>bins[Math.min(nb-1,Math.round((v-lo)/step))]++);const va=valueArea(bins);
    const vah=lo+va.hi*step,val=lo+va.lo*step,poc=lo+va.poc*step;
    let dir=0,bi=-1;for(let i=R;i<p.length;i++){if(p[i]>hi){dir=1;bi=i;break}if(p[i]<lo){dir=-1;bi=i;break}}
    let entry=null,stop=null,ei=-1;const H=hi-lo;
    if(dir){if(M==='orb'){entry=dir>0?hi:lo;stop=dir>0?lo:hi;ei=bi;}
      else{const lvl=M==='poc'?poc:(dir>0?vah:val);stop=dir>0?val-0.25:vah+0.25;for(let i=bi+1;i<p.length;i++){if(dir>0?p[i]<=lvl:p[i]>=lvl){entry=lvl;ei=i;break}}}}
    const tp=entry!==null?(dir>0?hi+1.5*H:lo-1.5*H):null;
    let res='brak wybicia',rr=0;
    if(entry!==null){rr=Math.abs(tp-entry)/Math.abs(entry-stop);res='otwarta';for(let i=ei+1;i<p.length;i++){if(dir>0?p[i]<=stop:p[i]>=stop){res='stop −1R';break}if(dir>0?p[i]>=tp:p[i]<=tp){res='TP +'+rr.toFixed(1)+'R';break}}if(res==='otwarta'){const last=p[p.length-1];res='koniec sesji '+(((last-entry)*dir)/Math.abs(entry-stop)).toFixed(1)+'R';}}
    else if(dir&&M!=='orb')res='brak retestu — ruch uciekł';
    const {c,w,h}=prep(cv,300);const all=p.concat([tp||100,stop||100]);const pmx=Math.max(...all)+1,pmn=Math.min(...all)-1;const Y=v=>10+(pmx-v)/(pmx-pmn)*(h-20);const X=i=>40+i/(p.length-1)*(w-50);
    c.clearRect(0,0,w,h);c.fillStyle=css('--va');c.globalAlpha=.6;c.fillRect(X(0),Y(hi),X(R)-X(0),Y(lo)-Y(hi));c.globalAlpha=1;
    c.fillStyle=css('--accent');c.globalAlpha=.18;c.fillRect(X(0),Y(vah),w,Y(val)-Y(vah));c.globalAlpha=1;
    const mx=Math.max(...bins);bins.forEach((b,i)=>{c.fillStyle=i===va.poc?css('--poc'):css('--accent');c.globalAlpha=.7;c.fillRect(X(0)-b/mx*30-2,Y(lo+i*step)-1.5,b/mx*30,3);});c.globalAlpha=1;
    const line=(v,col,lab,dash)=>{c.strokeStyle=col;c.setLineDash(dash?[5,4]:[]);c.beginPath();c.moveTo(X(0),Y(v));c.lineTo(w,Y(v));c.stroke();c.setLineDash([]);c.fillStyle=col;c.font='11px '+css('--mono');c.fillText(lab,w-150,Y(v)-3);};
    line(poc,css('--poc'),'POC range’u',true);line(vah,css('--accent'),'VAH',true);line(val,css('--accent'),'VAL',true);
    if(tp!==null)line(tp,css('--buy'),'cel ~1,5× range',true);if(stop!==null&&entry!==null)line(stop,css('--sell'),'stop',true);
    c.strokeStyle=css('--fg');c.lineWidth=1.6;c.beginPath();p.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));c.stroke();
    if(ei>=0&&entry!==null){c.fillStyle=dir>0?css('--buy'):css('--sell');c.beginPath();c.arc(X(ei),Y(entry),6,0,7);c.fill();}
    c.fillStyle=css('--muted');c.font='11px '+css('--mono');c.fillText('range '+R+' min',X(0)+4,14);
    $('[data-s=e]',el).textContent=entry!==null?entry.toFixed(2):'—';$('[data-s=s]',el).textContent=stop!==null&&entry!==null?stop.toFixed(2):'—';$('[data-s=r]',el).textContent=res;
    const note={orb:'Klasyczny ORB: pending STOP na krawędzi range’u, stop po drugiej stronie. Pewne wypełnienie, ale duży stop — RR na tym samym celu jest najniższe.',va:'Model 1 Fabera: czekasz na powrót do krawędzi value area range’u po stronie wybicia, stop za drugą krawędzią VA. Mniejszy stop, lepsze RR, ale nie każdego dnia jest retest.',poc:'Retest POC: jeszcze głębsze wejście, jeszcze lepsze RR i jeszcze więcej dni bez wypełnienia.'};
    $('.cap',el).innerHTML=note[M]+' <span class="mono">Dane syntetyczne, dzień #'+seed+'.</span>';
  }
  el.addEventListener('click',e=>{const t=e.target;if(t.dataset.r){R=+t.dataset.r;$$('[data-g=r] button',el).forEach(b=>b.classList.toggle('on',b===t));draw();}if(t.dataset.m){M=t.dataset.m;$$('[data-g=m] button[data-m]',el).forEach(b=>b.classList.toggle('on',b===t));draw();}if(t.dataset.a==='day'){seed++;draw();}});
  draw();new ResizeObserver(()=>draw()).observe(holder);
};

W.expectancy=function(el){
  el.innerHTML='<div class="wt">Kalkulator: wartość oczekiwana i szansa zdania challenge’u</div><div class="ctrls"><button data-p="65,1,1">Faber prop: 65% · 1:1</button><button data-p="50,2,1">Darius: 50% · 1:2</button><button data-p="60,1.5,1">Darius: 60% · 1:1,5</button><button data-p="25,4,1">Snajper: 25% · 1:4</button></div>'+
  '<label class="rl"><span>Skuteczność (WR)</span><input type="range" id="ex_wr" min="15" max="90" value="60"><span class="v" id="ex_wrv"></span></label><label class="rl"><span>RR (zysk / ryzyko)</span><input type="range" id="ex_rr" min="0.5" max="5" step="0.25" value="1.5"><span class="v" id="ex_rrv"></span></label><label class="rl"><span>Ryzyko na trade</span><input type="range" id="ex_rk" min="0.25" max="3" step="0.25" value="1"><span class="v" id="ex_rkv"></span></label>'+
  '<div class="grid2"><div class="stat"><div class="k">E na transakcję</div><div class="v" data-s="e"></div></div><div class="stat"><div class="k">Próg rentowności WR</div><div class="v" data-s="b"></div></div><div class="stat"><div class="k">Zdany challenge +10% przed −10%</div><div class="v" data-s="p"></div></div><div class="stat"><div class="k">Mediana max. obsunięcia (100 tr.)</div><div class="v" data-s="d"></div></div></div><div class="cv"></div><div class="cap">Wykres: 40 losowych ścieżek po 100 transakcji (1000 symulacji do statystyk). Czerwona linia = −10%.</div>';
  const holder=$('.cv',el);const cv=canvasIn(holder);
  function run(){const wr=+$('#ex_wr',el).value/100,rr=+$('#ex_rr',el).value,rk=+$('#ex_rk',el).value;$('#ex_wrv',el).textContent=Math.round(wr*100)+'%';$('#ex_rrv',el).textContent='1:'+rr;$('#ex_rkv',el).textContent=rk+'%';
    const E=wr*rr-(1-wr);$('[data-s=e]',el).textContent=(E>=0?'+':'')+E.toFixed(2)+'R';$('[data-s=b]',el).textContent=Math.round(100/(1+rr))+'%';
    const r=rng(42);let pass=0,dds=[];const paths=[];
    for(let s=0;s<1000;s++){let eq=0,peak=0,dd=0,done=0;const pth=[0];for(let t=0;t<100;t++){eq+=(r()<wr?rr:-1)*rk;peak=Math.max(peak,eq);dd=Math.max(dd,peak-eq);if(!done){if(eq>=10){done=1;pass++}else if(eq<=-10){done=-1}}pth.push(eq);}dds.push(dd);if(s<40)paths.push(pth);}
    dds.sort((a,b)=>a-b);$('[data-s=p]',el).textContent=Math.round(pass/10)+'%';$('[data-s=d]',el).textContent='−'+dds[500].toFixed(1)+'%';
    const {c,w,h}=prep(cv,240);const all=paths.flat();const mx=Math.max(12,...all),mn=Math.min(-12,...all);const Y=v=>8+(mx-v)/(mx-mn)*(h-16),X=i=>i/100*(w-10)+5;c.clearRect(0,0,w,h);
    c.strokeStyle=css('--line');c.beginPath();c.moveTo(0,Y(0));c.lineTo(w,Y(0));c.stroke();c.strokeStyle=css('--sell');c.setLineDash([5,4]);c.beginPath();c.moveTo(0,Y(-10));c.lineTo(w,Y(-10));c.stroke();c.strokeStyle=css('--buy');c.beginPath();c.moveTo(0,Y(10));c.lineTo(w,Y(10));c.stroke();c.setLineDash([]);
    c.strokeStyle=css('--accent');c.globalAlpha=.35;paths.forEach(p=>{c.beginPath();p.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));c.stroke();});c.globalAlpha=1;}
  el.addEventListener('input',run);el.addEventListener('click',e=>{if(e.target.dataset.p){const [a,b,d]=e.target.dataset.p.split(',');$('#ex_wr',el).value=a;$('#ex_rr',el).value=b;$('#ex_rk',el).value=d;run();}});
  run();new ResizeObserver(()=>run()).observe(holder);
};

LESSONS.L14={title:'Struktura rynku: akceptacja, ojcostwo ruchu, dwie struktury',time:'30 min',goals:['odróżnić akceptację totalną od częściowej i wiedzieć, czemu knot to nie wybicie','znaleźć „ojca” ostatniego ruchu i jego poziom alarmowy','rozdzielić strukturę peryferyjną i aktualną oraz wyznaczyć „potencjalność kierunkową”','dobrać trzy interwały (bias, pośredni, wykonawczy)'],
html:`
<section class="s"><h2>Price action to skutek, order flow to przyczyna</h2>
<p>W kanale głównym (po włosku) Faber uczy price action dla tych, którzy handlują CFD i nie mają prawdziwego wolumenu. Jego rama jest prosta: <b>wolumen pokazuje przyczynę, cena pokazuje skutek</b>. Na CFD przyczyny nie widzisz, więc ją <b>dedukujesz</b> ze świec (albo z VSA na tick volume). Wszystko w tej lekcji jest taką dedukcją. Tam, gdzie masz dane z CME, możesz ją potwierdzić footprintem z modułu C.</p>
<div class="watch">${yt('FIOKH2t0lEU',83,'Faber · PA = skutek, OF = przyczyna')}${yt('yrGkrE5qgB4',154,'Faber · dedukcja kontra wizualizacja')}</div>
</section>
<section class="s"><h2>Akceptacja totalna i częściowa</h2>
<p>Poziom, który trzeba złamać, to <b>początek ostatniego impulsu</b>, czyli miejsce, z którego wystartowali kupujący, którzy zrobili ostatni szczyt. Faber rozróżnia trzy sytuacje:</p>
<ul><li><b>Akceptacja totalna</b>: świeca zamyka się <b>korpusem</b> po drugiej stronie poziomu. Zlecenia zostały „zjedzone”, kontynuacja jest bardziej prawdopodobna, nawet jeśli najpierw przyjdzie pullback.</li>
<li><b>Akceptacja częściowa</b>: pod poziomem jest tylko <b>knot</b>, a korpus zostaje nad nim. Knot to absorpcja. Nie wiesz, czy rynek nie zareaguje w dolnej ćwiartce strefy, więc Faber taki trade pomija.</li>
<li><b>Zamknięcie wewnątrz knota poprzedniej świecy</b>: korpus jest już za poziomem, ale wciąż w zasięgu dużego knota (np. po newsie). Takie wybicia często zawodzą. Czekaj, aż cena wyjdzie poza cały knot.</li></ul>
<div class="w" data-w="accept"></div>
<div class="tip">Na wykresie liniowym wszystkie trzy przypadki wyglądają tak samo. Stąd ostrzeżenie Fabera: linia ukrywa knoty i „dodaje” fałszywe akceptacje, które obniżają skuteczność.</div>
<div class="watch">${yt('_FW5rKScPyY',147,'Faber · totalna kontra częściowa')}${yt('icRGUv37Y5s',570,'Faber · wybicie wewnątrz knota zawodzi')}${yt('FIOKH2t0lEU',4646,'Faber · zmiana struktury wymaga korpusu')}</div>
</section>
<section class="s"><h2>Kto jest ojcem ruchu</h2>
<p>Zanim uznasz, że struktura się zmieniła, zadaj pytanie: <b>który swing spowodował ostatni niższy dołek</b>? Podaż, z której wyszedł ten ruch, jest Twoją referencją. Wybicie mniejszego, pośredniego szczytu w środku spadku nie zmienia struktury. Faber podaje, że ten sam pomysł ma różne nazwy: Lory mówi o płynności pośredniej, Larry Williams o „last point of supply”.</p>
<p>W strefie popytu Faber oznacza też <b>dominance</b>, czyli poziom, z którego weszli sprawcy ruchu. Zamknięcie pod nim to alarm, że struktura się odwraca. Swing trader trzyma stop pod dominance, trader intraday czeka na nowy schemat i zmianę struktury na niższym interwale.</p>
<div class="watch">${yt('FIOKH2t0lEU',5137,'Faber · ojcostwo ruchu')}${yt('icRGUv37Y5s',1358,'Faber · demand, origin point i dominance')}</div>
</section>
<section class="s"><h2>Dwie struktury: peryferyjna i aktualna</h2>
<p>To według Fabera fragment, który „w końcu wyjaśnia strukturę”. Struktura <b>peryferyjna</b> odpowiada na pytanie, kto zrobił ostatni <b>swing</b>. To Twój kompas. Struktura <b>aktualna</b> odpowiada na pytanie, kto zrobił ostatni <b>impuls</b>.</p>
<ul><li>Wybicie struktury aktualnej mówi tylko, że cena chce dojść do <b>następnej potencjalności kierunkowej</b>, czyli najbliższej strefy przeciwnej. To nie jest odwrócenie trendu.</li>
<li>Wybicie struktury peryferyjnej zmienia cel: teraz grasz do poprzedniego swingu albo do projekcji.</li>
<li>Peryferyjna short, a aktualna long? Test longa zwykle kończy się stopem. Najlepsze wejścia są wtedy, gdy <b>obie są zgodne</b>.</li></ul>
<div class="w" data-w="structx"></div>
<div class="watch">${yt('FIOKH2t0lEU',5565,'Faber · peryferyjna i aktualna')}${yt('FIOKH2t0lEU',3978,'Faber · potencjalność kierunkowa')}${yt('FIOKH2t0lEU',5989,'Faber · filtr: dwie struktury niezgodne')}</div>
</section>
<section class="s"><h2>Fraktalność: trzy interwały</h2>
<p>Faber korzysta z układu Eldera (Triple Screen): interwał <b>biasu</b>, <b>pośredni</b> do doprecyzowania strefy i <b>wykonawczy</b> do triggera. Zejście w dół to mniej więcej ×4 (H1→M15, M15→M5/M3, H4→H1). Wejście z niższego interwału w strefie H4 zamiast czekania na formację H4 zmienia RR z ok. 1:1,5 na wielokrotność. Warunek: interwały ustalasz z góry i na nich robisz backtest. Nie przeskakujesz między pięcioma.</p>
<table class="t"><tr><th>Styl</th><th>Bias</th><th>Pośredni</th><th>Wykonanie</th></tr>
<tr><td>Position</td><td>M / W</td><td>D1</td><td>D1</td></tr><tr><td>Swing</td><td>D1</td><td>H4</td><td>H1</td></tr><tr><td>Intraday</td><td>H4 / H1</td><td>H1</td><td>M15</td></tr><tr><td>Scalping (Faber na NQ)</td><td>M15 / M5</td><td>—</td><td>M1</td></tr></table>
<div class="tip">Faber odradza ZigZag i Fractals do czytania struktury. Pomijają swingi pośrednie, a właśnie one decydują, co zostało naprawdę złamane.</div>
<div class="watch">${yt('FIOKH2t0lEU',2451,'Faber · fraktalność i Triple Screen')}${yt('WGS09v2hQSc',363,'Faber · zejście ×4')}${yt('FIOKH2t0lEU',4894,'Faber · dlaczego bez ZigZag')}</div>
</section>

<section class="s"><h2>Która strefa jest mocna</h2>
<p>Faber ocenia strefę po trzech kryteriach Sama Seidena i dodaje dwa własne „boostery”:</p>
<ul><li><b>Czystość</b>: szybkie wyjście z bazy, mało świec. Strefa z długim chopem ma nad sobą resztki zleceń i płynność.</li>
<li><b>Eksplozja momentum</b>: im silniejsza agresja, tym więcej niewypełnionych zleceń zostało w strefie.</li>
<li><b>Świeżość</b>: strefa, do której cena jeszcze nie wróciła („fresh”), reaguje mocniej niż już zmitygowana.</li>
<li><b>Wolf</b> (kompresja przed wybiciem płynności) przed strefą podnosi skuteczność.</li>

<p>Kilka zasad z tych samych nagrań: popyt ustawiony na popycie jest słabszy. <b>Kangaroo tail</b> (seria knotów na tym samym poziomie, potem wybicie i zamknięcie w drugą stronę) to według Fabera najlepszy wzorzec świecowy, bo to w praktyce zebranie płynności. Podwójny szczyt lub dołek z manipulacją działa, potrójnego lepiej nie grać. Formacje stosuj tylko w strefie, którą już zakwalifikowałeś.</p>

<section class="s"><h2>Cele i wejście</h2>
<ul><li><b>Cel domyślny</b>: przeciwna nieefektywność albo najbliższa płynność. Nie łap ruchów pośrednich, graj cały swing.</li>
<li><b>Projekcja</b>: poziomy −0,25 i −0,5 zakresu (Fibo w TradingView ustawione na −0.25 i −0.5). Z dwóch wybierz ten bliższy nieefektywności. Na TP1 zamknij część: w pokazanym przykładzie rynek oddał potem ok. 70% ruchu.</li>
<li><b>Dwie strefy blisko siebie</b> (np. 75% i poniżej 50%): alert przed każdą, bez zleceń oczekujących. Wchodzisz tam, gdzie pojawi się potwierdzenie.</li>
<li><b>Alert ustawiasz trochę przed strefą</b>, żeby mieć czas przejść na niższy interwał.</li>
<li><b>Trigger</b> chroni przed „bombą”: pełna świeca wjeżdżająca w strefę bez zatrzymania zabiera zlecenia oczekujące.</li>
<li><b>Najwyżej dwa wejścia w tę samą strefę.</b> Faber złamał tę regułę dzień po żałobie i trzecim wejściem oddał zysk dnia oraz część poprzedniego.</li></ul>

<section class="s"><h2>Model dzienny w 4 krokach (Price Action Series 2025)</h2>
<ol><li><b>Struktura i bias</b> na kilku interwałach.</li>
<li><b>Intensywność</b>: ten sam kierunek może być agresywnym impulsem albo „nieśmiałym” spadkiem. Liczy się siła.</li>
<li><b>Wymiana</b>: gdzie rynek przeszedł z efektywnego w nieefektywny, czyli ostatni balans przed impulsem. To jest supply albo demand.</li>
<li><b>Doprecyzowanie</b>: fixed profile od A do B impulsu. Najcieńszy wolumen (LVN, „pustka”) to strefa wejścia na retest, dodatkowo VWAP.</li></ol>
<p>Przykład z NQ: przed 15:30 balans, po otwarciu impuls w dół, fixed profile A→B, wejście na retest pustki wolumenowej, cel na minimum. Zasada: <b>jeden setup dziennie zgodny z biasem</b>. HVN to cele, stop za LVN. Wybicie wymaga co najmniej jednej pełnej świecy za poziomem, sam knot to failed auction.</p>
<p><b>Zarządzanie</b>: o skuteczności decydujesz na interwale wykonawczym, o RR na interwale biasu („do gdzie jestem long” = następne przeciwne rusztowanie). Trailing za kolejne nieudane aukcje w Twoim kierunku.</p>
<div class="watch">${yt('h1dTflLC6q8',791,'Faber · model na NQ')}${yt('h1dTflLC6q8',1214,'Faber · pełna świeca, nie knot')}${yt('75UptlDYjJQ',970,'Faber · buy stop nad rusztowaniem')}${yt('Ur8-c-bDGqU',731,'Faber · rynek po schodkach')}</div>
</section>
<section class="s"><h2>Dwa style wejścia</h2>

<section class="s"><h2>Raporty banków w weekend</h2>

LESSONS.L19={title:'Walidacja edge i praca na danych',time:'30 min',goals:['przejść protokół Fabera od pomysłu do konta','zdiagnozować, na którym etapie strategia się psuje','wiedzieć, ile transakcji potrzeba i jak robić uczciwy backtest','dzielić statystyki na instrument, sesję i okres'],
html:`
<section class="s"><h2>Czym jest edge</h2>
<p>Definicja Fabera: <b>mierzalna, nieprzypadkowa powtarzalność, która daje korzystne prawdopodobieństwo</b> i dodatnią wartość oczekiwaną <b>po kosztach</b>. Trading streszcza jako systematyczne stosowanie wcześniej zwalidowanego edge w podobnych warunkach. Tylko to kontrolujesz. Rozkładu zysków i strat nie kontrolujesz.</p>
<div class="watch">${yt('6vGpW7e3I2Y',0,'Faber · dlaczego strategie nie działają')}${yt('Ole1G-_P3ss',1181,'Faber · trading w jednym zdaniu')}</div>
</section>
<section class="s"><h2>Protokół „bulletproof”</h2>
<ol><li><b>Typ tradera</b> (scalper → position). Im wyższy interwał, tym mniej czasu przy ekranie.</li>
<li><b>Konfluencje</b> z obserwacji i próbkowania statystycznego. Najpierw zrozum narzędzie: Bollinger mierzy zmienność, nie odwrócenie.</li>
<li><b>Plan tradingowy</b>: część stała, część zmienna, próg typu 5 z 7 punktów.</li>
<li><b>Backtest</b> bez podglądania przyszłości.</li>
<li><b>Forward</b> na demo.</li>
<li><b>Mały real</b> (5–10% kapitału): celem jest dyscyplina, nie zysk.</li>
<li><b>Kapitał własny albo prop</b>, potem stała optymalizacja i kontrola.</li></ol>
<table class="t"><tr><th>Gdzie spadają wyniki</th><th>Diagnoza Fabera</th><th>Co robić</th></tr>
<tr><td>backtest → forward (np. WR 40% → 20%)</td><td>zepsuty backtest: bias, cherry-picking, podgląd przyszłości</td><td>zrób backtest od nowa</td></tr>
<tr><td>forward → real</td><td>psychika: revenge, FOMO, strach</td><td>praca nad sobą, limity na koncie</td></tr>
<tr><td>mały real → duży kapitał</td><td>„termostat finansowy”</td><td>cofnij się o etap</td></tr></table>
<div class="watch">${yt('Ole1G-_P3ss',1791,'Faber · protokół')}${yt('Ole1G-_P3ss',2458,'Faber · diagnoza rozjazdów')}${yt('mnojKQ4d_7g',1365,'Faber · flow chart')}</div>
</section>
<section class="s"><h2>Uczciwy backtest</h2>
<ul><li>W Replay najpierw cofnij się tak, żeby <b>nie widzieć przyszłości</b>. Inaczej podświadomie wybierasz setupy.</li>
<li>Przy wątpliwości liczysz trade jako <b>wzięty i stratny</b>.</li>
<li>Realne koszty: spread, prowizje, poślizg. Przy 100–200 transakcjach zmieniają wynik.</li>
<li>Różne reżimy zmienności (lato, kompresja), out-of-sample, analiza wrażliwości parametrów osobno, nie w trakcie backtestu.</li>
<li><b>Liczy się liczba prób, nie czas.</b> Minimum 100, lepiej 200 transakcji. Scalper z 250 transakcjami w kwartał ma pewniejszą statystykę niż position trader z 15 rocznie. Swój model NQ Faber opiera na 8–12 tysiącach wykonań.</li></ul>
<div class="w" data-w="streak"></div>
<div class="watch">${yt('k7n6U4oVgr4',0,'Faber · Edge Validation Protocol (EN)')}${yt('VmG7ED-X_2Q',511,'Faber · replay bez podglądania')}${yt('mnojKQ4d_7g',1549,'Faber · liczba transakcji kontra czas')}${yt('Ole1G-_P3ss',2640,'Faber · Monte Carlo na żywo')}</div>
</section>
<section class="s"><h2>Nie agreguj danych</h2>
<div class="case"><div class="lab">Przypadek · trader indeksów z Dubaju</div><p>Zyskowny od dwóch lat, handlował indeksy w sesji NY. Wziął pracę popołudniami i przeniósł tę samą strategię na Londyn. Skuteczność spadła z <b>53%</b> do <b>32%</b>, spread na OTC był większy, kwartał zamknął dużą stratą. Błąd: „mój WR na Nasdaq” to nie jedna liczba. To WR na Nasdaq w danej sesji, miesiącu i kwartale.</p></div>
<ul><li><b>Dziennik emocji</b> prowadź od razu. Stanu sprzed trzech miesięcy nie odtworzysz, transakcje z brokera tak.</li>
<li><b>Serie strat w kontekście</b>: w seriach po 10 SL Faberowi wyszło ok. 6 „fizjologicznych” i ok. 4 wziętych z potrzeby odrobienia. Na tej podstawie ma mechaniczny alarm: po N stratach odchodzi od wykresu.</li>
<li><b>Środowisko</b>: 75% jego serii strat przypadało na wyjazdy i laptopa bez drugiego ekranu. Przestał handlować poza stanowiskiem i rok zamknął lepiej.</li>
<li><b>Optymalizacja tylko na danych</b>: nowy trigger najpierw sprawdzasz na starych strefach, potem w forward. Jego przykład: poluzował zbyt sztywny trigger OF. Miał więcej strat, ale też więcej setupów, i przy dodatnim RR zarobił więcej.</li>
<li>Strategie mają ograniczoną żywotność. Co miesiąc przegląd dziennika, zmiana watchlisty albo triggera. „Nie przenoś modelu NQ na złoto”.</li></ul>
<div class="watch">${yt('pfTd_pzWCk0',544,'Faber · 53% → 32%')}${yt('pfTd_pzWCk0',2380,'Faber · serie 60/40')}${yt('pfTd_pzWCk0',2685,'Faber · środowisko pracy')}${yt('mnojKQ4d_7g',1850,'Faber · poluzowany trigger')}${yt('0qo-x2_E6GA',1292,'Faber · żywotność strategii')}</div>
</section>
<div class="task"><b>Zadanie (15 min):</b> wyeksportuj z MT5 wyniki ostatniego backtestu OBR i rozbij WR oraz E na: instrument × sesja × dzień tygodnia × kwartał. Wpisz swój WR do kalkulatora serii i zapisz, jaką serię stopów musisz przetrwać w roku.</div>`};

LESSONS.L20={title:'Ryzyko i psychika jako proces',time:'30 min',goals:['rozpoznać „cheap tricks” i policzyć koszt obsunięcia','ustawić ryzyko bazowe, limit dzienny i zasadę anty-martingale','oceniać dzień po procesie, nie po wyniku','nazwać 9 błędów poznawczych i mieć na każdy antidotum','prowadzić dziennik w dwóch warstwach: automatycznej i „dlaczego”'],
html:`
<section class="s"><h2>Trading jako gra o przetrwanie</h2>
<p>Faber porównuje trading do survival game: zasobem jest kapitał, a grasz tylko tak długo, jak go masz. „Cheap tricks” działają krótko i matematycznie przegrywają:</p>
<ul><li><b>Martingale</b> i podwajanie po stracie,</li><li><b>uśrednianie</b> przeciw sobie: break-even się oddala, a Ty uczysz podświadomość, że błąd trzeba powiększać.</li></ul>
<p>Na <b>czarnego łabędzia</b> jest tylko jedna obrona: ryzyko ustawione z góry. Strategia z obsunięciem 30–40% go nie przeżyje, strategia z 5–10% przeżyje i dalej ma swój edge.</p>
<div class="w" data-w="recovery"></div>
<div class="watch">${yt('Ole1G-_P3ss',206,'Faber · cheap tricks')}${yt('Ole1G-_P3ss',571,'Faber · −20% wymaga +25%')}</div>
</section>
<section class="s"><h2>Liczby, które Faber stosuje</h2>
<ul><li><b>Ryzyko bazowe 0,25%</b> na transakcję, <b>limit dnia ok. 0,75%</b>, czyli 3 stopy i koniec.</li>
<li><b>Anty-martingale</b>: „gaz na stabilnym terenie, hamulec na niestabilnym”. W dobrych warunkach ryzykuje część zysku, w złych zmniejsza ekspozycję. W World Cup ok. 600 transakcji, seria ok. 10 stopów to obsunięcie 4–7%.</li>
<li><b>Poduszka finansowa</b> na 6–9 miesięcy kosztów życia, żeby nie wypłacać z konta w obsunięciu.</li>
<li><b>Na propie Twój kapitał to limit obsunięcia</b>, nie nominał. 5% z 200 000 to 10 000.</li>
<li><b>Monte Carlo przed propem</b>: w jego przykładzie (WR 43%, 1:2,5, 80 transakcji rocznie) średnie obsunięcie ok. 12% było za duże na propa. Zmniejszasz ryzyko, aż obsunięcie będzie do zniesienia.</li>
<li><b>Autopsja dziennika</b>: 9 na 10 szkód to transakcja spoza planu albo zwiększone ryzyko. Stan po żałobie czy złości oznacza, że tego dnia nie handlujesz.</li></ul>
<div class="watch">${yt('mU66hRONvts',0,'Faber · Risk Management Guide (cały film)')}${yt('Ole1G-_P3ss',633,'Faber · stress test')}${yt('pfTd_pzWCk0',1039,'Faber · kapitał propa = obsunięcie')}</div>
</section>
<section class="s"><h2>Proces zamiast wyniku</h2>
<table class="t"><tr><th></th><th>Zysk</th><th>Strata</th></tr>
<tr><td><b>Plan przestrzegany</b></td><td>dobry dzień</td><td>dobry dzień: to statystyka, nagródź się</td></tr>
<tr><td><b>Plan złamany</b></td><td>fart: nie nagradzaj, bo powtórzysz</td><td>zasłużona lekcja</td></tr></table>
<p>Faber nagradzał się nawet za stratne dni, jeśli przestrzegał reguł. Mózg uczy się przez wzmocnienie, a nagradzanie złamanych zasad buduje nawyk, który kiedyś spali konto. Jego zdanie: „kiedy trading robi się nudny i powtarzalny, jesteś na dobrej drodze”.</p>
<div class="watch">${yt('amOPyBvuANU',1424,'Faber · proces kontra wynik')}${yt('amOPyBvuANU',1726,'Faber · nagradzaj dyscyplinę')}</div>
</section>
<section class="s"><h2>Dziewięć pułapek i antidota</h2>
<table class="t"><tr><th>Pułapka</th><th>Jak wygląda</th><th>Antidotum</th></tr>
<tr><td>Porównywanie</td><td>„ktoś zaczął później i już wypłaca”</td><td>porównuj się ze sobą sprzed kwartału</td></tr>
<tr><td>Myślenie grupowe</td><td>zamykasz, bo ktoś z grupy jest przeciw</td><td>handlujesz sam, dzielisz się po sesji</td></tr>
<tr><td>Kotwiczenie</td><td>3–4 wejścia w tę samą strefę</td><td>maks. 2 wejścia w strefę</td></tr>
<tr><td>Outcome bias</td><td>„złamałem plan, ale zarobiłem, więc było dobrze”</td><td>oceniaj zgodność z planem</td></tr>
<tr><td>Iluzja kontroli</td><td>po serii TP ryzykujesz zysk dnia na nieistniejącym setupie</td><td>stop dnia także po zysku</td></tr>
<tr><td>Self-serving bias</td><td>zysk = talent, strata = „rynek nie szanuje struktur”</td><td>dziennik „dlaczego” dla obu</td></tr>
<tr><td>Mental accounting</td><td>demo, real i prop traktujesz inaczej; termin propa rodzi pośpiech</td><td>te same reguły wszędzie</td></tr>
<tr><td>Confirmation bias</td><td>szukasz kogoś, kto potwierdzi analizę</td><td>checklista zamiast opinii</td></tr>
<tr><td>Sunk cost</td><td>trzymasz, bo „już tyle włożyłem”</td><td>inwalidacja ustalona przed wejściem</td></tr></table>
<p>Te błędy są nieświadome, jak droga do domu, której nie pamiętasz. Dlatego Faber zaleca <b>twarde limity w platformie</b> (blokada po maksymalnej dziennej stracie), a nie samą siłę woli.</p>
<div class="watch">${yt('SH-H6AZe-2o',331,'Faber · Dunning-Kruger w tradingu')}${yt('SH-H6AZe-2o',1796,'Faber · porównywanie')}${yt('SH-H6AZe-2o',2529,'Faber · outcome bias')}${yt('SH-H6AZe-2o',3017,'Faber · mental accounting')}${yt('SH-H6AZe-2o',3568,'Faber · limity na koncie')}</div>
</section>
<section class="s"><h2>Dziennik transakcji: jak prowadzą go Faber i Darius</h2>
<p>Obaj prowadzą dziennik w dwóch warstwach. <b>Automatyczna</b> zbiera dane z platformy: instrument, czas, wynik, R. <b>Ręczna</b> zapisuje to, czego żaden automat nie wie: dlaczego wszedłeś, jak wyglądał wykres i w jakim byłeś stanie. Sama automatyczna warstwa pokaże, <i>że</i> tracisz w piątki. Dopiero ręczna powie, <i>dlaczego</i>.</p>
<div class="scroll"><table class="t"><tr><th></th><th>Faber</th><th>Darius</th></tr>
<tr><td><b>Automatyczna</b></td><td>eksport wszystkich transakcji do Pythona. Luca analizuje je statystycznie i uczeniem maszynowym. <b>Osobne konto na każdy edge</b> (scalping NQ, intraday NQ, opcje, krypto), żeby statystyki się nie mieszały</td><td>TradeZella (import z brokera) i MyFXBook, głównie jako pokaz wyników na YouTube</td></tr>
<tr><td><b>Ręczna</b></td><td>dziennik emocji. Nazywa go pierwszą rzeczą, która naprawdę poprawiła jego wyniki: zobaczył, w jakim stanie robił szkody na koncie</td><td>Notion + Discord: każdy trade ze zrzutem ekranu i uzasadnieniem, dlaczego go wziął</td></tr>
<tr><td><b>Przegląd</b></td><td>weekendy na metryki. Po każdej większej stracie „autopsja”: 9 na 10 szkód to trade spoza planu, większe ryzyko albo stan emocjonalny, a nie strategia</td><td>codziennie: gdzie był idealny setup dnia i jaka jest różnica między tym a tym, co faktycznie zrobiłeś. Statystyki (WR, RR, szansa wypłaty) to tylko rama</td></tr>
<tr><td><b>Co z tego wyszło</b></td><td>filtry z L25 (bez piątków, bez transakcji po 19:00). Cięcie dnia przy −8/−9 tys., bo dni zaczynające się 3–5 stopami kończyły się na −15/−20 tys.</td><td>zasada „journal the why” i przegląd na poziomie setupu</td></tr></table></div>

  const S=[

  el.innerHTML='<div class="wt">Ćwiczenie: przeczytaj dzień jak Faber</div><div class="mono" data-s="n"></div><div class="scroll"><svg viewBox="0 0 640 280" role="img" aria-label="Profile wczoraj i dziś"></svg></div><div class="ctrls" data-g="a">'+A.map((t,i)=>'<button data-i="'+i+'">'+t+'</button>').join('')+'</div><div class="cap"></div><div class="ctrls"><button data-a="next" class="pri">Następny przypadek →</button></div>';
  let k=0,score=0,answered=false;const svg=$('svg',el);
  function prof(ms){const b=new Array(101).fill(0);for(let p=0;p<=100;p++){ms.forEach(([mu,sd,w])=>{b[p]+=w*Math.exp(-0.5*((p-mu)/sd)**2);});}return b;}
  function draw(){const sc=S[k];answered=false;$('.cap',el).innerHTML='Który bias na jutro? Wybierz odpowiedź.';$$('[data-g=a] button',el).forEach(b=>b.className='');
    $('[data-s=n]',el).textContent='Przypadek '+(k+1)+' z '+S.length+' · wynik '+score;
    const Y=p=>10+(100-p)/100*260;let s='';
    [[sc.y,70,'wczoraj'],[sc.t,360,'dziś']].forEach(([ms,x0,lab])=>{const b=prof(ms);const mx=Math.max(...b);const va=valueArea(b);
      s+='<rect x="'+x0+'" y="'+Y(va.hi)+'" width="230" height="'+(Y(va.lo)-Y(va.hi))+'" fill="var(--accent)" fill-opacity=".12"/>';
      b.forEach((v,p)=>{if(v/mx<0.01)return;const inva=p>=va.lo&&p<=va.hi;s+='<rect x="'+x0+'" y="'+(Y(p)-1.2)+'" width="'+(v/mx*200)+'" height="2.4" fill="'+(p===va.poc?'var(--poc)':'var(--accent)')+'" fill-opacity="'+(inva?.85:.35)+'"/>';});
      s+='<text x="'+x0+'" y="276" font-size="12" font-family="var(--mono)" fill="var(--muted)">'+lab+' · VA '+va.lo+'–'+va.hi+' · POC '+va.poc+'</text>';});
    const by=valueArea(prof(sc.y));s+='<line x1="60" x2="620" y1="'+Y(by.hi)+'" y2="'+Y(by.hi)+'" stroke="var(--muted)" stroke-dasharray="3 4"/><line x1="60" x2="620" y1="'+Y(by.lo)+'" y2="'+Y(by.lo)+'" stroke="var(--muted)" stroke-dasharray="3 4"/><text x="4" y="'+(Y(by.hi)+4)+'" font-size="11" font-family="var(--mono)" fill="var(--muted)">VAH wcz.</text><text x="4" y="'+(Y(by.lo)+4)+'" font-size="11" font-family="var(--mono)" fill="var(--muted)">VAL wcz.</text>';
    svg.innerHTML=s;}
  el.addEventListener('click',e=>{const t=e.target;if(t.dataset.i!==undefined&&!answered){answered=true;const i=+t.dataset.i;const ok=i===S[k].a;if(ok)score++;$$('[data-g=a] button',el).forEach((b,j)=>{if(j===S[k].a)b.className='on';});$('.cap',el).innerHTML=(ok?'✓ ':'✗ Poprawnie: '+A[S[k].a]+'. ')+S[k].e;$('[data-s=n]',el).textContent='Przypadek '+(k+1)+' z '+S.length+' · wynik '+score;}
    if(t.dataset.a==='next'){k=(k+1)%S.length;if(k===0)score=0;draw();}});
  draw();
};

W.streak=function(el){
  el.innerHTML='<div class="wt">Kalkulator serii strat (Monte Carlo)</div><div class="ctrls"><button data-p="43,80">Przykład Fabera: 43% · 80 tr./rok</button><button data-p="60,200">60% · 200 tr./rok</button><button data-p="50,250">50% · 250 tr./rok</button><button data-p="35,300">35% · 300 tr./rok</button></div><label class="rl"><span>Skuteczność (WR)</span><input type="range" id="st_wr" min="20" max="85" value="50"><span class="v" id="st_wrv"></span></label><label class="rl"><span>Transakcji w roku</span><input type="range" id="st_n" min="20" max="600" step="10" value="200"><span class="v" id="st_nv"></span></label><div class="grid2"><div class="stat"><div class="k">Mediana najdłuższej serii strat</div><div class="v" data-s="m"></div></div><div class="stat"><div class="k">Seria, którą przetrwasz w 90% lat</div><div class="v" data-s="p"></div></div></div><div class="cv"></div><div class="cap">Słupki: prawdopodobieństwo, że w roku trafisz co najmniej taką serię strat (5000 symulacji).</div>';
  const holder=$('.cv',el);const cv=canvasIn(holder);
  function run(){const wr=+$('#st_wr',el).value/100,n=+$('#st_n',el).value;$('#st_wrv',el).textContent=Math.round(wr*100)+'%';$('#st_nv',el).textContent=n;
    const r=rng(7);const M=[];for(let s=0;s<5000;s++){let cur=0,mx=0;for(let t=0;t<n;t++){if(r()<wr)cur=0;else{cur++;if(cur>mx)mx=cur;}}M.push(mx);}M.sort((a,b)=>a-b);
    $('[data-s=m]',el).textContent=M[2500]+' stopów';$('[data-s=p]',el).textContent=M[4500]+' stopów';
    const K=[];for(let k=2;k<=16;k++)K.push([k,M.filter(v=>v>=k).length/5000]);
    const {c,w,h}=prep(cv,220);c.clearRect(0,0,w,h);const bw=(w-40)/K.length;c.font='11px '+css('--mono');
    K.forEach(([k,p],i)=>{const x=30+i*bw,bh=p*(h-40);c.fillStyle=p>=0.5?css('--sell'):css('--accent');c.globalAlpha=.8;c.fillRect(x+3,h-22-bh,bw-6,bh);c.globalAlpha=1;c.fillStyle=css('--muted');c.fillText(String(k),x+bw/2-5,h-6);if(p>0.02){c.fillStyle=css('--fg');c.fillText(Math.round(p*100)+'%',x+2,h-26-bh);}});}
  el.addEventListener('input',run);el.addEventListener('click',e=>{if(e.target.dataset.p){const [a,b]=e.target.dataset.p.split(',');$('#st_wr',el).value=a;$('#st_n',el).value=b;run();}});
  run();new ResizeObserver(()=>run()).observe(holder);
};

LESSONS.L21={title:'Strategia H4 od zera: checklista Fabera',time:'30 min',goals:['zbudować strategię w kolejności: checklista → backtest → demo → mały live','zastosować 4 punkty obowiązkowe i 3 opcjonalne checklisty H4','wybrać między pendingiem w strefie a wejściem na potwierdzeniu','czytać statystyki Fabera jako hipotezę do testu w MT5, nie jako fakt'],
html:`
<section class="s"><h2>Skąd ta lekcja</h2>
<p>Cykl „Building a Strategy from Scratch” to cztery transmisje na żywo z lutego i marca 2022. Faber buduje w nich od zera strategię H4 „dla wszystkich”: do CFD i FX, bez danych z CME. To najbliższa Twojemu botowi część jego materiału. Operuje na świecach i poziomach, więc da się ją zakodować w MT5.</p>
<p>Zaczyna od czterech filarów, bez których sama checklista nic nie da:</p>
<ul><li><b>Ryzyko</b>: agresywne 2–3%, umiarkowane 1%, konserwatywne 0,25–0,5% (na propie tylko konserwatywne).</li>
<li><b>Zarządzanie operacyjne</b> ustalone przed wejściem (L22).</li>
<li><b>Psychika</b>: typowe błędy to oversize z zaufania do mentora i zmiana strategii po tygodniu obsunięcia.</li>
<li><b>Plan</b>: plan to nie checklista. Plan = checklista + dziennik + planowanie (sesja, ryzyko, maksymalna ekspozycja dzienna i tygodniowa, newsy, akceptowany RR).</li></ul>
<div class="watch">${yt('2mMKsPwInZo',327,'Faber · cztery filary')}${yt('2mMKsPwInZo',1120,'Faber · kolejność budowy')}</div>
</section>
<section class="s"><h2>Kolejność budowy</h2>
<p>Checklista (research) → <b>backtest</b> → skład watchlisty (3–5 instrumentów; trend following nie na instrumencie, który chodzi w zakresie) → <b>demo ustawione jak realny kapitał</b> → konsystencja przez minimum kwartał → mały live (tu wychodzą emocje) → skalowanie. Na H1/H4 wychodzi ok. <span class="num">4–5</span> setupów na instrument miesięcznie, więc kwartał demo to kilkadziesiąt transakcji, a nie kilkaset.</p>
<div class="tip">Ta sama ścieżka co u Ciebie z OBR: MT5 Strategy Tester to etap „backtest”. Forward na demo jest osobnym etapem, a nie formalnością.</div>
</section>
<section class="s"><h2>Checklista: 4 punkty obowiązkowe</h2>
<ol><li><b>Struktura H4 z akceptacją</b>, czyli zamknięcie korpusem (L14). Bias = akceptacja ostatniego impulsu. Nie bierzesz pullbacków M5 przeciw H4.</li>
<li><b>Strefa S/D, która spowodowała wybicie</b>: origin point albo strefa pośrednia. Ważniejszy jest punkt startu i świeca wybicia niż sama strefa.</li>
<li><b>Projekcja kwartylowa ≥ 1:3</b>. Wejście w premium (dla shorta) minimum powyżej 50%, optymalnie powyżej 75% zakresu. Cel to projekcja −25%, czyli kolejna noga ≈ poprzedniej (measured move). RR liczysz <b>przed</b> wejściem.</li>
<li><b>Okrągłe liczby i połówki</b> (Quarters Theory) jako konfluencja. Połówka to miejsce zbierania płynności, a nie reakcji.</li></ol>
<p>Punkty opcjonalne:</p>
<ol start="5"><li><b>Filtr godzin</b>: Londyn/NY kontra Azja wyraźnie zmienia wyniki.</li>
<li><b>Trigger</b>: manipulacja na otwarciu sesji (wersja intraday).</li>
<li><b>Filtr fundamentalny</b>: COT (L18).</li></ol>
<div class="w" data-w="h4check"></div>
<div class="watch">${yt('1BNCEe0GU7I',1476,'Faber · checklista finalna')}${yt('CWXbjQ8bejA',512,'Faber · bias, zakres, kwartyle')}${yt('CWXbjQ8bejA',1246,'Faber · okrągłe liczby i połówki')}${yt('2mMKsPwInZo',2160,'Faber · 5 punktów strategii H4')}</div>
</section>
<section class="s"><h2>Pending w strefie czy wejście na potwierdzeniu</h2>
<p>Faber pokazuje trzy triggery. Pierwszy to <b>pending w strefie</b> dla zajętych: stop za strefą, dalej trailing. Drugi to <b>evidence</b>, czyli zmiana struktury na interwale ×4 niższym (H4→H1, H1→M15). Trzeci to świeca odrzucenia na H4/H1, „three candle pattern” albo wybicie neckline z testem.</p>
<div class="case"><div class="lab">Przypadek z filmu · backtest na żywo GBPJPY H1 i USDJPY, styczeń–luty 2022</div><p>Wyniki były mieszane, ale jeden wniosek jest jasny. <b>Pending ze stopem za całą strefą</b> płacił lepiej niż wejście na evidence z krótkim stopem. Rynek robi spike’i tuż pod origin point (mutacja z L16), a krótki stop je łapie. Wniosek Fabera: evidence tylko z hojnym stopem. Trade pomija, gdy dominuje strona przeciwna (kompresja) albo brakuje akceptacji (same knoty).</p></div>
<div class="watch">${yt('CWXbjQ8bejA',1490,'Faber · trzy triggery')}${yt('7cZQzbeDNME',1609,'Faber · backtest: pending kontra evidence')}</div>
</section>
<section class="s"><h2>Statystyki Fabera: hipoteza do testu</h2>
<table class="t"><tr><th>Instrument</th><th>WR przy 1:3</th><th>Uwagi</th></tr>
<tr><td>EURUSD</td><td class="num">55%</td><td rowspan="4">backtest Fabera, 1 kwartał, H4, pending, bez filtra COT. Niezweryfikowane.</td></tr>
<tr><td>GBPUSD</td><td class="num">59%</td></tr><tr><td>USDJPY</td><td class="num">51%</td></tr><tr><td>NQ</td><td class="num">64%</td></tr></table>
<p>Jeden kwartał H4 to ok. 12–15 setupów na instrument. Przy takiej próbce 55% i 64% statystycznie się nie różnią. Traktuj tabelę jako punkt startowy dla MT5, a nie wynik. WR 55% przy 1:3 dałby EV ok. +1,2R na trade, a to podejrzanie dużo. Faber sam mówi o wadzie strategii: w konsolidacjach daje dużo BE.</p>
<div class="tip">Dwie obserwacje z tej serii, które warto sprawdzić na OBR. <b>Tydzień</b>: poniedziałek i wtorek „czyszczą” zakres poprzedniego tygodnia, kierunek przychodzi później. <b>Immobilizm</b>: czekanie na idealny powrót do 75% gubi trade’y, bo rynek często zaczyna dystrybucję już nad 50%.</div>
<div class="watch">${yt('1BNCEe0GU7I',1782,'Faber · statystyki backtestu')}${yt('7cZQzbeDNME',1670,'Faber · poniedziałek–wtorek czyszczą zakres')}${yt('1BNCEe0GU7I',204,'Faber · błąd immobilizmu')}</div>
</section>
<div class="task"><b>Zadanie (10 min):</b> przejdź w widżecie trzy scenariusze, potem opisz jeden własny trade z OBR punktami 1–7. Które punkty bot już sprawdza (struktura? RR z góry?), a których nie ma (okrągłe liczby, COT)? To lista kandydatów na filtry do testu A/B w MT5.</div>`};

LESSONS.L22={title:'Zarządzanie operacyjne: BE, TP, trailing, ADR',time:'30 min',goals:['porównać stałą i dynamiczną projekcję celu na tej samej transakcji','stosować regułę BE Fabera: zamknięcie świecy za swingiem, a nie „mała reakcja”','dopasować cel do ADR instrumentu','wiedzieć, kiedy piramidować, a kiedy brać częściowe TP'],
html:`
<section class="s"><h2>Ta sama strategia, sto wyników</h2>
<p>Faber przytacza eksperyment z Wall Street: tę samą strategię dostało sto osób i wyszło sto różnych wyników. Różnicę robią ryzyko, zarządzanie i psychika. Dlatego każdą strategię <b>backtestuje z kilkoma typami zarządzania</b>. Strategia słaba ze stałym TP może być dobra z dynamicznym.</p>
<div class="watch">${yt('yVSWUrhpYRk',461,'Faber · 100 osób, 100 wyników')}${yt('yVSWUrhpYRk',1798,'Faber · testuj każdy typ zarządzania')}</div>

<section class="s"><h2>Stała kontra dynamiczna projekcja</h2>

<section class="s"><h2>Trzy modele z „Blood, Sweat &amp; Scalps”</h2>

<section class="s"><h2>Realizm: liczby i trzy zasady przetrwania</h2>
<ul><li><b>Konkurs ≠ konto</b>: World Trading Cup grał z 4–5× większym ryzykiem. 500% w WTC to na koncie osobistym ok. 50–100% rocznie. Jego reguła: wynik konkursu ÷ 5–6.</li>

  {upto:23,t:'<b>Koniec dnia.</b> Konsolidacja przed kolejną Azją. To ilustracja modelu. Faber podaje ok. 7/10 odwróceń w oknach, bez opublikowanego testu. Twój test: MT5 na historii OBR.'}]});
W.vsa4=function(el){
  const K={fake:{n:'1 · Fake move (spring)',c:[[110,112,104,106],[106,107,101,102],[102,103,97,100.5],[100.5,106,100,105.5],[105.5,110,105,109]],v:[60,48,25,70,80],t:'<b>Nowy dołek przy wyczerpanym wolumenie sprzedaży</b> (trzecia świeca: niski słupek), potem szybki powrót. Low volume shakeout = manipulacja. Wejście na springu daje wyższe RR i niższy WR. Wejście po „jump the creek” z wysokim wolumenem odwrotnie.'},
   cat:{n:'2 · Catalyst',c:[[100,103,99,102],[102,103.5,100.5,101],[101,104,100.5,103.5],[103.5,109,103,108.5],[108.5,112,107.5,111.5]],v:[30,28,35,85,70],t:'<b>Wybicie z akceptacją i rosnącym wolumenem w kierunku.</b> Cena i wolumen zgodne → kontynuacja. Wysiłek daje rezultat.'},
   abs:{n:'3 · Absorpcja',c:[[100,104,99.5,103.5],[103.5,107,103,106.5],[106.5,112,105.5,107],[107,108,103,104],[104,105,99,100]],v:[40,50,95,55,50],t:'<b>Duży wolumen, długi knot, zamknięcie w zakresie.</b> Ogromny wysiłek kupujących bez nowego szczytu na zamknięciu („stopping volume”). Wysiłek bez rezultatu → odwrócenie.'},
   rmc:{n:'4 · Real money candle',c:[[104,105,102.5,103],[103,103.5,101.5,102],[102,110,101.5,109.5],[109.5,111,107.5,108],[108,109,106,106.5]],v:[25,22,95,40,30],t:'<b>Świeca wyróżniająca się i ceną, i wolumenem.</b> Jej baza to strefa („fresh” S/D Seidena). Przy powrocie do niej szukasz wejścia w kierunku świecy.'}};
  el.innerHTML='<div class="wt">Cztery potwierdzenia wolumenowe (ilustracja; tick volume)</div><div class="ctrls" data-g="k">'+Object.keys(K).map((k,i)=>'<button data-k="'+k+'"'+(i?'':' class="on"')+'>'+K[k].n+'</button>').join('')+'</div><div class="scroll"><svg viewBox="0 0 640 260" role="img" aria-label="Świece i wolumen"></svg></div><div class="cap"></div>';
  function draw(k){const d=K[k];const hi=Math.max(...d.c.map(x=>x[1]))+1,lo=Math.min(...d.c.map(x=>x[2]))-1;const Y=v=>10+(hi-v)/(hi-lo)*160;let s='';
    d.c.forEach((x,i)=>{const cx=110+i*100,up=x[3]>=x[0],col=up?'var(--buy)':'var(--sell)';s+='<line x1="'+cx+'" x2="'+cx+'" y1="'+Y(x[1])+'" y2="'+Y(x[2])+'" stroke="'+col+'" stroke-width="2"/>';const t=Y(Math.max(x[0],x[3])),b=Y(Math.min(x[0],x[3]));s+='<rect x="'+(cx-16)+'" y="'+t+'" width="32" height="'+Math.max(2,b-t)+'" fill="'+col+'"/>';
      const vh=d.v[i]*0.7;s+='<rect x="'+(cx-16)+'" y="'+(250-vh)+'" width="32" height="'+vh+'" fill="var(--accent)" opacity="'+(d.v[i]>=80?0.95:0.45)+'"/>';});
    s+='<text x="8" y="196" font-size="11" font-family="var(--mono)" fill="var(--muted)">wolumen</text><line x1="0" x2="640" y1="182" y2="182" stroke="var(--line)"/>';
    $('svg',el).innerHTML=s;$('.cap',el).innerHTML=d.t;}
  $('[data-g=k]',el).addEventListener('click',e=>{const k=e.target.dataset.k;if(!k)return;$$('[data-g=k] button',el).forEach(b=>b.classList.toggle('on',b===e.target));draw(k);});draw('fake');
};
W.regime=function(el){
  const Q=[['loc','Gdzie jest cena?',[['in','w VA poprzedniej sesji cash'],['out','zaakceptowana poza VA (imbalance)'],['poke','pierwsze wyjście poza VA i powrót']]],
    ['ses','Sesja',[['ny','NY'],['ldn','Londyn / lato / kompresja']]],
    ['gam','Option flow',[['neg','ujemna gamma / cena odjeżdża od zero gamma'],['pos','dodatnia gamma, chop wokół zero gamma'],['na','brak danych (CFD)']]]];
  const st={loc:'in',ses:'ny',gam:'na'};
  el.innerHTML='<div class="wt">Który model? (drzewo decyzji z sesji Fabera)</div>'+Q.map(q=>'<div class="cap" style="margin:8px 0 4px"><b>'+q[1]+'</b></div><div class="ctrls" data-q="'+q[0]+'">'+q[2].map(o=>'<button data-v="'+o[0]+'"'+(st[q[0]]===o[0]?' class="on"':'')+'>'+o[1]+'</button>').join('')+'</div>').join('')+'<div class="case" data-s="o"><div class="lab">Wniosek</div><p></p></div>';
  function run(){let t;const {loc,ses,gam}=st;
    if(gam==='pos'&&loc!=='out')t='<b>Siedź na rękach</b> albo graj tylko rotację krawędź → krawędź z małym RR i szybkim TP. Faber: w takie dni przepłaca prowizje, gdy próbuje wybić. Gdy dzień jest już na plusie, zamknij.';
    else if(loc==='in')t='<b>Model balansu (mean reverting).</b> Absorpcja na krawędzi VA (big trades), cel 1 = POC. Do przeciwnej krawędzi tylko przy zgodnym profile framingu. 1:3 i reload z zysku. BOS w środku VA to według Fabera tylko ok. 30% kontynuacji.';
    else if(loc==='poke')t='<b>Model 2 z Chart Fanatics (mean reversion)</b>'+(ses==='ldn'?', naturalny dla Londynu i kompresji':'')+'. Nie grasz pierwszego ruchu. Czekasz na złamanie struktury z powrotem do VA i duże zlecenia w stronę powrotu. Cel = POC, SL od razu za agresją, BE po pierwszym wybiciu w stronę celu.';
    else if(ses==='ldn')t='<b>Ostrożnie.</b> W Londynie wybicia na indeksach USA często wracają (fakeouty), więc Faber gra trend tylko w NY. Jeśli już grasz, to momentum z filtrem speed of tape albo Model 2 po powrocie.';
    else t='<b>Model 1 trend (NY)</b> albo <b>momentum</b>. Lokalizacja: LVN swingu, który wyszedł z balansu (fixed profile A→B). Trigger: bąbel agresji ≥30 kontraktów NQ, SL tuż za nim. Cel: POC poprzedniego balansu, całość na celu, min. 1:2,5.'+(gam==='neg'?' Ujemna gamma wzmacnia ruch, więc trailing zamiast wczesnego TP.':'')+(gam==='na'?' Bez danych opcyjnych: filtr reżimu przybliżasz zmiennością.':'');
    $('[data-s=o] p',el).innerHTML=t;}
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const g=b.parentElement.dataset.q;if(!g)return;st[g]=b.dataset.v;$$('button',b.parentElement).forEach(x=>x.classList.toggle('on',x===b));run();});run();
};
W.dayrules=function(el){
  el.innerHTML='<div class="wt">Symulator zasad dnia (model ilustracyjny, 5000 dni)</div><label class="rl"><span>Dni zakresowych</span><input type="range" id="dr_p" min="0" max="90" step="5" value="70"><span class="v" id="dr_pv"></span></label><label class="rl"><span>WR w dniu trendowym</span><input type="range" id="dr_wt" min="30" max="80" value="55"><span class="v" id="dr_wtv"></span></label><label class="rl"><span>WR w dniu zakresowym</span><input type="range" id="dr_wc" min="10" max="60" value="28"><span class="v" id="dr_wcv"></span></label><label class="rl"><span>RR (zysk w R)</span><input type="range" id="dr_rr" min="1" max="5" step="0.5" value="2"><span class="v" id="dr_rrv"></span></label><label class="rl"><span>Maks. transakcji dziennie</span><input type="range" id="dr_n" min="2" max="15" value="8"><span class="v" id="dr_nv"></span></label><div class="ctrls"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dr_s" checked> 3 stratne = koniec dnia</label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dr_c"> limit zysku +6R</label></div><div class="scroll"><table class="t"><tr><th></th><th>Bez zasad</th><th>Z zasadami</th></tr><tr><td>Średnio na dzień</td><td class="num" data-s="a0"></td><td class="num" data-s="a1"></td></tr><tr><td>Zielone dni</td><td class="num" data-s="g0"></td><td class="num" data-s="g1"></td></tr><tr><td>Najgorsze 5% dni (średnio)</td><td class="num" data-s="w0"></td><td class="num" data-s="w1"></td></tr><tr><td>Transakcji dziennie</td><td class="num" data-s="n0"></td><td class="num" data-s="n1"></td></tr><tr><td>Średnio na transakcję</td><td class="num" data-s="t0"></td><td class="num" data-s="t1"></td></tr></table></div><div class="cap">Założenia: typ dnia jest nieznany traderowi, transakcje wewnątrz dnia są niezależne, skuteczność zależy tylko od typu dnia. Parametry to założenia do zabawy, nie dane Fabera. Od niego jest tylko „rynek stacjonarny ok. 70% czasu” i reguła 3 stopów.</div>';
  function run(){const p=+$('#dr_p',el).value/100,wt=+$('#dr_wt',el).value/100,wc=+$('#dr_wc',el).value/100,rr=+$('#dr_rr',el).value,N=+$('#dr_n',el).value,S=$('#dr_s',el).checked,Cp=$('#dr_c',el).checked;
    $('#dr_pv',el).textContent=Math.round(p*100)+'%';$('#dr_wtv',el).textContent=Math.round(wt*100)+'%';$('#dr_wcv',el).textContent=Math.round(wc*100)+'%';$('#dr_rrv',el).textContent='1:'+rr;$('#dr_nv',el).textContent=N;
    const r=rng(11);const A=[[],[]],T=[0,0];
    for(let d=0;d<5000;d++){const chop=r()<p,wr=chop?wc:wt;const out=[];for(let i=0;i<N;i++)out.push(r()<wr?rr:-1);
      let s0=0;out.forEach(x=>s0+=x);A[0].push(s0);T[0]+=N;
      let s1=0,l=0,n=0;for(let i=0;i<N;i++){s1+=out[i];n++;if(out[i]<0)l++;if(S&&l>=3)break;if(Cp&&s1>=6)break;}A[1].push(s1);T[1]+=n;}
    [0,1].forEach(j=>{const a=A[j],m=a.reduce((x,y)=>x+y,0)/a.length,g=a.filter(x=>x>0).length/a.length,sr=a.slice().sort((x,y)=>x-y),w=sr.slice(0,250).reduce((x,y)=>x+y,0)/250;
      const f=v=>(v>=0?'+':'')+v.toFixed(2)+'R';$('[data-s=a'+j+']',el).textContent=f(m);$('[data-s=g'+j+']',el).textContent=Math.round(g*100)+'%';$('[data-s=w'+j+']',el).textContent=f(w);$('[data-s=n'+j+']',el).textContent=(T[j]/5000).toFixed(1);$('[data-s=t'+j+']',el).textContent=f(a.reduce((x,y)=>x+y,0)/T[j]);});}
  el.addEventListener('input',run);el.addEventListener('change',run);run();
};

LESSONS.L26={title:'Ściąga 1: oś czasu dnia (Azja → Londyn → NY)',time:'15 min',goals:['mieć w jednym miejscu wszystkie godziny z lekcji L16, L17, L22–L25','odróżnić okna FX od okien indeksów USA','zobaczyć, gdzie źródła się różnią i co trzeba sprawdzić w MT5'],
html:`
<section class="s"><h2>Jedna oś zamiast pięciu lekcji</h2>
<p>Godziny z kursu są rozrzucone po L16 (cykl dnia), L17 (model dzienny NQ), L22 (spread wieczorem), L23 (świeca D1), L24 (Londyn a NQ) i L25 (struktura NY). Tu są na jednej osi, w czasie polskim. Kliknij pasek, żeby zobaczyć szczegóły i źródło.</p>
<div class="w" data-w="daymap"></div>
<div class="tip"><b>Zmiana czasu.</b> Godziny NY podane są dla okresu, w którym USA i Europa mają ten sam tryb czasu. Przez 2–3 tygodnie w marcu i ok. tydzień na przełomie października i listopada otwarcie NY wypada o 14:30 zamiast 15:30. Bot z godziną wpisaną na sztywno w tych tygodniach handluje inny rynek.</div>
</section>
<section class="s"><h2>Gdzie źródła się różnią</h2>
<table class="t"><tr><th>Temat</th><th>Wersja A</th><th>Wersja B</th><th>Co z tym zrobić</th></tr>
<tr><td>Okno manipulacji rano</td><td>L16: ok. 9:00 (otwarcie Londynu)</td><td>L23: 8:30–9:30</td><td>to samo zjawisko, L23 to szerszy zakres. W teście MT5 użyj 8:30–9:30</td></tr>
<tr><td>Okno po południu</td><td>L16: 14:30–15:30 (największy wolumen NY na EURUSD/GBPUSD)</td><td>L23: 13:30–14:30</td><td>L23 kończy się tam, gdzie zaczyna L16. Newsy USD o 14:30 leżą na granicy. Testuj oba okna osobno</td></tr>
<tr><td>Wieczór na NQ</td><td>L25: filtr Luki „bez transakcji po 19:00” (WR 20%)</td><td>L25: 90% wejść modelu B w power hour 19:30–21:00</td><td>sprzeczność u samego Fabera: filtr pochodzi z danych konta hyperscalpingu, model B z innej sesji. Nie przenoś żadnej z tych reguł na OBR bez własnych danych</td></tr>
<tr><td>Londyn na indeksach</td><td>L24: wybicia na NQ w Londynie często wracają, trend tylko w NY</td><td>L23: na indeksach nie grać manipulacji sesji, tylko kierunek tygodniowy</td><td>spójne: na indeksach Londyn to nie czas na wybicia</td></tr></table>
</section>
<div class="task"><b>Zadanie (5 min):</b> zaznacz na osi godziny, w których dziś handluje OBR (Tokio, Londyn, NY). Które pasy z osi przecinają się z Twoimi wejściami? To gotowa lista kolumn do raportu MT5: godzina wejścia × wynik.</div>`};

/* ---------------- L27 ---------------- */
LESSONS.L27={title:'Ściąga 2: macierz prowadzenia pozycji',time:'15 min',goals:['zobaczyć, że „sprzeczne” zasady BE i TP zależą od stylu i instrumentu','wybrać zestaw zasad dla OBR do testu A/B'],
html:`
<section class="s"><h2>Dlaczego zasady wydają się sprzeczne</h2>
<p>W L22 Faber przesuwa stop na BE dopiero po zamknięciu świecy za swingiem. W L25 robi to w pierwszej minucie. W L21 bierze 50% na 1:3, a w L22 mówi, że na NQ nie bierze częściowych. To nie są sprzeczności. Zasady zależą od tego, <b>co widzisz</b> (świece czy order flow) i <b>jak zachowuje się instrument</b> (trend czy powrót do średniej).</p>
<div class="scroll"><table class="t"><tr><th>Styl</th><th>Instrument</th><th>BE</th><th>Stop w zysku / trailing</th><th>Cel</th><th>Częściowe TP</th><th>Lekcja</th></tr>
<tr><td><b>Swing / intraday H4–M15</b> (price action, bez wolumenu)</td><td>FX, indeksy CFD</td><td>gdy świeca wykonawcza <b>zamknie się za swingiem</b> po wyjściu z dystrybucji</td><td>przy <b>drugim wybiciu</b>, za strefą sprawców; nie na 50% nogi, nie ATR</td><td>stały: projekcja −25% (≥1:3) albo dynamiczny do złamania struktury</td><td>tak: 50% na 1:3, reszta z SL=0 (strategia H4)</td><td>L21, L22</td></tr>
<tr><td><b>Swing trendowy</b></td><td>NQ, złoto, ropa, krypto</td><td>jak wyżej</td><td>trailing za kolejnymi strefami popytu</td><td>dynamiczny (w przykładzie NQ 1:9,57 kontra 1:3,15 stałe)</td><td>raczej nie: dodatni skos, długie ruchy płacą za wszystko</td><td>L22</td></tr>
<tr><td><b>Swing mean reverting</b></td><td>pary FX w zakresie</td><td>jak wyżej</td><td>—</td><td>stały, do POC albo przeciwnej krawędzi</td><td>tak</td><td>L22</td></tr>
<tr><td><b>Scalping order flow</b> (big trades, footprint)</td><td>NQ, GC futures</td><td>gdy bitwa jest wygrana: nowe duże zlecenia w Twoją stronę, <b>często w pierwszej minucie</b></td><td>za ostatnim punktem agresji przeciwnej strony albo za poziomem kontroli, nie za świecą</td><td>POC poprzedniego balansu (Model 1), POC (Model 2), cel dnia</td><td>Faber na NQ: trailing zamiast częściowych; Darius: dokładanie na kolejnej absorpcji</td><td>L10, L24, L25</td></tr>
<tr><td><b>Hyperscalping w zakresie</b></td><td>NQ w kompresji</td><td>natychmiast</td><td>—</td><td>szybkie 1:1–1:3, wyjście przed POC sesji</td><td>—</td><td>L24, L25</td></tr>
<tr><td><b>Wybicie zakresu otwarcia</b> (IVB / OBR)</td><td>NQ, FX</td><td>brak reguły od autorów, testować oba warianty</td><td>—</td><td>protection level albo 1:2–1:3 i runner (IVB). OBR: stały TP</td><td>IVB: runner do protection level</td><td>L9, L13</td></tr></table></div>
<div class="tip"><b>Dla OBR.</b> OBR handluje świecami na CFD bez wolumenu, więc właściwy jest pierwszy wiersz, nie scalping. Zestaw do testu A/B w MT5 (specyfikacja w L22): obecny stały TP kontra BE po zamknięciu świecy za swingiem, stop w zysku przy drugim wybiciu i wyjście na złamaniu struktury M15. Porównuj PF, max DD i liczbę transakcji zamkniętych na BE.</div>
</section>
<section class="s"><h2>Wspólne dla wszystkich stylów</h2>
<ul><li>Zasady prowadzenia <b>ustalasz przed wejściem</b> i testujesz razem ze strategią. Słaba strategia ze stałym TP może być dobra z dynamicznym (L22).</li>
<li>BE za wcześnie to koszt. Podwójne polowanie na stopy wyrzuca Cię przed ruchem (L22).</li>
<li>„Nie zbankrutujesz przez realizację zysku”, ale cel ekstremum osiąga ok. 1 na 10 sesji (L25). Liczy się proporcja WR i RR na długiej próbie.</li>
<li>Spread wieczorem (21–23) na propach CFD wyrzuca stopy BE (L22).</li></ul>
</section>`};

LESSONS.L28={title:'Ściąga 3: karta ryzyka',time:'15 min',goals:['zebrać wszystkie liczby ryzyka z L12, L19, L20, L21, L25 w jednej tabeli','wypełnić własną kartę i przeliczyć ją na kwoty'],
html:`
<section class="s"><h2>Wszystkie liczby w jednym miejscu</h2>
<div class="scroll"><table class="t"><tr><th>Parametr</th><th>Faber</th><th>Darius</th><th>Lekcja</th></tr>
<tr><td>Ryzyko na transakcję</td><td>konto własne 0,25% (baza). W World Cup do 0,5%, po +100% do 1%. Profile: konserwatywny 0,25–0,5%, umiarkowany 1%, agresywny 2–3%. Na koncie wielomilionowym stała kwota 2–2,5 tys. $</td><td>prop: 500–1000 $ na trade (konto 150k). Dawniej challenge CFD 1%</td><td>L12, L20, L21, L25</td></tr>
<tr><td>Limit straty dnia</td><td>ok. 0,75% = 3 stopy. Bezpiecznik −1% dziennie</td><td>blokada w platformie; cel dzienny zgodny z zasadą spójności propa</td><td>L12, L20</td></tr>
<tr><td>Koniec dnia po stratach</td><td>3 stratne transakcje (na starcie sesji 4–5); tnie przy −8/−9 tys., bo dni od 3–5 SL kończyły się −15/−20 tys.</td><td>po osiągnięciu celu albo limitu</td><td>L20, L25</td></tr>
<tr><td>Limit zysku dnia</td><td>w dniu kompresji max SL = max zysk (np. 8 tys.). W trendzie po +20 tys. koniec</td><td>1–1,5 tys. $ dziennie (spójność 20% przy celu 9 tys.)</td><td>L12, L25</td></tr>
<tr><td>Po zysku</td><td>ryzykujesz tylko zysk sesji („poduszka”), max obsunięcie dnia = BE. Anty-martingale</td><td>skalowanie z zysku, dokładanie tak, żeby ryzyko netto = 0</td><td>L10, L20, L25</td></tr>
<tr><td>Po stracie</td><td>nigdy większa ekspozycja; w obsunięciu mniejsza</td><td>w DD ryzyko /2 (era CFD)</td><td>L12, L20, L25</td></tr>
<tr><td>Wartość oczekiwana</td><td>WR 43–49% przy średnio 1000 $ wygranej i 600 $ straty na kontrakt (NQ). Nie da się mieć 1:20 przy 75% WR</td><td>cel E = +0,5R (1,5R przy 60% albo 2R przy 50%)</td><td>L12, L25</td></tr>
<tr><td>Serie strat</td><td>ok. 10 stopów z rzędu w World Cup (600 transakcji) = obsunięcie 4–7%; Model 1: najdłuższa seria 11 SL</td><td>—</td><td>L19, L20, L24</td></tr>

<section class="s"><h2>Model trzech warstw: ICT, price action i order flow razem (do testu)</h2>
<p>Wniosek z rozmowy przy lekcji 2 (LVN a FVG). ICT (Inner Circle Trader, szkoła tradingu Michaela Huddlestona) <b>nie wyklucza</b> order flow. Często opisuje te same zdarzenia inną teorią: sweep (wybicie po stopy) to w footprincie (wykresie wolumenu na każdej cenie w świecy) seria odpalonych stopów, czyli agresja, którą widać. Słabym punktem ICT nie jest mapa, tylko <b>wejście bez potwierdzenia</b>. To, co w ICT jest już wejściem, w order flow jest najwyżej kandydatem.</p>
<div class="scroll"><table class="t"><tr><th>Warstwa</th><th>Pytanie</th><th>Narzędzia</th></tr>
<tr><td><b>1. Mapa</b></td><td>gdzie i kiedy patrzeć?</td><td>ICT: pule stopów nad szczytami i pod dołkami, FVG (fair value gap, luka „niesprawiedliwej” wyceny), okna czasowe sesji (killzones); price action (analiza samej ceny): struktura trendu; AMT (Auction Market Theory, teoria aukcji rynkowej): VA (value area, obszar wartości z ok. 70% wolumenu), LVN (low volume node, poziom z małym wolumenem)</td></tr>
<tr><td><b>2. Wyzwalacz</b></td><td>czy to dzieje się teraz?</td><td>order flow: absorpcja, agresja, delta, heatmapa, bąble; dopiero tu zapada decyzja o wejściu</td></tr>
<tr><td><b>3. Prowadzenie</b></td><td>gdzie się mylę, gdzie biorę zysk?</td><td>SL (stop loss) za poziomem unieważnienia, czyli tam, gdzie widać akceptację po drugiej stronie; TP (take profit) przy następnym HVN (high volume node, poziom z dużym wolumenem) albo puli płynności; time stop (wyjście po czasie), jeśli reakcji brak przez N świec</td></tr></table></div>
<p><b>Uczciwa ocena:</b></p>
<ul><li><b>ICT to nie „rzut monetą”.</b> Model 2022 też filtruje: sweep, MSS (market structure shift, złamanie struktury), displacement (gwałtowny ruch) tworzący FVG, wejście na powrocie, w oknie czasowym. Filtruje jednak samą ceną i czasem. Rzetelnych, niezależnych statystyk ICT nie ma ani za, ani przeciw.</li>
<li><b>Trafność to nie przewaga.</b> Przy stosunku zysku do ryzyka 1:2 trafność 50% daje zysk. Liczy się wynik w R (ryzykach) po kosztach.</li>
<li><b>Filtr order flow kosztuje:</b> mniej transakcji, późniejsze wejście (gorsza cena, mniejszy zysk przy tym samym SL), ruchy bez retestu przepadają. Narzędzia też mylą: spoof (fałszywe zlecenia na heatmapie), iceberg (ukryte zlecenia), szum algorytmów (zarzut Raschke).</li>
<li><b>Jedyny audytowany setup z tego środowiska</b> to IVB Fabera: PF (profit factor, zysk brutto / strata brutto) 1,28 po kosztach na 823 transakcjach. Audyt robił jednak Conti, czyli ktoś z nimi związany, a setup to prawie czyste wybicie z zakresu otwarcia z filtrem delty. To słaby dowód, że order flow coś dokłada.</li>
<li><b>ICT i price action liczy się z tej samej ceny.</b> Gdy oba mówią „tak”, to w dużej mierze jeden dowód policzony dwa razy. Dokładanie kolejnych warunków cenowych nie mnoży szans, za to zmniejsza liczbę transakcji i grozi przeuczeniem na historii (jak przy v6.7H). Naprawdę nową informację wnosi warstwa 2, bo to inne dane: wolumen i księga zleceń.</li></ul>
<div class="case"><div class="lab">Hipoteza do testu</div><p><b>Filtr order flow (warstwa 2) podnosi wynik w R po kosztach względem samej mapy (warstwa 1).</b> Mierzymy każdą warstwę osobno, zgodnie z zasadą „jeden filtr naraz”:</p>
<ol><li>sama mapa: wejście na dotknięciu poziomu (FVG, LVN, pula stopów);</li>
<li>mapa i potwierdzenie order flow;</li>
<li>mapa, order flow i warunki ICT (sweep, MSS).</li></ol>
<p>Dla każdego wariantu: liczba transakcji, trafność, wynik w R po kosztach, maksymalne obsunięcie, dwa podokresy. Pełny test wymaga futures (kontraktów terminowych z giełdy), bo na CFD (kontraktach na różnicę cen) w MT5 (MetaTrader 5) jest tylko wolumen tickowy, czyli przybliżenie.</p></div>
</section>
<section class="s"><h2>Hipotezy z filmów Maxa i Lindy Raschke (do testu OBR)</h2>
<p>Dwa źródła spoza kursu, oba o tym samym co OBR (Twój bot w MT5, czyli MetaTrader 5, grający wybicie zakresu otwarcia):</p>
<ul><li><b>Max</b> (kanał Max Options Trading, film <a href="https://www.youtube.com/watch?v=jFwe_MVxqd8" target="_blank" rel="noopener">„How ORB Made Me 1.2 Million In A Month”</a>, 15.11.2026). Gra ORB (opening range breakout, wybicie zakresu otwarcia) z pierwszych 15 minut sesji Nowy Jork, czyli 15:30–15:45 czasu polskiego. Czyta zakres na SPX (indeksie S&amp;P 500), a handluje NQ i ES (kontraktami futures E-mini Nasdaq-100 i E-mini S&amp;P 500) na wielu kontach prop (w firmach finansujących traderów). Nie pokazuje żadnej statystyki, a wynik z tytułu pochodzi z kilkudziesięciu kont kopiujących te same transakcje. Traktuj to jako źródło pomysłów, nie dowodów.</li>
<li><b>Linda Raschke</b> (wywiad <a href="https://www.youtube.com/watch?v=caLSbXnkaj4" target="_blank" rel="noopener">„OrderFlow is noise”</a>, listopad 2026). Bohaterka książki „Market Wizards” Jacka Schwagera, prowadziła fundusz z audytowanymi wynikami. Order flow uważa za szum, a jej tezy o wybiciach od otwarcia wspierają OBR.</li></ul>

<h3>Czy Raschke nie przekreśla tego kursu?</h3>
<p>Nie przekreśla, ale stawia mu poprzeczkę. Jej zarzuty: duzi ukrywają zlecenia (wiele kont, dark pools, czyli niejawne platformy obrotu), algorytmy robią szum w każdej skali czasu, człowiek nie przetworzy tego na żywo, a większość obrazu widać na samych świecach. Część z tego kurs sam przyznaje (iceberg, spoof, lekcja 1, sekcja 9). To jednak też jej opinia, a nie zmierzona statystyka. Rozstrzyga to hipoteza z sekcji „Model trzech warstw” powyżej: <b>czy filtr order flow podnosi wynik w R (ryzykach) po kosztach względem samej mapy</b>. Jeśli nie podnosi, Raschke ma rację i OBR zostaje na cenie i czasie. Na CFD (kontraktach na różnicę cen) w MT5 order flow i tak nie masz, więc OBR budujesz na tym, co mówią Max i Raschke, a order flow jest dodatkiem do sprawdzenia na futures.</p>

<h3>Hipotezy do testu</h3>
<div class="scroll"><table class="t"><tr><th>Hipoteza</th><th>Źródło</th><th>Jak zmierzyć w MT5</th></tr>
<tr><td><b>Zgodność indeksów:</b> wybicie na US100 (CFD na Nasdaq-100) działa lepiej, gdy US500 (CFD na S&amp;P 500) jest po tej samej stronie swojego zakresu otwarcia</td><td>Max</td><td>dla każdego wybicia OBR zapisz pozycję US500 względem jego zakresu; porównaj wynik w R po kosztach w obu grupach</td></tr>
<tr><td><b>Nieudane wybicie:</b> po powrocie ceny do zakresu i złamaniu struktury opłaca się gra w drugą stronę, do przeciwnej krawędzi</td><td>Max („break back in”), Faber (hook, lekcja 2), Raschke (pułapki, Turtle Soup)</td><td>dane zbiera już bot pomiarowy v12_1M; licz trafienie przeciwnej krawędzi przed SL (stop loss)</td></tr>
<tr><td><b>Pozycja ceny przy zamknięciu zakresu:</b> gdy w chwili zamknięcia zakresu cena stoi przy jego krawędzi, częściej dochodzi do odwrócenia niż do kontynuacji</td><td>Max</td><td>zapisz, w której tercji zakresu jest cena o jego końcu; porównaj częstość wybić udanych i nieudanych</td></tr>
<tr><td><b>Midline jako filtr kierunku:</b> wybicie w górę, gdy cena trzyma się nad środkiem zakresu, działa lepiej</td><td>Max</td><td>po wybiciu sprawdź, czy cena wracała pod środek zakresu; porównaj wyniki</td></tr>
<tr><td><b>Dzień trendowy = handel poza zakresem pierwszej godziny;</b> wybicia od otwarcia sesji są najlepsze</td><td>Raschke</td><td>porównaj zakres 15, 30 i 60 minut; najpierw bez filtrów</td></tr>
<tr><td><b>Wyjścia z ATR zamiast trailingu:</b> trailing (stop podążający za ceną) jest optymalny tylko w ok. 15% przypadków; lepszy jest mały cel ok. ½ ATR (średni dzienny zasięg ruchu), duży ok. 3 ATR albo wyjście po czasie</td><td>Raschke</td><td>na tych samych wejściach OBR porównaj trzy warianty wyjścia: trailing, cele z ATR, time stop</td></tr>
<tr><td><b>Stała wielkość pozycji</b> liczona z ATR na początku okresu</td><td>Raschke</td><td>porównaj obsunięcie kapitału przy stałym locie i przy locie z ATR</td></tr></table></div>
<p>Zasada bez zmian: najpierw pomiar bez filtrów, potem jeden filtr naraz, potem sprawdzenie na danych, których nie użyłeś do ustawiania (out-of-sample).</p>

<p><b>Model biznesowy market makera</b> (dostawcy płynności) to spread, a nie kierunek ceny. „Księga jest menu”: limity to oferta, a market taker (agresor) wybiera, co i gdzie „zjeść”.</p>

<section class="s unit" data-unit="2"><div class="unit-nr">Jednostka 2 z 2</div><h2>Płynność: cel i ściana jednocześnie</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 1 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Kupujesz rynkowo 6 kontraktów przy cenie 4719. Czy dostaniesz 4719?</p><details><summary>Pokaż odpowiedź</summary><p>Nie. Zjadasz limity sprzedaży po kolei (np. 3 + 3 na kolejnych poziomach) i wypełniasz się wyżej, ok. 4720.</p></details></div><div class="rq"><p class="q">Dlaczego przed newsami cena skacze tak mocno?</p><details><summary>Pokaż odpowiedź</summary><p>Bo market makerzy zdejmują limity i księga robi się cienka. Mała agresja przesuwa cenę o wiele poziomów.</p></details></div></div>
<p>Darius mówi dwie rzeczy, które na pierwszy rzut oka się kłócą:</p>
<ul><li>„rynek <b>zawsze idzie do płynności</b>” (do dużych skupisk limitów);</li><li>„gdy płynności jest dużo, cena <b>zwalnia</b>; szybki ruch to <b>brak</b> płynności”.</li></ul>
<p><b>Obie są prawdziwe, bo dotyczą różnych miejsc.</b> Przez cienkie poziomy cena przechodzi szybko, bo nikt jej nie zatrzymuje. Zatrzymuje się dopiero tam, gdzie stoi dużo limitów, czyli przy ścianie. Ściana jest więc <b>celem podróży</b> (tam ruch się kończy) i zarazem <b>przeszkodą</b> (tam toczy się walka).</p>
<p><b>Dlaczego agresor w ogóle idzie do ściany?</b> Bo tam może wykonać dużo kontraktów naraz. Przykład z filmu: ktoś sprzedaje 100 kontraktów. Dzięki 21 kontraktom na 4713 dostaje tam dobrą cenę na część zlecenia, a dopiero resztę „rozlewa” niżej (9 na 4712, 6 na 4711…). Duże skupisko płynności jest więc atrakcyjnym miejscem do transakcji dla obu stron. Dlatego właśnie tam toczy się bitwa.</p>
<div class="scroll"><svg viewBox="0 0 660 235" role="img" aria-label="Dwa wyniki przy ścianie płynności" style="max-width:660px;width:100%"><g style="font:12px var(--body,sans-serif)"><text x="165" y="18" text-anchor="middle" style="fill:var(--sell);font-weight:600">A. Ściana wytrzymała: odbicie</text><text x="495" y="18" text-anchor="middle" style="fill:var(--buy);font-weight:600">B. Ściana zjedzona: przyspieszenie</text><line x1="330" y1="28" x2="330" y2="230" style="stroke:var(--line)"/><rect x="20" y="60" width="290" height="14" style="fill:var(--heat2);opacity:.55"/><text x="24" y="55" style="fill:var(--muted)">duże limity sprzedaży (ściana)</text><rect x="350" y="60" width="290" height="14" style="fill:var(--heat2);opacity:.55"/><text x="354" y="55" style="fill:var(--muted)">duże limity sprzedaży (ściana)</text><polyline points="30,200 80,170 120,150 160,110 200,80 225,70 250,95 280,130 305,160" style="fill:none;stroke:var(--fg);stroke-width:2"/><circle cx="215" cy="74" r="11" style="fill:var(--buy);opacity:.6"/><circle cx="232" cy="72" r="9" style="fill:var(--buy);opacity:.6"/><text x="20" y="225" style="fill:var(--muted)">Kupujący uderzają (bąble), cena nie przechodzi = absorpcja</text><polyline points="360,200 410,170 450,150 490,110 530,80 550,70 565,45 590,35 620,32" style="fill:none;stroke:var(--fg);stroke-width:2"/><circle cx="545" cy="70" r="14" style="fill:var(--buy);opacity:.6"/><circle cx="560" cy="62" r="11" style="fill:var(--buy);opacity:.6"/><text x="350" y="225" style="fill:var(--muted)">Agresor zjada ścianę, nad nią pusto = szybki ruch</text></g></svg></div>
<ul><li><b>Cienka strona</b> (np. 16 kontraktów) pęka w kilka sekund, jeśli ktoś jest agresywny.</li><li><b>Gruba ściana</b> to dobre miejsce na pomysł handlowy: odbicie, jeśli agresja jest absorbowana (A), albo przyspieszenie, jeśli zostanie zjedzona (B).</li><li><b>TP:</b> nie stawiaj celu <b>za</b> ścianą płynności. Long z celem nad dużą ścianą sprzedaży to proszenie się o niewypełniony TP. Stawiaj go tuż <b>przed</b> ścianą.</li><li><b>„Polowanie na stopy”</b> to według Dariusa nieporozumienie: cena poszła tam, gdzie było cienko, a nie po Twój stop.</li></ul>
<div class="warnbox"><b>Uwaga do lekcji 2:</b> tabela „dwa znaczenia płynności” mówiła, że „magnes” to pojęcie ICT (Inner Circle Trader), a order flow widzi tylko „opór”. Darius pokazuje, że w order flow płynność z heatmapy jest jednym i drugim. Różnica wobec ICT: ICT zgaduje płynność (stopy) z wykresu, a heatmapa pokazuje prawdziwe limity.</div>
<div class="watch">${yt('qEGrb1-GNxo',428,'Darius · „rynek zawsze idzie do płynności”',489)}${yt('qEGrb1-GNxo',730,'Darius · 100 kontraktów na ścianie 4713, bitwa',851)}${yt('qEGrb1-GNxo',1460,'Darius · ścieżka najmniejszego oporu, TP przed ścianą',1643)}</div>
<div class="rcheck"><div class="rlab">Sprawdź się <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">W jakim sensie płynność jest „celem”, a w jakim „ścianą”?</p><details><summary>Pokaż odpowiedź</summary><p>Celem, bo cena przechodzi szybko przez cienkie poziomy i zatrzymuje się dopiero przy dużych limitach. Ścianą, bo tam agresja musi zjeść dużo kontraktów; albo zostanie zaabsorbowana (odbicie), albo zje ścianę (przyspieszenie).</p></details></div><div class="rq"><p class="q">Dlaczego duży agresor chętnie handluje przy ścianie?</p><details><summary>Pokaż odpowiedź</summary><p>Bo tam wykona dużą część zlecenia po jednej cenie, zamiast rozlewać je na wiele gorszych poziomów.</p></details></div><div class="rq"><p class="q">Masz longa. Nad ceną stoi gruba ściana limitów sprzedaży. Gdzie TP?</p><details><summary>Pokaż odpowiedź</summary><p>Tuż przed ścianą, nie za nią. Przebicie ściany wymaga dużej agresji i nie jest pewne.</p></details></div></div>
</section>

<div class="unit-tools"></div>
<p>Cały moduł 3 to <b>wysiłek kontra rezultat</b>. Wysiłek pokazują bąble big trades (duże pojedyncze transakcje agresywne) i wolumen. Rezultat pokazuje świeca.</p>

ty:.55"/><circle cx="530" cy="160" r="11" style="fill:var(--sell);opacity:.55"/><rect x="365" y="214" width="18" height="16" style="fill:var(--muted);opacity:.45"/><rect x="395" y="202" width="18" height="28" style="fill:var(--muted);opacity:.45"/><rect x="425" y="214" width="18" height="16" style="fill:var(--muted);opacity:.45"/><rect x="455" y="200" width="18" height="30" style="fill:var(--muted);opacity:.45"/><rect x="485" y="214" width="18" height="16" style="fill:var(--muted);opacity:.45"/><rect x="515" y="198" width="18" height="32" style="fill:var(--muted);opacity:.45"/><rect x="545" y="210" width="18" height="20" style="fill:var(--muted);opacity:.45"/><rect x="575" y="218" width="18" height="12" style="fill:var(--muted);opacity:.45"/><rect x="5" y="255" width="310" height="235" rx="6" style="fill:none;stroke:var(--line)"/><text x="15" y="275" style="fill:var(--fg);font-weight:700">Ścieżka najmniejszego oporu</text><text x="15" y="292" style="fill:var(--muted)">mały wolumen, duży ruch</text><polyline points="40,330 90,350 140,390 190,420 250,445" style="fill:none;stroke:var(--fg);stroke-width:2"/><rect x="35" y="476" width="18" height="4" style="fill:var(--muted);opacity:.45"/><rect x="65" y="476" width="18" height="4" style="fill:var(--muted);opacity:.45"/><rect x="95" y="477" width="18" height="3" style="fill:var(--muted);opacity:.45"/><rect x="125" y="476" width="18" height="4" style="fill:var(--muted);opacity:.45"/><rect x="155" y="476" width="18" height="4" style="fill:var(--muted);opacity:.45"/><rect x="185" y="477" width="18" height="3" style="fill:var(--muted);opacity:.45"/><rect x="215" y="476" width="18" height="4" style="fill:var(--muted);opacity:.45"/><rect x="245" y="477" width="18" height="3" style="fill:var(--muted);opacity:.45"/><rect x="335" y="255" width="310" height="235" rx="6" style="fill:none;stroke:var(--line)"/><text x="345" y="275" style="fill:var(--fg);font-weight:700">Wyczerpanie</text><text x="345" y="292" style="fill:var(--muted)">nowe szczyty, gasnące bąble</text><polyline points="370,440 410,410 440,390 470,370 500,360 530,355 555,352 580,380" style="fill:none;stroke:var(--fg);stroke-width:2"/><circle cx="410" cy="410" r="14" style="fill:var(--buy);opacity:.55"/><circle cx="470" cy="370" r="10" style="fill:var(--buy);opacity:.55"/><circle cx="530" cy="355" r="6" style="fill:var(--buy);opacity:.55"/><rect x="365" y="448" width="18" height="32" style="fill:var(--muted);opacity:.45"/><rect x="395" y="452" width="18" height="28" style="fill:var(--muted);opacity:.45"/><rect x="425" y="456" width="18" height="24" style="fill:var(--muted);opacity:.45"/><rect x="455" y="462" width="18" height="18" style="fill:var(--muted);opacity:.45"/><rect x="485" y="466" width="18" height="14" style="fill:var(--muted);opacity:.45"/><rect x="515" y="470" width="18" height="10" style="fill:var(--muted);opacity:.45"/><rect x="545" y="472" width="18" height="8" style="fill:var(--muted);opacity:.45"/><rect x="575" y="468" width="18" height="12" style="fill:var(--muted);opacity:.45"/></g></svg></div>
<p><b>Absorpcja:</b> agresorzy uderzają w poziom, a cena nie idzie dalej. Pasywne limity (ściana z heatmapy) „wypijają” agresję. Na krawędziach wartości, przy VAH i VAL (górnej i dolnej krawędzi obszaru wartości), to sygnał <b>odwrócenia</b>. Przykład z filmu: na szczycie bąble kupna, m.in. <b>181 kontraktów</b>, a świeca zamyka się spadkowo. Kupujący przegrali, cena wraca do wartości.</p>
<p><b>Agresja (aukcja inicjująca):</b> jedna strona naciska, a cena idzie za nią. Poziomy są zjadane, świece zamykają się mocno w kierunku nacisku. Przykład: sprzedający wchodzą (np. 34 kontrakty), cena spada, znowu wchodzą i znowu spada („print, print, print”). To <b>kontynuacja</b> trendu, dopóki sprzedający nie zaczną być absorbowani. Wtedy kontrolę przejmują kupujący (bąbel 111 kontraktów i ruch w górę).</p>
<p><b>Ważne:</b> nie każdy duży bąbel coś znaczy. Duzi gracze zwykle wchodzą po cichu, kawałkami. Liczy się, <b>gdzie</b> bąbel się pojawia i <b>co cena robi potem</b>.</p>

<section class="s unit" data-unit="2"><div class="unit-nr">Jednostka 2 z 2</div><h2>Ścieżka najmniejszego oporu i wyczerpanie</h2>
<div class="unit-tools"></div>
<div class="rcheck"><div class="rlab">Powtórka z jednostki 1 <span>(najpierw odpowiedz w myślach, potem rozwiń)</span></div><div class="rq"><p class="q">Bąble kupna przy VAH, a świeca zamyka się nisko. Co to jest?</p><details><summary>Pokaż odpowiedź</summary><p>Absorpcja kupujących: wysiłek bez rezultatu. Sygnał możliwego odwrócenia w dół, do wartości.</p></details></div><div class="rq"><p class="q">Sprzedający wchodzą raz za razem i cena za każdym razem spada. Co to jest?</p><details><summary>Pokaż odpowiedź</summary><p>Agresja (aukcja inicjująca) sprzedających: wysiłek z rezultatem, sygnał kontynuacji.</p></details></div></div>
<p><b>Ścieżka najmniejszego oporu z samego wolumenu.</b> W lekcji 1 czytaliśmy ją z księgi. Darius pokazuje drugi sposób: <b>mały wolumen i duży ruch</b>. Normalnie przy małym wolumenie rynek powinien stać. Jeśli jedzie mimo to, po drodze nie ma kontrahenta (brak płynności), więc cena przyspiesza. Wolumen jest tu „kodem do oszukiwania”: nie potrzebujesz nawet heatmapy, żeby zobaczyć, że dany obszar jest pusty.</p>
<p><b>Wyczerpanie (exhaustion):</b> cena dalej robi nowe szczyty, ale bąble robią się mniejsze, a wolumen słabnie. Ruch „kończy się paliwo”. Na samej górze nie ma już żadnego dużego kupującego. Wtedy przejmują sprzedający, często gwałtownie. To okazja do odwrócenia, ale <b>wejście dopiero po potwierdzeniu</b>: absorpcji kupujących albo agresji sprzedających.</p>
<p><b>W praktyce odczyty się mieszają.</b> Spadek bywa jednocześnie ścieżką najmniejszego oporu (mało wolumenu) i wyczerpaniem. Darius radzi patrzeć na wszystko razem i nie widzieć rynku wyłącznie przez „absorpcję albo agresję”. Np. agresja była zaabsorbowana, cena wróciła, potem agresja wygrała, aż kupujący znów zostali zaabsorbowani.</p>
